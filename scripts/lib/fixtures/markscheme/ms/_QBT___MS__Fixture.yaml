questions:
  - q: 1
    stamp: f4a71e2e
    parts:
      - part: a
        rows:
          - figure: 1
            marks:
              - code: B1
                note: A cardioid, symmetric about the initial line, with its cusp at the pole.
                feature: shape
              - code: B1
                note: \((4, 0)\) marked, or \(r = 4\) on the initial line.
                feature: labelled point
              - code: B1
                note: From the pole at angle \(\frac{2\pi}{3}\), meeting \(C_1\) once more.
                feature: half-line
      - part: b
        rows:
          - scheme: |
              \(A = \frac12\int_{2\pi/3}^{\pi} 4(1 + \cos\theta)^2\,\mathrm{d}\theta\)
            marks:
              - code: M1
                note: Uses \(\frac12\int r^2\,\mathrm{d}\theta\) with \(r = 2(1 + \cos\theta)\). Limits may come later.
          - scheme: |
              \(\phantom{A} = \int_{2\pi/3}^{\pi} (3 + 4\cos\theta + \cos 2\theta)\,\mathrm{d}\theta\)
            marks:
              - code: M1
                note: Uses \(\cos^2\theta = \frac12(1 + \cos 2\theta)\) to reach an integrable form.
          - scheme: |
              \(\phantom{A} = \left[3\theta + 4\sin\theta + \frac12\sin 2\theta\right]_{2\pi/3}^{\pi}\)
            marks:
              - code: A1
          - scheme: |
              \(\phantom{A} = \pi - \frac{7\sqrt3}{4}\) [\(\approx 0.111\)]
            marks:
              - code: A1
                note: cso, from the limits \(\frac{2\pi}{3}\) and \(\pi\).
  - q: 2
    stamp: 38fb4e8e
    parts:
      - part: a
        rows:
          - scheme: |
              \(\text{EPE}_0 = \frac{2mg(2a)^2}{2(2a)} = 2mga\); the string is slack at \(\frac32 a\) above \(O\)
            marks:
              - code: B1
                note: The initial elastic energy, and none once \(P\) is \(\frac32 a\) above \(O\).
          - scheme: |
              \(4mga + 2mga = \frac12 mv^2 + \frac32 mga\)
            marks:
              - code: M1
                note: Forms an energy equation with kinetic, gravitational and elastic terms, each of the right form.
              - code: A1
          - scheme: |
              \(v = 3\sqrt{ag}\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \(T = \frac{2mg(2a)}{2a} = 2mg\)
              \(m\alpha = 2mg + mg\)
            marks:
              - code: M1
                note: Uses Hooke's law for the tension and applies Newton's second law with the tension and the weight.
          - scheme: |
              \(\alpha = 3g\), downwards
            marks:
              - code: A1
  - q: 3
    stamp: 835b7dbc
    parts:
      - part: ''
        rows:
          - scheme: |
              \(\overrightarrow{CD} = 2\mathbf i + \mathbf j - \mathbf k\), \(\overrightarrow{CE} = \mathbf i + 3\mathbf j\)
            marks:
              - code: M1
                note: Finds two direction vectors in the plane by subtracting position vectors of the three points.
          - scheme: |
              \(\mathbf n = \overrightarrow{CD}\times\overrightarrow{CE} = 3\mathbf i - \mathbf j + 5\mathbf k\)
            marks:
              - code: M1
                note: Finds the vector product of their two direction vectors, or solves for a normal by scalar products.
              - code: A1
          - scheme: |
              \(\mathbf r\cdot(3\mathbf i - \mathbf j + 5\mathbf k) = 14\), or \(3x - y + 5z = 14\)
            marks:
              - code: A1
          - scheme: |
              \(\mathbf p' = \mathbf p - 2\,\dfrac{\mathbf p\cdot\mathbf n - d}{\mathbf n\cdot\mathbf n}\,\mathbf n\)
            marks:
              - code: M1
                note: Uses the reflection formula with their plane, or another full method for the image of \(A\).
          - scheme: |
              \(\mathbf p\cdot\mathbf n - d = 35\), \(\mathbf n\cdot\mathbf n = 35\)
            marks:
              - code: A1
          - scheme: |
              \(\overrightarrow{OB} = (4\mathbf i - 2\mathbf j + 7\mathbf k) - 2(3\mathbf i - \mathbf j + 5\mathbf k)\)
            marks:
              - code: dM1
                note: Substitutes their values into the formula, with the factor of 2 and the sign right.
          - scheme: |
              \(B = (-2, 0, -3)\)
            marks:
              - code: A1
        alt:
          title: the line through \(A\) along the normal
          rows:
            - scheme: |
                \(\mathbf n = \overrightarrow{CD}\times\overrightarrow{CE} = 3\mathbf i - \mathbf j + 5\mathbf k\)
              marks:
                - code: M1
                  note: Finds two direction vectors in the plane from the three points.
                - code: M1
                  note: Finds their vector product, or solves for a normal by scalar products.
            - scheme: |
                \(\mathbf n = 3\mathbf i - \mathbf j + 5\mathbf k\); \(3x - y + 5z = 14\)
              marks:
                - code: A1
                - code: A1
            - scheme: |
                \(\mathbf r = (4\mathbf i - 2\mathbf j + 7\mathbf k) + \lambda(3\mathbf i - \mathbf j + 5\mathbf k)\)
                \(3(4 + 3\lambda) - (-2 - \lambda) + 5(7 + 5\lambda) = 14\)
              marks:
                - code: M1
                  note: Forms the line through \(A\) along their normal and substitutes it into their plane.
            - scheme: |
                \(\lambda = -1\): the line meets the plane at \(C(1, -1, 2)\)
              marks:
                - code: A1
            - scheme: |
                \(\overrightarrow{OB} = \overrightarrow{OA} + 2\overrightarrow{AC}\)
              marks:
                - code: dM1
                  note: Finds \(B\) by doubling the step from \(A\) to the plane, or uses \(C\) as the midpoint of \(AB\).
            - scheme: |
                \(B = (-2, 0, -3)\)
              marks:
                - code: A1
  - q: 4
    stamp: 23ea1ae5
    parts:
      - part: a
        rows:
          - scheme: |
              Along the line of centres, \(\frac{1}{\sqrt2}(\mathbf i + \mathbf j)\):
              \(P\): \(\frac{6 + 2}{\sqrt2}\), \(Q\): \(\frac{-2 + 2}{\sqrt2}\)
            marks:
              - code: M1
                note: Resolves both velocities along the line of centres, using a unit vector parallel to \(\mathbf i + \mathbf j\).
          - scheme: |
              \(P\): \(4\sqrt2\), \(Q\): \(0\)
            marks:
              - code: A1
                note: Both parallel components, in \(\mathrm{m\,s^{-1}}\).
          - scheme: |
              Perpendicular to it, \(\frac{1}{\sqrt2}(-\mathbf i + \mathbf j)\):
              \(P\): \(\frac{-6 + 2}{\sqrt2}\), \(Q\): \(\frac{2 + 2}{\sqrt2}\)
            marks:
              - code: M1
                note: Resolves both velocities perpendicular to the line of centres.
          - scheme: |
              \(P\): \(-2\sqrt2\), \(Q\): \(2\sqrt2\)
            marks:
              - code: A1
                note: Both perpendicular components, with signs consistent with their unit vector.
          - scheme: |
              The spheres are smooth, so the impulse is along the line of centres: each perpendicular component is unchanged
            marks:
              - code: E1
                note: Explains that smooth spheres give no impulse perpendicular to the line of centres, so those components are unchanged.
          - scheme: |
              \(0.4(4\sqrt2) + 0.6(0) = 0.4v_P + 0.6v_Q\)
            marks:
              - code: M1
                note: Uses conservation of momentum along the line of centres, with their parallel components. Condone a sign slip.
          - scheme: |
              \(8\sqrt2 = 2v_P + 3v_Q\)
            marks:
              - code: A1
          - scheme: |
              \(v_Q - v_P = 4\sqrt2\,e\)
            marks:
              - code: M1
                note: Uses Newton's law of restitution along the line of centres, separation speed over approach speed.
          - scheme: |
              \(\frac12(0.4)(4\sqrt2)^2 - \frac12(0.4)v_P^2 - \frac12(0.6)v_Q^2 = 2.88\)
            marks:
              - code: M1
                note: Forms an energy equation in the parallel components, or in the full speeds, with the loss of \(2.88\,\mathrm{J}\).
          - scheme: |
              \(v_P = \frac{4\sqrt2}{5}(2 - 3e)\), \(v_Q = \frac{8\sqrt2}{5}(1 + e)\)
            marks:
              - code: dM1
                note: Solves the momentum and restitution equations and substitutes into the energy equation, reaching an equation in \(e\) alone.
          - scheme: |
              \(2v_P^2 + 3v_Q^2 = 35.2\)
              \((2 - 3e)^2 + 6(1 + e)^2 = \frac{55}{4}\)
            marks:
              - code: A1
                note: A correct quadratic in \(e\), in any form.
          - scheme: |
              \(e = \frac12\), as \(e \geq 0\)
            marks:
              - code: A1
          - scheme: |
              \(v_P = \frac{2\sqrt2}{5}\), \(v_Q = \frac{12\sqrt2}{5}\)
            marks:
              - code: A1ft
                note: ft their \(e\), in their expressions for \(v_P\) and \(v_Q\), with \(0 \leq e \leq 1\).
          - scheme: |
              \(\mathbf v_P = \frac{2\sqrt2}{5}\cdot\frac{1}{\sqrt2}(\mathbf i + \mathbf j) + 2\sqrt2\cdot\frac{1}{\sqrt2}(\mathbf i - \mathbf j)\)
            marks:
              - code: M1
                note: Combines the parallel and perpendicular components of the velocity of \(P\) in terms of \(\mathbf i\) and \(\mathbf j\).
          - scheme: |
              \(\mathbf v_P = (2.4\mathbf i - 1.6\mathbf j)\,\mathrm{m\,s^{-1}}\)
            marks:
              - code: A1
          - scheme: |
              \(\mathbf v_Q = (0.4\mathbf i + 4.4\mathbf j)\,\mathrm{m\,s^{-1}}\)
            marks:
              - code: A1ft
                note: ft their \(v_Q\), combined with the unchanged perpendicular component as for \(P\).
      - part: b
        rows:
          - scheme: |
              \(\cos\theta = \dfrac{\mathbf u_P\cdot\mathbf v_P}{|\mathbf u_P|\,|\mathbf v_P|} = \dfrac{7}{\sqrt{130}}\)
            marks:
              - code: M1
                note: Uses the scalar product of \(\mathbf u_P\) and their \(\mathbf v_P\) to find the angle between them.
          - scheme: |
              \(\theta = 52.1^\circ\)
            marks:
              - code: A1
                note: awrt \(52.1^\circ\).
