  - q: 7
    stamp: 52bd9ef0
    parts:
      - part: a
        rows:
          - scheme: |
              \(x = \cosh y = \frac{e^y + e^{-y}}{2}\)
              \(\Rightarrow e^{2y} - 2xe^y + 1 = 0\)
            marks:
              - code: M1
                note: Replaces \(\cosh y\) by exponentials and multiplies through to form a three-term quadratic in \(e^y\) or a substituted letter. Condone sign and coefficient slips.
              - code: A1
                note: Any equivalent arrangement, in \(e^y\) or another letter.
          - scheme: |
              \(e^y = \frac{2x \pm \sqrt{4x^2-4}}{2}\)
            marks:
              - code: M1
                note: Solves their three-term quadratic in \(e^y\) by the formula or completing the square, reaching \(e^y = \ldots\). Condone slips.
          - scheme: |
              \(e^y = x \pm \sqrt{x^2-1}\)
            marks:
              - code: A1
                note: Both roots.
          - scheme: |
              \(y \geq 0 \Rightarrow e^y \geq 1\)
              \(x - \sqrt{x^2-1} = \frac{1}{x+\sqrt{x^2-1}} \leq 1\)
              \(\Rightarrow \operatorname{arcosh} x = \ln\left(x+\sqrt{x^2-1}\right)\)
            marks:
              - code: A1 AG
                note: Rejects the minus root using \(y \geq 0\), with a reason it is at most 1 (e.g. product of roots is 1), then takes logs. A0 for an unexplained rejection.
      - part: b
        rows:
          - scheme: |
              \(x = \sinh y,\ x+2 = \cosh y\)
              \(\Rightarrow \cosh y - \sinh y = 2\)
            marks:
              - code: M1
                note: Writes both curves in terms of \(\sinh y\) and \(\cosh y\) at a common point and eliminates \(x\). Condone sign slips.
          - scheme: |
              \(\cosh y - \sinh y = e^{-y} \Rightarrow e^{-y} = 2\)
            marks:
              - code: A1
                note: oe, such as \(y = -\ln 2\).
          - scheme: |
              \(y = \operatorname{arcosh}(x+2) \geq 0 \Rightarrow e^{-y} \leq 1\)
              Contradiction, so the graphs do not intersect
            marks:
              - code: A1 AG
                note: Uses \(y \geq 0\) from the range of arcosh to contradict \(e^{-y} = 2\) oe, and concludes no intersection. A0 if the conclusion is missing.
