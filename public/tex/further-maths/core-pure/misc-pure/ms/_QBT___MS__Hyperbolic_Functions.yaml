                note: Correct exponential forms leading without error to the printed identity. If both sides are worked separately, needs a closing statement such as LHS = RHS.
      - part: b
        rows:
          - scheme: |
              \(2(1+2\sinh^2 x)-7\sinh x=4\)
              \(\Rightarrow 4\sinh^2 x-7\sinh x-2=0\)
              \(\Rightarrow \sinh x=\ldots\)
            marks:
              - code: M1
                note: Substitutes (a) to form a three-term quadratic in \(\sinh x\) and solves it by any method. Condone sign slips.
