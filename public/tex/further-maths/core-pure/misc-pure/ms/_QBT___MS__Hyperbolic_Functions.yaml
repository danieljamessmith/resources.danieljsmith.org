  - q: 1
    stamp: c268c604
    parts:
      - part: ''
        rows:
          - scheme: |
              \(2\left(\frac{e^x-e^{-x}}{2}\right)+5\left(\frac{e^x+e^{-x}}{2}\right)=6\)
              \(\Rightarrow \ldots e^{2x}+\ldots e^x+\ldots=0\)
            marks:
              - code: M1
                note: Substitutes both exponential forms and multiplies through by a multiple of \(e^x\) to reach a three-term quadratic in \(e^x\). Condone sign and coefficient slips.
          - scheme: |
              \(7e^{2x}-12e^x+3=0\)
            marks:
              - code: A1
                note: oe, any multiple or arrangement, such as \(7e^{2x}+3=12e^x\).
          - scheme: |
              \(e^x=\frac{6\pm\sqrt{15}}{7}\Rightarrow x=\ln(\ldots)\)
            marks:
              - code: M1
                note: Solves their three-term quadratic in \(e^x\) by formula, completing the square, factorising or calculator, and takes ln of at least one positive root.
          - scheme: |
              \(x=\ln\left(\frac{6+\sqrt{15}}{7}\right),\ x=\ln\left(\frac{6-\sqrt{15}}{7}\right)\)
            marks:
              - code: A1
                note: cso. Both, in any exact log form such as \(\ln(6\pm\sqrt{15})-\ln 7\). A0 if either is rejected.
  - q: 2
    stamp: fa3c73bb
    parts:
      - part: a
        rows:
          - scheme: |
              \(\tanh x = \dfrac{\frac12(e^x - e^{-x})}{\frac12(e^x + e^{-x})}\)
              \(\phantom{\tanh x} = \dfrac{(e^x - e^{-x})e^x}{(e^x + e^{-x})e^x}\)
            marks:
              - code: M1
                note: Writes \(\sinh x/\cosh x\) using both exponential definitions and multiplies numerator and denominator by \(e^x\); or divides the printed fraction through by \(e^x\).
          - scheme: |
              \(\phantom{\tanh x} = \dfrac{e^{2x}-1}{e^{2x}+1}\)
            marks:
              - code: A1 AG
                note: Correct definitions leading without error to the printed result; combined steps accepted.
      - part: b
        rows:
          - scheme: |
              \(\dfrac{e^{2(x-\ln 2)}-1}{e^{2(x-\ln 2)}+1} = \dfrac37\)
              \(\Rightarrow e^{2(x-\ln 2)} = \ldots\)
            marks:
              - code: M1
                note: Substitutes \(x-\ln 2\), or a defined variable for it, into the result of (a), sets it equal to \(\frac37\) and rearranges for the exponential. Condone sign slips.
          - scheme: |
              \(e^{2(x-\ln 2)} = \tfrac52\)
            marks:
              - code: A1
                note: oe, such as \(e^{2x} = 10\), or \(e^{2y} = \frac52\) with \(y = x - \ln 2\).
          - scheme: |
              \(2(x-\ln 2) = \ln \their{\tfrac52}\)
            marks:
              - code: M1
                note: Takes ln of both sides of their \(e^{2(x-\ln 2)} = c\), \(c > 0\), giving a linear equation in \(x\).
          - scheme: |
              \(2x = \ln \their{\tfrac52} + \ln 4 = \ln(\ldots)\)
            marks:
              - code: dM1
                note: Uses \(2\ln 2 = \ln 4\) and \(\ln a + \ln b = \ln ab\) to reach a single log; or \(e^{-2\ln 2} = \frac14\) before taking logs.
          - scheme: |
              \(x = \tfrac12 \ln 10\)
            marks:
              - code: A1
                note: cso. \(x = \frac12\ln 10\) or \(k = 10\); \(\ln\sqrt{10}\) or a decimal scores A0.
  - q: 3
    stamp: f9d2974a
    parts:
      - part: a
        rows:
          - scheme: |
              \(\cosh x + \sinh x = \frac{(e^x+e^{-x})+(e^x-e^{-x})}{2}\)
            marks:
              - code: M1
                note: Substitutes both exponential definitions into either expression and combines over 2. Condone sign slips.
          - scheme: |
              \(\phantom{\cosh x + \sinh x} = \frac{2e^x}{2} = e^x\)
            marks:
              - code: A1
                note: Correct combined numerator simplified to \(e^x\) without error.
          - scheme: |
              \(\cosh x - \sinh x = \frac{(e^x+e^{-x})-(e^x-e^{-x})}{2}\)
              \(\phantom{\cosh x - \sinh x} = \frac{2e^{-x}}{2} = e^{-x}\)
            marks:
              - code: A1 AG
                note: Correct substituted expression with the subtraction applied to both terms of \(\sinh x\), leading without error to \(e^{-x}\).
      - part: b
        rows:
          - scheme: |
              \(2(e^x+e^{-x}) - \tfrac32(e^x-e^{-x}) = 5\)
              \(\Rightarrow \ldots e^{2x} + \ldots e^x + \ldots = 0\)
            marks:
              - code: M1
                note: Substitutes exponential forms, or uses (a), and multiplies by \(e^x\) to reach a three-term quadratic in \(e^x\). Condone sign and coefficient slips.
          - scheme: |
              \(e^{2x} - 10e^x + 7 = 0\)
            marks:
              - code: A1
                note: oe, any multiple, terms in any order, or in a substituted letter for \(e^x\).
          - scheme: |
              \(e^x = \frac{10 \pm \sqrt{72}}{2} \Rightarrow x = \ln(\ldots)\)
            marks:
              - code: M1
                note: Solves their three-term quadratic in \(e^x\) by any means, calculator allowed, and takes ln of at least one positive root.
          - scheme: |
              \(x = \ln(5+3\sqrt2)\) or \(x = \ln(5-3\sqrt2)\)
            marks:
              - code: A1
                note: Both exact, and no others. Accept equivalent exact forms, such as \(\ln\frac{10\pm\sqrt{72}}{2}\), or \(\ln 7-\ln(5+3\sqrt2)\) for the second.
  - q: 4
    stamp: 751d1f0a
    parts:
      - part: a
        rows:
          - scheme: |
              \(\operatorname{sech} 2x = \dfrac{1}{2\cosh^2 x - 1}\)
              \(\phantom{\operatorname{sech} 2x} = \dfrac{1}{\frac{2}{\operatorname{sech}^2 x} - 1}\)
            marks:
              - code: M1
                note: Takes the reciprocal of the identity and replaces \(\cosh^2 x\) by \(\frac{1}{\operatorname{sech}^2 x}\), or substitutes \(\operatorname{sech}^2 x = \frac{1}{\cosh^2 x}\) into the RHS.
          - scheme: |
              \(\phantom{\operatorname{sech} 2x} = \dfrac{\operatorname{sech}^2 x}{2 - \operatorname{sech}^2 x}\)
            marks:
              - code: A1 AG
                note: Printed result reached without error from a correct substituted expression; combined simplification accepted. Working from the RHS must end at \(\frac{1}{\cosh 2x}\) via the identity.
      - part: b.i
        rows:
          - scheme: |
              \(0 < f(x) < 1\)
            marks:
              - code: B1
                note: oe, such as \((0, 1)\). B0 if either bound is included.
      - part: b.ii
        rows:
          - scheme: |
              \(\operatorname{sech} 2x = \dfrac{\operatorname{sech}^2 x}{2 - \operatorname{sech}^2 x}\)
              \(0 < \operatorname{sech} x < 1 \Rightarrow 2 - \operatorname{sech}^2 x > 1\)
            marks:
              - code: M1
                note: Uses (a) with \(0 < \operatorname{sech} x < 1\) to bound the denominator or the fraction, such as \(2 - \operatorname{sech}^2 x > 1\).
          - scheme: |
              \(\Rightarrow \operatorname{sech} 2x < \operatorname{sech}^2 x\)
            marks:
              - code: A1
          - scheme: |
              \(0 < \operatorname{sech} x < 1 \Rightarrow \operatorname{sech}^2 x < \operatorname{sech} x\)
              \(\Rightarrow \operatorname{sech} 2x < \operatorname{sech} x\)
            marks:
              - code: A1 AG
                note: Justifies \(\operatorname{sech}^2 x < \operatorname{sech} x\) from \(0 < \operatorname{sech} x < 1\) and concludes the printed inequality. A0 if that justification is missing.
