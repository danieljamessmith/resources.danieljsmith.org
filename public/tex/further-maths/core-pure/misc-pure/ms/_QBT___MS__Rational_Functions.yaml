questions:
  - q: 1
    stamp: 34b47ef8
    parts:
      - part: a
        rows:
          - scheme: |
              \(y = 5\)
            marks:
              - code: B1
      - part: b
        rows:
          - scheme: |
              \(x^2 + bx + a = (x+1)(x-2) = x^2 - x - 2\)
            marks:
              - code: M1
                note: Compares coefficients of \(x^2+bx+a\) with \((x+1)(x-2)\), or substitutes \(x=-1\) and \(x=2\) into \(x^2+bx+a=0\) and solves. Condone sign slips.
          - scheme: |
              \(a = -2,\ b = -1\)
            marks:
              - code: A1
                note: Both values.
      - part: c
        rows:
          - scheme: |
              \(\left(0, -\tfrac12\right)\)
            marks:
              - code: B1
                note: Accept \(y = -\frac12\) stated with \(x = 0\).
      - part: d
        rows:
          - scheme: |
              \(5x^2 - 2x + 1 = 4(x^2 - x - 2)\)
            marks:
              - code: M1
                note: Equates their curve to 4 and multiplies by the denominator, collecting to a three-term quadratic. Condone sign slips.
          - scheme: |
              \(x^2 + 2x + 9 = 0\)
            marks:
              - code: A1
                note: oe, any nonzero multiple.
          - scheme: |
              \(2^2 - 4(1)(9) = \ldots\)
            marks:
              - code: M1
                note: Evaluates \(b^2-4ac\) for their three-term quadratic, or completes the square. Condone a slip in the value.
          - scheme: |
              \(= -32 < 0 \Rightarrow\) no real roots, so \(y = 4\)
              does not intersect \(C\)
            marks:
              - code: A1 AG
                note: \(-32<0\), or \((x+1)^2+8>0\), from the correct quadratic, with a conclusion that there are no real roots so no intersection.
