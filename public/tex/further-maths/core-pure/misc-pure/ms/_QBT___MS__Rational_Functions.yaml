  - q: 5
    stamp: 8e9ed390
    parts:
      - part: a
        rows:
          - scheme: |
              \(y = 2\)
            marks:
              - code: B1
                note: Must be an equation, not 2 alone.
          - scheme: |
              \(x = -1\)
            marks:
              - code: B1
                note: Must be an equation, not \(-1\) alone.
      - part: b
        rows:
          - scheme: |
              \(3x + c = 2 - \frac{3}{x+1}\)
              \(\Rightarrow (3x + c - 2)(x+1) = -3\)
            marks:
              - code: M1
                note: Equates line and curve and multiplies through by \(x+1\). Condone sign slips.
          - scheme: |
              \(3x^2 + 3x + (c-2)x + c - 2 = -3\)
            marks:
              - code: A1
                note: Correct expanded equation with no fractions, any arrangement; terms need not be collected.
          - scheme: |
              \(3x^2 + (c+1)x + (c+1) = 0\)
            marks:
              - code: A1 AG
                note: From a correct expanded equation, reaches the printed result, including \(= 0\), with no errors; collected steps accepted.
      - part: c.i
        rows:
          - scheme: |
              \(b^2 - 4ac = 0\):
              \((c+1)^2 - 12(c+1) = 0\)
            marks:
              - code: M1
                note: Sets the discriminant of the quadratic in (b) to zero, with its coefficients substituted. Condone one slip. Not for a calculus method.
              - code: A1
                note: oe, e.g. \(c^2 - 10c - 11 = 0\).
          - scheme: |
              \(c = -1\) or \(c = 11\)
            marks:
              - code: A1
                note: Both values and no others.
      - part: c.ii
        rows:
          - scheme: |
              \(x = -\frac{c+1}{2 \times 3}\) with \(c = \their{-1}, \their{11}\)
              \(\Rightarrow x = \ldots\)
            marks:
              - code: M1
                note: Finds the repeated root for at least one of their values of \(c\), by \(x = -\frac{b}{2a}\) or by solving the quadratic in (b).
          - scheme: |
              \(x = 0\), \(x = -2\)
            marks:
              - code: A1
                note: Both values.
          - scheme: |
              \(y = 3(0) - 1\), \(y = 3(-2) + 11\)
            marks:
              - code: dM1
                note: Substitutes their \(x\) with its corresponding \(c\) into the line, or substitutes \(x\) into the curve, to find \(y\).
          - scheme: |
              \((0, -1)\) and \((-2, 5)\)
            marks:
              - code: A1
                note: Both points, correctly paired.
  - q: 6
    stamp: ebfaad95
    parts:
      - part: a
        rows:
          - scheme: |
              \(y(2x-3)=-2x^2+11x-20\)
            marks:
              - code: M1
                note: Multiplies by \(2x-3\) and rearranges towards a quadratic in \(x\) with coefficients in \(y\). Condone sign slips.
          - scheme: |
              \(2x^2+(2y-11)x+(20-3y)=0\)
            marks:
              - code: A1
                note: oe, terms collected.
          - scheme: |
              \((2y-11)^2-4(2)(20-3y)\geq 0\)
            marks:
              - code: M1
                note: Applies \(b^2-4ac\) to their quadratic in \(x\), with \(\geq\), \(>\) or \(=\), giving a quadratic in \(y\). Condone sign slips.
          - scheme: |
              \(4y^2-20y-39\geq 0 \Rightarrow y=\ldots\ [= -\tfrac32,\ \tfrac{13}{2}]\)
            marks:
              - code: dM1
                note: Solves their three-term quadratic in \(y\) for its critical values by any means, calculator allowed.
          - scheme: |
              \(f(x)\leq -\tfrac32\) or \(f(x)\geq \tfrac{13}{2}\)
            marks:
              - code: A1
                note: Both non-strict inequalities, oe in set or interval notation; \(y\) for \(f(x)\) condoned. No check of endpoints or \(x=\frac32\) needed. Accept the range from a correct sketch in (d).
      - part: b
        rows:
          - scheme: |
              \(f'(x)=-1+\frac{16}{(2x-3)^2}\)
            marks:
              - code: M1
                note: Differentiates by the quotient rule or after dividing. Condone sign and coefficient slips.
          - scheme: |
              \(f'(x)=0\Rightarrow (2x-3)^2=16\Rightarrow x=\ldots\)
              \(\Rightarrow y=\ldots\)
            marks:
              - code: dM1
                note: Sets their derivative to zero, solves for \(x\) and substitutes at least one root to find \(y\).
          - scheme: |
              \(\left(-\tfrac12,\tfrac{13}{2}\right)\), \(\left(\tfrac72,-\tfrac32\right)\)
            marks:
              - code: A1
                note: Both points, correctly paired.
        alt:
          title: Repeated roots from (a)
          rows:
            - scheme: |
                \(2x^2+(2y-11)x+(20-3y)=0\)
                \(y=\tfrac{13}{2}\Rightarrow (2x+1)^2=0\)
                \(y=-\tfrac32\Rightarrow (2x-7)^2=0\)
              marks:
                - code: M1
                  note: Substitutes the critical values from (a) into their quadratic in \(x\). Condone sign slips.
            - scheme: |
                \(x=-\tfrac12\) or \(x=\tfrac72\)
                Attained range endpoints are extrema, hence stationary points.
              marks:
                - code: dM1
                  note: Solves for the repeated roots and identifies the attained range endpoints as differentiable extrema, hence stationary points.
            - scheme: |
                \(\left(-\tfrac12,\tfrac{13}{2}\right)\), \(\left(\tfrac72,-\tfrac32\right)\)
              marks:
                - code: A1
                  note: Both points, correctly paired.
      - part: c
        rows:
          - scheme: |
              \(f(x)=-x+4-\frac{8}{2x-3}\)
            marks:
              - code: M1
                note: Divides to the form \(ax+b+\frac{c}{2x-3}\) by any method; may be seen in (b). Condone arithmetic slips.
          - scheme: |
              \(y=-x+4\)
            marks:
              - code: A1
                note: From a correct quotient; a slip in the remainder alone is condoned.
      - part: d
        rows:
          - figure: 1
            marks:
              - code: B1
                note: Left branch left of the vertical asymptote and above the oblique; right branch right of the vertical and below the oblique. Both approach the asymptotes, with no \(x\)-intercepts.
                feature: shape
              - code: B1
                note: Vertical asymptote at \(x=\frac32\), labelled.
                feature: asymptotes
              - code: B1
                note: Oblique asymptote with negative gradient, labelled \(y=-x+4\).
                feature: asymptotes
              - code: B1
                note: 'Both points labelled with coordinates: minimum \(\left(-\frac12,\frac{13}{2}\right)\) on the left branch, maximum \(\left(\frac72,-\frac32\right)\) on the right.'
                feature: turning points
  - q: 7
    stamp: f31e2a44
    parts:
      - part: a
        rows:
          - scheme: |
              \(y = 1\)
            marks:
              - code: B1
      - part: b
        rows:
          - scheme: |
              \(p^2 - 4(1)(4) < 0 \Rightarrow p^2 - 16 < 0\)
            marks:
              - code: M1
                note: Uses the discriminant of the denominator, set negative. Condone \(\leq\) for this mark.
              - code: A1
                note: \(p^2 - 16 < 0\) oe, such as \(p^2 < 16\).
          - scheme: |
              \(p^2 = 16 \Rightarrow p = \ldots\), inside region
            marks:
              - code: dM1
                note: Finds the critical values of their quadratic inequality and selects the inside region.
          - scheme: |
              \(-4 < p < 4\)
            marks:
              - code: A1
                note: 'Strict inequalities; accept \(\{p : -4 < p < 4\}\) or \((-4, 4)\).'
      - part: c
        rows:
          - scheme: |
              \(x^2 + 2x - 3 = 0 \Rightarrow x = \ldots\)
            marks:
              - code: M1
                note: Sets the numerator equal to zero and solves by any means.
          - scheme: |
              \((-3, 0)\), \((1, 0)\)
            marks:
              - code: A1
                note: Both points, and no others.
          - scheme: |
              \(\left(0, -\tfrac34\right)\)
            marks:
              - code: B1
      - part: d.i
        rows:
          - scheme: |
              \(x^2 + 2x - 3 = k(x^2 - x + 4)\)
            marks:
              - code: M1
                note: Sets the curve equal to \(k\), clears the fraction and collects into a three-term quadratic in \(x\). Condone sign slips.
          - scheme: |
              \((1-k)x^2 + (2+k)x - (3+4k) = 0\)
            marks:
              - code: A1
                note: Correct quadratic, oe with all terms on one side.
          - scheme: |
              \((2+k)^2 - 4(1-k)\bigl(-(3+4k)\bigr) \geq 0\)
            marks:
              - code: M1
                note: Uses \(b^2 - 4ac\) with their coefficients in \(k\), set non-negative. Condone \(>\) or \(=\) for this mark.
          - scheme: |
              \(\Rightarrow -15k^2 + 8k + 16 \geq 0\)
              \(\Rightarrow 15k^2 - 8k - 16 \leq 0\)
            marks:
              - code: A1 AG
                note: Correct substituted discriminant with \(\geq 0\), expanded without error to the printed result, the inequality reversed correctly on changing signs.
      - part: d.ii
        rows:
          - scheme: |
              \(15k^2 - 8k - 16 = 0 \Rightarrow k = \ldots\)
            marks:
              - code: M1
                note: Solves \(15k^2 - 8k - 16 = 0\) by any means, calculator allowed.
          - scheme: |
              \(k = \tfrac43\) or \(-\tfrac45\)
              \(y\)-coordinate of \(M\) is \(\tfrac43\)
            marks:
              - code: A1
                note: \(\frac43\) or awrt 1.33 given as the answer; A0 if \(-\frac45\) is also given as the \(y\)-coordinate.
  - q: 8
    stamp: 20ccafe7
    parts:
      - part: a
        rows:
          - scheme: |
              \(x = -1\)
            marks:
              - code: B1
          - scheme: |
              \(\frac{x^2+3}{x+1} = x - 1 + \frac{4}{x+1}\)
            marks:
              - code: M1
                note: Divides to the form \(x + p + \frac{q}{x+1}\) by any method. Condone slips in \(p\) and \(q\).
          - scheme: |
              \(y = x - 1\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \(y(x+1) = x^2 + 3\)
            marks:
              - code: M1
                note: Multiplies by \(x + 1\) and rearranges towards a quadratic in \(x\) with coefficients in \(y\). Condone sign slips.
          - scheme: |
              \(x^2 - yx + (3 - y) = 0\)
            marks:
              - code: A1
                note: oe, any arrangement equated to zero.
          - scheme: |
              Real \(x\) needs \(b^2 - 4ac \geq 0\):
              \((-y)^2 - 4(3 - y) \geq 0\)
              \(\phantom{A} \Rightarrow y^2 + 4y - 12 \geq 0\)
            marks:
              - code: M1
                note: Uses the discriminant of their quadratic in \(x\) to form a quadratic inequality or equation in \(y\). Condone slips and a wrong inequality sign.
          - scheme: |
              \((y + 6)(y - 2) \geq 0 \Rightarrow y = \ldots\ [= -6,\ 2]\)
            marks:
              - code: dM1
                note: Solves their three-term quadratic in \(y\) by factorising, formula, completing the square or calculator.
          - scheme: |
              \(y \leq -6\) or \(y \geq 2\)
              so no point on \(C\) with \(-6 < y < 2\)
            marks:
              - code: A1 AG
                note: 'cso: correct region from \(b^2 - 4ac \geq 0\), or discriminant \(< 0\) shown for \(-6 < y < 2\), with a conclusion in words. A0 for the region alone.'
      - part: c
        rows:
          - figure: 1
            marks:
              - code: B1
                note: Two branches approaching both asymptotes without crossing them; right branch above the \(x\)-axis, left branch below it.
                feature: shape
              - code: B1
                note: Both asymptotes drawn and labelled \(x=-1\), \(y=x-1\). Intercept and turning-point labels are optional.
                feature: asymptotes
      - part: d.i
        rows:
          - figure: 2
            marks:
              - code: B1
                note: '\(C_1\): right branch unchanged, left branch reflected above the \(x\)-axis; the whole curve is above the axis.'
                feature: shape
              - code: B1
                note: \(C_1\) approaches \(x=-1\), \(y=1-x\) on the left and \(y=x-1\) on the right; \(C_2\) may supply the oblique asymptotes.
                feature: asymptotes
              - code: B1
                note: '\(C_2\): V with vertex at \((1,0)\), arms of gradients \(-1\) and \(1\); \(C_1\) stays above it.'
                feature: shape
              - code: B1
                note: \((0,3)\) on \(C_1\), and both \((1,0)\), \((0,1)\) on \(C_2\), marked or stated; axis values accepted.
                feature: intercepts
      - part: d.ii
        rows:
          - scheme: |
              \(c \leq 0\)
            marks:
              - code: B1
                note: oe; the inequality must include 0.
  - q: 9
    stamp: 59651fee
    parts:
      - part: a
        rows:
          - scheme: |
              \(y=1\)
            marks:
              - code: B1
          - scheme: |
              \((-2)^2-4(1)(3)=-8\)
            marks:
              - code: M1
                note: Finds the discriminant of the denominator to examine whether it has real roots. Condone arithmetic slips.
          - scheme: |
              \(-8<0\Rightarrow\) denominator never zero
              \(\Rightarrow\) no vertical asymptotes
            marks:
              - code: A1 AG
                note: Correct discriminant \(-8<0\) and conclusion that the denominator is never zero, hence no vertical asymptotes.
        alt:
          title: Completing the square
          rows:
            - scheme: |
                \(y=1\)
              marks:
                - code: B1
            - scheme: |
                \(x^2-2x+3=(x-1)^2+2\)
              marks:
                - code: M1
                  note: Completes the square on the denominator to examine whether it has real roots.
            - scheme: |
                \((x-1)^2+2>0\) for all real \(x\)
                \(\Rightarrow\) denominator never zero
                \(\Rightarrow\) no vertical asymptotes
              marks:
                - code: A1 AG
                  note: Correct positive square form for all real \(x\), with the conclusion that the denominator is never zero, hence no vertical asymptotes.
      - part: b
        rows:
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}x}=\{(2x+2)(x^2-2x+3)\)
              \(\phantom{=}-(x^2+2x-3)(2x-2)\}\div(x^2-2x+3)^2\)
            marks:
              - code: M1
                note: Applies the quotient or product rule, with linear derivatives of numerator and denominator. Condone sign slips.
              - code: A1
                note: Any correct form, simplified or not.
          - scheme: |
              \(12x-4x^2=0 \Rightarrow x=\ldots\)
              \(\Rightarrow y=\ldots\)
            marks:
              - code: dM1
                note: Sets their numerator equal to zero, solves by any method and substitutes at least one root into \(y\).
          - scheme: |
              \((0,-1)\) and \((3,2)\)
            marks:
              - code: A1
                note: Both points and no others.
      - part: c
        rows:
          - figure: 1
            marks:
              - code: B1
                note: 'One continuous curve: minimum on the negative \(y\)-axis, maximum in the first quadrant; both ends approach the horizontal asymptote, from below on the left and above on the right.'
                feature: shape
              - code: B1
                note: Horizontal asymptote \(y=1\) drawn and labelled; \(1\) on the \(y\)-axis accepted.
                feature: asymptotes
              - code: B1
                note: All three \((-3,0)\), \((1,0)\), \((0,-1)\), marked or stated; values on the axes accepted.
                feature: intercepts
      - part: d
        rows:
          - figure: 2
            marks:
              - code: B1
                note: Part below the \(x\)-axis reflected above it, with cusps at \(x=-3\) and \(x=1\), and a local maximum on the positive \(y\)-axis.
                feature: shape
          - scheme: |
              \(0<k<1\)
            marks:
              - code: B1
                note: Strict inequalities, oe such as \(k\in(0,1)\).
  - q: 10
    stamp: 70cbe7d3
    parts:
      - part: a
        rows:
          - scheme: |
              \(x = -1\)
            marks:
              - code: B1
          - scheme: |
              \(\frac{x^2+ax-6}{x+1} = x + \ldots + \frac{\ldots}{x+1}\)
            marks:
              - code: M1
                note: Divides by \(x+1\) by any method, e.g. comparing coefficients, reaching a linear quotient \(x + \ldots\). Condone a wrong remainder.
          - scheme: |
              \(y = x + a - 1\)
            marks:
              - code: A1
                note: Must be an equation; \(x + a - 1\) alone scores A0.
      - part: b
        rows:
          - scheme: |
              \(y = x + a - 1 - (a+5)(x+1)^{-1}\)
              \(\Rightarrow \frac{\mathrm{d}y}{\mathrm{d}x} = \ldots\)
            marks:
              - code: M1
                note: Differentiates their (a) form with \((x+1)^{-1} \to k(x+1)^{-2}\), or the original by the quotient rule with denominator \((x+1)^2\). Condone sign slips.
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}x} = 1 + \frac{a+5}{(x+1)^2}\)
            marks:
              - code: A1
                note: oe, e.g. \(\frac{x^2+2x+a+6}{(x+1)^2}\).
          - scheme: |
              \(a > 0 \Rightarrow \frac{a+5}{(x+1)^2} > 0\)
