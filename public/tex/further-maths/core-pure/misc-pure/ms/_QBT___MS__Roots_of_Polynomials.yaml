              \((\sum\alpha)^2 = \sum\alpha^2 + 2\sum\alpha\beta\)
            marks:
              - code: M1
                note: Expands the squared condition into \(\sum\alpha^2\), \(\sum\alpha\) and a constant, and relates \(\sum\alpha^2\) to \((\sum\alpha)^2\) and \(c\). Condone slips in coefficients or the constant.
          - scheme: |
              \(\sum\alpha^2 = 6\)
            marks:
              - code: A1
