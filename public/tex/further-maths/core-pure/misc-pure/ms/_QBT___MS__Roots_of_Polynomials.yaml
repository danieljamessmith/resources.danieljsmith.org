  - q: 2
    stamp: 80c94c24
    parts:
      - part: a
        rows:
          - scheme: |
              \(\alpha+\beta+\gamma=-5,\ \alpha\beta+\beta\gamma+\gamma\alpha=-4,\ \alpha\beta\gamma=24\)
            marks:
              - code: B1
      - part: b.i
        rows:
          - scheme: |
              \(\frac{\alpha+\beta+\gamma}{\alpha\beta\gamma}=\frac{\text{"}-5\text{"}}{\text{"}24\text{"}}\)
            marks:
              - code: M1
                note: Combines over the common denominator \(\alpha\beta\gamma\) to the sum of roots over the product and substitutes their values from (a).
          - scheme: |
              \(-\frac{5}{24}\)
            marks:
              - code: A1
                note: oe, or awrt \(-0.208\).
      - part: b.ii
        rows:
          - scheme: |
              \(\alpha\beta\gamma+2(\alpha\beta+\beta\gamma+\gamma\alpha)+4(\alpha+\beta+\gamma)+8\)
              \(\phantom{=} = \text{"}24\text{"}+2(\text{"}-4\text{"})+4(\text{"}-5\text{"})+8\)
            marks:
              - code: M1
                note: Expands to the three root sums and a constant, or uses \(x=y-2\), and substitutes their values. Condone one coefficient slip.
          - scheme: |
              \(4\)
            marks:
              - code: A1
      - part: b.iii
        rows:
          - scheme: |
              \(\alpha^2\beta^2+\beta^2\gamma^2+\gamma^2\alpha^2\)
              \(\phantom{=} = (\alpha\beta+\beta\gamma+\gamma\alpha)^2-2\alpha\beta\gamma(\alpha+\beta+\gamma)\)
            marks:
              - code: M1
                note: Writes the sum as \((\alpha\beta+\beta\gamma+\gamma\alpha)^2\) minus a multiple of \(\alpha\beta\gamma(\alpha+\beta+\gamma)\). Condone a wrong coefficient.
          - scheme: |
              \(\phantom{=} = (-4)^2-2(24)(-5)\)
            marks:
              - code: A1
                note: Correct identity with the correct values substituted.
          - scheme: |
              \(\phantom{=} = 256\)
            marks:
              - code: A1
  - q: 3
    stamp: 6dd680b9
    parts:
      - part: a
        rows:
          - scheme: |
              \(\alpha+\beta+\gamma=-2,\ \alpha\beta+\beta\gamma+\gamma\alpha=-5,\ \alpha\beta\gamma=3\)
            marks:
              - code: B1
                note: All three, soi.
          - scheme: |
              \((\alpha\beta+\beta\gamma+\gamma\alpha)^2\)
              \(\phantom{(} = \sum\alpha^2\beta^2 + 2(\alpha\beta^2\gamma+\beta\gamma^2\alpha+\gamma\alpha^2\beta)\)
            marks:
              - code: M1
                note: Squares \(\sum\alpha\beta\), giving the three squared terms and cross terms. Condone a slip in the cross terms' coefficient.
          - scheme: |
              \(\sum\alpha^2\beta^2 = \left(\sum\alpha\beta\right)^2 - 2\alpha\beta\gamma\sum\alpha\)
            marks:
              - code: A1
                note: Correct identity in terms of \(\sum\alpha\beta\), \(\alpha\beta\gamma\) and \(\sum\alpha\), oe.
          - scheme: |
              \(= (-5)^2 - 2(3)(-2) = 37\)
            marks:
              - code: A1
                note: 'cso: withhold if sign errors in the root sums cancel.'
      - part: b
        rows:
          - scheme: |
              \(\sum\alpha^2 = (-2)^2 - 2(-5)\ [= 14]\)
            marks:
              - code: M1
                note: Uses \(\left(\sum\alpha\right)^2 - 2\sum\alpha\beta\) with their values. Condone sign slips in substitution.
          - scheme: |
              \(\alpha^2\beta^2\gamma^2 = 3^2 = 9\)
            marks:
              - code: B1
          - scheme: |
              \(x^3 - 14x^2 + 37x - 9 = 0\)
            marks:
              - code: A1
                note: Or any integer multiple, in any variable; must be an equation.
  - q: 4
    stamp: 286d1857
    parts:
      - part: ''
        rows:
          - scheme: |
              \((a-d)+a+(a+d)=-3 \Rightarrow a=\ldots\)
            marks:
              - code: M1
                note: Equates the sum of equally spaced roots, such as \(a-d,\ a,\ a+d\) or \(a,\ a+d,\ a+2d\), to \(\pm3\).
          - scheme: |
              \(a=-1\)
            marks:
              - code: A1
                note: Middle root \(-1\), in any parametrisation.
          - scheme: |
              \((a-d)a(a+d)=20\)
            marks:
              - code: M1
                note: Equates the product of their three roots to \(\pm20\).
              - code: A1
                note: Correct equation, oe such as \(a(a^2-d^2)=20\) or with \(a=-1\) substituted.
          - scheme: |
              \(-1\left(1-d^2\right)=20 \Rightarrow d^2=\ldots\ [=21]\)
            marks:
              - code: dM1
                note: Substitutes their \(a\) and solves for \(d\) or \(d^2\).
          - scheme: |
              \(x=-1-\sqrt{21},\ -1,\ -1+\sqrt{21}\)
            marks:
              - code: A1
                note: All three, exact or awrt \(-5.58\) and \(3.58\), with no others.
  - q: 5
    stamp: af011d9f
    parts:
      - part: a
        rows:
          - scheme: |
              \(\alpha + \beta = k,\quad \alpha\beta = 1\)
            marks:
              - code: B1
                note: Both values needed.
      - part: b
        rows:
          - scheme: |
              \(\alpha^2 + \beta^2 + \alpha + \beta\)
              \(\phantom{\alpha^2} = (\alpha+\beta)^2 - 2\alpha\beta + (\alpha+\beta)\)
            marks:
              - code: M1
                note: Writes \(\alpha^2+\beta^2\) in terms of \(\alpha+\beta\) and \(\alpha\beta\) and substitutes their values from (a). Condone a sign slip in the identity.
          - scheme: |
              \(= k^2 + k - 2\)
            marks:
              - code: A1
                note: Must be simplified.
      - part: c
        rows:
          - scheme: |
              \((\alpha^2+\beta)(\beta^2+\alpha)\)
              \(\phantom{(\alpha} = (\alpha\beta)^2 + \alpha^3 + \beta^3 + \alpha\beta\)
              \(\alpha^3+\beta^3 = (\alpha+\beta)^3 - 3\alpha\beta(\alpha+\beta)\)
            marks:
              - code: M1
                note: Expands the product to four terms and expresses \(\alpha^3+\beta^3\) in terms of \(k\) by any valid identity or reduction. Condone sign and coefficient slips.
          - scheme: |
              Product \(= k^3 - 3k + 2\)
            marks:
              - code: A1
          - scheme: |
              \(x^2 - (k^2+k-2)x + k^3 - 3k + 2 = 0\)
            marks:
              - code: A1
                note: Or any integer multiple, in \(x\), with \(= 0\); brackets need not be expanded. Stating \(p\), \(q\), \(r\) alone scores A0.
  - q: 6
    stamp: c15dbe56
    parts:
      - part: a
        rows:
          - scheme: |
              \((\alpha-\beta)^2+(\beta-\gamma)^2+(\gamma-\alpha)^2\)
              \(\phantom{A}= 2\sum\alpha^2 - 2\sum\alpha\beta\)
              \(\phantom{A}= 2\big((\sum\alpha)^2 - 2\sum\alpha\beta\big) - 2\sum\alpha\beta\)
            marks:
              - code: M1
                note: Expands the squares and writes the expression in terms of \(\sum\alpha\) and \(\sum\alpha\beta\) only. Condone sign and coefficient slips.
          - scheme: |
              \(\phantom{A}= 2\big((\sum\alpha)^2 - 3\sum\alpha\beta\big)\)
            marks:
              - code: A1
                note: oe, such as \(2(\sum\alpha)^2 - 6\sum\alpha\beta\).
          - scheme: |
              \(\sum\alpha = 5,\ \sum\alpha\beta = p\)
              \(14 = 2(5^2 - 3p) \Rightarrow p = 6\)
            marks:
              - code: A1 AG
                note: Correct \(\sum\alpha = 5\) and \(\sum\alpha\beta = p\) substituted into a correct expression, leading without error to \(p = 6\).
      - part: b
        rows:
          - scheme: |
              \(\alpha\beta\gamma = q\)
            marks:
              - code: B1
          - scheme: |
              \(\frac{\sum\alpha\beta}{\alpha\beta\gamma} = \frac{6}{q} = 3\)
            marks:
              - code: M1
                note: Writes the reciprocal sum as \(\sum\alpha\beta\) over \(\alpha\beta\gamma\), substitutes their product and \(p\), and sets it equal to 3. Condone a sign slip in the product.
          - scheme: |
              \(q = 2\)
            marks:
              - code: A1
      - part: c
        rows:
          - scheme: |
              \((\alpha+1)(\beta+1)(\gamma+1)\)
              \(\phantom{A}= \alpha\beta\gamma + \sum\alpha\beta + \sum\alpha + 1\)
              \(\phantom{A}= \text{"}2\text{"} + 6 + 5 + 1\)
            marks:
              - code: M1
                note: Expands the product into \(\alpha\beta\gamma\), \(\sum\alpha\beta\), \(\sum\alpha\) and 1, condoning one slip, and substitutes their values; or any method not finding the roots, eg \(-f(-1)\).
          - scheme: |
              \(\phantom{A}= 14\)
            marks:
              - code: A1
                note: cao. Scores 0 if the roots are found or no working is shown.
