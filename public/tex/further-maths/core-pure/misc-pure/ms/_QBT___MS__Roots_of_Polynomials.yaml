              \(\sum\alpha^3 + 3\sum\alpha^2 + 3\sum\alpha + 4 = 20\)
            marks:
              - code: M1
                note: Expands the cubed condition into \(\sum\alpha^3\), \(\sum\alpha^2\), \(\sum\alpha\) and a constant. Condone slips in the coefficients or the constant.
          - scheme: |
              \(\sum\alpha^3 + 18 - 6 + 4 = 20\)
              \(\phantom{A}\Rightarrow \sum\alpha^3 = 4\)
