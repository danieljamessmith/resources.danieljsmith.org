              \(\sum\alpha^4 = -2\sum\alpha^3 + \sum\alpha^2 + 6\sum\alpha - 12\)
              \(\phantom{\sum\alpha^4} = -2(\text{"}4\text{"}) + 6 + 6(-2) - 12\)
