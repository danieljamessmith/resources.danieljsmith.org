    parts:
      - part: a
        rows:
          - scheme: |
              \(\alpha+\beta+\gamma+\delta = -b \Rightarrow b = 2\)
            marks:
              - code: B1
          - scheme: |
              \(\sum\frac{1}{\alpha} = \frac{\sum\alpha\beta\gamma}{\alpha\beta\gamma\delta} = \frac{-d}{3}\)
              \(\phantom{A}\Rightarrow \frac{-d}{3} = 2 \Rightarrow d = \ldots\)
