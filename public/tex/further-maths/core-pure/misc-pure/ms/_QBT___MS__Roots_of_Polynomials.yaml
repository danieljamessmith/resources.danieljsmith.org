  - q: 8
    stamp: 8d14e6b7
    parts:
      - part: a
        rows:
          - scheme: |
              \(y = \frac{1}{x+1} \Rightarrow x = \frac{1-y}{y}\)
            marks:
              - code: B1
                note: oe, such as \(x = \frac1y - 1\).
          - scheme: |
              \(\left(\frac{1-y}{y}\right)^3 + \left(\frac{1-y}{y}\right)^2\)
              \(\phantom{A} - 2\left(\frac{1-y}{y}\right) - 1 = 0\)
            marks:
              - code: M1
                note: Substitutes their \(x\) in terms of \(y\) into every term of the given cubic.
          - scheme: |
              \((1-y)^3 + y(1-y)^2 - 2y^2(1-y) - y^3 = 0\)
              \(\phantom{A} \Rightarrow \ldots\)
            marks:
              - code: M1
                note: Clears the fractions and expands to a polynomial in \(y\). Condone slips in expansion.
          - scheme: |
              \(y^3 - y^2 - 2y + 1 = 0\)
            marks:
              - code: A1
                note: Or any multiple, as an equation in any variable.
      - part: b
        rows:
          - scheme: |
              Sum of roots \(= 1\), sum of pairs \(= -2\)
            marks:
              - code: B1
                note: Both values.
          - scheme: |
              \(\text{"}1\text{"}^2 - 2(\text{"}{-2}\text{"}) = \ldots\)
            marks:
              - code: M1
                note: Uses (sum of roots)\(^2 - 2\)(sum of pairs) with their values.
          - scheme: |
              \(= 5\)
            marks:
              - code: A1
                note: With no incorrect values seen.
      - part: c
        rows:
          - scheme: |
              Product of roots \(= -1\)
            marks:
              - code: B1
          - scheme: |
              \(\text{"}1\text{"}^3 - 3(\text{"}1\text{"})(\text{"}{-2}\text{"}) + 3(\text{"}{-1}\text{"}) = \ldots\)
            marks:
              - code: M1
                note: Uses a correct identity for the sum of cubes, or sums the cubic over its roots, with their values. Not for the identity alone.
          - scheme: |
              \(= 4\)
            marks:
              - code: A1
  - q: 9
    stamp: a0851a67
    parts:
      - part: a
        rows:
          - scheme: |
              \(\frac{a}{r} + a + ar = 14\)
            marks:
              - code: M1
                note: Writes the roots as a geometric progression, such as \(\frac{a}{r}, a, ar\) or \(a, ar, ar^2\), in the sum of roots. Condone a sign error in 14.
              - code: A1
                note: Correct sum relation, oe.
          - scheme: |
              \(\frac{a^2}{r} + a^2 + a^2 r = 56\)
              \(\Rightarrow a^2\left(\frac1r + 1 + r\right) = 56 \Rightarrow a = \ldots\)
            marks:
              - code: M1
                note: Forms the sum of products in pairs equal to 56 in their progression and eliminates \(r\), e.g. by dividing by the sum relation. Condone slips.
          - scheme: |
              \(a = 4\)
            marks:
              - code: A1
                note: Middle root 4, e.g. \(ar = 4\) for roots \(a, ar, ar^2\).
          - scheme: |
              \(\text{"}4\text{"}\left(\frac1r + 1 + r\right) = 14\)
              \(\Rightarrow 2r^2 - 5r + 2 = 0 \Rightarrow r = \ldots\ [= \tfrac12, 2]\)
            marks:
              - code: dM1
                note: Substitutes their middle root into a relation to form a three-term quadratic in \(r\) and solves it by any means, leading to \(r = \ldots\)
          - scheme: |
              Roots \(2,\ 4,\ 8\)
            marks:
              - code: A1
                note: All three roots stated; values of \(r\) alone do not score.
      - part: b
        rows:
          - scheme: |
              \(c = -(2 \times 4 \times 8) = -64\)
            marks:
              - code: B1ft
                note: ft minus the product of their three roots.
  - q: 10
    stamp: d37cc77f
    parts:
      - part: a
        rows:
          - scheme: |
              \(\sum\alpha\beta\gamma = 4,\quad \alpha\beta\gamma\delta = 1\)
            marks:
              - code: B1
          - scheme: |
              \(\frac1\alpha+\frac1\beta+\frac1\gamma+\frac1\delta = \frac{\sum\alpha\beta\gamma}{\alpha\beta\gamma\delta} = \ldots\)
            marks:
              - code: M1
                note: Writes the reciprocal sum as their triple-product sum over their product of roots, or uses the sum of roots of the reciprocal equation.
          - scheme: |
              \(= 4\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \(\sum\frac1{\alpha\beta} = \frac{\sum\alpha\beta}{\alpha\beta\gamma\delta} = 3\)
            marks:
              - code: B1
          - scheme: |
              \(\sum\frac1{\alpha^2} = \left(\sum\frac1\alpha\right)^2 - 2\sum\frac1{\alpha\beta}\)
              \(\phantom{\sum\frac1{\alpha^2}} = \text{"}4\text{"}^2 - 2(\text{"}3\text{"}) = \ldots\)
            marks:
              - code: M1
                note: Uses the square of their reciprocal sum minus twice their pair sum of reciprocals.
          - scheme: |
              \(= 10\)
            marks:
              - code: A1
      - part: c
        rows:
          - scheme: |
              \(\frac1\alpha+\frac1\beta+\frac1\gamma = 4-\frac1\delta\)
              \(\frac1\beta+\frac1\gamma+\frac1\delta = 4-\frac1\alpha\)
              \(\frac1\gamma+\frac1\delta+\frac1\alpha = 4-\frac1\beta\)
              \(\frac1\delta+\frac1\alpha+\frac1\beta = 4-\frac1\gamma\)
            marks:
              - code: M1
                note: Writes at least one bracket as the sum of all four reciprocals minus the omitted reciprocal, or expands one bracket squared into its three squares and twice its pair products.
              - code: A1
                note: All four correct, or that bracket's expansion correct.
          - scheme: |
              \(\sum\left(4-\frac1\alpha\right)^2 = \sum\left(16-\frac8\alpha+\frac1{\alpha^2}\right)\)
              \(\phantom{\sum} = 64 - 8\sum\frac1\alpha + \sum\frac1{\alpha^2}\)
            marks:
              - code: M1
                note: Expands the squared brackets and sums, collecting in terms of \(\sum\frac1\alpha\) and \(\sum\frac1{\alpha^2}\), or of \(\sum\frac1{\alpha^2}\) and \(\sum\frac1{\alpha\beta}\). Condone coefficient slips.
              - code: A1
                note: Correct collected form, oe such as \(3\sum\frac1{\alpha^2}+4\sum\frac1{\alpha\beta}\).
          - scheme: |
              \(= 64 - 32 + 10 = 42\)
            marks:
              - code: A1
  - q: 11
    stamp: 948ba2c2
    parts:
      - part: a
        rows:
          - scheme: |
              \(t = \frac{1}{x-1} \Rightarrow x = 1 + \frac{1}{t}\)
            marks:
              - code: B1
                note: Or \(x = \frac{1+t}{t}\) oe; any letter.
          - scheme: |
              \(\left(1+\frac{1}{t}\right)^3 - 3\left(1+\frac{1}{t}\right) + 1 = 0\)
            marks:
              - code: M1
                note: Substitutes their \(x\) in terms of \(t\) into the cubic.
          - scheme: |
              \(\frac{1}{t^3} + \frac{3}{t^2} - 1 = 0 \Rightarrow 1 + 3t - t^3 = 0\)
            marks:
              - code: M1
                note: Expands the cube and multiplies through by \(t^3\) to reach a polynomial equation. Condone slips in the expansion.
          - scheme: |
              \(t^3 - 3t - 1 = 0\)
            marks:
              - code: A1
                note: Or any multiple, in any variable; must be an equation.
      - part: b
        rows:
          - scheme: |
              \(\sum r = 0,\ \sum r_1r_2 = -3\)
            marks:
              - code: B1
                note: Both values, from the cubic in (a).
          - scheme: |
              \(\sum r^2 = \text{"}0\text{"}^2 - 2(\text{"}-3\text{"})\)
            marks:
              - code: M1
                note: Uses \((\sum r)^2 - 2\sum r_1r_2\) with their values from a cubic in the reciprocal variable.
          - scheme: |
              \(= 6\)
            marks:
              - code: A1
      - part: c
        rows:
          - scheme: |
              \(r^3 = 3r + 1 \Rightarrow r^5 = 3r^3 + r^2\)
              \(\phantom{r^3 = 3r + 1 \Rightarrow r^5} = r^2 + 9r + 3\)
            marks:
              - code: M1
                note: Uses \(r^3 = 3r + 1\) to express \(r^5\) in powers below 3 and sums over the roots, or uses the recurrence \(\sum r^{n+3} = 3\sum r^{n+1} + \sum r^n\). Condone slips.
              - code: A1
                note: oe, such as \(\sum r^5 = 3\sum r^3 + \sum r^2\) with \(\sum r^3 = 3\).
          - scheme: |
              \(\sum r^5 = \text{"}6\text{"} + 9(0) + 3 \times 3 = 15\)
            marks:
              - code: A1
  - q: 12
