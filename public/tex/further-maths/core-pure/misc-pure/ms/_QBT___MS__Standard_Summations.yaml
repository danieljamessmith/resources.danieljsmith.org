questions:
  - q: 1
    stamp: 17b7e5f7
    parts:
      - part: ''
        rows:
          - scheme: |
              \((2r-1)(r+3) = 2r^2 + 5r - 3\)
              \(\sum_{r=1}^{n} = \tfrac13 n(n+1)(2n+1) + \tfrac52 n(n+1) - 3n\)
            marks:
              - code: M1
                note: Expands to a quadratic in \(r\) and substitutes the standard results for \(\sum r^2\) and \(\sum r\), with general or numerical \(n\). Condone slips in the expansion.
              - code: A1
                note: Correct in any form, need not be simplified, including \(-3n\). Also for correct substituted expressions at both \(n=12\) and \(n=4\).
          - scheme: |
              \(\sum_{r=5}^{12} = \sum_{r=1}^{12} - \sum_{r=1}^{4}\)
              \(\phantom{\sum_{r=5}^{12}} = \text{"}1654\text{"} - \text{"}98\text{"}\)
            marks:
              - code: M1
                note: Subtracts their sum to 4 from their sum to 12, both from the standard results. Not for subtracting the sum to 5.
          - scheme: |
              \(= 1556\)
            marks:
              - code: A1 AG
                note: Correct values for both sums from the formulae, leading without error to 1556.
