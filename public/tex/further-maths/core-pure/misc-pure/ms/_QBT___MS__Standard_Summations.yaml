  - q: 4
    stamp: 88c31e64
    parts:
      - part: ''
        rows:
          - scheme: |
              \(6\times\tfrac16 k(k+1)(2k+1) - k\times k^2\)
            marks:
              - code: M1
                note: Uses \(\frac16k(k+1)(2k+1)\) for \(\sum r^2\) and sums \(k^2\) as \(k^3\). Not for \(\sum k^2\) taken as \(k^2\) or as \(\sum r^2\).
          - scheme: |
              \(k^3+3k^2+k-205=0\)
            marks:
              - code: A1
                note: oe, such as \(k^3+3k^2+k=205\).
          - scheme: |
              \(k=5\) is a root \(\Rightarrow (k-5)(k^2+8k+41)=0\)
              \(8^2-4\times1\times41 = \ldots\)
            marks:
              - code: dM1
                note: Shows \(k=5\) is a root, then tests the quadratic factor by discriminant or completing the square, or argues the cubic increasing or the factor positive for \(k>0\). Condone slips.
          - scheme: |
              \(-100<0\) so no real roots \(\Rightarrow k=5\) only
            marks:
              - code: A1
                note: cso. Needs the correct negative discriminant oe, or a correct increasing or positivity argument, and a conclusion that \(k=5\) is the only value. \(k=5\) by trial alone earns neither mark.
  - q: 5
    stamp: 1504cd50
    parts:
      - part: a
        rows:
          - scheme: |
              \((2r-1)^3 = 8r^3-12r^2+6r-1\)
              \(\sum(2r-1)^3 = 8\sum r^3-12\sum r^2+6\sum r-\sum 1\)
            marks:
              - code: M1
                note: Expands to four terms and writes the sum as multiples of \(\sum r^3\), \(\sum r^2\), \(\sum r\) and \(\sum 1\). Condone one coefficient slip.
          - scheme: |
              \(= 8\times\tfrac14 n^2(n+1)^2-12\times\tfrac16 n(n+1)(2n+1)\)
              \(\phantom{=} +6\times\tfrac12 n(n+1)-n\)
            marks:
              - code: M1
                note: Substitutes standard results for \(\sum r^3\), \(\sum r^2\) and \(\sum r\) into their split sum. Condone \(\sum 1\) taken as 1, or one slip in a formula.
              - code: A1
                note: Correct expression; need not be simplified.
          - scheme: |
              \(= n\big[2n^3+4n^2+2n-4n^2-6n-2\)
              \(\phantom{= n\big[} +3n+3-1\big]\)
              \(\phantom{=} = \ldots\)
            marks:
              - code: dM1
                note: Expands their expression and collects like terms, with or without a common factor taken out. Condone slips.
          - scheme: |
              \(= n(2n^3-n) = n^2(2n^2-1)\)
            marks:
              - code: A1 AG
                note: Printed result reached without error from a correct substituted expression; combined steps accepted. Nothing for working backwards from the result.
      - part: b
        rows:
          - scheme: |
              \(\frac{1}{n^2}\sum_{r=1}^{n}(2r-1)^3 = 2n^2-1\)
              \(n=5 \Rightarrow 2\times5^2-1 = \ldots\)
            marks:
              - code: M1
                note: Evaluates the expression for an integer \(n \geq 5\), via \(2n^2-1\) or summing directly.
          - scheme: |
              \(49 = 7\times7\), not prime, so the statement is false
            marks:
              - code: A1
                note: Any counterexample, with a factor shown and a conclusion that the statement is false.
