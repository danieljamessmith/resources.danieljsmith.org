questions:
  - q: 1
    stamp: c2646567
    parts:
      - part: ''
        rows:
          - scheme: |
              \(x = r\cos\theta = 3\sin 2\theta\cos\theta\)
              \(\Rightarrow \frac{\mathrm{d}x}{\mathrm{d}\theta} = \ldots\)
            marks:
              - code: M1
                note: Writes \(x\) in terms of \(\theta\) only and differentiates, by the product rule or after any rewriting. Condone sign and coefficient slips.
          - scheme: |
              \(\frac{\mathrm{d}x}{\mathrm{d}\theta} = 6\cos 2\theta\cos\theta - 3\sin 2\theta\sin\theta\)
            marks:
              - code: A1
                note: Correct derivative in any form.
          - scheme: |
              \(6\cos 2\theta\cos\theta - 3\sin 2\theta\sin\theta = 0\)
              \(\Rightarrow 6\cos\theta(3\cos^2\theta - 2) = 0\)
              \(\Rightarrow \cos^2\theta = \ldots\)
            marks:
              - code: M1
                note: Sets their \(\frac{\mathrm{d}x}{\mathrm{d}\theta} = 0\), uses identities to reach a single trigonometric ratio of \(\theta\), and solves for it. Condone slips.
          - scheme: |
              \(\cos^2\theta = \frac23\) \((\cos\theta = 0\) gives the pole\()\)
            marks:
              - code: A1
                note: Or \(\sin^2\theta = \frac13\), \(\tan\theta = \frac{1}{\sqrt2}\) oe. \(\cos\theta = 0\) rejected or not pursued; A0 if it is offered as \(P\).
          - scheme: |
              \(r = 6\sin\theta\cos\theta = 6 \times \frac{1}{\sqrt3} \times \sqrt{\frac23}\)
            marks:
              - code: M1
                note: Substitutes their \(\theta\) or trigonometric ratios, with \(0 < \theta < \frac{\pi}{2}\), into \(r = 3\sin 2\theta\).
          - scheme: |
              \(OP = 2\sqrt2\)
            marks:
              - code: A1
                note: cso. Any exact equivalent, such as \(\sqrt8\).
  - q: 2
    stamp: 7679d4ee
    parts:
      - part: ''
        rows:
          - scheme: |
              \(y = r\sin\theta = 2\sin 3\theta\sin\theta\)
              \(\frac{\mathrm{d}y}{\mathrm{d}\theta} = 6\cos 3\theta\sin\theta + 2\sin 3\theta\cos\theta\)
            marks:
              - code: M1
                note: Differentiates \(y = 2\sin 3\theta\sin\theta\), or an equivalent such as \(\cos 2\theta - \cos 4\theta\), with respect to \(\theta\). Condone coefficient slips.
              - code: A1
                note: Correct \(\frac{\mathrm{d}y}{\mathrm{d}\theta}\), oe.
          - scheme: |
              \(3\cos 3\theta\sin\theta + \sin 3\theta\cos\theta = 0\)
              \(\Rightarrow \sin\theta\cos\theta(16\cos^2\theta - 10) = 0\)
              \(\Rightarrow \cos^2\theta = \ldots\)
            marks:
              - code: M1
                note: Sets their \(\frac{\mathrm{d}y}{\mathrm{d}\theta} = 0\) and uses multiple-angle identities to reach and solve an equation in \(\cos^2\theta\), \(\sin^2\theta\) or \(\cos 2\theta\). Condone slips.
          - scheme: |
              \(\cos^2\theta = \frac58\ \ (\sin\theta = 0\) gives the pole)
            marks:
              - code: A1
                note: Or \(\sin^2\theta = \frac38\) or \(\cos 2\theta = \frac14\), with \(\theta = 0\) not taken as \(P\).
          - scheme: |
              \(\sin\theta = \frac{\sqrt6}{4}\)
              \(\Rightarrow r = 2(3\sin\theta - 4\sin^3\theta) = \ldots\)
            marks:
              - code: M1
                note: Substitutes their \(\theta\), from a valid \(\cos^2\theta\) or equivalent, into \(r = 2\sin 3\theta\), by any means.
          - scheme: |
              \(OP = \frac{3\sqrt6}{4}\)
            marks:
              - code: A1
                note: Exact, oe such as \(\sqrt{\frac{27}{8}}\).
  - q: 3
    stamp: 0e331e2f
    parts:
      - part: a
        rows:
          - scheme: |
              \(\text{Area} = \frac12\int_{-\pi}^{\pi} 4(1+\cos\theta)^2\,\mathrm{d}\theta\)
            marks:
              - code: B1
                note: Correct integral with correct limits, oe such as \(2 \times \frac12\int_0^{\pi}\). Needs the \(\frac12\).
          - scheme: |
              \(\phantom{A} = 2\int_{-\pi}^{\pi}\left(\frac32 + 2\cos\theta + \frac12\cos 2\theta\right)\mathrm{d}\theta\)
              \(\phantom{A} = 2\left[\frac32\theta + 2\sin\theta + \frac14\sin 2\theta\right]_{-\pi}^{\pi}\)
            marks:
              - code: M1
                note: Expands, uses a double-angle identity for \(\cos^2\theta\) and integrates to the form \(p\theta + q\sin\theta + s\sin 2\theta\). Condone sign and coefficient slips.
          - scheme: |
              \(\phantom{A} = 2\left(\frac32\pi - \left(-\frac32\pi\right)\right)\)
            marks:
              - code: dM1
                note: Substitutes their limits into their integrated expression.
          - scheme: |
              \(\phantom{A} = 6\pi\)
            marks:
              - code: A1
                note: \(6\pi\), or awrt 18.8.
      - part: b.i
        rows:
          - scheme: |
              \(2(1+\cos\theta) = \sin\theta\)
              \(\Rightarrow 4(1+\cos\theta)^2 = 1 - \cos^2\theta\)
            marks:
              - code: M1
                note: Equates the two expressions for \(r\) and forms an equation in one trigonometric function, e.g. by squaring and using \(\sin^2\theta = 1 - \cos^2\theta\).
          - scheme: |
              \(5\cos^2\theta + 8\cos\theta + 3 = 0\)
            marks:
              - code: A1
                note: oe, terms collected.
          - scheme: |
              \((5\cos\theta + 3)(\cos\theta + 1) = 0\)
              \(\Rightarrow \cos\theta = -\frac35\) (\(\cos\theta = -1\) gives \(O\))
            marks:
              - code: dM1
                note: Solves their three-term quadratic and rejects \(\cos\theta = -1\), soi by using only the other root.
          - scheme: |
              \(\sin\theta = \frac45 \Rightarrow A\left(\frac45,\ \arccos\left(-\frac35\right)\right)\)
            marks:
              - code: A1
                note: \(r = \frac45\) and \(\theta = \arccos\left(-\frac35\right)\), awrt 2.21 or awrt \(126.9^\circ\).
      - part: b.ii
        rows:
          - scheme: |
              \(x_A = \frac45 \times \left(-\frac35\right) = -\frac{12}{25}\)
            marks:
              - code: B1
                note: oe, such as \(-0.48\).
          - scheme: |
              \(2\cos\theta(1+\cos\theta) = \their{-\frac{12}{25}}\)
            marks:
              - code: M1
                note: Sets \(r\cos\theta\) for \(C_1\) equal to their \(x\)-coordinate of \(A\).
          - scheme: |
              \(25\cos^2\theta + 25\cos\theta + 6 = 0\)
            marks:
              - code: A1
                note: oe, terms collected.
          - scheme: |
              \((5\cos\theta + 3)(5\cos\theta + 2) = 0 \Rightarrow \cos\theta = \ldots\)
            marks:
              - code: dM1
                note: Solves their three-term quadratic in \(\cos\theta\).
          - scheme: |
              \(\cos\theta = -\frac25\) (\(-\frac35\) is \(A\))
            marks:
              - code: A1
                note: Rejection of \(-\frac35\) soi by using only \(-\frac25\).
          - scheme: |
              \(OB = 2\left(1 - \frac25\right) = \frac65\)
            marks:
              - code: A1 AG
                note: \(\cos\theta = -\frac25\) substituted correctly into \(r = 2(1+\cos\theta)\), reaching \(\frac65\) without error.
      - part: b.iii
        rows:
          - scheme: |
              \(\sin\theta_B = \frac{\sqrt{21}}{5}\)
              \(y_A = \frac45 \times \frac45,\quad y_B = \frac65 \times \frac{\sqrt{21}}{5}\)
            marks:
              - code: M1
                note: Uses \(y = r\sin\theta\) for both \(A\) and \(B\), with \(\sin\theta\) at \(B\) found from \(\cos\theta = -\frac25\). Need not be simplified.
          - scheme: |
              \(y_A = \frac{16}{25},\quad y_B = \frac{6\sqrt{21}}{25}\)
            marks:
              - code: A1
                note: oe, or awrt 0.640 and 1.10.
          - scheme: |
              \(AB = \frac{6\sqrt{21} - 16}{25} = 0.460\)
            marks:
              - code: A1
                note: awrt 0.460.
  - q: 4
    stamp: d4c941a7
    parts:
      - part: a
        rows:
          - scheme: |
              \(\frac12\int_0^{2\pi} a^2(1+\sin\theta)^2\,\mathrm{d}\theta\)
            marks:
              - code: B1
                note: Limits spanning one full turn, e.g. \(-\frac{\pi}{2}\) to \(\frac{3\pi}{2}\), accepted. Needs the \(\frac12\).
          - scheme: |
              \(\frac{a^2}{2}\int\left(\frac32+2\sin\theta-\frac12\cos 2\theta\right)\mathrm{d}\theta\)
              \(\phantom{A} = \frac{a^2}{2}\left[\frac32\theta-2\cos\theta-\frac14\sin 2\theta\right]\)
            marks:
              - code: M1
                note: Expands, uses a double-angle identity for \(\sin^2\theta\) and integrates to the form \(p\theta+q\cos\theta+s\sin 2\theta\). Condone sign and coefficient slips.
          - scheme: |
              \(\frac{a^2}{2}\left[(3\pi-2)-(-2)\right]\)
            marks:
              - code: dM1
                note: Substitutes their limits into their integrated expression and subtracts.
          - scheme: |
              \(\frac{3\pi a^2}{2}\)
            marks:
              - code: A1
                note: oe.
      - part: b
        rows:
          - scheme: |
              \(y = a(1+\sin\theta)\sin\theta\)
              \(\frac{\mathrm{d}y}{\mathrm{d}\theta} = a\cos\theta\sin\theta\)
              \(\phantom{\frac{\mathrm{d}y}{\mathrm{d}\theta}} + a(1+\sin\theta)\cos\theta\)
            marks:
              - code: M1
                note: Differentiates \(r\sin\theta\) with their \(r\), by the product rule or after expanding. Condone sign slips.
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}\theta} = a\cos\theta(1+2\sin\theta)\)
            marks:
              - code: A1
                note: oe, e.g. \(a(\cos\theta+\sin 2\theta)\).
          - scheme: |
              \(\cos\theta = 0\) or \(\sin\theta = -\frac12\)
              \(\Rightarrow \theta = \ldots\)
            marks:
              - code: M1
                note: Sets their \(\frac{\mathrm{d}y}{\mathrm{d}\theta} = 0\) and solves at least one factor for \(\theta\).
          - scheme: |
              \(\theta = \frac{\pi}{2},\ \frac{7\pi}{6},\ \frac{11\pi}{6}\)
              (\(\frac{3\pi}{2}\) rejected: \(r = 0\))
            marks:
              - code: A1
                note: These three only, or awrt 1.57, 3.67, 5.76. A0 if \(\frac{3\pi}{2}\) is included.
          - scheme: |
              \(r = a\left(1+\sin\frac{7\pi}{6}\right) = \ldots\)
            marks:
              - code: M1
                note: Substitutes a value with \(\sin\theta = -\frac12\) into \(r = a(1+\sin\theta)\).
          - scheme: |
              \(A\left(\frac a2,\frac{7\pi}{6}\right)\), \(B\left(\frac a2,\frac{11\pi}{6}\right)\)
            marks:
              - code: A1
                note: Both, correctly assigned to \(A\) and \(B\). Angles awrt 3.67 and 5.76 accepted.
      - part: c
        rows:
          - scheme: |
              \(y = 2a\sin\frac{\pi}{2} = 2a\), \(y = \frac a2\sin\frac{7\pi}{6} = -\frac a4\)
              \(WZ = 2a - \left(-\frac a4\right)\)
            marks:
              - code: M1
                note: Finds \(y = r\sin\theta\) at \(\theta = \frac{\pi}{2}\) and at their \(A\) or \(B\), and finds the distance between them.
          - scheme: |
              \(WZ = \frac{9a}{4}\)
            marks:
              - code: A1 AG
                note: Both \(y\)-values correct, combined without error to the printed result.
      - part: d
        rows:
          - scheme: |
              \(\frac{3\sqrt3\,a}{2}\times\frac{9a}{4}\)
            marks:
              - code: M1
                note: Multiplies the given \(WX\) by \(\frac{9a}{4}\).
          - scheme: |
              \(\frac{27\sqrt3\,a^2}{8}\)
            marks:
              - code: A1
                note: oe.
      - part: e
        rows:
          - scheme: |
              \(\frac{27\sqrt3\times 8^2}{8} = 216\sqrt3\ [\approx 374.1]\)
            marks:
              - code: B1
                note: \(216\sqrt3\) or awrt 374.
          - scheme: |
              \(216\sqrt3 - \frac{3\pi\times 8^2}{2} = 216\sqrt3 - 96\pi\)
            marks:
              - code: M1
                note: Subtracts their area from (a), with \(a = 8\), from their rectangle area.
          - scheme: |
              \(\approx 72.5\ (\mathrm{cm}^2)\)
            marks:
              - code: A1
                note: awrt 72.5, or \(216\sqrt3-96\pi\).
  - q: 5
    stamp: 6984788f
    parts:
      - part: a
        rows:
          - scheme: |
              \(x = 4(1-\cos\theta)\cos\theta\)
              \(\phantom{x} = 4(\cos\theta - \cos^2\theta) \Rightarrow \frac{\mathrm{d}x}{\mathrm{d}\theta} = \ldots\)
            marks:
              - code: M1
                note: Forms \(x = r\cos\theta\) with the given \(r\) and differentiates with respect to \(\theta\), by product rule or after expanding. Condone sign slips.
          - scheme: |
              \(\frac{\mathrm{d}x}{\mathrm{d}\theta} = 4(-\sin\theta + 2\sin\theta\cos\theta)\)
            marks:
              - code: A1
                note: oe; need not be factorised.
          - scheme: |
              \(4\sin\theta(2\cos\theta - 1) = 0\)
              \(\Rightarrow \theta = 0\) (pole, rejected) or \(\cos\theta = \frac12\)
            marks:
              - code: M1
                note: Sets their \(\frac{\mathrm{d}x}{\mathrm{d}\theta}\), in terms of \(\sin\theta\) and \(\cos\theta\), equal to 0, solves for \(\theta\) and rejects \(\theta = 0\) as the pole.
          - scheme: |
              \(\theta = \frac{\pi}{3},\ r = 4\left(1 - \frac12\right) = 2\)
            marks:
              - code: A1 AG
                note: cso, with \(r = 2\) shown by substituting \(\theta = \frac{\pi}{3}\).
      - part: b
        rows:
          - scheme: |
              \(\text{Area} = \int_0^{\pi/3} y\,\frac{\mathrm{d}x}{\mathrm{d}\theta}\,\mathrm{d}\theta\)
              \(\phantom{A} = 16\int_0^{\pi/3}(1-\cos\theta)\sin^2\theta\)
              \(\phantom{A = 16\int} \times(2\cos\theta-1)\,\mathrm{d}\theta\)
            marks:
              - code: M1
                note: Uses \(\int y\frac{\mathrm{d}x}{\mathrm{d}\theta}\,\mathrm{d}\theta\) with \(y = r\sin\theta\), their \(\frac{\mathrm{d}x}{\mathrm{d}\theta}\) from (a) and limits 0 and \(\frac{\pi}{3}\).
              - code: A1
                note: Correct integrand in \(\theta\), oe, with limits.
          - scheme: |
              \(16\int_0^{\pi/3}(2\cos^4\theta - 3\cos^3\theta - \cos^2\theta\)
              \(\phantom{16\int} + 3\cos\theta - 1)\,\mathrm{d}\theta = 16\left[\ldots\right]_0^{\pi/3}\)
            marks:
              - code: M1
                note: Expands, uses double-angle identities for even powers and reverse chain rule or \(1-\sin^2\theta\) for odd powers, and integrates. Condone sign and coefficient slips.
          - scheme: |
              \(16\left[\sin^3\theta + \tfrac14\sin2\theta + \tfrac1{16}\sin4\theta - \tfrac34\theta\right]_0^{\pi/3}\)
            marks:
              - code: A1
                note: Correct integral, oe; need not be simplified.
          - scheme: |
              \(16\left[\left(\tfrac{\sqrt3}{2}\right)^3 + \tfrac14\cdot\tfrac{\sqrt3}{2} - \tfrac1{16}\cdot\tfrac{\sqrt3}{2} - \tfrac{\pi}{4}\right] - 0\)
            marks:
              - code: dM1
                note: Substitutes \(\frac{\pi}{3}\) and 0 into their integrated expression and subtracts; the zero lower value may be implied.
          - scheme: |
              \(= \tfrac{15\sqrt3}{2} - 4\pi = \tfrac12(15\sqrt3 - 8\pi)\)
            marks:
              - code: A1 AG
                note: 'cso: correct exact sine values leading without error to the printed result.'
  - q: 6
    stamp: 4b13d499
    parts:
      - part: a
        rows:
          - scheme: |
              \(y = (1+2\cos 2\theta)\sin\theta\)
              \(\frac{\mathrm{d}y}{\mathrm{d}\theta} = -4\sin 2\theta\sin\theta + (1+2\cos 2\theta)\cos\theta\)
            marks:
              - code: M1
                note: Differentiates \(r\sin\theta\) with \(r = 1+2\cos 2\theta\), by the product rule or after expanding. Condone sign and coefficient slips.
              - code: A1
                note: Any correct form.
          - scheme: |
              Sets \(\frac{\mathrm{d}y}{\mathrm{d}\theta} = 0\):
              \(3\cos\theta(1-4\sin^2\theta) = 0 \Rightarrow \theta = \ldots\)
            marks:
              - code: M1
                note: Sets their \(\frac{\mathrm{d}y}{\mathrm{d}\theta}\) to zero and solves by trigonometric identities, reaching \(\theta = \ldots\). Not for substituting \(\theta = \frac{\pi}{6}\) to verify.
          - scheme: |
              \(\sin\theta = \tfrac12 \Rightarrow \theta = \tfrac{\pi}{6}\)
              \(r = 1+2\cos\tfrac{\pi}{3} = 2\)
            marks:
              - code: A1 AG
                note: Correct equation solved without error to \(\theta = \frac{\pi}{6}\) as the only solution in range, with \(r = 2\) shown by substitution.
      - part: b
        rows:
          - scheme: |
              \(\tfrac12\int_0^{\pi/6}(1+2\cos 2\theta)^2\,\mathrm{d}\theta\)
            marks:
              - code: B1
                note: May be seen within a larger expression.
          - scheme: |
              \(\tfrac12\int(3+4\cos 2\theta+2\cos 4\theta)\,\mathrm{d}\theta\)
              \(\phantom{A} = \tfrac12\left[3\theta+2\sin 2\theta+\tfrac12\sin 4\theta\right]_0^{\pi/6}\)
            marks:
              - code: M1
                note: Expands, replaces \(\cos^2 2\theta\) by \(\frac12(1\pm\cos 4\theta)\) and integrates to the form \(p\theta+q\sin 2\theta+s\sin 4\theta\). Condone sign and coefficient slips.
          - scheme: |
              \(\phantom{A} = \tfrac12\left(\tfrac{\pi}{2}+\sqrt3+\tfrac{\sqrt3}{4}\right) = \tfrac{\pi}{4}+\tfrac{5\sqrt3}{8}\)
            marks:
              - code: dM1
                note: Substitutes \(\frac{\pi}{6}\) and 0 into their integrated expression and subtracts; implied by a correct value.
              - code: A1
          - scheme: |
              \(P = (\sqrt3, 1)\)
              \(R = \tfrac12(1)(3-\sqrt3)\)
              \(\phantom{R =} - \left[\their{\tfrac{\pi}{4}+\tfrac{5\sqrt3}{8}} - \tfrac12(3)(2)\sin\tfrac{\pi}{6}\right]\)
            marks:
              - code: M1
                note: Combines their sector area, correctly signed, with areas of triangle \(OAP\) and the triangle \(A\), \(P\), \((3,1)\), or an equivalent polygon. Triangle areas need a correct method; condone arithmetic slips.
          - scheme: |
              \(R = 3-\tfrac{\pi}{4}-\tfrac{9\sqrt3}{8}\)
            marks:
              - code: A1
                note: Any exact equivalent.
  - q: 7
    stamp: bb1a9c88
    parts:
      - part: a
        rows:
          - scheme: |
              \(x = r\cos\theta,\ y = r\sin\theta \Rightarrow \frac{\mathrm{d}x}{\mathrm{d}\theta} = \ldots,\ \frac{\mathrm{d}y}{\mathrm{d}\theta} = \ldots\)
            marks:
              - code: M1
                note: Differentiates \(r\cos\theta\) or \(r\sin\theta\) by the product rule, treating \(r\) as a function of \(\theta\). Condone sign slips.
          - scheme: |
              \(\frac{\mathrm{d}x}{\mathrm{d}\theta} = \frac{\mathrm{d}r}{\mathrm{d}\theta}\cos\theta - r\sin\theta\)
              \(\frac{\mathrm{d}y}{\mathrm{d}\theta} = \frac{\mathrm{d}r}{\mathrm{d}\theta}\sin\theta + r\cos\theta\)
            marks:
              - code: A1
          - scheme: |
              \(\tan\psi = \frac{\mathrm{d}y}{\mathrm{d}x} = \frac{\mathrm{d}y/\mathrm{d}\theta}{\mathrm{d}x/\mathrm{d}\theta}\)
            marks:
              - code: M1
                note: Uses \(\tan\psi = \frac{\mathrm{d}y}{\mathrm{d}x}\) as their \(\frac{\mathrm{d}y}{\mathrm{d}\theta}\) divided by their \(\frac{\mathrm{d}x}{\mathrm{d}\theta}\).
          - scheme: |
              \(\tan\psi = \frac{\frac{\mathrm{d}r}{\mathrm{d}\theta}\sin\theta + r\cos\theta}{\frac{\mathrm{d}r}{\mathrm{d}\theta}\cos\theta - r\sin\theta}\)
            marks:
              - code: A1 AG
                note: Correct derivatives substituted, leading without error to the printed result; combined steps accepted.
      - part: b
        rows:
          - scheme: |
              \(\tan\psi = \frac{\tan\theta + \frac{r}{r'}}{1 - \tan\theta\frac{r}{r'}}\), where \(r' = \frac{\mathrm{d}r}{\mathrm{d}\theta}\)
            marks:
              - code: M1
                note: Rearranges into the form \(\frac{\tan\theta + k}{1 - k\tan\theta}\), or otherwise uses the compound angle formula for tan to relate \(\psi\), \(\theta\) and \(\frac{r}{\mathrm{d}r/\mathrm{d}\theta}\). Condone sign slips.
          - scheme: |
              \(\tan\psi = \tan(\theta + \beta)\), \(\tan\beta = \frac{r}{\mathrm{d}r/\mathrm{d}\theta}\)
            marks:
              - code: A1
                note: oe, such as \(\tan(\psi - \theta) = \frac{r}{\mathrm{d}r/\mathrm{d}\theta}\).
          - scheme: |
              \(\beta = \alpha \Rightarrow \frac{\mathrm{d}r}{\mathrm{d}\theta} = r\cot\alpha\)
            marks:
              - code: A1
                note: Identifies the angle between \(OP\) and the tangent with \(\alpha\). Any equivalent form, such as \(\tan\alpha = \frac{r}{\mathrm{d}r/\mathrm{d}\theta}\).
          - scheme: |
              \(\int \frac{1}{r}\,\mathrm{d}r = \int \cot\alpha\,\mathrm{d}\theta\)
            marks:
              - code: M1
                note: Separates their variables and integrates at least one side correctly.
          - scheme: |
              \(\ln r = (\cot\alpha)\theta + c\)
            marks:
              - code: A1
                note: Must include a constant. oe, such as \(r = Ke^{(\cot\alpha)\theta}\).
          - scheme: |
              \(\theta = 0,\ r = 2 \Rightarrow c = \ldots\ [= \ln 2]\)
            marks:
              - code: M1
                note: Substitutes \(\theta = 0\), \(r = 2\) into their integrated equation, which must contain a constant, to find the constant.
          - scheme: |
              \(r = 2e^{(\cot\alpha)\theta}\)
            marks:
              - code: A1 AG
                note: cso. Correct constant, leading without error to the printed equation.
  - q: 8
    stamp: c656da6d
    parts:
      - part: a
        rows:
          - scheme: |
              \(A(6, 0)\)
            marks:
              - code: B1
      - part: b
        rows:
          - scheme: |
              \(y = r\sin\theta = \frac{6\sin\theta}{2-\cos\theta}\)
              \(\frac{\mathrm{d}y}{\mathrm{d}\theta} = \frac{6\cos\theta(2-\cos\theta) - 6\sin^2\theta}{(2-\cos\theta)^2}\)
            marks:
              - code: M1
                note: Differentiates \(\frac{6\sin\theta}{2-\cos\theta}\) by the quotient or product rule, or \(r\sin\theta\) by the product rule. Condone sign slips. Not for differentiating \(r\) or \(r\cos\theta\).
              - code: A1
                note: Any correct form; need not be simplified.
          - scheme: |
              \(12\cos\theta - 6(\cos^2\theta + \sin^2\theta) = 0\)
              \(\Rightarrow \cos\theta = \ldots\)
            marks:
              - code: M1
                note: Sets the numerator of their quotient-rule derivative to zero, uses \(\sin^2\theta+\cos^2\theta=1\) and solves for \(\theta\).
          - scheme: |
              \(\theta = \frac{\pi}{3}\)
            marks:
              - code: A1
                note: Or awrt 1.05, with no other value in \(0\leq\theta\leq\pi\).
          - scheme: |
              \(r = \frac{6}{2 - \cos\their{\frac{\pi}{3}}}\)
              \(\Rightarrow B\left(4, \frac{\pi}{3}\right)\)
            marks:
              - code: M1
                note: Substitutes their \(\theta\) from \(\frac{\mathrm{d}y}{\mathrm{d}\theta}=0\) into the equation of \(C\).
              - code: A1
                note: Or \((4, \text{awrt } 1.05)\).
      - part: c
