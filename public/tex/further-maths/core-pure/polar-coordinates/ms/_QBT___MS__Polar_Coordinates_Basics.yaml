          - scheme: |
              \(x = \their{(1+2\pi)}\cos\pi,\ y = \their{(1+2\pi)}\sin\pi\)
            marks:
              - code: M1
                note: Uses \(x = r\cos\theta\) and \(y = r\sin\theta\) with their \(r\) and \(\theta = \pi\).
          - scheme: |
              \((-1-2\pi, 0)\)
            marks:
              - code: A1
                note: oe, or awrt \((-7.28, 0)\).
      - part: b
        rows:
          - scheme: |
              \(1+2\theta = 8-\theta \Rightarrow \theta = \ldots\)
            marks:
              - code: M1
