  - q: 2
    stamp: 5d9d9c9f
    parts:
      - part: a
        rows:
          - scheme: |
              \(r = \dfrac{6}{2-\sin\frac{\pi}{6}} = \dfrac{6}{2-\frac12} = 4\)
            marks:
              - code: B1
                note: Needs \(\sin\frac{\pi}{6} = \frac12\) substituted, or the denominator \(\frac32\) seen, leading to \(r = 4\).
      - part: b
        rows:
          - scheme: |
              \(r\) greatest when \(2-\sin\theta\) is least: \(\sin\theta = 1\)
            marks:
              - code: B1
                note: Identifies \(\sin\theta = 1\), or \(\theta = \frac{\pi}{2}\), as giving greatest \(r\), by the least denominator or otherwise.
          - scheme: |
              \(\theta = \frac{\pi}{2} \Rightarrow r = \dfrac{6}{2-1} = \ldots\)
            marks:
              - code: M1
                note: Substitutes their \(\theta\), from maximising \(r\), into the equation of \(C\) to find \(r\).
          - scheme: |
              \(\left(6, \frac{\pi}{2}\right)\)
            marks:
              - code: A1
                note: Accept \(r = 6\), \(\theta = \frac{\pi}{2}\) stated separately.
      - part: c
        rows:
          - scheme: |
              \(r\sin\theta = r\cos\theta \Rightarrow \tan\theta = 1\)
            marks:
              - code: M1
                note: Substitutes \(x = r\cos\theta\), \(y = r\sin\theta\) into \(y = x\), reaching \(\tan\theta = 1\) or an angle directly.
          - scheme: |
              \(\theta = \frac{\pi}{4},\ -\frac{3\pi}{4}\)
            marks:
              - code: A1
                note: Both, with no others in \(-\pi<\theta\leq\pi\). Condone \(\frac{5\pi}{4}\) for the second.
          - scheme: |
              \(r = \dfrac{6}{2-\frac{\sqrt2}{2}},\ x = r\cos\frac{\pi}{4} = \ldots\)
              \(r = \dfrac{6}{2+\frac{\sqrt2}{2}},\ x = r\cos\left(-\frac{3\pi}{4}\right) = \ldots\)
            marks:
              - code: M1
                note: Finds \(r\) at one of their angles and uses \(x = r\cos\theta\) or \(y = r\sin\theta\). Need not be simplified.
          - scheme: |
              \(\left(\frac{6+12\sqrt2}{7}, \frac{6+12\sqrt2}{7}\right)\), \(\left(\frac{6-12\sqrt2}{7}, \frac{6-12\sqrt2}{7}\right)\)
            marks:
              - code: A1
                note: Both points, each with both coordinates, in any exact form; need not be rationalised.
  - q: 3
    stamp: f3c1d88e
    parts:
      - part: a
        rows:
          - figure: 1
            marks:
              - code: B1
                note: Given portion reflected in the initial line, giving a closed curve symmetric about it and still passing through \((1,0)\).
                feature: symmetry
      - part: b
        rows:
          - figure: 2
            marks:
              - code: B1
                note: Vertical line through \((1,0)\) on the initial line, meeting \(C\) there and crossing it once above and once below the initial line.
                feature: intercepts
          - scheme: |
              \((4-3\cos\theta)\cos\theta = 1\)
            marks:
              - code: M1
                note: Substitutes for \(r\) in \(r\cos\theta=1\) to obtain an equation in \(\cos\theta\) alone.
          - scheme: |
              \(3\cos^2\theta - 4\cos\theta + 1 = 0\)
            marks:
              - code: A1
                note: oe, any three-term form.
          - scheme: |
              \((3\cos\theta-1)(\cos\theta-1)=0 \Rightarrow \cos\theta = \ldots\)
              \(\theta = \ldots,\ r = 4-3\cos\theta = \ldots\)
            marks:
              - code: dM1
                note: Solves their three-term quadratic in \(\cos\theta\) by any means, then finds at least one \(\theta\) and its \(r\) from either equation.
          - scheme: |
              \((1, 0)\)
            marks:
              - code: A1
          - scheme: |
              \((3, 1.23)\), \((3, -1.23)\)
            marks:
              - code: A1
                note: Both, with \(r = 3\) and angles awrt \(\pm1.23\). A0 for an angle outside \(-\pi<\theta\leq\pi\).
  - q: 4
    stamp: 0d082ca4
    parts:
      - part: a
        rows:
          - scheme: |
              \(x^2+y^2+4x-6y=12\)
            marks:
              - code: M1
                note: Replaces \(r^2\) by \(x^2+y^2\) and at least one of \(r\cos\theta\), \(r\sin\theta\) by \(x\), \(y\).
              - code: A1
                note: Correct equation, oe.
          - scheme: |
              \((x+2)^2-4+(y-3)^2-9=12\)
            marks:
              - code: M1
                note: Completes the square in both \(x\) and \(y\) for their equation of the form \(x^2+y^2+ax+by=c\). Condone sign slips.
          - scheme: |
              \((x+2)^2+(y-3)^2=25\)
              Centre \((-2,3)\), radius \(5\)
            marks:
              - code: A1
                note: Both centre and radius, from a correct equation in circle form.
      - part: b
        rows:
          - figure: 1
            marks:
              - code: B1
                note: Circle with its centre marked in the second quadrant, labelled \((-2,3)\).
                feature: centre and radius
              - code: B1
                note: Pole marked at the origin, inside the circle.
                feature: labelled point
          - scheme: |
              \(OA=\sqrt{(-2)^2+3^2}\ [=\sqrt{13}]\)
              \(5\pm\their{\sqrt{13}}\)
            marks:
              - code: M1
                note: Finds the distance from the pole to their centre and adds it to and subtracts it from their radius. No justification that the pole is inside is needed.
          - scheme: |
              Greatest \(5+\sqrt{13}\), least \(5-\sqrt{13}\)
            marks:
              - code: A1
                note: Both, correctly identified.
  - q: 5
    stamp: ee1fd892
    parts:
      - part: a
        rows:
          - scheme: |
              \(x^2+\left(y-\frac{\sqrt3}{2}\right)^2=\ldots\)
            marks:
              - code: M1
                note: Completes the square in \(y\), or compares with the general circle equation. Condone a slip in the constant.
          - scheme: |
              Centre \(\left(0,\frac{\sqrt3}{2}\right)\), radius \(\frac{\sqrt3}{2}\)
            marks:
              - code: A1
                note: Both, exact or awrt 0.866.
          - scheme: |
              \(r^2\cos^2\theta+r^2\sin^2\theta=\sqrt3\,r\sin\theta\)
            marks:
              - code: M1
                note: Substitutes \(x=r\cos\theta\), \(y=r\sin\theta\), or uses \(x^2+y^2=r^2\) with \(y=r\sin\theta\).
          - scheme: |
              \(r^2=\sqrt3\,r\sin\theta\), \(r\neq0\)
              \(\Rightarrow r=\sqrt3\sin\theta\)
            marks:
              - code: A1 AG
                note: Correct substituted equation leading without error to the printed result. Needs \(r\neq0\), or non-pole, stated when dividing by \(r\).
      - part: b
        rows:
          - scheme: |
              \(\sqrt3\sin\theta=1+\cos\theta\)
              \(\Rightarrow \sqrt3\sin\theta-\cos\theta=R\sin(\theta-\alpha)=1\)
            marks:
              - code: M1
                note: Equates the radii and reduces to one trigonometric function, e.g. any harmonic form with \(R\) and \(\alpha\) attempted, or half-angle identities. Condone sign slips.
          - scheme: |
              \(R=2,\ \alpha=\frac{\pi}{6}\)
            marks:
              - code: A1
                note: Or a correct equivalent single-function equation by another route.
          - scheme: |
              \(\sin\left(\theta-\frac{\pi}{6}\right)=\frac12 \Rightarrow \theta=\ldots\)
            marks:
              - code: dM1
                note: Solves their equation for \(\theta\) in \(0\le\theta\le\pi\), finding at least one value.
          - scheme: |
              \(\theta=\frac{\pi}{3}\) (\(\theta=\pi\) is the pole)
              \(P\left(\frac32,\frac{\pi}{3}\right)\)
            marks:
              - code: A1
                note: cso. Exact. Needs \(\theta=\pi\) rejected, or \(\frac{\pi}{3}\) shown to be the only solution in \(0<\theta<\pi\), with one intersection stated.
      - part: c
        rows:
          - figure: 1
            marks:
              - code: B1
                note: Complete circle above the initial line, touching it at the pole.
                feature: shape
              - code: B1
                note: Upper half of a cardioid from \((2,0)\), passing into \(x<0\) before reaching the pole; both curves labelled.
                feature: shape
              - code: B1
                note: \(P\) marked at the intersection, and \((2,0)\) and \((0,0)\) indicated.
                feature: intercepts
  - q: 6
    stamp: 755daf28
    parts:
      - part: i
        rows:
          - scheme: |
              \(r^4 = 5r^2\cos^2\theta + 4r^2\cos\theta\sin\theta\)
              \(\phantom{r^4 =} + 2r^2\sin^2\theta\)
            marks:
              - code: M1
                note: Substitutes \(x=r\cos\theta\), \(y=r\sin\theta\) and \(x^2+y^2=r^2\) throughout. Condone one slip.
          - scheme: |
              \(r^2 = 5\cos^2\theta + 4\cos\theta\sin\theta + 2\sin^2\theta\)
            marks:
              - code: A1
          - scheme: |
              \(r^2 = \tfrac52(1+\cos2\theta) + 2\sin2\theta\)
              \(\phantom{r^2 =} + (1-\cos2\theta)\)
            marks:
              - code: M1
                note: Uses double-angle identities for all of \(\cos^2\theta\), \(\sin^2\theta\) and \(\sin\theta\cos\theta\). Condone sign and coefficient slips.
          - scheme: |
              \(r^2 = \dfrac{7+3\cos2\theta+4\sin2\theta}{2}\)
            marks:
              - code: A1 AG
                note: Correct equation in \(r\) and \(\theta\) leading without error to the printed result; combined steps accepted.
      - part: ii
        rows:
          - scheme: |
              \(3\cos2\theta+4\sin2\theta = R\cos(2\theta-\alpha)\)
              \(\dfrac{7-R}{2} \leq r^2 \leq \dfrac{7+R}{2}\)
            marks:
              - code: M1
                note: Expresses \(3\cos2\theta+4\sin2\theta\) as any single harmonic form and uses its bounds \(\pm R\) in \(r^2\). Condone a wrong \(R\).
          - scheme: |
              \(R = 5 \Rightarrow 1 \leq r^2 \leq 6\)
            marks:
              - code: A1
          - scheme: |
              Least distance \(1\), greatest distance \(\sqrt6\)
            marks:
              - code: A1
                note: Both distances, exact. Not for the values of \(r^2\) alone.
  - q: 7
    stamp: 3feb5a55
    parts:
      - part: a
        rows:
          - scheme: |
              \(r\cos\left(\theta+\tfrac{\pi}{6}\right)=6\)
              \(r\left(\cos\theta\cos\tfrac{\pi}{6}-\sin\theta\sin\tfrac{\pi}{6}\right)=6\)
            marks:
              - code: M1
                note: Multiplies through by \(\cos\left(\theta+\frac{\pi}{6}\right)\) and expands the compound angle. Condone sign slips in the expansion.
          - scheme: |
              \(\tfrac{\sqrt3}{2}x-\tfrac12y=6\)
            marks:
              - code: dM1
                note: Replaces \(r\cos\theta\) by \(x\) and \(r\sin\theta\) by \(y\).
          - scheme: |
              \(y=\sqrt3x-12\)
            marks:
              - code: A1
                note: cso. Must be in the form \(y=mx+c\); another linear form such as \(\sqrt3x-y=12\) scores A0.
      - part: b
        rows:
          - figure: 1
            marks:
              - code: B1
                note: Straight line with positive gradient crossing the initial line to the right of \(O\), extending above and below it.
                feature: shape
              - code: B1
                note: Ray from \(O\) below the initial line meeting \(G_1\), with \(\alpha\) marked between the ray and the initial line.
                feature: half-line
              - code: B1
                note: \(\left(4\sqrt3,0\right)\), \(\left(6\sec\frac{\pi}{6},0\right)\) or awrt \((6.93,0)\), at the crossing of \(G_1\) and the initial line.
                feature: labelled point
      - part: c
        rows:
          - scheme: |
              \(r=6\sec\left(-\alpha+\tfrac{\pi}{6}\right)\)
            marks:
              - code: M1
                note: Substitutes \(\theta=-\alpha\) into the equation of \(G_1\).
          - scheme: |
              \(\left(6\sec\left(\tfrac{\pi}{6}-\alpha\right),\,-\alpha\right)\)
            marks:
              - code: A1
                note: Both coordinates, oe such as \(\frac{6}{\cos\left(\frac{\pi}{6}-\alpha\right)}\) or expanded.
      - part: d
        rows:
          - scheme: |
              \(12\sqrt3=\tfrac12\left(\their{4\sqrt3}\right)\left(\their{6\sec\left(\tfrac{\pi}{6}-\alpha\right)}\right)\sin\alpha\)
            marks:
              - code: M1
                note: Forms the triangle's area in terms of \(\alpha\), e.g. \(\frac12ab\sin C\) with their sides from \(O\) and angle \(\alpha\), or \(\frac12\int r^2\,\mathrm{d}\theta\), equal to \(12\sqrt3\).
              - code: A1
                note: Correct equation, oe.
          - scheme: |
              \(\sin\alpha=\cos\left(\tfrac{\pi}{6}-\alpha\right)\)
              \(\phantom{\sin\alpha}=\tfrac{\sqrt3}{2}\cos\alpha+\tfrac12\sin\alpha\)
              \(\Rightarrow\tan\alpha=\ldots\)
            marks:
              - code: dM1
                note: Expands the compound angle and rearranges to an equation in \(\tan\alpha\) alone. Condone sign slips.
          - scheme: |
              \(\tan\alpha=\sqrt3\Rightarrow\alpha=\tfrac{\pi}{3}\)
            marks:
              - code: A1
                note: cso, with no other values given.
  - q: 8
    stamp: 845b1160
    parts:
      - part: i
        rows:
          - scheme: |
              \(2(1+\cos 3\theta) = 0 \Rightarrow \cos 3\theta = -1\)
              \(\phantom{2(1+\cos 3\theta)} \Rightarrow \theta = \ldots\)
            marks:
              - code: M1
                note: Sets \(r = 0\) and solves \(\cos 3\theta = -1\) for at least one value of \(\theta\).
          - scheme: |
              \(\alpha = \frac{\pi}{3}\)
            marks:
              - code: A1
                note: In terms of \(\pi\); 1.05 alone scores A0.
      - part: ii.a
        rows:
          - scheme: |
              \(f\left(\frac{2k\pi}{3}-\theta\right) = 2[1+\cos(2k\pi - 3\theta)]\)
              \(\phantom{f} = 2[1+\cos 2k\pi\cos 3\theta + \sin 2k\pi\sin 3\theta]\)
            marks:
              - code: M1
                note: Expands \(\cos(2k\pi - 3\theta)\) by the addition formula, or uses the evenness and period \(2\pi\) of cosine.
          - scheme: |
              \(\phantom{f} = 2(1+\cos 3\theta) = f(\theta)\)
            marks:
              - code: A1
                note: Reaches \(f(\theta)\) without error for general integer \(k\), not a particular value.
          - scheme: |
              \(f\left(\theta+\frac{2\pi}{3}\right) = 2[1+\cos(3\theta + 2\pi)]\)
              \(\phantom{f} = 2[1+\cos 3\theta\cos 2\pi - \sin 3\theta\sin 2\pi]\)
            marks:
              - code: M1
                note: Expands \(\cos(3\theta + 2\pi)\) by the addition formula, or uses the period \(2\pi\) of cosine.
          - scheme: |
              \(\phantom{f} = 2(1+\cos 3\theta) = f(\theta)\)
            marks:
              - code: A1 AG
                note: Correct substituted expression leading without error to \(f(\theta)\), with \(= f(\theta)\) or a statement in words to conclude.
      - part: ii.b
        rows:
          - scheme: |
              Reflection in \(\theta = \beta\): \(\theta \to 2\beta - \theta\)
              \(2\beta = \frac{2k\pi}{3} \Rightarrow \theta = \frac{k\pi}{3}\)
            marks:
              - code: B1
                note: Lines \(\theta = \frac{k\pi}{3}\) oe, linked to the first identity.
          - scheme: |
              \(\theta = 0,\ \frac{\pi}{3},\ \frac{2\pi}{3}\)
            marks:
              - code: B1
                note: All three and no others.
          - scheme: |
              Rotation through \(\frac{2\pi}{3}\)
            marks:
              - code: B1
      - part: iii
        rows:
          - figure: 1
            marks:
              - code: B1
                note: Three equal closed lobes meeting at \(O\), one centred on the initial line, the others in roughly the correct directions.
                feature: shape
          - scheme: |
              \(r_{\max} = 4\)
            marks:
              - code: B1
          - scheme: |
              \(\cos 3\theta = 1 \Rightarrow 3\theta = 2k\pi \Rightarrow \theta = \ldots\)
            marks:
              - code: M1
                note: Sets \(\cos 3\theta = 1\) and finds at least one nonzero value of \(\theta\).
          - scheme: |
              \(\theta = 0,\ \frac{2\pi}{3},\ \frac{4\pi}{3}\)
            marks:
              - code: A1
                note: All three, or 0, awrt 2.09 and 4.19, with no others in \(0 \leq \theta < 2\pi\).
  - q: 9
    stamp: 6062d685
    parts:
      - part: a
        rows:
          - scheme: |
              \(r\cos\left(\theta-\frac{\pi}{4}\right)=3\)
              \(\Rightarrow \frac{r\cos\theta+r\sin\theta}{\sqrt2}=3\)
            marks:
              - code: M1
                note: Expands \(\cos\left(\theta-\frac{\pi}{4}\right)\) and replaces \(r\cos\theta\), \(r\sin\theta\) by \(x\), \(y\). Condone a slip in the value of \(\cos\frac{\pi}{4}\).
          - scheme: |
              \(x+y=3\sqrt2\)
            marks:
              - code: A1 AG
                note: Correct expansion with \(\cos\frac{\pi}{4}=\sin\frac{\pi}{4}=\frac{1}{\sqrt2}\), leading without error to the printed equation.
      - part: b
        rows:
          - scheme: |
              \(\sin2\theta=2\cos^2\left(\theta-\frac{\pi}{4}\right)-1\)
              \(\phantom{\sin2\theta}=\frac{18}{r^2}-1\)
              \(r=5-2\left(\frac{18}{r^2}-1\right)\)
            marks:
              - code: M1
                note: Eliminates \(\theta\) using \(L\) and a double-angle identity, e.g. via \((x+y)^2=r^2(1+\sin2\theta)\), to an equation in \(r\) alone. Condone sign slips.
          - scheme: |
              \(r^3-7r^2+36=0\)
            marks:
              - code: A1
                note: oe, e.g. \(r=7-\frac{36}{r^2}\).
          - scheme: |
              \((r-3)(r-6)(r+2)=0 \Rightarrow r=\ldots\)
            marks:
              - code: dM1
                note: Solves their cubic by any means, calculator included, to obtain values of \(r\).
          - scheme: |
              \(r=3,\ r=6\) (\(r=-2\) rejected as \(3\le r\le7\))
            marks:
              - code: A1
                note: Both values, with \(r=-2\) rejected for any valid reason.
          - scheme: |
              \(\cos\left(\theta-\frac{\pi}{4}\right)=\frac{3}{\their{r}}\), \(-\frac{\pi}{2}<\theta-\frac{\pi}{4}<\frac{\pi}{2}\)
              \(\Rightarrow \theta=\ldots\)
            marks:
              - code: M1
                note: Substitutes a positive value of their \(r\) into either equation and solves for \(\theta\) in \(-\frac{\pi}{4}<\theta<\frac{3\pi}{4}\).
          - scheme: |
              \(\left(3,\frac{\pi}{4}\right),\ \left(6,-\frac{\pi}{12}\right),\ \left(6,\frac{7\pi}{12}\right)\)
              No other solutions in the range of \(L\)
            marks:
              - code: A1
                note: cso. All three exact points and no others, with a statement that the cosine equations have no further solutions in the range of \(L\).
  - q: 10
    stamp: a23ced17
    parts:
      - part: a
        rows:
          - scheme: |
              \((r\cos\theta)^2-(r\sin\theta)^2=6r\cos\theta\)
            marks:
              - code: M1
                note: Substitutes both into the Cartesian equation.
          - scheme: |
              \(r^2\cos2\theta=6r\cos\theta \Rightarrow r\cos2\theta=6\cos\theta\)
            marks:
              - code: A1
          - scheme: |
              \(x>0 \Rightarrow \cos\theta>0\), \(r>0 \Rightarrow \cos2\theta>0\)
              \(\Rightarrow -\frac{\pi}{4}<\theta<\frac{\pi}{4}\), \(r=6\cos\theta\sec2\theta\)
            marks:
              - code: A1 AG
                note: Printed equation reached without error, with the range deduced from \(\cos\theta>0\) and \(\cos2\theta>0\). A0 if the range is only stated.
      - part: b.i
        rows:
          - scheme: |
              \(0<\cos2\theta=\cos^2\theta-\sin^2\theta\leq\cos^2\theta\leq\cos\theta\)
            marks:
              - code: M1
                note: 'Attempts a valid justification: bounds \(\cos2\theta\) by \(\cos\theta\) on the interval, sets \(\frac{\mathrm{d}r}{\mathrm{d}\theta}=0\), or writes \(r^2=2x^2-6x\) for \(x\geq6\).'
          - scheme: |
              \(r=\dfrac{6\cos\theta}{\cos2\theta}\geq6\), equality only at \(\theta=0\)
            marks:
              - code: A1
                note: 'Or an equivalent conclusion: the stationary point shown to be a minimum, or \(r^2\) increasing for \(x\geq6\).'
          - scheme: |
              \(N=(6,0)\)
            marks:
              - code: A1
      - part: b.ii
        rows:
          - scheme: |
              \(6\sqrt3\cos2\theta=6\cos\theta\)
              \(\Rightarrow \sqrt3(2\cos^2\theta-1)=\cos\theta\)
            marks:
              - code: M1
                note: Equates \(6\sqrt3\) to the polar equation and uses a double-angle formula to reach an equation in \(\cos\theta\) only; or eliminates \(y\) using \(x^2+y^2=108\).
          - scheme: |
              \(2\sqrt3\cos^2\theta-\cos\theta-\sqrt3=0\)
            marks:
              - code: A1
                note: oe, or \(2x^2-6x-108=0\) oe.
          - scheme: |
              \((2\cos\theta-\sqrt3)(\sqrt3\cos\theta+1)=0 \Rightarrow \cos\theta=\ldots\)
            marks:
              - code: dM1
                note: Solves their three-term quadratic by factorising (product of constants correct), the formula or completing the square; calculator allowed.
          - scheme: |
              \(\cos\theta=\frac{\sqrt3}{2}\) (\(-\frac{1}{\sqrt3}\) rejected as \(\cos\theta>0\))
            marks:
              - code: A1
                note: Other root rejected with a reason, eg \(\cos\theta>0\) on the interval; or \(x=9\) with \(x=-6\) rejected.
          - scheme: |
              \(P\left(6\sqrt3,\frac{\pi}{6}\right)\), \(Q\left(6\sqrt3,-\frac{\pi}{6}\right)\)
            marks:
              - code: A1
                note: Both points exact, angles in the stated interval; \(\frac{11\pi}{6}\) for \(Q\) scores A0.
      - part: b.iii
        rows:
          - scheme: |
              \(NP^2=6^2+(6\sqrt3)^2-2(6)(6\sqrt3)\cos\frac{\pi}{6}\)
            marks:
              - code: M1
                note: Uses the cosine rule in triangle \(ONP\) with \(ON=6\), their \(OP\) from (b)(ii) and angle \(\frac{\pi}{6}\), or the distance formula, or finds the Cartesian coordinates of \(P\).
