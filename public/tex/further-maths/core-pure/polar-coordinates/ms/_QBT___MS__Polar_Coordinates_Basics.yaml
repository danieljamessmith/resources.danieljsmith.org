          - scheme: |
              \(\left(\frac{17}{3}, \frac73\right)\)
            marks:
              - code: A1
                note: oe, or awrt \((5.67, 2.33)\). Both coordinates needed.
      - part: c
        rows:
          - figure: 1
            marks:
              - code: B1
