              - code: B1
                note: Start on the initial line labelled 8 or \((8, 0)\).
                feature: labelled point
              - code: B1
                note: End on the initial line between \(O\) and the start, labelled \(8-2\pi\), awrt 1.72, or \((8-2\pi, 2\pi)\).
