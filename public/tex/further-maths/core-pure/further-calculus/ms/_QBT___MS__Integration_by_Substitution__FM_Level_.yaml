          - scheme: |
              \(= \left[-\tfrac43 u^{3/2} + 8u^{1/2} + 2u^{-1/2}\right]\)
            marks:
              - code: A1
                note: oe, need not be simplified.
          - scheme: |
              \(\left(-\tfrac43\left(\tfrac32\right)^{3/2} + 8\left(\tfrac32\right)^{1/2} + 2\left(\tfrac32\right)^{-1/2}\right)\)
              \(\phantom{=} - \left(-\tfrac43 + 8 + 2\right)\)
            marks:
              - code: dM1
                note: Applies limits 1 and \(\frac32\) to their integral, or 0 and \(\frac{\pi}{6}\) after substituting back, subtracting the right way round.
          - scheme: |
              \(= -\tfrac{26}{3} + \tfrac{11}{3}\sqrt6\)
