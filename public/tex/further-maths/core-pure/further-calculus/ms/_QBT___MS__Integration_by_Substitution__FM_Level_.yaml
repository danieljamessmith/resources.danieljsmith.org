            marks:
              - code: A1
                note: Correct integrand in \(u\), oe.
          - scheme: |
              \(= \frac12\arcsin u\)
            marks:
              - code: M1
                note: Integrates their integral of the form \(\frac{p}{\sqrt{a^2 - b^2u^2}}\) to \(\lambda\arcsin(\mu u)\).
              - code: A1
          - scheme: |
              \(x = 0 \Rightarrow u = 0\), \(x = 1 \Rightarrow u = \frac23\tanh 1\)
              \(\frac12\arcsin\left(\frac23\tanh 1\right) - \frac12\arcsin 0\)
            marks:
              - code: dM1
                note: Applies \(u\)-limits \(0\) and \(\frac23\tanh 1\) to their arcsin form, or substitutes back for \(u\) and applies \(0\) and \(1\).
          - scheme: |
              \(= \frac12\arcsin\left(\frac23\tanh 1\right)\ [\approx 0.266]\)
            marks:
              - code: A1
                note: oe, or awrt 0.266.
  - q: 9
    stamp: d57f6d31
    parts:
      - part: a
        rows:
          - scheme: |
              \(x = \frac{u^2-1}{2},\ \mathrm{d}x = u\,\mathrm{d}u\)
              \(\int \frac{\frac12(u^2-1)}{2+u}\,u\,\mathrm{d}u\)
            marks:
              - code: M1
                note: Replaces \(x\), \(\sqrt{2x+1}\) and \(\mathrm{d}x\) by expressions in \(u\), with \(\mathrm{d}x\) of the form \(ku\,\mathrm{d}u\).
          - scheme: |
              \(x = 0 \Rightarrow u = 1,\ x = \frac{15}{2} \Rightarrow u = 4\)
            marks:
              - code: B1
          - scheme: |
              \(\int_1^4 \frac{u(u^2-1)}{2(u+2)}\,\mathrm{d}u\)
            marks:
              - code: A1 AG
                note: Correct substituted integral leading without error to the printed integrand.
      - part: b
        rows:
          - scheme: |
              \(u^3 - u = (u+2)(au^2+bu+c) + d \Rightarrow \ldots\)
            marks:
              - code: M1
                note: Divides \(u^3-u\) by \(u+2\) by any method, reaching a quadratic quotient and a constant remainder. Condone slips.
          - scheme: |
              \(\frac{u(u^2-1)}{2(u+2)} = \frac12\left(u^2-2u+3-\frac{6}{u+2}\right)\)
            marks:
              - code: A1
                note: Or quotient \(u^2-2u+3\) and remainder \(-6\) stated.
          - scheme: |
              \(\frac12\left[\frac{u^3}{3}-u^2+3u-6\ln(u+2)\right]_1^4\)
            marks:
              - code: M1
                note: Integrates their quotient and \(\frac{d}{u+2}\), with \(\frac{d}{u+2} \to d\ln(u+2)\) and at least one power increased by 1. Condone coefficient slips.
          - scheme: |
              \(\frac12\left[\left(\frac{52}{3}-6\ln 6\right)-\left(\frac73-6\ln 3\right)\right]\)
              \(\ln 6 - \ln 3 = \ln 2 \Rightarrow \ldots\)
            marks:
              - code: dM1
                note: Substitutes 4 and 1 into their integral, subtracts, and combines their logarithms into a single logarithm.
          - scheme: |
              \(\frac{15}{2} - 3\ln 2\)
            marks:
              - code: A1
                note: cso. Or \(A = \frac{15}{2}\), \(B = 3\). Not for \(\frac{15}{2} - \ln 8\) or a decimal.
  - q: 10
    stamp: 0af7423c
    parts:
      - part: ''
        rows:
          - scheme: |
              \(u = 1 + \sin x \Rightarrow \mathrm{d}u = \cos x\,\mathrm{d}x\)
            marks:
              - code: M1
                note: Uses an appropriate substitution such as \(u = 1 + \sin x\), replacing \(\cos x\,\mathrm{d}x\) by a multiple of \(\mathrm{d}u\).
