  - q: 12
    stamp: '8358e480'
    parts:
      - part: ''
        rows:
          - scheme: |
              \(u = \tfrac32\tanh x\), \(\mathrm{d}u = \tfrac32\operatorname{sech}^2 x\,\mathrm{d}x\)
              \(\Rightarrow \int \frac{\frac23}{\sqrt{4 - 9\left(\frac{2u}{3}\right)^2}}\,\mathrm{d}u\)
            marks:
              - code: M1
                note: Substitutes for \(\tanh x\), such as \(u = k\tanh x\), replacing both \(\operatorname{sech}^2 x\,\mathrm{d}x\) and \(\tanh^2 x\) in the new variable. Condone coefficient slips.
          - scheme: |
              \(= \tfrac13\int \frac{1}{\sqrt{1-u^2}}\,\mathrm{d}u\)
            marks:
              - code: A1
                note: Correct integrand for their substitution, oe such as \(\frac{1}{\sqrt{4-9u^2}}\) for \(u = \tanh x\).
          - scheme: |
              \(e^{2x} = 2+\sqrt3\)
