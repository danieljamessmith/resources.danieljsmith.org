questions:
  - q: 1
    stamp: b007bc6f
    parts:
      - part: a
        rows:
          - scheme: |
              \(\frac{\mathrm{d}}{\mathrm{d}x}\ln(\sec x+\tan x) = \frac{\sec x\tan x+\sec^2 x}{\sec x+\tan x}\)
            marks:
              - code: M1
                note: Divides a derivative of \(\sec x+\tan x\) of the form \(p\sec x\tan x+q\sec^2 x\) by \(\sec x+\tan x\), oe in sines and cosines.
          - scheme: |
              \(\phantom{\frac{\mathrm{d}}{\mathrm{d}x}} = \frac{\sec x(\tan x+\sec x)}{\sec x+\tan x} = \sec x\)
            marks:
              - code: A1 AG
                note: Correct derivative simplified without error to \(\sec x\); combined steps accepted.
      - part: b
        rows:
          - scheme: |
              \(V = \pi\int_0^{\pi/3}\sec x\,\mathrm{d}x\)
            marks:
              - code: B1
                note: Needs the \(\pi\); limits may be implied by their substitution.
          - scheme: |
              \(\phantom{V} = \pi\left[\ln(\sec x+\tan x)\right]_0^{\pi/3}\)
            marks:
              - code: M1
                note: Obtains \(\ln(\sec x+\tan x)\), or another correct integral of \(\sec x\). The \(\pi\) need not be seen.
          - scheme: |
              \(\phantom{V} = \pi\left(\ln(2+\sqrt{3}) - \ln 1\right)\)
            marks:
              - code: dM1
                note: Substitutes both limits and subtracts, evaluating \(\sec\) and \(\tan\) exactly. Condone the zero lower-limit term unwritten.
          - scheme: |
              \(V = \pi\ln(2+\sqrt{3})\)
            marks:
              - code: A1
                note: oe exact, such as \(-\pi\ln(2-\sqrt{3})\).
  - q: 2
    stamp: d9a8778b
    parts:
      - part: a
        rows:
          - scheme: |
              \(\sinh(2\ln 2) = \frac{e^{2\ln 2} - e^{-2\ln 2}}{2}\)
              \(e^{2\ln 2} = e^{\ln 4} = 4\)
            marks:
              - code: M1
                note: Uses the exponential definition of \(\sinh\) with \(2\ln 2\), or a double-angle identity with \(\ln 2\), and evaluates at least one exponential.
          - scheme: |
              \(\sinh(2\ln 2) = \frac{4 - \frac14}{2} = \frac{15}{8}\)
            marks:
              - code: A1 AG
                note: Correct substituted expression leading without error to \(\frac{15}{8}\); combined steps accepted.
      - part: b
        rows:
          - scheme: |
              \(V = \pi\int_0^{2\ln 2} (\cosh x - 1)\,\mathrm{d}x\)
            marks:
              - code: B1
                note: Correct integral with limits \(0\) and \(2\ln 2\), oe such as a cylinder of volume \(2\pi\ln 2\) subtracted. Needs the \(\pi\).
          - scheme: |
              \(\int (\cosh x - 1)\,\mathrm{d}x = \sinh x - x\)
            marks:
              - code: M1
                note: Integrates at least one term correctly, such as \(\cosh x \to \sinh x\).
              - code: A1
                note: With or without \(\pi\).
          - scheme: |
              \(\pi\left[\sinh x - x\right]_0^{2\ln 2} = \pi\left(\tfrac{15}{8} - 2\ln 2 - 0\right)\)
            marks:
              - code: dM1
                note: Applies their limits to their integral of the form \(p\sinh x + qx\), evaluating \(\sinh(2\ln 2)\) by (a) or otherwise.
          - scheme: |
              \(V = \pi\left(\frac{15}{8} - 2\ln 2\right)\)
            marks:
              - code: A1
                note: Any exact equivalent, such as \(\frac{15\pi}{8} - \pi\ln 4\).
  - q: 3
    stamp: a0ee66ce
    parts:
      - part: ''
        rows:
          - scheme: |
              \(\pi\int_0^k \frac{k-x}{k+x}\,\mathrm{d}x = 1\)
            marks:
              - code: B1
                note: Needs \(\pi\), \(y^2\) as the integrand and limits 0 and \(k\); the \(= 1\) may be seen later.
          - scheme: |
              \(\frac{k-x}{k+x} = -1 + \frac{2k}{k+x}\)
              \(\Rightarrow \int \ldots \,\mathrm{d}x = \ldots\)
            marks:
              - code: M1
                note: Writes the integrand as a constant plus \(\frac{c}{k+x}\) and integrates to the form \(px + q\ln(k+x)\). Condone sign and coefficient slips.
          - scheme: |
              \(\left[-x + 2k\ln(k+x)\right]_0^k\)
            marks:
              - code: A1
                note: Accept \(\ln|k+x|\) or any equivalent, such as \(2k\ln(k+x) - x + c\).
          - scheme: |
              \(\pi\left(-k + 2k\ln 2k - 2k\ln k\right) = 1\)
              \(\Rightarrow \pi k(2\ln 2 - 1) = 1 \Rightarrow k = \ldots\)
            marks:
              - code: dM1
                note: Substitutes both limits into their integral, subtracts, and combines the logarithms to a constant multiple of \(k\).
          - scheme: |
              \(k = \frac{1}{\pi(2\ln 2 - 1)}\)
            marks:
              - code: A1
                note: Or any exact equivalent, such as \(\frac{1}{\pi(\ln 4 - 1)}\).
  - q: 4
    stamp: 5aaf52c5
    parts:
      - part: ''
        rows:
          - scheme: |
              \(\pi\int_0^k \frac{x^2}{k^2+x^2}\,\mathrm{d}x = 1\)
            marks:
              - code: B1
                note: Needs the \(\pi\) and limits 0 and \(k\); the equation with 1 may appear later.
          - scheme: |
              \(\frac{x^2}{k^2+x^2} = 1 - \frac{k^2}{k^2+x^2}\)
              \(\Rightarrow \int \ldots\,\mathrm{d}x = x - \ldots\arctan\frac{x}{k}\)
            marks:
              - code: M1
                note: Writes the integrand as \(1 - \frac{p}{k^2+x^2}\) and integrates to \(x \pm q\arctan\frac{x}{k}\), or substitutes \(x = k\tan\theta\) and integrates \(\tan^2\theta\) via \(\sec^2\theta - 1\). Condone coefficient slips.
          - scheme: |
              \(\left[x - k\arctan\frac{x}{k}\right]_0^k\)
            marks:
              - code: A1
                note: oe, such as \(k(\tan\theta - \theta)\) after \(x = k\tan\theta\).
          - scheme: |
              \(\pi\left(k - k\arctan 1\right) = 1 \Rightarrow k = \ldots\)
            marks:
              - code: dM1
                note: Substitutes both limits, in the variable used, into their integral, equates \(\pi\) times the result to 1 and solves for \(k\).
          - scheme: |
              \(k = \frac{4}{\pi(4-\pi)}\)
            marks:
              - code: A1
                note: Any exact equivalent, such as \(\frac{1}{\pi\left(1 - \frac{\pi}{4}\right)}\).
  - q: 5
    stamp: 8f4d95f2
    parts:
      - part: a
        rows:
          - scheme: |
              \(\int \sin^2\theta\,\mathrm{d}\theta = \int \tfrac12(1 - \cos 2\theta)\,\mathrm{d}\theta\)
              \(\phantom{\int \sin^2\theta\,\mathrm{d}\theta} = \ldots\)
            marks:
              - code: M1
                note: Uses \(\sin^2\theta = \frac12(1 \pm \cos 2\theta)\) and integrates to the form \(p\theta + q\sin 2\theta\). Condone sign and coefficient slips.
          - scheme: |
              \(= \frac{\theta}{2} - \frac{\sin 2\theta}{4} + c\)
            marks:
              - code: A1
                note: oe, with \(+c\).
      - part: b
        rows:
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}\theta} = -\operatorname{cosec}^2\theta\)
            marks:
              - code: B1
          - scheme: |
              \(V = \pi\int (6\sin^2\theta)^2 \times \their{{-\operatorname{cosec}^2\theta}}\,\mathrm{d}\theta\)
            marks:
              - code: M1
                note: Uses \(\pi\int x^2\frac{\mathrm{d}y}{\mathrm{d}\theta}\,\mathrm{d}\theta\) with \(x = 6\sin^2\theta\) and their \(\frac{\mathrm{d}y}{\mathrm{d}\theta}\) of the form \(\pm p\operatorname{cosec}^2\theta\). Limits not needed.
          - scheme: |
              \(= 36\pi\int -\sin^2\theta\,\mathrm{d}\theta\)
            marks:
              - code: A1
                note: oe. Limits not needed.
          - scheme: |
              \(y = \sqrt3 \Rightarrow \theta = \frac{\pi}{6}\)
              \(y = \frac{1}{\sqrt3} \Rightarrow \theta = \frac{\pi}{3}\)
            marks:
              - code: B1
                note: Both, matched to their \(y\) values; may be seen as limits.
          - scheme: |
              \(V = 36\pi\int_{\pi/6}^{\pi/3} \sin^2\theta\,\mathrm{d}\theta\)
              \(k = 36\pi,\ a = \frac{\pi}{6},\ b = \frac{\pi}{3}\)
            marks:
              - code: A1
                note: cso. Accept \(k = -36\pi\), \(a = \frac{\pi}{3}\), \(b = \frac{\pi}{6}\).
      - part: c
        rows:
          - scheme: |
              \(V = 36\pi\left[\frac{\theta}{2} - \frac{\sin 2\theta}{4}\right]_{\pi/6}^{\pi/3}\)
            marks:
              - code: M1
                note: Substitutes their limits from (b) into their integral from (a), of the form \(p\theta + q\sin 2\theta\), and subtracts.
          - scheme: |
              \(= 36\pi\left(\frac{\pi}{6} - \frac{\sqrt3}{8} - \frac{\pi}{12} + \frac{\sqrt3}{8}\right)\)
            marks:
              - code: dM1
                note: Uses exact values of \(\sin\frac{2\pi}{3}\) and \(\sin\frac{\pi}{3}\), or their equality, to reach an exact expression.
          - scheme: |
              \(= 3\pi^2\)
            marks:
              - code: A1
                note: cso. \(p = 3\) alone scores A0.
