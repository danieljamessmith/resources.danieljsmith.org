  - q: 8
    stamp: e1aba3fe
    parts:
      - part: ''
        rows:
          - scheme: |
              \(\frac{e^a - e^{-a}}{2} = 2 \Rightarrow e^{2a} - 4e^a - 1 = 0\)
              \(\phantom{\frac{e^a}{2}} \Rightarrow e^a = \ldots\)
            marks:
              - code: M1
                note: Writes \(\sinh a = 2\) in exponentials and forms a three-term quadratic in \(e^a\), or uses \(\operatorname{arsinh} x = \ln\left(x + \sqrt{x^2+1}\right)\). Condone sign slips.
          - scheme: |
              \(e^a = 2 + \sqrt5 \Rightarrow a = \ln(2 + \sqrt5)\)
            marks:
              - code: A1
                note: A0 if \(2 - \sqrt5\) is retained.
          - scheme: |
              \(V = \pi\int_0^a \left(4 - \sinh^2 x\right)\mathrm{d}x\)
            marks:
              - code: B1
                note: Accept the cylinder \(4\pi a\) minus \(\pi\int_0^a \sinh^2 x\,\mathrm{d}x\). Upper limit \(a\), \(\operatorname{arsinh} 2\) or their logarithm. Needs the \(\pi\).
          - scheme: |
              \(\pi\int_0^a \left(4 - \tfrac12(\cosh 2x - 1)\right)\mathrm{d}x\)
              \(\phantom{\pi} = \pi\left[\tfrac92 x - \tfrac14\sinh 2x\right]_0^a\)
            marks:
              - code: M1
                note: Uses an identity for \(\sinh^2 x\), or exponentials, and integrates to the form \(px + q\sinh 2x\) or its exponential equivalent. Condone sign and coefficient slips.
              - code: A1
                note: Correct integral, oe; \(\pi\) not needed.
          - scheme: |
              \(\cosh a = \sqrt5 \Rightarrow \sinh 2a = 2(2)(\sqrt5) = 4\sqrt5\)
              \(V = \pi\left(\tfrac92 a - \tfrac14(4\sqrt5)\right)\)
            marks:
              - code: dM1
                note: Substitutes both limits and evaluates \(\sinh 2a\) exactly, from \(\sinh a = 2\) with \(\cosh^2 a = 1 + \sinh^2 a\), or from their \(e^a\).
          - scheme: |
              \(V = \pi\left(\tfrac92\ln(2 + \sqrt5) - \sqrt5\right)\)
            marks:
              - code: A1
                note: Exact oe, with a logarithm; \(\operatorname{arsinh} 2\) in place of the logarithm scores A0.
