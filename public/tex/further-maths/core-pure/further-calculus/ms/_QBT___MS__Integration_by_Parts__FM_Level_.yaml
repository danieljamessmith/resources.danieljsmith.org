          - scheme: |
              \(\phantom{A} = \frac12\cdot\frac{(1-x)+(1+x)}{(1+x)(1-x)} = \frac{1}{1-x^2}\)
            marks:
              - code: A1 AG
                note: Correct derivative leading without error to \(\frac{1}{1-x^2}\); combined steps accepted.
      - part: b
        rows:
          - scheme: |
              \(\int \operatorname{artanh} x\,\mathrm{d}x\)
              \(\phantom{A} = x\operatorname{artanh} x - \int \frac{x}{1-x^2}\,\mathrm{d}x\)
            marks:
              - code: M1
