    parts:
      - part: ''
        rows:
          - scheme: |
              \(\left[\tfrac{x^3}{3}\ln(1+x)\right]_0^2\)
              \(\phantom{A} - \int_0^2 \frac{x^3}{3(1+x)}\,\mathrm{d}x\)
            marks:
              - code: M1
                note: Uses parts with \(u = \ln(1+x)\), reaching the form \(kx^3\ln(1+x) - \int \frac{mx^3}{1+x}\,\mathrm{d}x\). Condone coefficient slips.
              - code: A1
                note: Limits need not appear yet.
          - scheme: |
              \(\frac{x^3}{1+x} = x^2 - x + 1 - \frac{1}{1+x}\)
            marks:
              - code: M1
                note: Divides \(x^3\) by \(1+x\), or writes \(x^3\) in powers of \(1+x\), reaching a quadratic plus \(\frac{k}{1+x}\). Condone coefficient slips.
              - code: A1
          - scheme: |
              \(\int \frac{x^3}{1+x}\,\mathrm{d}x = \frac{x^3}{3} - \frac{x^2}{2} + x - \ln(1+x)\)
            marks:
              - code: A1
                note: With or without the factor \(\frac13\).
          - scheme: |
              \(\tfrac83\ln 3 - \tfrac13\left(\tfrac83 - 2 + 2 - \ln 3\right) - 0\)
            marks:
              - code: dM1
                note: Substitutes \(x = 2\) and \(x = 0\), or the limits after a substitution, into both their \(uv\) term and their integral, and subtracts.
          - scheme: |
              \(= 3\ln 3 - \frac89\), so \(a = -\frac89\), \(b = 3\)
            marks:
              - code: A1
                note: cso. \(3\ln 3 - \frac89\) oe, or \(a\) and \(b\) stated; not \(\ln 27 - \frac89\).
  - q: 4
    stamp: f8419b07
    parts:
      - part: ''
        rows:
          - scheme: |
              \(t = 2x+1\): \(\int \operatorname{arsinh}(2x+1)\,\mathrm{d}x = \tfrac12\int \operatorname{arsinh} t\,\mathrm{d}t\)
              \(\phantom{\int} = \tfrac12\left(t\operatorname{arsinh} t - \int \frac{t}{\sqrt{t^2+1}}\,\mathrm{d}t\right)\)
            marks:
              - code: M1
                note: Uses parts with \(u = \operatorname{arsinh}\) and \(v = t\), \(x\) or \(x + \frac12\), differentiating arsinh to \(\frac{k}{\sqrt{(2x+1)^2+1}}\) or \(\frac{k}{\sqrt{t^2+1}}\). Condone slips in the factor \(\frac12\) or 2.
              - code: A1
                note: Correct in either variable, such as \(x\operatorname{arsinh}(2x+1) - \int \frac{2x}{\sqrt{(2x+1)^2+1}}\,\mathrm{d}x\).
          - scheme: |
              \(\int \frac{t}{\sqrt{t^2+1}}\,\mathrm{d}t = \sqrt{t^2+1}\)
            marks:
              - code: M1
                note: Integrates their remaining integral to \(\lambda\sqrt{t^2+1}\), or in \(x\) to a form including \(\lambda\sqrt{(2x+1)^2+1}\), by inspection or substitution.
          - scheme: |
              \(\tfrac12(2x+1)\operatorname{arsinh}(2x+1)\)
              \(\phantom{\tfrac12} - \tfrac12\sqrt{(2x+1)^2+1}\)
            marks:
              - code: A1
                note: oe in \(x\); \(+c\) not needed here.
          - scheme: |
              \(\tfrac12(2x+1)\ln\left(2x+1+\sqrt{(2x+1)^2+1}\right)\)
              \(\phantom{\tfrac12} - \tfrac12\sqrt{(2x+1)^2+1} + c\)
            marks:
              - code: A1
                note: oe, with \(+c\). A0 if any arsinh remains.
  - q: 5
    stamp: aa5d4bcc
    parts:
      - part: a
        rows:
          - scheme: |
              \(h(\theta) = 3\sin^2\theta + 5\sin\theta\cos\theta - 2\cos^2\theta\)
              \(\phantom{h(\theta)} = \tfrac32(1 - \cos2\theta) + \tfrac52\sin2\theta - (1 + \cos2\theta)\)
            marks:
              - code: M1
                note: Expands and replaces \(\sin^2\theta\), \(\cos^2\theta\) and \(\sin\theta\cos\theta\) by double-angle forms, or expands the printed form in \(\theta\) to compare. Condone sign slips.
          - scheme: |
              \(h(\theta) = \tfrac12 - \tfrac52\cos2\theta + \tfrac52\sin2\theta\)
            marks:
              - code: A1 AG
                note: Correct expansion and identities leading without error to the printed result; if both sides are worked, a conclusion is needed.
      - part: b
        rows:
          - scheme: |
              \(\int\left(\tfrac{\pi}{2} - \theta\right)\cos2\theta\,\mathrm{d}\theta\)
              \(\phantom{A} = \tfrac12\left(\tfrac{\pi}{2} - \theta\right)\sin2\theta + \tfrac12\int\sin2\theta\,\mathrm{d}\theta\)
            marks:
              - code: M1
                note: Uses (a) and integrates by parts, differentiating the linear factor, on a product with \(\cos2\theta\) or \(\sin2\theta\), reaching the form \(uv - \int v\frac{\mathrm{d}u}{\mathrm{d}\theta}\,\mathrm{d}\theta\). Condone sign and coefficient slips.
              - code: A1
                note: One by-parts result correct; need not be simplified.
          - scheme: |
              \(I = \Big[\tfrac{\pi\theta}{4} - \tfrac{\theta^2}{4}\)
              \(\phantom{I =} - \tfrac54\left(\tfrac{\pi}{2} - \theta\right)\sin2\theta + \tfrac58\cos2\theta\)
              \(\phantom{I =} - \tfrac54\left(\tfrac{\pi}{2} - \theta\right)\cos2\theta - \tfrac58\sin2\theta\Big]_0^{\frac{\pi}{2}}\)
            marks:
              - code: A1
                note: Every term integrated correctly, combined or as separate integrals; need not be simplified.
          - scheme: |
              \(= \left(\tfrac{\pi^2}{16} - \tfrac58\right) - \left(\tfrac58 - \tfrac{5\pi}{8}\right)\)
            marks:
              - code: dM1
                note: Substitutes \(\frac{\pi}{2}\) and \(0\) into their integrated terms and subtracts, upper minus lower.
          - scheme: |
              \(= \frac{\pi^2 + 10\pi - 20}{16}\)
            marks:
              - code: A1
                note: oe exact, such as \(\frac{\pi^2}{16} + \frac{5\pi}{8} - \frac54\).
