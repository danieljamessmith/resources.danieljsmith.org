  - q: 8
    stamp: 5e5ec21a
    parts:
      - part: a
        rows:
          - scheme: |
              \(\frac{\mathrm{d}}{\mathrm{d}x}\left[\tfrac12\ln(1+x) - \tfrac12\ln(1-x)\right]\)
              \(\phantom{A} = \frac12\left[\frac{1}{1+x} + \frac{1}{1-x}\right]\)
