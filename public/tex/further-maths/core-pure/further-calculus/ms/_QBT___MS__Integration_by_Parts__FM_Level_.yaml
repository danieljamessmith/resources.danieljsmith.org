          - scheme: |
              \(\left[\text{"}x\operatorname{artanh} x + \frac12\ln(1-x^2)\text{"}\right]_0^{1/2}\)
              \(\phantom{A} = \frac12\operatorname{artanh}\frac12 + \frac12\ln\frac34 - 0\)
              \(\operatorname{artanh}\frac12 = \frac12\ln\left(\frac{1+\frac12}{1-\frac12}\right)\ [= \tfrac12\ln 3]\)
            marks:
              - code: dM1
                note: Substitutes both limits into their integral of the form \(x\operatorname{artanh} x + k\ln(1-x^2)\) and writes \(\operatorname{artanh}\frac12\) as a logarithm.
          - scheme: |
              \(\frac34\ln 3 - \ln 2\)
            marks:
              - code: A1
                note: Any exact logarithmic form, such as \(\frac14\ln\frac{27}{16}\), with no \(\operatorname{artanh}\) remaining.
      - part: c
        rows:
          - scheme: |
              \(\operatorname{artanh} x\) is defined only for \(|x| < 1\)
              \(0 \leq x \leq \frac32\) includes \(x = 1\) and \(x > 1\)
            marks:
              - code: E1
                note: States that \(\operatorname{artanh} x\) is undefined, or not real, for \(x \geq 1\) (or \(x > 1\)) and that the interval contains such values.
