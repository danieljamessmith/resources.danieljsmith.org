    parts:
      - part: ''
        rows:
          - scheme: |
              \(I = \left[\frac23 x^{3/2}\ln\left(\frac9x\right)\right]_1^9\)
              \(\phantom{I} - \int_1^9 \frac23 x^{3/2}\left(-\frac1x\right)\mathrm{d}x\)
            marks:
              - code: M1
                note: Integrates \(\sqrt{x}\) and differentiates the logarithm, reaching \(px^{3/2}\ln\left(\frac9x\right) \pm \int qx^{1/2}\,\mathrm{d}x\), oe after splitting the logarithm. Condone coefficient slips.
              - code: A1
                note: Correct, oe. Limits not needed.
          - scheme: |
              \(\frac23\int x^{1/2}\,\mathrm{d}x = \frac49 x^{3/2}\)
            marks:
              - code: A1
          - scheme: |
              \(I = \left(\frac23(27)\ln 1 + \frac49(27)\right)\)
              \(\phantom{I =} - \left(\frac23\ln 9 + \frac49\right)\)
            marks:
              - code: dM1
                note: Substitutes 9 and 1 into their integrated expression and subtracts, upper minus lower.
          - scheme: |
              \(I = \frac{104}{9} - \frac43\ln 3\)
            marks:
              - code: A1
                note: cso, or \(a = \frac{104}{9}\), \(b = -\frac43\) stated. Not for \(\ln 9\) left in the answer.
  - q: 2
    stamp: e33d2712
    parts:
      - part: a
        rows:
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}x} = \frac{1}{1+\left(\frac{x-2}{x+2}\right)^2}\)
              \(\phantom{\frac{\mathrm{d}y}{\mathrm{d}x} =} \times \frac{(x+2)-(x-2)}{(x+2)^2}\)
            marks:
              - code: M1
                note: Uses \(\frac{1}{1+w^2}\) times an attempt at the derivative of \(\frac{x-2}{x+2}\) by quotient or product rule, or differentiates \(\tan y = \frac{x-2}{x+2}\) implicitly. Condone sign slips.
          - scheme: |
              \(= \frac{2}{x^2+4}\)
            marks:
              - code: A1
                note: Simplified. Not for an unsimplified form such as \(\frac{4}{2x^2+8}\).
      - part: b
        rows:
          - scheme: |
              \(u = \arctan\left(\frac{x-2}{x+2}\right)\), \(v = x\)
              \(I = x\arctan\left(\frac{x-2}{x+2}\right) - \int \frac{2x}{x^2+4}\,\mathrm{d}x\)
            marks:
              - code: M1
                note: Uses parts with \(v = x\), reaching \(x\arctan\left(\frac{x-2}{x+2}\right) - \int x \times\) their (a) \(\mathrm{d}x\), their (a) any derivative found there. Condone a sign slip.
              - code: A1
                note: oe.
          - scheme: |
              \(\int \frac{2x}{x^2+4}\,\mathrm{d}x = \ln(x^2+4)\)
            marks:
              - code: M1
                note: Integrates their \(\frac{kx}{x^2+4}\) to \(\lambda\ln(x^2+4)\), by substitution or inspection.
          - scheme: |
              \(I = x\arctan\left(\frac{x-2}{x+2}\right) - \ln(x^2+4) + c\)
            marks:
              - code: A1
                note: oe, including \(+\,c\).
  - q: 3
