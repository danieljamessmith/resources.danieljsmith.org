          - scheme: |
              \(\frac92\left(\arctan\frac32 - \arctan(-1)\right)\)
            marks:
              - code: dM1
                note: Substitutes \(4\) and \(-1\), or the corresponding limits of their substitution, and subtracts the right way round.
          - scheme: |
              \(= \frac92\left(\arctan\frac32 + \frac{\pi}{4}\right)\ [= 7.957\ldots]\)
            marks:
              - code: A1
                note: Exact, or awrt 7.96.
          - scheme: |
              \(V = 36 \times \their{7.957} \times 240\)
            marks:
              - code: M1
                note: Multiplies their area in graph units by \(6^2\) and by 240, or works in centimetres throughout. Not for scaling by 6 alone.
          - scheme: |
              \(= 6.87 \times 10^4\,\mathrm{cm}^3\)
            marks:
              - code: A1
                note: awrt \(6.87 \times 10^4\) (68\,700), or awrt \(0.0687\,\mathrm{m}^3\).
  - q: 7
    stamp: 52367b23
    parts:
      - part: ''
        rows:
          - scheme: |
              \(u = \ln x \Rightarrow \mathrm{d}u = \frac{1}{x}\,\mathrm{d}x\)
            marks:
              - code: M1
                note: Uses \(u = \ln x\) with \(\mathrm{d}u = \frac{1}{x}\,\mathrm{d}x\) oe to replace \(\frac{1}{x}\,\mathrm{d}x\). Implied by integrating directly to an \(\arcsin\) of a multiple of \(\ln x\).
          - scheme: |
              \(\int \frac{1}{\sqrt{4-u^2}}\,\mathrm{d}u\)
            marks:
              - code: A1
                note: Limits need not be seen. Implied by \(\arcsin\left(\frac{\ln x}{2}\right)\).
          - scheme: |
              \(\arcsin\left(\tfrac{u}{2}\right)\)
            marks:
              - code: M1
                note: Integrates to \(k\arcsin\left(\frac{u}{a}\right)\) or \(k\arcsin(bu)\), any nonzero constants.
              - code: A1
                note: Correct, or \(\arcsin\left(\frac{\ln x}{2}\right)\).
          - scheme: |
              \(x = 1, e \Rightarrow u = 0, 1\)
              \(\arcsin\left(\tfrac12\right) - \arcsin 0\)
            marks:
              - code: dM1
                note: Applies \(u\)-limits 0 and 1, or \(x\)-limits 1 and \(e\) after substituting back, and subtracts.
          - scheme: |
              \(= \frac{\pi}{6}\)
            marks:
              - code: A1
                note: cao. Not 0.524 or \(30^\circ\).
  - q: 8
    stamp: 165049ca
    parts:
      - part: i
        rows:
          - scheme: |
              \(9x^2+12x+20 = 9\left(x+\tfrac23\right)^2 + \ldots\)
            marks:
              - code: M1
                note: Writes the denominator as \(9\left(x \pm \frac23\right)^2 + k\) or \((3x \pm 2)^2 + k\), \(k \neq 0\), oe.
          - scheme: |
              \(\phantom{9x^2+12x+20} = 9\left(x+\tfrac23\right)^2 + 16\)
            marks:
              - code: A1
                note: oe, such as \((3x+2)^2 + 16\).
          - scheme: |
              \(\displaystyle\int \ldots\,\mathrm{d}x = \frac19 \cdot \frac{1}{\their{\frac43}}\arctan\left(\frac{x+\frac23}{\their{\frac43}}\right)\)
            marks:
              - code: M1
                note: Integrates their completed square to \(p\arctan(\text{linear in } x)\). Condone an incorrect \(p\).
          - scheme: |
              \(\frac{1}{12}\arctan\left(\frac{3x+2}{4}\right) + c\)
            marks:
              - code: A1
                note: oe. Needs \(+c\).
      - part: ii
        rows:
          - scheme: |
              \(45+12x-9x^2 = \ldots - 9\left(x-\tfrac23\right)^2\)
            marks:
              - code: M1
                note: Writes the quadratic as \(k - 9\left(x \pm \frac23\right)^2\) or \(k - (3x \pm 2)^2\), \(k > 0\), oe.
          - scheme: |
              \(\phantom{45+12x-9x^2} = 49 - (3x-2)^2\)
            marks:
              - code: A1
                note: oe, such as \(9\left[\frac{49}{9} - \left(x-\frac23\right)^2\right]\).
          - scheme: |
              \(\displaystyle\int \ldots\,\mathrm{d}x = \frac13\arcsin\left(\frac{x-\frac23}{\their{\frac73}}\right)\)
            marks:
              - code: M1
                note: Integrates their completed square to \(p\arcsin(\text{linear in } x)\). Condone an incorrect \(p\).
          - scheme: |
              \(\frac13\arcsin\left(\frac{3x-2}{7}\right) + c\)
            marks:
              - code: A1
                note: oe. Needs \(+c\).
  - q: 9
    stamp: '89852760'
    parts:
      - part: a
        rows:
          - scheme: |
              \(6x+1 = \lambda(8x-8)+\mu \Rightarrow \lambda = \ldots,\ \mu = \ldots\)
            marks:
              - code: M1
                note: Writes \(6x+1\) as a multiple of \(8x-8\) plus a constant, or splits the integral equivalently. Condone slips in the constants.
          - scheme: |
              \(\tfrac34\ln(4x^2-8x+13)\)
            marks:
              - code: A1
                note: Or \(A = \frac34\) stated.
          - scheme: |
              \(4x^2-8x+13 = (2x-2)^2+9\)
              \(\their{7}\int \frac{1}{(2x-2)^2+9}\,\mathrm{d}x = k\arctan\left(\frac{2x-2}{3}\right)\)
            marks:
              - code: M1
                note: Completes the square and integrates their constant term to \(k\arctan\) of a linear expression in \(x\). Condone slips in \(k\).
          - scheme: |
              \(\tfrac76\arctan\left(\frac{2x-2}{3}\right)\)
            marks:
              - code: A1
                note: Or \(B = \frac76\) stated. Condone a missing \(+c\).
      - part: b
        rows:
          - scheme: |
              \(\frac{1}{\frac52-1}\int_1^{5/2} f(x)\,\mathrm{d}x\)
            marks:
              - code: M1
                note: Divides the integral of \(f(x)\) from \(1\) to \(\frac52\) by \(\frac32\), or multiplies it by \(\frac23\).
          - scheme: |
              \(\frac23\left(\their{\tfrac34\ln 18+\tfrac76\cdot\tfrac{\pi}{4}}-\their{\tfrac34\ln 9}\right)\)
            marks:
              - code: dM1
                note: Substitutes both limits into their (a) of the form \(A\ln(4x^2-8x+13)+B\arctan\left(\frac{2x-2}{3}\right)\) and subtracts.
          - scheme: |
              \(\frac23\left(\tfrac34\ln 2+\tfrac{7\pi}{24}\right)\)
              \(\phantom{\frac23} = \frac12\ln 2+\frac{7\pi}{36}\)
            marks:
              - code: A1 AG
                note: Correct substituted expression leading without error to the printed result; combined steps accepted. A decimal check earns A0.
      - part: c
        rows:
          - scheme: |
              \(3-\ln 2-\frac{7\pi}{18}\)
            marks:
              - code: B1
                note: oe, or awrt 1.09.
  - q: 10
    stamp: 6e4cc1a9
    parts:
      - part: ''
        rows:
          - scheme: |
              \(4x - 1 = 2(2x - 4) + 7\)
            marks:
              - code: M1
                note: Writes the numerator as a multiple of \(2x - 4\) plus a constant, or splits the integrand equivalently. Condone arithmetic slips.
          - scheme: |
              \(\int \frac{2(2x-4)}{x^2-4x+8}\,\mathrm{d}x\)
              \(\phantom{A} = 2\ln(x^2-4x+8)\)
            marks:
              - code: A1
                note: Correct term, or \(B = 2\) stated. Condone a modulus.
          - scheme: |
              \(x^2 - 4x + 8 = (x-2)^2 + 4\)
              \(\int \frac{\their{7}}{(x-2)^2+4}\,\mathrm{d}x\)
              \(\phantom{A} = \their{7} \times \tfrac12\arctan\left(\frac{x-2}{2}\right)\)
            marks:
              - code: M1
                note: Completes the square and integrates their constant term to the form \(k\arctan(px+q)\). Condone slips in \(k\), \(p\) or \(q\).
          - scheme: |
              \(\tfrac72\arctan\left(\frac{x-2}{2}\right) + 2\ln(x^2-4x+8) + c\)
            marks:
              - code: A1
                note: Correct expression in the given form, or \(A = \frac72\) stated.
  - q: 11
    stamp: e9e6b211
    parts:
      - part: a
        rows:
          - scheme: |
              \(x^3-3x^2+9x+13=(x+1)(x^2-4x+13)\)
              \(2x^2-3x+31 \equiv P(x^2-4x+13)+Q(x+1)\)
            marks:
              - code: M1
                note: Uses the factorised denominator and multiplies through to form an identity in \(P\) and \(Q\). Condone a sign slip.
          - scheme: |
              \(x^2\colon P = \ldots\)
              \(x\colon -4P+Q=-3 \Rightarrow Q = \ldots\)
            marks:
              - code: dM1
                note: Compares coefficients or substitutes values of \(x\), and solves two equations for both \(P\) and \(Q\).
          - scheme: |
              \(P=2,\ Q=5\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \(\int \frac{\their{2}}{x+1}\,\mathrm{d}x = 2\ln|x+1|\)
            marks:
              - code: M1
                note: Integrates their \(\frac{P}{x+1}\) to \(k\ln|x+1|\).
              - code: A1ft
                note: \(2\ln|x+1|\), ft their \(P\).
          - scheme: |
              \(x^2-4x+13=(x-2)^2+9\)
              \(\int \frac{\their{5}}{(x-2)^2+9}\,\mathrm{d}x = k\arctan\left(\frac{x-2}{3}\right)\)
            marks:
              - code: M1
                note: Completes the square as \((x-2)^2+a\), \(a>0\), and integrates their term to \(k\arctan\left(\frac{x-2}{\sqrt a}\right)\). Condone slips in \(k\).
          - scheme: |
              \(\int g(x)\,\mathrm{d}x = 2\ln|x+1|\)
              \(\phantom{\int g(x)\,\mathrm{d}x} + \frac53\arctan\left(\frac{x-2}{3}\right)+c\)
            marks:
              - code: A1ft
                note: \(B=\frac53\), ft their \(Q\) as \(\frac{Q}{3}\). Condone a missing \(+c\).
      - part: c
        rows:
          - scheme: |
              \(\int_0^\infty g(x)\,\mathrm{d}x = \lim_{t\to\infty}\int_0^t g(x)\,\mathrm{d}x\)
              \(\int_0^t g(x)\,\mathrm{d}x = 2\ln(t+1)+\frac53\arctan\left(\frac{t-2}{3}\right)\)
              \(\phantom{\int_0^t g(x)\,\mathrm{d}x =} - \frac53\arctan\left(-\frac23\right)\)
            marks:
              - code: M1
                note: Replaces the upper limit by a variable, or writes a limit, and substitutes it and 0 into their (b) answer of the form \(A\ln|x+1|+B\arctan(\ldots)\).
          - scheme: |
              \(t\to\infty\colon \arctan\left(\frac{t-2}{3}\right)\to\frac{\pi}{2}\), \(2\ln(t+1)\to\infty\)
              so the integral diverges
            marks:
              - code: A1 AG
                note: cso. States the arctan term tends to \(\frac{\pi}{2}\) or is bounded, \(\ln(t+1)\to\infty\), and concludes divergence. A0 for evaluating at \(\infty\) directly.
  - q: 12
    stamp: 04485c7b
    parts:
      - part: i
        rows:
          - scheme: |
              \(\cosh y = x \Rightarrow \sinh y\frac{\mathrm{d}y}{\mathrm{d}x} = 1\)
            marks:
              - code: M1
                note: Writes \(\cosh y = x\) and differentiates implicitly, or finds \(\frac{\mathrm{d}x}{\mathrm{d}y}\) and inverts. Condone a sign slip.
          - scheme: |
              \(\sinh^2 y = \cosh^2 y - 1 = x^2 - 1\)
            marks:
              - code: M1
                note: Uses \(\cosh^2 y - \sinh^2 y = 1\) to express \(\sinh y\) or \(\sinh^2 y\) in terms of \(x\). Condone a sign slip in the identity.
          - scheme: |
              \(y \geq 0 \Rightarrow \sinh y = \sqrt{x^2 - 1}\)
              \(\Rightarrow \frac{\mathrm{d}y}{\mathrm{d}x} = \frac{1}{\sqrt{x^2-1}}\)
            marks:
              - code: A1 AG
                note: Printed result without error, with the positive root justified, e.g. \(y \geq 0\) so \(\sinh y \geq 0\).
      - part: ii
        rows:
          - scheme: |
              \(y = \int \frac{1}{\sqrt{x^2-1}}\,\mathrm{d}x\)
              \(\phantom{y} = \int \frac{x+\sqrt{x^2-1}}{\sqrt{x^2-1}\left(x+\sqrt{x^2-1}\right)}\,\mathrm{d}x\)
            marks:
              - code: M1
                note: Multiplies numerator and denominator of the integrand by \(x + \sqrt{x^2-1}\).
          - scheme: |
              \(\phantom{y} = \int \frac{1+\frac{x}{\sqrt{x^2-1}}}{x+\sqrt{x^2-1}}\,\mathrm{d}x\), numerator the
              derivative of the denominator
            marks:
              - code: A1
                note: Integrand in the form \(\frac{f'(x)}{f(x)}\) with \(f(x) = x + \sqrt{x^2-1}\), the derivative shown or stated.
          - scheme: |
              \(y = \ln\left(x+\sqrt{x^2-1}\right) + c\)
              \(x = 1,\ y = 0 \Rightarrow 0 = \ln 1 + c \Rightarrow c = \ldots\)
            marks:
              - code: dM1
                note: Integrates to \(\ln\left(x+\sqrt{x^2-1}\right) + c\) and substitutes \(x = 1\), \(y = \operatorname{arcosh} 1 = 0\) to find \(c\).
          - scheme: |
              \(c = 0 \Rightarrow y = \ln\left(x+\sqrt{x^2-1}\right)\)
            marks:
              - code: A1 AG
                note: Printed result without error from a correct evaluation of \(c\). A0 if \(c\) is omitted or assumed zero.
      - part: iii
        rows:
          - scheme: |
              \(\sqrt{4x^2-9} = 3\sqrt{\left(\frac{2x}{3}\right)^2 - 1}\)
              \(\Rightarrow \int \frac{1}{\sqrt{4x^2-9}}\,\mathrm{d}x = k\operatorname{arcosh}\left(\frac{2x}{3}\right)\)
            marks:
              - code: M1
                note: Rewrites the integrand to use (i), by factorising or a substitution such as \(u = \frac{2x}{3}\), and integrates to \(k\operatorname{arcosh}(px)\). Condone wrong constants.
          - scheme: |
              \(\frac12\operatorname{arcosh}\left(\frac{2x}{3}\right)\)
            marks:
              - code: A1
          - scheme: |
              \(\frac12\operatorname{arcosh}\left(\frac23 \times \frac52\right) - \frac12\operatorname{arcosh}\left(\frac23 \times \frac{15}{8}\right)\)
            marks:
              - code: dM1
                note: Substitutes both limits into their \(k\operatorname{arcosh}(px)\) and subtracts, in the correct order.
          - scheme: |
              \(= \frac12\left(\operatorname{arcosh}\frac53 - \operatorname{arcosh}\frac54\right)\)
            marks:
              - code: A1
                note: Printed result, with no errors seen.
          - scheme: |
              \(\operatorname{arcosh}\frac53 = \ln\left(\frac53 + \sqrt{\frac{25}{9}-1}\right)\ [= \ln 3]\)
              \(\operatorname{arcosh}\frac54 = \ln\left(\frac54 + \sqrt{\frac{25}{16}-1}\right)\ [= \ln 2]\)
            marks:
              - code: M1
                note: Uses (ii) to write both \(\operatorname{arcosh}\frac53\) and \(\operatorname{arcosh}\frac54\) as logarithms. Need not be simplified.
          - scheme: |
