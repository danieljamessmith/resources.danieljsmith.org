questions:
  - q: 1
    stamp: acdcceb8
    parts:
      - part: ''
        rows:
          - scheme: |
              \(x(4-x) = 4 - (x-2)^2\)
            marks:
              - code: M1
                note: Writes \(x(4-x)\) in the form \(p - (x-q)^2\). Condone slips in \(p\) or \(q\).
          - scheme: |
              \(\int \frac{1}{\sqrt{4-(x-2)^2}}\,\mathrm{d}x\)
              \(\phantom{\int} = \arcsin\left(\frac{x-2}{2}\right)\)
            marks:
              - code: M1
                note: Integrates their \(\frac{1}{\sqrt{p-(x-q)^2}}\) to the form \(k\arcsin\left(\frac{x-q}{r}\right)\). Condone a wrong \(k\) or \(r\).
              - code: A1
                note: oe, such as \(\arcsin\left(\frac{x}{2}-1\right)\) or \(-\arccos\left(\frac{x-2}{2}\right)\).
          - scheme: |
              \(\lim_{t\to 4^-}\arcsin\left(\tfrac{t-2}{2}\right) - \lim_{s\to 0^+}\arcsin\left(\tfrac{s-2}{2}\right)\)
              \(\phantom{\lim} = \arcsin(1) - \arcsin(-1)\)
            marks:
              - code: dM1
                note: Evaluates their arcsin form as limits at 0 and 4 and subtracts. Not for substituting 0 and 4 with no limit seen.
          - scheme: |
              \(= \frac{\pi}{2} - \left(-\frac{\pi}{2}\right) = \pi\)
            marks:
              - code: A1
  - q: 2
    stamp: 2c05d9fb
    parts:
      - part: ''
        rows:
          - scheme: |
              \((x^2 - 2x + 5 =)\ (x - 1)^2 + 4\)
            marks:
              - code: M1
                note: Completes the square to the form \((x \pm 1)^2 + q\). Condone a wrong constant \(q\).
          - scheme: |
              \(\int_0^3 \frac{1}{(x - 1)^2 + 2^2}\,\mathrm{d}x\)
              \(\phantom{A} = \tfrac12\left[\arctan\left(\frac{x - 1}{2}\right)\right]_0^3\)
            marks:
              - code: M1
                note: Integrates their \(\frac{1}{(x \pm 1)^2 + q}\), \(q > 0\), to the form \(k\arctan\left(\frac{x \pm 1}{\sqrt q}\right)\), or to \(ku\) after a tan substitution.
              - code: A1
                note: oe, such as \(\frac12 u\) after \(x - 1 = 2\tan u\).
          - scheme: |
              \(\tfrac12\left(\arctan 1 - \arctan\left(-\tfrac12\right)\right)\)
            marks:
              - code: dM1
                note: Substitutes 3 and 0 into their arctan form and subtracts, or uses the changed limits after a substitution.
          - scheme: |
              \(= \tfrac12\left(\tfrac{\pi}{4} + \arctan\tfrac12\right)\)
            marks:
              - code: A1
                note: Any correct exact form; implied by correctly combining \(\arctan 1 - \arctan\left(-\frac12\right)\) in the next step.
          - scheme: |
              \(\tan\left(\tfrac{\pi}{4} + \arctan\tfrac12\right)\)
              \(\phantom{\tan} = \frac{1 + \frac12}{1 - 1 \times \frac12} = \ldots\)
            marks:
              - code: M1
                note: Applies \(\tan(A \pm B)\), or the arctan addition formula, to their two angles with their tangents substituted, or shows \(\arctan 3 - \frac{\pi}{4} = \arctan\frac12\). Condone sign slips.
          - scheme: |
              \(= 3\), with \(\tfrac{\pi}{4} + \arctan\tfrac12\) in \(\left(0, \tfrac{\pi}{2}\right)\)
              \(\Rightarrow \int_0^3 \frac{1}{x^2 - 2x + 5}\,\mathrm{d}x = \tfrac12\arctan 3\)
            marks:
              - code: A1 AG
                note: Correct substituted formula leading without error to tangent 3, the angle placed in \(\left(0, \frac{\pi}{2}\right)\), directly or as in \((0, \pi)\) with a positive tangent, and the printed result stated.
  - q: 3
    stamp: 229cc520
    parts:
      - part: ''
        rows:
          - scheme: |
              \(10 + 8x - 2x^2 = 2\left(9 - (x - 2)^2\right)\)
            marks:
              - code: M1
                note: Completes the square to the form \(p\left(q - (x - r)^2\right)\) oe. Condone slips in the constants.
          - scheme: |
              \(\frac{1}{\sqrt{2}}\int_1^4 \frac{1}{\sqrt{9 - (x - 2)^2}}\,\mathrm{d}x\)
              \(\phantom{A} = \frac{1}{\sqrt{2}}\left[\arcsin\left(\frac{x - 2}{3}\right)\right]_1^4\)
            marks:
              - code: M1
                note: Takes out \(\sqrt{p}\) and integrates to the form \(k\arcsin\left(\frac{x - r}{s}\right)\), by the standard result or a substitution. Condone slips in \(k\) and \(s\).
              - code: A1
                note: oe, such as \(\frac{1}{\sqrt{2}}\arcsin\frac{u}{3}\) with \(u = x - 2\).
          - scheme: |
              \(= \frac{1}{\sqrt{2}}\left(\arcsin\left(\frac23\right) - \arcsin\left(-\frac13\right)\right)\)
            marks:
              - code: dM1
                note: Substitutes both limits, or their transformed limits, into their arcsin form and subtracts.
          - scheme: |
              \(= \frac{1}{\sqrt{2}}\left(\arcsin\left(\frac23\right) + \arcsin\left(\frac13\right)\right)\)
            marks:
              - code: A1 AG
                note: Correct substituted limits leading without error to the printed result, with the sign of \(\arcsin\left(-\frac13\right)\) handled correctly.
  - q: 4
    stamp: 36792f66
    parts:
      - part: a
        rows:
          - scheme: |
              The upper limit is \(\infty\): the interval of integration is unbounded.
            marks:
              - code: E1
                note: States the upper limit is infinite or the interval is unbounded. E0 if it also says the integrand is undefined in the interval.
      - part: b
        rows:
          - scheme: |
              \(x^2 - 6x + 18 = (x-3)^2 + 9\)
            marks:
              - code: M1
                note: Writes the denominator as \((x \pm 3)^2 + c\) with \(c > 0\).
          - scheme: |
              \(\int \frac{1}{(x-3)^2 + 9}\,\mathrm{d}x = \frac13\arctan\left(\frac{x-3}{3}\right)\)
            marks:
              - code: M1
                note: Integrates their completed square to the form \(p\arctan(q(x-3))\), or \(p\arctan(qu)\) after substituting \(u = x - 3\).
              - code: A1
          - scheme: |
              \(\lim_{t\to\infty}\left[\tfrac13\arctan\left(\tfrac{x-3}{3}\right)\right]_0^t\)
              \(\phantom{l} = \tfrac13\left(\tfrac{\pi}{2} - \left(-\tfrac{\pi}{4}\right)\right)\)
            marks:
              - code: dM1
                note: Applies limits \(0\) and \(t\) to their arctan form, using \(\arctan \to \frac{\pi}{2}\) as \(t \to \infty\). Condone \(\infty\) substituted directly.
          - scheme: |
              \(= \frac{\pi}{4}\), so \(k = \frac14\)
            marks:
              - code: A1
                note: cso. Accept \(\frac{\pi}{4}\) with \(k\) not stated; a decimal value scores A0.
  - q: 5
    stamp: 02b89de8
    parts:
      - part: ''
        rows:
          - scheme: |
              \(x^2 - 4x + 8 = (x-2)^2 + 4\)
            marks:
              - code: M1
                note: Writes the denominator as \((x \pm 2)^2 + k\), \(k > 0\). Condone a slip in \(k\).
          - scheme: |
              \(\int_0^4 \frac{1}{(x-2)^2 + 2^2}\,\mathrm{d}x\)
              \(\phantom{\int} = \left[\tfrac12\arctan\left(\tfrac{x-2}{2}\right)\right]_0^4\)
            marks:
              - code: M1
                note: Integrates to \(p\arctan\left(\frac{x-2}{q}\right)\), or \(p\arctan\frac{u}{q}\) with \(u = x - 2\). Condone wrong \(p\) or \(q\).
              - code: A1
          - scheme: |
              \(\tfrac12\arctan(1) - \tfrac12\arctan(-1)\)
            marks:
              - code: dM1
                note: Substitutes both limits, 4 and 0 (or \(\pm 2\) for \(u\)), into their arctan form and subtracts.
          - scheme: |
              \(= \frac{\pi}{4}\)
            marks:
              - code: A1
                note: cso.
  - q: 6
    stamp: 8a6f6f4f
    parts:
      - part: ''
        rows:
          - scheme: |
              \(\displaystyle\int_{-1}^{4}\frac{9}{(x-1)^2+4}\,\mathrm{d}x\)
              \(\phantom{A} = \left[k\arctan\left(\frac{x-1}{2}\right)\right]_{-1}^{4}\)
            marks:
              - code: M1
                note: Integrates to the form \(k\arctan(px+q)\), by recognition or a substitution such as \(x-1=2\tan\theta\). Condone slips in \(k\).
          - scheme: |
              \(= \left[\frac92\arctan\left(\frac{x-1}{2}\right)\right]_{-1}^{4}\)
            marks:
              - code: A1
