          - scheme: |
              \((z^3 - 1)(z^3 - 6z^2 + 12z - 9) = 0\)
              \(\phantom{(z^3 - 1)} \Rightarrow z^6 - 6z^5 + \ldots = 0\)
            marks:
              - code: M1
                note: Multiplies their two cubics and expands. Condone slips in collecting terms.
          - scheme: |
              \(z^6 - 6z^5 + 12z^4 - 10z^3 + 6z^2 - 12z + 9 = 0\)
            marks:
              - code: A1
                note: Any nonzero integer multiple accepted.
  - q: 6
    stamp: 63b31302
    parts:
      - part: a
        rows:
          - scheme: |
              \(z_A - z_G = 4 + 4i\)
            marks:
              - code: B1
          - scheme: |
              \(z_B - z_G = (4+4i)\left(-\tfrac12 + \tfrac{\sqrt3}{2}i\right)\)
              \(\phantom{z_B - z_G} = \ldots\)
            marks:
              - code: M1
                note: Multiplies their \(z_A - z_G\) by \(e^{\pm 2\pi i/3}\) in any form and expands. Condone a sign slip in the cosine or sine value.
          - scheme: |
              \(z_B - z_G = (-2-2\sqrt3) + (2\sqrt3-2)i\)
            marks:
              - code: A1
          - scheme: |
              \(z_B = (-1-2\sqrt3) + (2\sqrt3-4)i\)
            marks:
              - code: A1
                note: Exact, in the form \(a + bi\). \(B\) and \(C\) may be interchanged.
          - scheme: |
              \(z_C = (1-2i) + (4+4i)\left(-\tfrac12 - \tfrac{\sqrt3}{2}i\right)\)
              \(\phantom{z_C} = \ldots\)
            marks:
              - code: M1
                note: Rotates their \(z_A - z_G\) through the other angle and adds \(z_G\), or uses \(z_C = 3z_G - z_A - z_B\) with their \(z_B\).
          - scheme: |
              \(z_C = (-1+2\sqrt3) - (4+2\sqrt3)i\)
            marks:
              - code: A1
                note: Exact, in the form \(a + bi\).
      - part: b
        rows:
          - scheme: |
              \(z_D = \tfrac13(z_G + z_B + z_C)\), \(z_B + z_C = 3z_G - z_A\)
              \(\Rightarrow z_D = \tfrac13(4z_G - z_A)\)
            marks:
              - code: M1
                note: Writes \(z_D\) as the mean of \(z_G\), \(z_B\), \(z_C\), then simplifies using \(z_A + z_B + z_C = 3z_G\) or evaluates with their (a) values.
          - scheme: |
              \(z_D - z_G = -\tfrac13(z_A - z_G)\), similarly for \(E\), \(F\)
              \(\Rightarrow\) area factor \(\left(\tfrac13\right)^2 = \tfrac19\)
            marks:
              - code: A1
                note: Lengths scaled by \(\frac13\) about \(G\), sign not needed, with \(E\) and \(F\) by symmetry, and area factor \(\frac19\).
          - scheme: |
              \(GA = |4 + 4i| = 4\sqrt2\)
              Area \(ABC = 3 \times \tfrac12(4\sqrt2)^2\sin\tfrac{2\pi}{3}\)
              \(\phantom{\text{Area } ABC} = \ldots\ [= 24\sqrt3]\)
            marks:
              - code: M1
                note: Uses three triangles \(\frac12 r^2 \sin\frac{2\pi}{3}\) with their \(r = |z_A - z_G|\), or \(\frac{\sqrt3}{4}s^2\) with their side \(s = |z_A - z_B|\).
          - scheme: |
              Area \(DEF = \tfrac19 \times 24\sqrt3 = \tfrac{8\sqrt3}{3}\)
            marks:
              - code: A1
                note: Exact, oe such as \(\frac{8}{\sqrt3}\).
  - q: 7
    stamp: 834643ee
    parts:
      - part: a
        rows:
          - scheme: |
              \(|w-(1+i)|^2 = \bigl(w-(1+i)\bigr)\bigl(w^*-(1-i)\bigr)\)
              \(\phantom{|w-(1+i)|^2} = \ldots\)
            marks:
              - code: M1
                note: Multiplies \(w-(1+i)\) by its attempted conjugate and expands, or an equivalent Cartesian method. Condone sign slips.
          - scheme: |
              \(= ww^* - (1-i)w - (1+i)w^* + (1+i)(1-i)\)
            marks:
              - code: A1
                note: Correct four-term expansion, oe.
          - scheme: |
              \(ww^* = |w|^2 = 1\), \((1+i)(1-i) = 2\)
              \(\Rightarrow |w-(1+i)|^2 = 3-(1-i)w-(1+i)w^*\)
            marks:
              - code: A1 AG
                note: Uses \(ww^* = 1\) from \(|w| = 1\) and \((1+i)(1-i) = 2\), reaching the printed result without error.
      - part: b
        rows:
          - scheme: |
              \(A_{2r-1}\colon w_r = e^{\frac{2(r-1)\pi}{5}i}\), the fifth roots of unity
              \(P\colon 1+i\)
            marks:
              - code: B1
                note: Needs both the odd-numbered vertices as the fifth roots of unity, or their five arguments, and \(P\) as \(1+i\).
          - scheme: |
              \(\sum_{r=1}^{5}(PA_{2r-1})^2 = \sum_{r=1}^{5}\bigl(3-(1-i)w_r-(1+i)w_r^*\bigr)\)
              \(\phantom{\sum} = 15-(1-i)\sum w_r-(1+i)\sum w_r^*\)
            marks:
              - code: M1
                note: Sums the result of (a) over the five odd-numbered vertices, separating the sums of \(w_r\) and \(w_r^*\). Condone the constant left as \(\sum 3\).
          - scheme: |
              \(\sum w_r = 0\), \(\sum w_r^* = 0\)
            marks:
              - code: B1
                note: Both sums stated or shown to be zero.
          - scheme: |
              \(\sum_{r=1}^{5}(PA_{2r-1})^2 = 15\)
            marks:
              - code: A1
                note: cso.
  - q: 8
    stamp: 434fd205
    parts:
      - part: a
        rows:
          - scheme: |
              \(\alpha^5 = \cos\left(5 \times \frac{3\pi}{5}\right) + i\sin\left(5 \times \frac{3\pi}{5}\right)\)
              \(\phantom{\alpha^5} = \cos 3\pi + i\sin 3\pi\)
            marks:
              - code: M1
                note: Applies de Moivre's theorem to \(\alpha^5\), reaching argument \(3\pi\) or an equivalent.
          - scheme: |
              \(\alpha^5 = -1\), so \(\alpha\) is a root
            marks:
              - code: A1 AG
                note: Evaluates \(\cos 3\pi = -1\) and \(\sin 3\pi = 0\) and concludes that \(\alpha\) is a root.
      - part: b
        rows:
          - scheme: |
              \(\cos\frac{\pi}{5} + i\sin\frac{\pi}{5}\), \(\ -1\),
              \(\cos\frac{7\pi}{5} + i\sin\frac{7\pi}{5}\), \(\ \cos\frac{9\pi}{5} + i\sin\frac{9\pi}{5}\)
            marks:
              - code: B1
                note: All four, in any correct form, with arguments in any range such as \(-\pi < \theta \leq \pi\).
      - part: c
        rows:
          - scheme: |
              \(\alpha^5 + 1 = (\alpha + 1)(\alpha^4 - \alpha^3 + \alpha^2 - \alpha + 1)\)
            marks:
              - code: M1
                note: Factorises \(z^5 + 1\) with factor \(z + 1\), or sums the geometric series with ratio \(-\alpha\). Expanding the printed product to \(\alpha^5 + 1\) also scores.
          - scheme: |
              \(\alpha^5 + 1 = 0\) and \(\alpha \neq -1\)
              \(\Rightarrow \alpha^4 - \alpha^3 + \alpha^2 - \alpha + 1 = 0\)
            marks:
              - code: A1 AG
                note: Uses \(\alpha^5 + 1 = 0\) and states \(\alpha \neq -1\) before concluding. A0 if \(\alpha \neq -1\) is not stated.
      - part: d
        rows:
          - scheme: |
              \(\alpha^2 - \alpha + 1 - \frac{1}{\alpha} + \frac{1}{\alpha^2} = 0\)
            marks:
              - code: M1
                note: Divides the quartic by \(\alpha^2\), or multiplies an expansion of the printed LHS by \(\alpha^2\). Condone one slip.
          - scheme: |
              \(\left(\alpha + \frac{1}{\alpha}\right)^2 = \alpha^2 + 2 + \frac{1}{\alpha^2}\)
              \(\Rightarrow \left(\alpha + \frac{1}{\alpha}\right)^2 - 2 - \left(\alpha + \frac{1}{\alpha}\right) + 1 = 0\)
            marks:
              - code: M1
                note: Uses the expansion of \(\left(\alpha + \frac{1}{\alpha}\right)^2\) to replace \(\alpha^2 + \frac{1}{\alpha^2}\), or to expand the printed LHS.
          - scheme: |
              \(\left(\alpha + \frac{1}{\alpha}\right)^2 - \left(\alpha + \frac{1}{\alpha}\right) - 1 = 0\)
            marks:
              - code: A1 AG
                note: Printed result reached without error from the result of (c). Showing the printed LHS equals \(\alpha^{-2}\) times the quartic, then citing (c), also scores.
      - part: e
        rows:
          - scheme: |
              \(t^2 - t - 1 = 0 \Rightarrow t = \ldots\), where \(t = \alpha + \frac{1}{\alpha}\)
            marks:
              - code: M1
                note: Solves the quadratic in \(\alpha + \frac{1}{\alpha}\) by formula, completing the square or calculator.
          - scheme: |
              \(t = \frac{1 \pm \sqrt{5}}{2}\)
            marks:
              - code: A1
          - scheme: |
              \(\frac{1}{\alpha} = \cos\frac{3\pi}{5} - i\sin\frac{3\pi}{5}\)
              \(\Rightarrow 2\cos\frac{3\pi}{5} = \their{\frac{1 \pm \sqrt{5}}{2}} \Rightarrow \cos\frac{3\pi}{5} = \ldots\)
            marks:
              - code: M1
                note: Shows or quotes \(\alpha + \frac{1}{\alpha} = 2\cos\frac{3\pi}{5}\) and equates it to their roots.
          - scheme: |
              \(\cos\frac{3\pi}{5} < 0 \Rightarrow \cos\frac{3\pi}{5} = \frac14 - \frac14\sqrt{5}\)
            marks:
              - code: A1
                note: Positive value rejected as \(\cos\frac{3\pi}{5} < 0\). In the form \(a + b\sqrt{c}\), or \(a\), \(b\), \(c\) stated; awrt \(-0.309\) scores A0.
  - q: 9
    stamp: f80c74b3
    parts:
      - part: a
        rows:
          - scheme: |
              \(\alpha = \frac{(6+11i) + (-8-3i)}{2}\)
            marks:
              - code: M1
                note: Uses the midpoint of \(z_1\) and \(z_2\), with values substituted.
          - scheme: |
              \(\alpha = \frac{-2+8i}{2} = -1+4i\)
            marks:
              - code: A1 AG
                note: Printed result reached from the substituted midpoint without error.
      - part: b
        rows:
          - scheme: |
              \(z_1 - \alpha = 7+7i\)
              \(\beta(z_1 - \alpha) = \frac{(1-i)(7+7i)}{14}\)
            marks:
              - code: M1
                note: Finds \(z_1 - \alpha\) and multiplies by \(\beta\). Condone a slip in \(z_1 - \alpha\).
          - scheme: |
              \(\phantom{\beta(z_1 - \alpha)} = \frac{7(1-i)(1+i)}{14} = \frac{7 \times 2}{14} = 1\)
            marks:
              - code: A1 AG
                note: Product evaluated explicitly, without error, to 1; a bare calculator result scores A0.
      - part: c.i
        rows:
          - scheme: |
              \(w = e^{\frac{k\pi}{4}i}, \quad k = 0, 1, \ldots, 7\)
            marks:
              - code: B1
                note: All eight roots, for any eight consecutive \(k\) or listed separately. \(r = 1\) may be omitted.
      - part: c.ii
        rows:
          - scheme: |
              \(w = \beta(z - \alpha) \Rightarrow z = \alpha + \frac{w}{\beta}\)
            marks:
              - code: M1
                note: Rearranges for \(z\) in terms of \(w\), or otherwise rotates \(z_1 - \alpha\) about \(\alpha\) through multiples of \(\frac{\pi}{4}\).
          - scheme: |
              \(\frac{1}{\beta} = 7(1+i)\)
              \(z = -1+4i+7(1+i)w\)
            marks:
              - code: A1
                note: oe
          - scheme: |
              \(w = \frac{1+i}{\sqrt2} \Rightarrow z = -1+4i+7(1+i)\frac{1+i}{\sqrt2}\)
              \(w = i \Rightarrow z = -1+4i+7(1+i)i\), \(\ldots\)
            marks:
              - code: dM1
                note: Substitutes at least two of the six non-real roots into their \(z = \alpha + cw\), for a constant \(c\).
          - scheme: |
              \(-1+(4+7\sqrt2)i,\ -8+11i,\ (-1-7\sqrt2)+4i\)
              \(-1+(4-7\sqrt2)i,\ 6-3i,\ (-1+7\sqrt2)+4i\)
            marks:
              - code: A1
                note: All six, exact or awrt 3 s.f., and no others; \(z_1\) and \(z_2\) also listed is condoned.
