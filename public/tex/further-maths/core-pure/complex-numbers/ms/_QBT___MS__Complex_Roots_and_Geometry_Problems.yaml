questions:
  - q: 1
    stamp: fc63df90
    parts:
      - part: a.i
        rows:
          - figure: 1
            marks:
              - code: B1
                note: \(B\) and \(D\) at the quarter-turn rotations of \(A\) about \(O\), \(B\) anticlockwise from \(A\). Condone small inaccuracy in position.
                feature: labelled point
              - code: B1
                note: \(C\) opposite \(A\) through \(O\), labelled \(C\).
                feature: symmetry
      - part: a.ii
        rows:
          - scheme: |
              \(z_1 + z_1e^{\frac12\pi i} + z_1e^{\pi i} + z_1e^{\frac32\pi i}\)
              \(\phantom{z_1} = z_1 + iz_1 - z_1 - iz_1\)
            marks:
              - code: M1
                note: Evaluates the three exponentials, directly or by \(\cos\theta + i\sin\theta\), at least two correctly, and sums the resulting multiples of \(z_1\).
          - scheme: |
              \(\phantom{z_1} = z_1(1 + i - 1 - i) = 0\)
            marks:
              - code: A1 AG
                note: All three values correct and the terms shown to cancel to 0 without error.
        alt:
          title: Geometric series
          rows:
            - scheme: |
                \(z_1\left(1 + e^{\frac12\pi i} + e^{\pi i} + e^{\frac32\pi i}\right)\)
                \(\phantom{z_1} = z_1\dfrac{1 - \left(e^{\frac12\pi i}\right)^4}{1 - e^{\frac12\pi i}}\)
              marks:
                - code: M1
                  note: Uses the sum of four terms of a geometric series with ratio \(e^{\frac12\pi i}\). Condone the factor \(z_1\) omitted here.
            - scheme: |
                \(\left(e^{\frac12\pi i}\right)^4 = e^{2\pi i} = 1 \Rightarrow\) sum \(= 0\)
              marks:
                - code: A1 AG
                  note: Shows the ratio to the fourth power is 1 and concludes the sum is 0, with the denominator nonzero.
      - part: b
        rows:
          - scheme: |
              \(-16 = 16e^{\pi i}\)
              \(\phantom{-16} = 16e^{(\pi + 2k\pi)i}\)
            marks:
              - code: B1
                note: Accept modulus–argument form, and the four arguments listed in place of \(\pi + 2k\pi\).
          - scheme: |
              \(z = 2e^{\frac{\pi + 2k\pi}{4}i}\), \(k = 0, 1, 2, 3\)
            marks:
              - code: M1
                note: Takes the fourth root of their modulus and divides their arguments by 4, giving at least two distinct roots in any form.
          - scheme: |
              \(z = \sqrt2 + \sqrt2\,i,\ -\sqrt2 + \sqrt2\,i\)
            marks:
              - code: A1
                note: Any two correct roots, in any form.
          - scheme: |
              \(z = \pm\sqrt2 \pm \sqrt2\,i\) (all four)
            marks:
              - code: A1
                note: All four in the form \(a + bi\) with exact \(a\) and \(b\), and no others. Roots left in exponential form score A0.
  - q: 2
    stamp: 33b550d4
    parts:
      - part: a
        rows:
          - scheme: |
              \(|w| = \sqrt{16^2 + (16\sqrt{3})^2}\)
              \(\arg w = \arctan\frac{16\sqrt{3}}{16}\)
            marks:
              - code: M1
                note: Attempts both the modulus and the argument of \(16 + 16\sqrt{3}\,i\). Condone arithmetic slips.
          - scheme: |
              \(16 + 16\sqrt{3}\,i = 32e^{\frac{\pi}{3}i}\)
            marks:
              - code: A1
                note: Or modulus 32 and argument \(\frac{\pi}{3}\) (awrt 1.05) stated.
          - scheme: |
              \(z = \their{32}^{\frac15}e^{\frac{\their{\pi/3} + 2k\pi}{5}i}\)
            marks:
              - code: M1
                note: Takes the fifth root of their modulus and uses arguments (their argument \(+ 2k\pi\))\(/5\), for general \(k\) or at least two values, or rotates one root by \(\frac{2\pi}{5}\).
          - scheme: |
              \(2e^{\frac{\pi}{15}i},\ 2e^{\frac{7\pi}{15}i}, \ldots\)
            marks:
              - code: A1
                note: Any two correct roots, in any form.
          - scheme: |
              \(2e^{\frac{\pi}{15}i},\ 2e^{\frac{7\pi}{15}i},\ 2e^{\frac{13\pi}{15}i},\)
              \(2e^{\frac{19\pi}{15}i},\ 2e^{\frac{5\pi}{3}i}\)
            marks:
              - code: A1
                note: All five as \(2e^{i\theta}\) with \(0 \leq \theta < 2\pi\), exact or awrt 0.209, 1.47, 2.72, 3.98, 5.24, and no others. A0 for any argument outside the range.
      - part: b
        rows:
          - figure: 1
            marks:
              - code: B1
                note: Pentagon centred at \(O\) with vertices equally spaced on a circle of radius 2, the radius shown by a scale or label.
                feature: shape
              - code: B1
                note: Each vertex labelled with its root, or a letter identified with it, in its correct position, one near the positive real axis in the first quadrant.
                feature: labelled point
      - part: c
        rows:
          - scheme: |
              Five congruent triangles with sides \(2, 2\)
              and angle \(\frac{2\pi}{5}\) at \(O\)
            marks:
              - code: B1
                note: Angle at \(O\) may be implied by its use in an area.
          - scheme: |
              \(\frac12 \times 2 \times 2 \times \sin\frac{2\pi}{5}\)
            marks:
              - code: M1
                note: Uses \(\frac12 ab\sin C\) with two sides equal to their modulus and their angle at \(O\) as the included angle.
          - scheme: |
              \(\phantom{\tfrac12} = 2\sin\frac{2\pi}{5}\)
            marks:
              - code: A1
          - scheme: |
              \(5 \times 2\sin\frac{2\pi}{5} = 10\sin\frac{2\pi}{5} \Rightarrow k = 10\)
            marks:
              - code: A1
                note: cso. Area \(10\sin\frac{2\pi}{5}\) or \(k = 10\) stated; a decimal area alone scores A0.
  - q: 3
    stamp: 39535d92
    parts:
      - part: a
        rows:
          - scheme: |
              \((h-1)^2 + 4^2 = (h-7)^2 + 2^2\)
              \(\Rightarrow h = \ldots\)
            marks:
              - code: M1
                note: Equates the distances, or squared distances, from \((h, 0)\) to \(A\) and \(B\), or intersects the perpendicular bisector of \(AB\) with the real axis. Condone sign slips.
          - scheme: |
              \(h = 3\)
            marks:
              - code: A1
          - scheme: |
              \(r^2 = (\their{3} - 1)^2 + 4^2\ [= 20]\)
            marks:
              - code: M1
                note: Uses Pythagoras for the distance from their real centre to \(A\) or \(B\).
          - scheme: |
              \(|z - 3| = 2\sqrt{5}\)
            marks:
              - code: A1
                note: Accept \(\sqrt{20}\) or awrt 4.47. Only the form \(|z-a|=b\) scores; \((x-3)^2 + y^2 = 20\) alone scores A0.
      - part: b
        rows:
          - scheme: |
              \((x-3)^2 + y^2 = 20\)
              \((x-1)^2 + (y-1)^2 = 25\)
            marks:
              - code: M1
                note: Writes at least one circle as an equation in \(x\) and \(y\), using \(z = x + iy\) and their \(C\) of the form \(|z-a|=b\). Condone sign slips.
              - code: A1
                note: Both correct, in any form.
          - scheme: |
              \(4x - 2y - 12 = 0 \Rightarrow y = 2x - 6\)
            marks:
              - code: M1
                note: Subtracts their equations to eliminate \(x^2\) and \(y^2\), reaching a linear equation in \(x\) and \(y\). Condone sign slips.
          - scheme: |
              \((x-3)^2 + (\their{2x-6})^2 = 20\)
              \(\Rightarrow x = \ldots\)
            marks:
              - code: dM1
                note: Substitutes their linear equation into either circle and solves the resulting quadratic in one variable by any method.
          - scheme: |
              \(z_1 = 1 - 4i,\ z_2 = 5 + 4i\)
            marks:
              - code: A1
                note: Both, in either order, as complex numbers; coordinates alone score A0.
  - q: 4
    stamp: e1a5d61b
    parts:
      - part: a
        rows:
          - scheme: |
              \(z_2 = \frac{(7 - i)(1 + i)}{(1 - i)(1 + i)} = \ldots\)
            marks:
              - code: M1
                note: Multiplies numerator and denominator by \(1 + i\) and expands, or equates real and imaginary parts of \((a + bi)(1 - i) = 7 - i\). Condone one slip.
          - scheme: |
              \(z_2 = 4 + 3i\)
            marks:
              - code: A1
      - part: b
        rows:
          - figure: 1
            marks:
              - code: B1
                note: \(P\) plotted and labelled at \((7, -1)\), in the fourth quadrant, with its position shown by scale or coordinates.
                feature: labelled point
              - code: B1ft
                note: ft their \(z_2\) from (a). \(Q\) plotted and labelled at their point, positioned correctly relative to \(P\).
                feature: labelled point
      - part: c
        rows:
          - scheme: |
              \(\overrightarrow{QO}\cdot\overrightarrow{QP} = (-4)(3) + (-3)(-4)\)
            marks:
              - code: M1
                note: Applies a perpendicularity test at \(Q\) to \(OQ\) and \(QP\), such as a scalar product, a product of gradients or Pythagoras' converse. Condone sign slips.
          - scheme: |
              \(\phantom{\overrightarrow{QO}\cdot\overrightarrow{QP}} = 0 \Rightarrow \angle OQP = \frac{\pi}{2}\)
            marks:
              - code: A1 AG
                note: Correct values giving 0, a gradient product of \(-1\), or \(OQ^2 + QP^2 = OP^2\), with a conclusion that the angle is a right angle.
      - part: d
        rows:
          - scheme: |
              Uses \(OP\) as a diameter: \(C = \tfrac12(7 - i) = \ldots\)
            marks:
              - code: M1
                note: Takes \(C\) as the midpoint of \(OP\), or solves for the point equidistant from \(O\), \(P\) and \(Q\).
          - scheme: |
              \(C = \tfrac72 - \tfrac12i\)
            marks:
              - code: A1
                note: oe as a complex number, such as \(3.5 - 0.5i\). Coordinates \(\left(\frac72, -\frac12\right)\) alone do not score.
      - part: e
        rows:
          - scheme: |
              \(r = \tfrac12|OP| = \tfrac12\sqrt{7^2 + (-1)^2}\)
            marks:
              - code: M1
                note: Finds half of \(|OP|\), or the distance from their \(C\) to \(O\), \(P\) or \(Q\), by Pythagoras. Condone sign slips.
          - scheme: |
              \(r = \frac{5\sqrt2}{2}\)
            marks:
              - code: A1
                note: Any exact form, such as \(\frac{\sqrt{50}}{2}\) or \(\sqrt{12.5}\).
  - q: 5
    stamp: e153bf26
    parts:
      - part: ''
        rows:
          - scheme: |
              \(A\), \(B\), \(C\): \(z^3 - 1 = 0\)
            marks:
              - code: B1
          - scheme: |
              \(P\), \(Q\), \(R\): \((z - 2)^3 = 1\)
            marks:
              - code: M1
