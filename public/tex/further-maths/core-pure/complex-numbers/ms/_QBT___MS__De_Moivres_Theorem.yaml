          - scheme: |
              \(x = 2\cos\theta \Rightarrow x^5 - 5x^3 + 5x\)
              \(\phantom{x} = 32\cos^5\theta - 40\cos^3\theta + 10\cos\theta = 2\cos5\theta\)
            marks:
              - code: M1
                note: Substitutes \(x = 2\cos\theta\) and uses (a) to write \(x^5 - 5x^3 + 5x\) as \(2\cos5\theta\).
          - scheme: |
              \(2\cos5\theta + 1 = 0 \Rightarrow \cos5\theta = -\frac12\)
            marks:
              - code: A1
          - scheme: |
              \(5\theta = \frac{2\pi}{3}, \frac{4\pi}{3}, \frac{8\pi}{3}, \frac{10\pi}{3}, \frac{14\pi}{3} \Rightarrow \theta = \ldots\)
            marks:
              - code: M1
                note: Finds at least two values of \(5\theta\) for their \(\cos5\theta = k\), \(|k| \le 1\), and divides by 5.
          - scheme: |
              \(x = 2\cos\frac{2\pi}{15}, 2\cos\frac{4\pi}{15}, 2\cos\frac{8\pi}{15}, 2\cos\frac{2\pi}{3}, 2\cos\frac{14\pi}{15}\)
            marks:
              - code: A1
                note: All five, each as \(2\cos q\pi\) oe (e.g. \(2\cos\frac{16\pi}{15}\)), no repeated root. Decimals, \(-1\), or \(\theta\) values alone score A0.
