  - q: 17
    stamp: 0a343444
    parts:
      - part: a
        rows:
          - scheme: |
              \((z-z^{-1})^4(z+z^{-1})^2 = (2i\sin\theta)^4(2\cos\theta)^2\)
              \(\phantom{(z-z^{-1})^4(z+z^{-1})^2} = 64\sin^4\theta\cos^2\theta\)
            marks:
              - code: B1
          - scheme: |
              \((z-z^{-1})^4(z+z^{-1})^2 = (z^2-2+z^{-2})(z^4-2+z^{-4})\)
              \(\phantom{(z-z^{-1})^4(z+z^{-1})^2} = \ldots\)
            marks:
              - code: M1
                note: Attempts the full expansion of the product into powers of \(z\), in any order. Condone sign and coefficient slips.
          - scheme: |
              \(= z^6-2z^4-z^2+4-z^{-2}-2z^{-4}+z^{-6}\)
            marks:
              - code: A1
                note: Correct seven-term expansion, oe.
          - scheme: |
              \(= (z^6+z^{-6})-2(z^4+z^{-4})-(z^2+z^{-2})+4\)
              \(= 2\cos 6\theta-4\cos 4\theta-2\cos 2\theta+4\)
            marks:
              - code: M1
                note: Pairs \(z^n\) with \(z^{-n}\) and replaces each pair by \(2\cos n\theta\).
          - scheme: |
              \(64\sin^4\theta\cos^2\theta = 2\cos 6\theta-4\cos 4\theta-2\cos 2\theta+4\)
              \(\Rightarrow \sin^4\theta\cos^2\theta \equiv \frac{1}{32}(\cos 6\theta-2\cos 4\theta-\cos 2\theta+2)\)
            marks:
              - code: A1 AG
                note: Correct expansion equated to \(64\sin^4\theta\cos^2\theta\), leading without error to the printed identity.
        alt:
          title: Double-angle formulae in \(\cos 2\theta\)
          rows:
            - scheme: |
                \(\sin^4\theta\cos^2\theta = \left(\frac{1-\cos 2\theta}{2}\right)^2\left(\frac{1+\cos 2\theta}{2}\right) = \ldots\)
              marks:
                - code: M1
                  note: Uses \(\sin^2\theta=\frac12(1-\cos 2\theta)\), \(\cos^2\theta=\frac12(1+\cos 2\theta)\) and expands to a polynomial in \(\cos 2\theta\). Condone sign slips.
            - scheme: |
                \(= \frac18(1-\cos 2\theta-\cos^2 2\theta+\cos^3 2\theta)\)
              marks:
                - code: A1
            - scheme: |
                \((\cos 2\theta+i\sin 2\theta)^3 = \cos 6\theta+i\sin 6\theta\)
                \(\Rightarrow \cos 6\theta = \cos^3 2\theta-3\cos 2\theta\sin^2 2\theta = \ldots\)
              marks:
                - code: M1
                  note: Expands \((\cos 2\theta+i\sin 2\theta)^3\) and equates real parts to express \(\cos 6\theta\) in powers of \(\cos 2\theta\); \(\cos 4\theta\) may come from a double-angle formula. Not for quoting the triple-angle formula.
            - scheme: |
                \(\cos^2 2\theta = \frac12(1+\cos 4\theta)\)
                \(\cos^3 2\theta = \frac14(\cos 6\theta+3\cos 2\theta)\)
              marks:
                - code: A1
                  note: Both, oe.
            - scheme: |
                \(\sin^4\theta\cos^2\theta = \frac18\left(1-\cos 2\theta-\frac{1+\cos 4\theta}{2}+\frac{\cos 6\theta+3\cos 2\theta}{4}\right)\)
                \(\phantom{\sin^4\theta\cos^2\theta} \equiv \frac{1}{32}(\cos 6\theta-2\cos 4\theta-\cos 2\theta+2)\)
              marks:
                - code: A1 AG
                  note: Correct substitution into the correct cubic, leading without error to the printed identity.
      - part: b
        rows:
          - scheme: |
              \(\sin^2\theta\cos^4\theta = \sin^4\alpha\cos^2\alpha\)
              \(\phantom{\sin^2\theta\cos^4\theta} = \frac{1}{32}(\cos 6\alpha-2\cos 4\alpha-\cos 2\alpha+2)\)
            marks:
