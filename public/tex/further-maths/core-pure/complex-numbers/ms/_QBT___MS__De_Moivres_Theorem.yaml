questions:
  - q: 1
    stamp: c10781b7
    parts:
      - part: ''
        rows:
          - scheme: |
              \(z - z^{-1} = 2i\sin\theta,\ z + z^{-1} = 2\cos\theta\)
              \(\Rightarrow \sin\theta\cos^4\theta = \frac{1}{32i}(z-z^{-1})(z+z^{-1})^4\)
            marks:
              - code: B1
                note: Both, stated or used.
          - scheme: |
              \((z-z^{-1})(z^4+4z^2+6+4z^{-2}+z^{-4})\)
            marks:
              - code: M1
                note: Multiplies out \((z-z^{-1})(z+z^{-1})^4\) to a sum of powers of \(z\), in any order of multiplication. Condone coefficient and sign slips.
          - scheme: |
              \(= z^5+3z^3+2z-2z^{-1}-3z^{-3}-z^{-5}\)
            marks:
              - code: A1
                note: Correct expansion, oe; the factor \(\frac{1}{32i}\) need not be shown here.
          - scheme: |
              \((z^5-z^{-5})+3(z^3-z^{-3})+2(z-z^{-1})\)
              \(\phantom{(} = 2i\sin5\theta+6i\sin3\theta+4i\sin\theta\)
            marks:
              - code: M1
                note: Pairs terms as \(z^n - z^{-n}\) and replaces each by \(2i\sin n\theta\), keeping their coefficients.
          - scheme: |
              \(A=\frac18,\ B=\frac{3}{16},\ C=\frac{1}{16}\)
            marks:
              - code: A1
                note: cso; withhold if an \(i\) or the factor \(\frac{1}{32}\) is lost and recovered. Accept the identity written with these values.
  - q: 2
    stamp: 73a637c8
    parts:
      - part: a
        rows:
          - scheme: |
              \(z^n = \cos n\theta + i\sin n\theta\)
              \(z^{-n} = \cos(-n\theta) + i\sin(-n\theta)\)
              \(\phantom{z^{-n}} = \cos n\theta - i\sin n\theta\)
            marks:
              - code: M1
                note: Uses de Moivre's theorem to write both \(z^n\) and \(z^{-n}\) in terms of \(\cos n\theta\) and \(\sin n\theta\); \(z^{-n}\) may come from \(\frac{1}{z^n}\) by realising the denominator.
          - scheme: |
              \(z^n + \frac{1}{z^n} = 2\cos n\theta\)
            marks:
              - code: A1
                note: From correct expressions for both powers, with \(\cos(-n\theta)\) and \(\sin(-n\theta)\) correctly simplified.
          - scheme: |
              \(z^n - \frac{1}{z^n} = (\cos n\theta + i\sin n\theta) - (\cos n\theta - i\sin n\theta)\)
              \(\phantom{z^n - \frac{1}{z^n}} = 2i\sin n\theta\)
            marks:
              - code: A1 AG
                note: Correct subtraction of the two expressions leading without error to the printed result.
      - part: b
        rows:
          - scheme: |
              \(\left(z+\frac1z\right)^3 = z^3+\frac{1}{z^3} + 3\left(z+\frac1z\right)\)
              \(\Rightarrow 8\cos^3\theta = 2\cos3\theta + 6\cos\theta\)
              \(\left(z-\frac1z\right)^3 = z^3-\frac{1}{z^3} - 3\left(z-\frac1z\right)\)
              \(\Rightarrow -8i\sin^3\theta = 2i\sin3\theta - 6i\sin\theta\)
            marks:
              - code: M1
                note: Expands both cubes binomially, groups into \(z^3 \pm z^{-3}\) and \(z \pm z^{-1}\), and replaces each by (a). Condone sign and coefficient slips.
          - scheme: |
              \(\cos3\theta = 4\cos^3\theta - 3\cos\theta\)
              \(\sin3\theta = 3\sin\theta - 4\sin^3\theta\)
            marks:
              - code: A1
                note: Both correct, from working with \((2i\sin\theta)^3 = -8i\sin^3\theta\) correct.
          - scheme: |
              \(\tan3\theta = \frac{3\sin\theta - 4\sin^3\theta}{4\cos^3\theta - 3\cos\theta}\)
              \(\phantom{\tan3\theta} = \frac{3\tan\theta\sec^2\theta - 4\tan^3\theta}{4 - 3\sec^2\theta}\)
            marks:
              - code: M1
                note: Writes \(\tan3\theta\) as their \(\sin3\theta\) over their \(\cos3\theta\), each a cubic in \(\sin\theta\) or \(\cos\theta\), and divides through by a power of \(\cos\theta\) to introduce \(\tan\theta\).
          - scheme: |
              \(\phantom{\tan3\theta} = \frac{3\tan\theta(1+\tan^2\theta) - 4\tan^3\theta}{4 - 3(1+\tan^2\theta)}\)
              \(\phantom{\tan3\theta} = \frac{3\tan\theta - \tan^3\theta}{1 - 3\tan^2\theta}\)
            marks:
              - code: A1 AG
                note: From correct expressions for \(\sin3\theta\) and \(\cos3\theta\), with \(\sec^2\theta = 1+\tan^2\theta\) oe used correctly, leading without error to the printed result.
  - q: 3
    stamp: 50e8c192
    parts:
      - part: ''
        rows:
          - scheme: |
              \(\cos 6\theta + i\sin 6\theta = (\cos\theta + i\sin\theta)^6\)
              \(\phantom{\cos 6\theta + i\sin 6\theta} = \cos^6\theta\,(1+it)^6\)
            marks:
              - code: M1
                note: Applies de Moivre's theorem and equates \(\cos 6\theta + i\sin 6\theta\) to \(\cos^6\theta\,(1+it)^6\).
          - scheme: |
              \((1+it)^6 = 1 + 6(it) + 15(it)^2 + 20(it)^3\)
              \(\phantom{(1+it)^6 =} + 15(it)^4 + 6(it)^5 + (it)^6\)
            marks:
              - code: M1
                note: Expands with seven terms in powers of \(it\) and binomial coefficients; condone one coefficient slip.
          - scheme: |
              \(\phantom{(1+it)^6} = (1 - 15t^2 + 15t^4 - t^6)\)
              \(\phantom{(1+it)^6 =} + i(6t - 20t^3 + 6t^5)\)
            marks:
              - code: A1
                note: Correct, with powers of \(i\) simplified; need not be grouped into real and imaginary parts.
          - scheme: |
              \(\cos 6\theta = \cos^6\theta\,(1 - 15t^2 + 15t^4 - t^6)\)
              \(\sin 6\theta = \cos^6\theta\,(6t - 20t^3 + 6t^5)\)
            marks:
              - code: M1
                note: Equates real parts and imaginary parts of their two expressions for \((\cos\theta + i\sin\theta)^6\).
              - code: A1
                note: Both correct, including the factor \(\cos^6\theta\).
          - scheme: |
              \(\tan 6\theta = \frac{\sin 6\theta}{\cos 6\theta} = \frac{\cos^6\theta\,(6t - 20t^3 + 6t^5)}{\cos^6\theta\,(1 - 15t^2 + 15t^4 - t^6)}\)
            marks:
              - code: M1
                note: Divides their \(\sin 6\theta\) by their \(\cos 6\theta\), or the imaginary part by the real part, and cancels \(\cos^6\theta\).
          - scheme: |
              \(\tan 6\theta = \frac{6\tan\theta - 20\tan^3\theta + 6\tan^5\theta}{1 - 15\tan^2\theta + 15\tan^4\theta - \tan^6\theta}\)
            marks:
              - code: A1 AG
                note: 'cso: printed result from correct working with no errors in powers of \(i\) or signs. Condone the final line left in \(t\).'
  - q: 4
    stamp: 230202bb
    parts:
      - part: a
        rows:
          - scheme: |
              \((\cos x + i\sin x)^6 = \cos 6x + i\sin 6x\)
              \(\phantom{(\cos x + i\sin x)^6} = \cos^6 x + 6i\cos^5 x\sin x\)
              \(\phantom{(\cos x + i\sin x)^6 =} + 15i^2\cos^4 x\sin^2 x + \ldots\)
            marks:
              - code: M1
                note: Applies de Moivre to \((\cos x + i\sin x)^6\) and expands binomially, at least the terms giving the imaginary part. Condone slips in coefficients or powers of \(i\).
          - scheme: |
              \(\sin 6x = 6\cos^5 x\sin x - 20\cos^3 x\sin^3 x\)
              \(\phantom{\sin 6x =} + 6\cos x\sin^5 x\)
            marks:
              - code: A1
                note: Equates imaginary parts correctly, oe.
          - scheme: |
              \(\sin 6x = 2\sin x\cos x\big(3\cos^4 x\)
              \(\phantom{\sin 6x =} - 10\cos^2 x(1-\cos^2 x) + 3(1-\cos^2 x)^2\big)\)
            marks:
              - code: M1
                note: Uses \(\sin^2 x + \cos^2 x = 1\) to write the bracket in powers of \(\cos x\) alone, by any route.
          - scheme: |
              \(\sin 6x = \sin 2x\,(\ldots\cos^4 x + \ldots\cos^2 x + \ldots)\)
            marks:
              - code: dM1
                note: Expands and collects to a quartic in \(\cos x\), with \(2\sin x\cos x\) replaced by \(\sin 2x\). Condone arithmetic slips.
          - scheme: |
              \(\sin 6x = \sin 2x\,(16\cos^4 x - 16\cos^2 x + 3)\)
              \(a = 16,\ b = -16,\ c = 3\)
            marks:
              - code: A1
                note: cso. Correct identity or \(a\), \(b\), \(c\) stated.
      - part: b
        rows:
          - scheme: |
              \(\sin 2\theta(16\cos^4\theta - 16\cos^2\theta + 3) = \sin 2\theta\cos 2\theta\)
              \(\Rightarrow 16\cos^4\theta - 16\cos^2\theta + 3 = 2\cos^2\theta - 1\)
            marks:
              - code: M1
                note: Uses their identity of the form \(\sin 2\theta(a\cos^4\theta + b\cos^2\theta + c)\), cancels \(\sin 2\theta\) and writes \(\cos 2\theta\) as \(2\cos^2\theta - 1\). Condone sign slips.
          - scheme: |
              \(16\cos^4\theta - 18\cos^2\theta + 4 = 0\)
            marks:
              - code: A1
                note: oe, such as \(8\cos^4\theta - 9\cos^2\theta + 2 = 0\).
          - scheme: |
              \(\cos^2\theta = \frac{9 \pm \sqrt{17}}{16} \Rightarrow \theta = \ldots\)
            marks:
              - code: M1
                note: Solves their three-term quadratic in \(\cos^2\theta\) by any means, calculator allowed, and inverts to find at least one \(\theta\).
          - scheme: |
              \(\theta = 0.438,\ 0.986\)
            marks:
              - code: A1
                note: Both, awrt 0.438 and 0.986, and no others in \(0 < \theta < \frac{\pi}{2}\).
  - q: 5
    stamp: acff6cf1
    parts:
      - part: a
        rows:
          - scheme: |
              \((z - z^{-1})^6 = (2i\sin\theta)^6 = -64\sin^6\theta\)
            marks:
              - code: B1
          - scheme: |
              \((z - z^{-1})^6\)
              \(\phantom{A} = z^6 - 6z^4 + 15z^2 - 20 + 15z^{-2} - 6z^{-4} + z^{-6}\)
            marks:
              - code: M1
                note: Expands using binomial coefficients 1, 6, 15, 20 with powers of \(z\) and \(z^{-1}\). Condone sign and power slips; need not be simplified.
              - code: A1
                note: All seven terms correct; powers need not be simplified.
          - scheme: |
              \((z^6 + z^{-6}) - 6(z^4 + z^{-4}) + 15(z^2 + z^{-2}) - 20\)
              \(\phantom{A} = 2\cos 6\theta - 12\cos 4\theta + 30\cos 2\theta - 20\)
            marks:
              - code: M1
                note: Pairs terms and uses \(z^n + z^{-n} = 2\cos n\theta\) for at least two pairs. Condone coefficient slips.
          - scheme: |
              \(-64\sin^6\theta = 2\cos 6\theta - 12\cos 4\theta + 30\cos 2\theta - 20\)
              \(\Rightarrow \sin^6\theta = \frac{1}{32}(10 - 15\cos 2\theta + 6\cos 4\theta - \cos 6\theta)\)
            marks:
              - code: A1 AG
                note: Equates the two expressions and reaches the printed identity without error; combined rearrangement accepted.
      - part: b
        rows:
          - scheme: |
              \(x = \tan\theta,\ \mathrm{d}x = \sec^2\theta\,\mathrm{d}\theta\)
              \(\Rightarrow \int \frac{\tan^6\theta}{(\sec^2\theta)^4}\sec^2\theta\,\mathrm{d}\theta\)
            marks:
              - code: M1
                note: 'Substitutes fully: \(\mathrm{d}x\) replaced by \(\sec^2\theta\,\mathrm{d}\theta\) and \(1 + x^2\) by \(\sec^2\theta\) or \(1 + \tan^2\theta\). Condone slips in powers.'
          - scheme: |
              \(\int_0^{\pi/4} \sin^6\theta\,\mathrm{d}\theta\)
            marks:
              - code: A1
          - scheme: |
              \(\frac{1}{32}\int_0^{\pi/4} (10 - 15\cos 2\theta + 6\cos 4\theta - \cos 6\theta)\,\mathrm{d}\theta\)
              \(\phantom{A} = \frac{1}{32}\left[10\theta - \frac{15}{2}\sin 2\theta + \frac{3}{2}\sin 4\theta - \frac{1}{6}\sin 6\theta\right]_0^{\pi/4}\)
            marks:
              - code: M1
                note: Replaces \(\sin^6\theta\) by the result of (a) and integrates to the form \(a\theta + \sum b_k \sin k\theta\). Condone sign and coefficient slips.
              - code: A1
                note: Correct integral; the factor \(\frac{1}{32}\) may be applied later.
          - scheme: |
              \(\frac{1}{32}\left(\frac{10\pi}{4} - \frac{15}{2} + 0 + \frac{1}{6}\right)\)
            marks:
              - code: dM1
                note: Substitutes \(\frac{\pi}{4}\) and 0 into their integral and subtracts; the zero from the lower limit need not be shown.
          - scheme: |
              \(= \frac{15\pi - 44}{192}\)
            marks:
              - code: A1
                note: Any exact equivalent, such as \(\frac{5\pi}{64} - \frac{11}{48}\).
  - q: 6
    stamp: 28e7ee03
    parts:
      - part: a
        rows:
          - scheme: |
              \(\cos5\theta + i\sin5\theta = (\cos\theta + i\sin\theta)^5\)
              \(\phantom{\cos5\theta} = \cos^5\theta + 5i\cos^4\theta\sin\theta - 10\cos^3\theta\sin^2\theta + \ldots\)
