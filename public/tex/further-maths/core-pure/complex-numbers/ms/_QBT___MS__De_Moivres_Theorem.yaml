          - scheme: |
              \(\cos5\theta = 16\cos^5\theta - 20\cos^3\theta + 5\cos\theta\)
              \(2\cos5\theta = 32\cos^5\theta - 40\cos^3\theta + 10\cos\theta\)
            marks:
              - code: A1 AG
                note: Correct real part, substituted and expanded without error to the printed identity, including the doubling; combined steps accepted.
      - part: b
