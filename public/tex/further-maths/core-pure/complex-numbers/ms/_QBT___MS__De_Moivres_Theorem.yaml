                note: Replaces \(\sin\theta\) by \(\cos\alpha\) and \(\cos\theta\) by \(\sin\alpha\) and applies the identity of (a) in \(\alpha\).
          - scheme: |
              \(\cos 2\alpha = -\cos 2\theta,\ \cos 4\alpha = \cos 4\theta,\ \cos 6\alpha = -\cos 6\theta\)
