          - scheme: |
              \(\phantom{\cos5\theta} = \cos^5\theta - 10\cos^3\theta(1-\cos^2\theta)\)
              \(\phantom{\cos5\theta =} + 5\cos\theta(1-\cos^2\theta)^2\)
            marks:
              - code: M1
                note: Replaces \(\sin^2\theta\) by \(1-\cos^2\theta\) in both terms containing \(\sin\theta\).
          - scheme: |
              \(\phantom{\cos5\theta} = \cos^5\theta - 10\cos^3\theta + 10\cos^5\theta\)
              \(\phantom{\cos5\theta =} + 5\cos\theta - 10\cos^3\theta + 5\cos^5\theta\)
