questions:
  - q: 1
    stamp: 18941f1e
    parts:
      - part: a.i
        rows:
          - scheme: |
              \(z^*=x-iy\)
            marks:
              - code: B1
      - part: a.ii
        rows:
          - scheme: |
              \(zz^*=(x+iy)(x-iy)\)
              \(\phantom{zz^*}=x^2-i^2y^2\)
            marks:
              - code: M1
                note: Expands \((x+iy)(x-iy)\) and uses \(i^2=-1\). Cross terms may cancel unseen; condone one sign slip.
          - scheme: |
              \(\phantom{zz^*}=x^2+y^2\), which is real
            marks:
              - code: A1 AG
                note: Correct expansion leading without error to \(x^2+y^2\), with a statement that it is real.
      - part: b.i
        rows:
          - scheme: |
              \(2w^*+12=5w-14i\)
            marks:
              - code: M1
                note: Conjugates the whole equation, including \(14i\), or substitutes \(w=a+bi\) and equates real and imaginary parts. Condone one sign slip.
          - scheme: |
              \(2w-5w^*=-12+14i\)
              \(-5w+2w^*=-12-14i\)
              \(\Rightarrow -21w=-84-42i \Rightarrow w=\ldots\)
            marks:
              - code: dM1
                note: Solves their two equations simultaneously, eliminating \(w^*\) or finding \(a\) and \(b\), to reach \(w=\ldots\). Condone arithmetic slips.
          - scheme: |
              \(w=4+2i\)
            marks:
              - code: A1
                note: In the form \(a+bi\) only; \(a=4\), \(b=2\) alone does not score.
      - part: b.ii
        rows:
          - scheme: |
              \(w^2(w^*)^2=(12+16i)(12-16i)=400\)
            marks:
              - code: B1
  - q: 2
    stamp: a85a5299
    parts:
      - part: ''
        rows:
          - scheme: |
              \(4(a+bi+2i) = (1-2i)(a-bi)\)
              \(\phantom{4}\Rightarrow 4a+(4b+8)i = (a-2b)+(-2a-b)i\)
            marks:
              - code: M1
                note: Substitutes \(z=a+bi\) and \(z^*=a-bi\) and expands the product using \(i^2=-1\). Condone sign slips.
          - scheme: |
              \(4a = a-2b\)
              \(4b+8 = -2a-b\)
            marks:
              - code: M1
                note: Equates real and imaginary parts of their expansion to form two equations in \(a\) and \(b\).
              - code: A1
                note: Correct pair, oe.
          - scheme: |
              \(3a+2b=0,\ 2a+5b=-8 \Rightarrow a=\ldots,\ b=\ldots\)
            marks:
              - code: dM1
                note: Solves their two linear equations for \(a\) and \(b\) by any method; a calculator may be used.
          - scheme: |
              \(z=\dfrac{16}{11}-\dfrac{24}{11}i\)
            marks:
              - code: A1
                note: oe, or awrt \(1.45-2.18i\). Must be given as \(z\) in the form \(a+bi\); \(a\) and \(b\) stated separately do not score.
  - q: 3
    stamp: 2f3697fa
    parts:
      - part: a
        rows:
          - scheme: |
              (i) \(|z_1z_2| = 2\sqrt{3}\)
            marks:
              - code: B1
          - scheme: |
              (ii) \(\arg(z_1z_2) = -\frac{2\pi}{3}\)
            marks:
              - code: B1
                note: Must lie in \(-\pi < \theta \leq \pi\).
      - part: b
        rows:
          - scheme: |
              \(\arg(w^n) = n\left(\their{-\tfrac{2\pi}{3}}\right) = 2k\pi \Rightarrow n = \ldots\)
            marks:
              - code: M1
                note: Multiplies their \(\arg w\) by \(n\) and sets it equal to a multiple of \(2\pi\), or finds arguments of successive powers until one is. Not for a multiple of \(\pi\) alone.
          - scheme: |
              (i) \(n = 3\)
            marks:
              - code: A1
          - scheme: |
              (ii) \(|w^3| = (\their{2\sqrt{3}})^3 = 24\sqrt{3}\)
            marks:
              - code: B1ft
                note: ft their \(|z_1z_2|\) raised to their \(n\).
  - q: 4
    stamp: 7d77b7e8
    parts:
      - part: a
        rows:
          - scheme: |
              \((4+3i)(-12+5i) = -48+20i-36i+15i^2\)
            marks:
              - code: M1
                note: Expands to four terms and uses \(i^2=-1\). Condone one sign slip.
          - scheme: |
              \(-63-16i\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \(|z_2| = \sqrt{(-12)^2+5^2} = 13\)
              \(\arg z_2 = \pi - \arctan\frac{5}{12}\)
            marks:
              - code: M1
                note: Attempts the modulus and an argument placed in the second quadrant, such as \(\pi-\arctan\frac5{12}\). Condone a slip in the modulus.
          - scheme: |
              \(z_2 = 13(\cos\theta + i\sin\theta)\)
              \(\theta = \pi - \arctan\frac{5}{12}\ [\approx 2.75]\)
            marks:
              - code: A1
                note: Form \(13(\cos\theta+i\sin\theta)\) with \(\theta\) exact oe or awrt 2.75.
      - part: c
        rows:
          - scheme: |
              \(\arg z_1 = \arctan\frac34\)
              \(\arg z_2 = \pi - \arctan\frac5{12}\)
              \(\arg(z_1z_2) = \pi + \arctan\frac{16}{63}\)
            marks:
              - code: B1
                note: All three, exact oe or awrt 0.644, 2.75, 3.39, each in \(0\leq\arg z<2\pi\) and its correct quadrant.
          - scheme: |
              \(\tan\left(\arctan\frac34 - \arctan\frac5{12}\right)\)
              \(\phantom{\tan} = \dfrac{\frac34-\frac5{12}}{1+\frac34\times\frac5{12}}\)
            marks:
              - code: M1
                note: Applies the compound angle formula for \(\tan\) of a sum or difference of their angles, with their tangents substituted. A decimal comparison alone earns neither this nor the A1.
          - scheme: |
              \(\phantom{\tan} = \frac{16}{63}\)
              \(\arg z_1+\arg z_2 = \pi + \arctan\frac{16}{63}\)
              \(\phantom{\arg z_1+\arg z_2} = \arg(z_1z_2)\)
            marks:
              - code: A1 AG
                note: Exact \(\frac{16}{63}\) obtained without error, then a statement that the sum of arguments equals \(\arg(z_1z_2)\). Condone no comment on the range of the angle.
  - q: 5
    stamp: b9607bed
    parts:
      - part: a
        rows:
          - scheme: |
              \(r = \sqrt{(-3)^2 + 2^2}\)
              \(\theta = \pi - \arctan\tfrac23\)
            marks:
              - code: M1
                note: Attempts the modulus by Pythagoras and an argument between \(\frac{\pi}{2}\) and \(\pi\) using \(\arctan\frac23\) or \(\arctan\frac32\).
          - scheme: |
              \(z_1 = \sqrt{13}\left(\cos 2.554 + i\sin 2.554\right)\)
            marks:
              - code: A1
                note: \(r = \sqrt{13}\) exactly and \(\theta\) awrt 2.554, in the required form.
      - part: b
        rows:
          - scheme: |
              \(z_1z_2 = (-3+2i)(a+bi)\)
              \(\phantom{z_1z_2} = (-3a-2b) + (2a-3b)i\)
            marks:
              - code: M1
                note: Expands \((-3+2i)(a+bi)\) using \(i^2 = -1\). Condone one sign slip.
              - code: A1
                note: Correct real and imaginary parts, oe.
          - scheme: |
              \(2a - 3b = -(-3a-2b) \Rightarrow a = \ldots\)
            marks:
              - code: M1
                note: Uses \(\arg = -\frac{\pi}{4}\) to set their imaginary part equal to minus their real part, or their ratio equal to \(\tan(-\frac{\pi}{4})\), and finds a relation between \(a\) and \(b\).
          - scheme: |
              \(a = -5b\)
            marks:
              - code: A1
          - scheme: |
              \(\sqrt{(13b)^2 + (-13b)^2} = 26\sqrt{2} \Rightarrow b = \ldots\)
            marks:
              - code: dM1
                note: Substitutes their relation into a modulus equation, for \(z_1z_2\) with \(26\sqrt{2}\) or for \(z_2\) with \(2\sqrt{26}\), and solves for \(b\).
          - scheme: |
              \(z_2 = -10 + 2i\)
            marks:
              - code: A1
                note: cao. A0 if \(10 - 2i\) is also given as an answer.
  - q: 6
    stamp: 4ae9075b
    parts:
      - part: a.i
        rows:
          - scheme: |
              \(|w| = \sqrt{(-6\sqrt{3})^2 + (-6)^2}\)
            marks:
              - code: M1
                note: Takes the square root of the sum of the squares of the real and imaginary parts. Condone sign slips.
          - scheme: |
              \(|w| = 12\)
            marks:
              - code: A1
      - part: a.ii
        rows:
          - scheme: |
              \(\arg w = -\pi + \arctan\left(\frac{6}{6\sqrt{3}}\right)\)
            marks:
              - code: M1
                note: Uses arctan of a ratio of the parts' magnitudes and adjusts for the third quadrant, e.g. \(-\pi + \alpha\) or \(-\frac{\pi}{2} - \beta\).
          - scheme: |
              \(\arg w = -\frac{5\pi}{6}\)
            marks:
              - code: A1
                note: \(-\frac{5\pi}{6}\) or awrt \(-2.62\), in the range \(-\pi < \arg w \leq \pi\).
      - part: b.i
        rows:
          - scheme: |
              \(z_1z_2 = 2(a\cos\theta + 3\sin\theta)\)
              \(\phantom{z_1z_2 =} + 2(a\sin\theta - 3\cos\theta)i\)
              \(a\cos\theta + 3\sin\theta = -3\sqrt{3}\)
              \(a\sin\theta - 3\cos\theta = -3\)
            marks:
              - code: M1
                note: Expands \(z_1z_2\) and equates real and imaginary parts with \(w\), giving two equations; condone sign slips. Or uses \(|z_1| = \frac{|w|}{|z_2|}\).
          - scheme: |
              \((a\cos\theta + 3\sin\theta)^2 + (a\sin\theta - 3\cos\theta)^2\)
              \(\phantom{(} = 27 + 9 \Rightarrow a^2 + 9 = 36 \Rightarrow a = \ldots\)
            marks:
              - code: dM1
                note: Squares and adds their equations to eliminate \(\theta\), or sets \(a^2 + 9\) equal to their \(|z_1|^2\), leading to \(a = \ldots\)
          - scheme: |
              \(a = 3\sqrt{3}\)
            marks:
              - code: A1
                note: \(3\sqrt{3}\) or \(\sqrt{27}\). A0 if the negative root is also given as an answer.
      - part: b.ii
        rows:
          - scheme: |
              \(z_2 = \frac{-6\sqrt{3} - 6i}{\their{3\sqrt{3}} - 3i} \times \frac{\their{3\sqrt{3}} + 3i}{\their{3\sqrt{3}} + 3i}\)
            marks:
              - code: M1
                note: Divides \(w\) by \(z_1\) with their \(a\), multiplying numerator and denominator by the conjugate of the denominator. Condone sign slips.
          - scheme: |
              \(z_2 = -1 - \sqrt{3}\,i\)
            marks:
              - code: A1
                note: Or \(\cos\theta = -\frac12\) and \(\sin\theta = -\frac{\sqrt{3}}{2}\).
          - scheme: |
              \(\theta = -\pi + \arctan\sqrt{3} = -\frac{2\pi}{3}\)
            marks:
              - code: A1
                note: In the range \(-\pi < \theta \leq \pi\).
  - q: 7
    stamp: 2028ed74
    parts:
      - part: a
        rows:
          - scheme: |
              \(zw = (3+i)(2+4i)\)
              \(\phantom{zw} = 6+12i+2i+4i^2\)
            marks:
              - code: M1
                note: Expands the product using \(i^2=-1\). Condone one arithmetic slip.
          - scheme: |
              \(zw = 2+14i\)
            marks:
              - code: A1
          - scheme: |
              \(|zw| = \sqrt{2^2+14^2} = \ldots\)
              \(\arg(zw) = \arctan\frac{14}{2} = \ldots\)
            marks:
              - code: M1
                note: Finds the modulus and argument of their \(zw\), the argument in the correct quadrant for their \(zw\).
          - scheme: |
              \(zw = 10\sqrt2\left(\cos(\arctan 7)\right.\)
              \(\phantom{zw = 10\sqrt2}\left.+\,i\sin(\arctan 7)\right)\)
            marks:
              - code: A1
                note: Accept \(\sqrt{200}\) or awrt 14.1, and \(\theta\) awrt 1.43.
      - part: b
        rows:
          - scheme: |
              \(\frac1v = \frac{z-w}{zw} = \frac{(3+i)-(2+4i)}{\their{2+14i}}\)
            marks:
              - code: M1
                note: Combines over a common denominator, or finds \(\frac1w\) and \(\frac1z\) in the form \(a+bi\) and subtracts.
          - scheme: |
              \(\frac1v = \frac{1-3i}{2+14i}\)
            marks:
              - code: A1
                note: oe, such as \(-\frac{2+i}{10}\).
          - scheme: |
              \(v = \frac{(2+14i)(1+3i)}{(1-3i)(1+3i)}\)
            marks:
              - code: M1
                note: Inverts their \(\frac1v\) and multiplies numerator and denominator by the conjugate of the denominator.
          - scheme: |
              \(\phantom{v} = \frac{2+6i+14i+42i^2}{1-9i^2}\)
            marks:
              - code: dM1
                note: Expands numerator and denominator using \(i^2=-1\), reaching a real denominator. Condone one slip.
          - scheme: |
              \(v = -4+2i\)
            marks:
              - code: A1
      - part: c
        rows:
          - scheme: |
              \(vv^* = (-4+2i)(-4-2i) = \ldots\)
            marks:
              - code: M1
                note: Multiplies their \(v\) by its conjugate, or uses \(vv^*=a^2+b^2\) with their \(a\) and \(b\).
          - scheme: |
              \(vv^* = 20\), so \(k = 20\)
            marks:
              - code: A1
  - q: 8
    stamp: fddcad96
    parts:
      - part: a
        rows:
          - scheme: |
              Real coefficients \(\Rightarrow\) \(3+i\) and \(2+3i\) also roots
            marks:
              - code: E1
                note: States that non-real roots occur in conjugate pairs, so the conjugates of \(z_2\) and \(z_3\) must also be roots.
          - scheme: |
              Five distinct roots, but a quartic has at most four
            marks:
              - code: E1
                note: Concludes that five distinct roots, or more than four, is impossible for a degree-four polynomial.
      - part: b
        rows:
          - scheme: |
              \(\frac{2-i}{1-3i} \times \frac{1+3i}{1+3i} = \ldots\)
            marks:
              - code: M1
                note: Substitutes and multiplies numerator and denominator by the conjugate of their denominator. Condone sign slips in forming the differences.
          - scheme: |
              \(\phantom{\frac{2}{1}} = \frac12 + \frac12i\)
            marks:
              - code: A1
                note: oe, such as \(\frac{5+5i}{10}\).
          - scheme: |
              First quadrant \(\Rightarrow \arg = \arctan 1 = \frac{\pi}{4}\)
            marks:
              - code: A1 AG
                note: Correct quotient leading without error to \(\frac{\pi}{4}\), with the first quadrant, or both parts positive, stated.
      - part: c
        rows:
          - scheme: |
              \(\arg\left(\frac{z_2-z_1}{z_3-z_1}\right) = \arg(2-i) - \arg(1-3i)\)
              \(\phantom{\arg} = -\arctan\frac12 - \left(-\arctan 3\right)\)
            marks:
              - code: M1
                note: Uses the argument of a quotient as the difference of arguments, with arctan forms of both arguments placed in the fourth quadrant. Condone one sign slip.
          - scheme: |
              \(\frac{\pi}{4} = \arctan 3 - \arctan\frac12\)
            marks:
              - code: A1 AG
                note: Correct negative arguments equated to \(\frac{\pi}{4}\) from (b), reaching the printed result without error.
      - part: d
        rows:
          - figure: 1
            marks:
              - code: B1
                note: Straight line through the midpoint of \(z_1\) and \(z_3\), visibly perpendicular to their join. Intercepts need not be marked.
                feature: shape
              - code: B1
                note: Half-plane containing \(z_1\) shaded, on a line that is at least roughly the bisector. Condone a dashed boundary.
                feature: shading
