questions:
  - q: 1
    stamp: d1104b39
    parts:
      - part: a
        rows:
          - scheme: |
              \(\{z \in \mathbb{C} : |z + 2 - i| = 4\}\)
            marks:
              - code: B1
                note: \(|z + 2 - i|\) oe, such as \(|z - (-2 + i)|\).
              - code: B1
                note: Equal to 4, inside set braces with \(z\) defined by a colon or bar. Condone \(\in \mathbb{C}\) omitted.
      - part: b
        rows:
          - figure: 1
            marks:
              - code: B1
                note: Straight line, drawn as the perpendicular bisector of the segment from \(2 + i\) to \(-1 + 3i\).
                feature: shape
              - code: B1
                note: Through \(\left(\frac12, 2\right)\) with positive gradient, about \(\frac32\), crossing the Re axis between \(-2\) and \(O\); labelled \(L\).
                feature: labelled point
      - part: c
        rows:
          - scheme: |
              \(z = x + 5i \Rightarrow z + 1 - 2i = (x + 1) + 3i\)
              \(\tan\frac{2\pi}{3} = \frac{3}{x + 1} \Rightarrow x = \ldots\)
            marks:
              - code: M1
                note: Uses \(\mathrm{Im}(z) = 5\) and \(\tan\frac{2\pi}{3}\) or \(\tan\frac{\pi}{3}\) as the ratio of imaginary to real parts of \(z + 1 - 2i\), solving for \(x\). Condone sign slips.
          - scheme: |
              \(z = -1 - \sqrt{3} + 5i\)
            marks:
              - code: A1
                note: oe, or awrt \(-2.73 + 5i\), as a complex number.
  - q: 2
    stamp: 825a5a1b
    parts:
      - part: a
        rows:
          - figure: 1
            marks:
              - code: B1
                note: A closed circle, freehand accepted.
                feature: shape
              - code: B1
                note: Centre at \(2 + 4i\) and radius 3, shown by position against the scales or by labels.
                feature: centre and radius
      - part: b
        rows:
          - figure: 2
            marks:
              - code: B1
                note: Half-line from \(1\) on the real axis at \(\frac{\pi}{4}\), through about \((5, 4)\), going up and right only; start shown excluded or not marked included.
                feature: half-line
      - part: c
        rows:
          - scheme: |
              \((x-2)^2 + (y-4)^2 = 9\), \(y = x - 1\)
              \(\Rightarrow (x-2)^2 + (x-5)^2 = 9 \Rightarrow x = \ldots\)
            marks:
              - code: M1
                note: Substitutes the line into a circle equation of the form \((x-2)^2 + (y-4)^2 = 9\), or eliminates \(x\), and solves the quadratic by any means. Condone slips.
          - scheme: |
              \(x = 5 \Rightarrow 5 + 4i\)
            marks:
              - code: A1
                note: \(5 + 4i\) or \((5, 4)\) taken as the furthest point; \((2, 1)\) need not be found.
          - scheme: |
              \(|w|_{\max} = \sqrt{5^2 + 4^2} = \sqrt{41}\)
            marks:
              - code: A1
                note: \(\sqrt{41}\) or awrt 6.40.
  - q: 3
    stamp: 5f65883b
    parts:
      - part: a.i
        rows:
          - scheme: |
              \((4, -3)\)
            marks:
              - code: B1
                note: Accept \(4 - 3i\).
      - part: a.ii
        rows:
          - scheme: |
              \(8\)
            marks:
              - code: B1
      - part: b
        rows:
          - figure: 1
            marks:
              - code: B1
                note: Interior of a circle shaded, centre \(4 - 3i\) in the fourth quadrant, enclosing \(O\), with the centre or radius 8 indicated.
                feature: shading
      - part: c
        rows:
          - scheme: |
              \(|4 - 3i| = \sqrt{4^2 + 3^2} = 5\)
            marks:
              - code: B1
          - scheme: |
              \(|z|_{\max} = \text{"}5\text{"} + 8 = \ldots\)
            marks:
              - code: M1
                note: Adds the radius to their distance from \(O\) to the centre, or maximises \(|z|\) on the circle by another valid method.
          - scheme: |
              \(13\)
            marks:
              - code: A1
      - part: d
        rows:
          - scheme: |
              \(x + y = 9\), \((x - 4)^2 + (y + 3)^2 = 64\)
              \(\Rightarrow x^2 - 16x + 48 = 0 \Rightarrow x = \ldots\)
            marks:
              - code: M1
                note: Combines a line through \((3, 6)\) of gradient \(\pm 1\) with their circle equation and solves for the intersections by any means. Condone sign slips.
          - scheme: |
              \((4, 5)\), \((12, -3)\)
              \(\Rightarrow \angle PCQ = \frac{\pi}{2}\)
            marks:
              - code: A1
                note: Angle at the centre \(\frac{\pi}{2}\) or \(90^\circ\), from correct intersection points.
          - scheme: |
              \(\text{Area} = \tfrac12 \times 8^2 \times \text{"}\tfrac{\pi}{2}\text{"}\)
              \(\phantom{\text{Area}} - \tfrac12 \times 8^2 \times \sin\text{"}\tfrac{\pi}{2}\text{"}\)
            marks:
              - code: dM1
                note: Uses sector minus triangle, \(\frac12 r^2(\theta - \sin\theta)\), with \(r = 8\) and their angle at the centre.
          - scheme: |
              \(= 16\pi - 32 = 18.3\)
            marks:
              - code: A1
                note: awrt 18.3.
  - q: 4
    stamp: becda6f1
    parts:
      - part: a.i
        rows:
          - scheme: |
              \(|z - (-2 + 4i)| = 3\)
              \(|z + 2 - 4i| = 3\)
            marks:
              - code: B1
                note: \(|z - (-2 + 4i)|\) or \(|z + 2 - 4i|\) seen, with any right-hand side.
              - code: B1
                note: Correct equation in any modulus form.
      - part: a.ii
        rows:
          - scheme: |
              \(|z + 2 - 4i| < 3\)
            marks:
              - code: B1
                note: With any inequality or equals sign.
          - scheme: |
              \(|z - (2 + 6i)| < 4\)
            marks:
              - code: B1
                note: With any inequality or equals sign.
              - code: B1
                note: Strict \(<\) in both, on inequalities for both circles.
      - part: b.i
        rows:
          - figure: 1
            marks:
              - code: B1
                note: Half-line from \(-2 + i\) at \(\frac{\pi}{4}\) above the positive real direction; angle labelled or clearly in proportion.
                feature: half-line
              - code: B1
                note: Half-line from \(-2 + i\) at \(\frac{\pi}{6}\) below the positive real direction; angle labelled or clearly in proportion.
                feature: half-line
              - code: B1
                note: Region between the half-lines, to the right of \(-2 + i\), shaded or labelled. Condone solid boundaries and an unmarked vertex.
                feature: shading
      - part: b.ii
        rows:
          - scheme: |
              \(z + 2 - i = 3 + 4i \Rightarrow \arg(3 + 4i) = \ldots\)
            marks:
              - code: M1
                note: Substitutes \(1 + 5i\) into \(z + 2 - i\) and attempts its argument, or the gradient from \(-2 + i\) to \(1 + 5i\).
          - scheme: |
              \(\arctan\frac43 \approx 0.927\)
            marks:
              - code: A1
                note: \(\arctan\frac43\), awrt 0.927 or 53.1°, or gradient \(\frac43\).
          - scheme: |
              \(0.927 > \frac{\pi}{4} \approx 0.785\)
              \(1 + 5i\) is not in the region
            marks:
              - code: A1ft
                note: ft their argument or gradient. Compares with \(\frac{\pi}{4}\) (or \(\tan\frac{\pi}{4} = 1\)), and with \(-\frac{\pi}{6}\) where needed, and concludes correctly.
  - q: 5
    stamp: 1a220c43
    parts:
      - part: a
        rows:
          - scheme: |
              \(|2+2\sqrt{3}i| = \sqrt{2^2 + (2\sqrt{3})^2}\)
            marks:
              - code: M1
                note: Squares the real and imaginary parts, adds and takes the square root. Condone one slip in squaring.
          - scheme: |
              \(= 4\)
            marks:
              - code: A1
      - part: b.i
        rows:
          - figure: 1
            marks:
              - code: B1
                note: A circle drawn wholly below the real axis.
                feature: shape
              - code: B1
                note: Centre \(2-2\sqrt{3}i\) or \((2, -2\sqrt{3})\) indicated, and the circle touching the imaginary axis at \(-2\sqrt{3}i\).
                feature: centre and radius
      - part: b.ii
        rows:
          - scheme: |
              \(\sin\alpha = \frac{2}{4} \Rightarrow \alpha = \frac{\pi}{6}\)
              \(\arg w = -\frac{\pi}{3} + \alpha\)
            marks:
              - code: M1
                note: Uses the tangent from \(O\) to \(L\), adding the angle between \(OC\) and the tangent to their \(\arg\) of the centre, or finds the tangent's gradient by any method.
          - scheme: |
              \(\arg w = -\frac{\pi}{6}\)
            marks:
              - code: A1
                note: In terms of \(\pi\).
      - part: c
        rows:
          - scheme: |
              \(|2+2\sqrt{3}i| = 4\), \(\arg = \arctan\sqrt{3} = \ldots\)
            marks:
              - code: M1
                note: Finds the modulus and attempts an argument by trigonometry on the real and imaginary parts. The modulus may come from (a).
          - scheme: |
              \(z^4 = 4e^{i\pi/3}\)
            marks:
              - code: A1
                note: oe, such as \(4\left(\cos\frac{\pi}{3} + i\sin\frac{\pi}{3}\right)\).
          - scheme: |
              \(r = \text{"}4\text{"}^{1/4}\), \(\theta = \dfrac{\text{"}\frac{\pi}{3}\text{"} + 2k\pi}{4}\)
            marks:
              - code: M1
                note: Takes the fourth root of their modulus, and divides their argument plus \(2k\pi\) by 4 for at least two values of \(k\), or adds multiples of \(\frac{\pi}{2}\) to one root's argument.
          - scheme: |
              \(z = \sqrt{2}\,e^{i\pi/12},\ \sqrt{2}\,e^{7\pi i/12}\)
            marks:
              - code: A1
                note: Any two correct roots; arguments need not be in range. Modulus \(\sqrt{2}\) oe or awrt 1.41, arguments exact or awrt.
          - scheme: |
              \(z = \sqrt{2}\,e^{-11\pi i/12},\ \sqrt{2}\,e^{-5\pi i/12}\)
            marks:
              - code: A1
                note: All four roots in the form \(re^{i\theta}\) with \(-\pi < \theta \leq \pi\), and no others.
  - q: 6
    stamp: d68111ef
    parts:
      - part: a
        rows:
          - scheme: |
              \((x-1)^2+(y-1)^2\)
              \(\phantom{(x-1)^2} = \frac14\left((x-4)^2+(y-1)^2\right)\)
            marks:
              - code: M1
                note: Writes both moduli in terms of \(x\) and \(y\) and squares both sides. Condone sign slips and the \(\frac12\) left unsquared.
              - code: A1
                note: Any correct equation without square roots.
          - scheme: |
              \(3x^2+3y^2-6y-9=0\)
              \(\Rightarrow x^2+(y-1)^2 = \ldots\)
            marks:
              - code: dM1
                note: Expands and collects to \(x^2+y^2+ax+by+c=0\) or a multiple, then completes the square or uses centre \(\left(-\frac a2,-\frac b2\right)\). Condone arithmetic slips.
          - scheme: |
              \(x^2+(y-1)^2=4\), a circle
            marks:
              - code: A1
                note: Or \(x^2+y^2-2y-3=0\), with the locus stated to be a circle.
          - scheme: |
              Centre \((0,1)\), radius \(2\)
            marks:
              - code: A1
                note: Both, cso.
      - part: b
        rows:
          - figure: 1
            marks:
              - code: B1
                note: A circle, crossing both axes twice.
                feature: shape
              - code: B1
                note: Centre \((0,1)\) marked, and radius 2 shown or the circle through \(3i\) and \(-i\).
                feature: centre and radius
          - scheme: |
              \((x-2)^2+(y-3)^2=(x+2)^2+(y-1)^2\)
              \(\Rightarrow -8x-4y+8=0\)
            marks:
              - code: M1
                note: Squares the moduli in terms of \(x\) and \(y\) and simplifies to a linear equation, or finds the perpendicular bisector of \((2,3)\) and \((-2,1)\). Condone sign slips.
          - scheme: |
              \(y=2-2x\)
            marks:
              - code: A1
                note: oe, such as \(2x+y=2\).
          - scheme: |
              Line \(y=2-2x\) on the same diagram
            marks:
              - code: B1
                note: Straight line of negative gradient through \((1,0)\) and \((0,2)\), cutting the circle twice. Intercepts need not be labelled.
      - part: c
        rows:
          - figure: 2
            marks:
              - code: B1
                note: Shaded region lies inside the circle.
                feature: shading
              - code: B1
                note: Shading on the side of the line containing \(O\), with only the intersection of the two regions shaded.
                feature: shading
  - q: 7
    stamp: 4ef5f78a
    parts:
      - part: ''
        rows:
          - scheme: |
              \((x-2)^2 + (y+1)^2 = 9\)
            marks:
              - code: B1
                note: oe, such as \(x^2 + y^2 - 4x + 2y - 4 = 0\).
          - scheme: |
              \((x+1)^2 + (y-11)^2 = 9\left((x+1)^2 + (y-3)^2\right)\)
            marks:
              - code: M1
                note: Writes both moduli in terms of \(x\) and \(y\) and squares both sides. Condone sign slips.
          - scheme: |
              \((x+1)^2 + (y-2)^2 = 9\)
            marks:
              - code: A1
                note: oe, such as \(x^2 + y^2 + 2x - 4y - 4 = 0\).
          - scheme: |
              \((x-2)^2 + (y+1)^2 = (x+1)^2 + (y-2)^2\)
              \(\Rightarrow -6x + 6y = 0\)
            marks:
              - code: M1
                note: Subtracts their circle equations, each with equal coefficients of \(x^2\) and \(y^2\), to reach a linear equation in \(x\) and \(y\). Condone sign slips.
          - scheme: |
              \(y = x\)
            marks:
              - code: A1
          - scheme: |
              \((x-2)^2 + (x+1)^2 = 9\)
              \(\Rightarrow x^2 - x - 2 = 0 \Rightarrow x = \ldots\)
            marks:
              - code: dM1
                note: Substitutes their linear equation into either circle and solves the three-term quadratic by any means, leading to \(x = \ldots\) or \(y = \ldots\).
          - scheme: |
              \((2, 2)\) and \((-1, -1)\)
            marks:
              - code: A1
                note: Both points and no others.
  - q: 8
    stamp: c563b6c5
    parts:
      - part: a
        rows:
          - figure: 1
            marks:
              - code: B1
                note: A circle, roughly round.
                feature: shape
              - code: B1
                note: Centre at \(3 + i\) and radius 1, shown by position against the scales or by labels.
                feature: centre and radius
      - part: b.i
        rows:
          - scheme: |
              \((x-3)^2 + (mx-1)^2 = 1\)
              \(\Rightarrow (1+m^2)x^2 - (6+2m)x + 9 = 0\)
              \((6+2m)^2 - 36(1+m^2) = 0 \Rightarrow m = \ldots\)
            marks:
              - code: M1
                note: Uses a tangency condition, such as a zero discriminant for their quadratic in \(x\) or the distance from \((3, 1)\) to \(y = mx\) equal to 1, and solves for \(m\).
          - scheme: |
              \(m = \tfrac34\) (\(m = 0\) rejected)
              \(\alpha = \arctan\tfrac34 = 0.644\)
            marks:
              - code: A1
                note: \(\arctan\frac34\), awrt 0.644 or \(36.9^\circ\). A0 if \(\alpha = 0\) is also given as an answer.
      - part: b.ii
        rows:
          - scheme: |
              \((x-3)^2 + \left(\text{"}\tfrac34\text{"}x - 1\right)^2 = 1\)
              \(\Rightarrow 25x^2 - 120x + 144 = 0 \Rightarrow x = \ldots\)
            marks:
              - code: M1
                note: Substitutes \(y = mx\) with their nonzero \(m\) into the circle and solves for \(x\), or finds the point of contact by any valid method.
          - scheme: |
              \(w = \tfrac{12}{5} + \tfrac95 i\)
            marks:
              - code: A1
                note: oe, such as \(2.4 + 1.8i\).
          - scheme: |
              \(|w| = \sqrt{2.4^2 + 1.8^2}\)
              \(\arg w = \arctan\frac{1.8}{2.4}\)
            marks:
              - code: M1
                note: Finds the modulus and argument of their \(w\); the argument may be taken as their \(\alpha\).
          - scheme: |
              \(w = 3.0(\cos 0.64 + i\sin 0.64)\)
            marks:
              - code: A1
                note: In the form \(r(\cos\theta + i\sin\theta)\); accept \(r = 3\) and \(\theta = 37^\circ\).
  - q: 9
    stamp: 6e518e6e
    parts:
      - part: a
        rows:
          - scheme: |
              \(w - 2 + i = (x - 2) + 4i\)
              \(\tan\frac{\pi}{6} = \frac{4}{x - 2} \Rightarrow x = \ldots\)
            marks:
              - code: M1
                note: Equates \(\tan\frac{\pi}{6}\) to the ratio of imaginary to real part of \(w - 2 + i\) with \(\mathrm{Im}(w) = 3\), and solves. Condone one sign slip.
          - scheme: |
              \(w = 2 + 4\sqrt{3} + 3i\)
            marks:
              - code: A1
                note: oe, or awrt \(8.93 + 3i\).
      - part: b
        rows:
          - scheme: |
              \(k = \lvert \text{"}2 + 4\sqrt{3} + 3i\text{"} - (2 + 11i) \rvert\)
              \(\phantom{k} = \lvert 4\sqrt{3} - 8i \rvert\)
            marks:
              - code: M1
                note: Uses Pythagoras on the real and imaginary differences between their \(w\) from (a) and \(2 + 11i\). Condone sign slips.
          - scheme: |
              \(k^2 = 112\)
            marks:
              - code: A1
                note: Or \(k = 4\sqrt{7}\) oe, awrt 10.6.
          - scheme: |
              \(y + 1 = \frac{x - 2}{\sqrt{3}}\)
            marks:
              - code: B1
                note: oe. The restriction \(x > 2\) need not be stated.
          - scheme: |
              \((x - 2)^2 + \left(\frac{x - 2}{\sqrt{3}} - 12\right)^2 = \text{"}112\text{"}\)
            marks:
              - code: M1
                note: Substitutes their linear equation into a circle centre \((2, 11)\) with their \(k^2\), reaching an equation in one variable.
          - scheme: |
              \(x^2 - (4 + 6\sqrt{3})x + 28 + 12\sqrt{3} = 0\)
            marks:
              - code: A1
                note: Any correct three-term quadratic in one variable, oe, such as \(y^2 - 4y + 3 = 0\).
          - scheme: |
              \(x = 2 + 4\sqrt{3}\) (gives \(P\)) or \(x = 2 + 2\sqrt{3}\)
              \(\Rightarrow y = \ldots\)
            marks:
              - code: dM1
                note: Solves their quadratic by any method, calculator allowed, rejects the root giving \(P\) and finds the other coordinate.
          - scheme: |
              \(z = 2 + 2\sqrt{3} + i\)
            marks:
              - code: A1
                note: oe, or awrt \(5.46 + i\).
  - q: 10
    stamp: 446a6121
    parts:
      - part: a
        rows:
          - figure: 1
            marks:
              - code: B1
                note: Major arc of a circle with endpoints \(2+i\) and \(6+5i\), both shown excluded.
                feature: shape
              - code: B1
                note: Arc on the side of chord \(AB\) below and to the right, away from the origin.
                feature: labelled point
      - part: b
        rows:
          - scheme: |
              Centre equidistant from \(A\) and \(B\), so on the
              perpendicular bisector of \(AB\):
              midpoint \((4,3)\), gradient \(-1\)
              \(\Rightarrow y - 3 = -(x-4) \Rightarrow y = 7-x\)
            marks:
              - code: E1
                note: Gives the equidistance reason and shows the perpendicular bisector of \(AB\) is \(y = 7-x\), by midpoint and gradient or any valid check.
      - part: c
        rows:
          - scheme: |
              \(\angle APB = 2 \times \frac{\pi}{4} = \frac{\pi}{2}\)
              \(\Rightarrow r^2 + r^2 = AB^2 = 32 \Rightarrow r = \ldots\)
            marks:
              - code: M1
                note: Uses the angle at the centre with Pythagoras on chord \(AB\), or another valid chord relation such as \(AB = 2r\sin\frac{\pi}{4}\). Condone a slip in \(AB^2\).
          - scheme: |
              \(r = 4\)
            marks:
              - code: A1
      - part: d
        rows:
          - scheme: |
              Centre \((a, 7-a)\):
              \((a-2)^2 + (6-a)^2 = 16\)
              \(\Rightarrow a^2 - 8a + 12 = 0 \Rightarrow a = \ldots\)
            marks:
              - code: M1
                note: Uses a centre on \(y = 7-x\) at distance their \(r\) from \(A\) or \(B\) and solves for it. Condone expansion slips.
          - scheme: |
              \(a = 2\) or \(6\): \((2,5)\) or \((6,1)\)
              \(10+i\) on locus, \(\sqrt{80} \ne 4\) from \((2,5)\)
              Centre \((6,1)\)
            marks:
              - code: A1
                note: Rejects \((2,5)\) with a reason, such as a test point on the locus or the arc lying below and to the right of \(AB\).
