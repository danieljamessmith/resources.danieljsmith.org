          - scheme: |
              \(50\)
            marks:
              - code: A1
      - part: b.i
        rows:
          - scheme: |
              \(OP\) is perpendicular to the plane \(PQR\)
            marks:
              - code: E1
                note: States \(OP\) is normal to plane \(PQR\), oe such as perpendicular to both \(PQ\) and \(QR\). Not for perpendicular to one line alone.
      - part: b.ii
        rows:
          - scheme: |
              \(50 \neq 0\), so \(O\), \(P\), \(Q\) and \(R\) are not coplanar
            marks:
              - code: E1
                note: States the four points are not coplanar, oe such as \(O\) not in plane \(PQR\). Need not mention \(50 \neq 0\).
