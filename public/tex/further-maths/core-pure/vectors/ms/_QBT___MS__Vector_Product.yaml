questions:
  - q: 1
    stamp: '03138225'
    parts:
      - part: a
        rows:
          - scheme: |
              \(\mathbf q\times\mathbf p = (2m+3)\mathbf i - 5\mathbf j + (6-m)\mathbf k\)
            marks:
              - code: B1
                note: Any form; the components need not be simplified.
          - scheme: |
              \(-5 = -\lambda\), \(2m+3 = \lambda\) or \(6-m = \lambda\)
              \(\Rightarrow \lambda = \ldots,\ m = \ldots\)
            marks:
              - code: M1
                note: Equates at least two components of their \(\mathbf q\times\mathbf p\) to those of \(\lambda\mathbf n\) and solves for \(\lambda\) and \(m\). Condone sign slips.
          - scheme: |
              \(\lambda = 5,\ m = 1\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \(|\mathbf q\times\mathbf p| = \sqrt{75}\ [= 5\sqrt3]\)
              \(|\mathbf p| = \sqrt{14},\ |\mathbf q| = \sqrt6\)
            marks:
              - code: B1
                note: All three, in any form.
          - scheme: |
              \(\sin\theta = \frac{\their{5\sqrt3}}{\their{\sqrt6}\,\their{\sqrt{14}}}\ \left[= \frac{5}{2\sqrt7}\right]\)
            marks:
              - code: M1
                note: Uses \(|\mathbf q\times\mathbf p| = |\mathbf q||\mathbf p|\sin\theta\) with their magnitudes to find \(\sin\theta\).
          - scheme: |
              \(\theta = 70.9^\circ\)
            marks:
              - code: A1
                note: awrt \(70.9^\circ\) or awrt 1.24 rad. A0 for the obtuse angle.
  - q: 2
    stamp: b3f8aad8
    parts:
      - part: a
        rows:
          - scheme: |
              \(\overrightarrow{AB}\times\overrightarrow{AC}=\mathbf 0\) only if \(\overrightarrow{AB}\) and \(\overrightarrow{AC}\)
              are parallel, or one is \(\mathbf 0\)
            marks:
              - code: B1
                note: Accept oe such as \(|\mathbf a||\mathbf b|\sin\theta = 0\) only when \(\theta = 0\) or \(\pi\), or a zero vector.
          - scheme: |
              \(\overrightarrow{AB}=\begin{pmatrix}t-1\\2\\4-t\end{pmatrix}\), \(\overrightarrow{AC}=\begin{pmatrix}3\\0\\1\end{pmatrix}\neq\mathbf 0\)
              \(y\)-components \(2\) and \(0\), so \(\overrightarrow{AB}\neq k\overrightarrow{AC}\) for any \(t\)
              \(\Rightarrow\) statement false for all \(t\)
            marks:
              - code: E1
                note: Shows \(\overrightarrow{AB}\) is never a multiple of \(\overrightarrow{AC}\), by components, and concludes false for all \(t\). Not for computing the vector product.
      - part: b.i
        rows:
          - scheme: |
              \(\begin{pmatrix}t-1\\2\\4-t\end{pmatrix}\times\begin{pmatrix}3\\0\\1\end{pmatrix}=\begin{pmatrix}2\cdot1-(4-t)\cdot0\\(4-t)\cdot3-(t-1)\cdot1\\(t-1)\cdot0-2\cdot3\end{pmatrix}\)
            marks:
              - code: M1
                note: Forms two sides of the triangle as vectors in \(t\) and attempts their vector product, all three components. Condone sign slips.
          - scheme: |
              \(\phantom{\overrightarrow{AB}} = \begin{pmatrix}2\\13-4t\\-6\end{pmatrix}\)
            marks:
              - code: A1
                note: Correct vector, or its negative.
          - scheme: |
              \(\text{Area}=\tfrac12\sqrt{2^2+\their{(13-4t)}^2+(-6)^2}\)
            marks:
              - code: dM1
                note: Takes half the magnitude of their vector product, squaring all three components.
          - scheme: |
              \(\phantom{\text{Area}} = \tfrac12\sqrt{(13-4t)^2+40}\)
            marks:
              - code: A1
                note: Correct expression oe, such as \(\frac12\sqrt{16t^2-104t+209}\).
      - part: b.ii
        rows:
          - scheme: |
              \((13-4t)^2+40\) least when \(13-4t=0\Rightarrow t=\ldots\)
            marks:
              - code: M1
                note: Finds the minimum of the area or the expression under their root, by a squared term set to zero, completing the square or a derivative set to zero.
          - scheme: |
              \(t=\frac{13}{4}\)
            marks:
              - code: A1
                note: oe, such as \(3.25\).
  - q: 3
    stamp: 5cc053f8
    parts:
      - part: a
        rows:
          - scheme: |
              \(\overrightarrow{AB} = (p-1)\mathbf{i} + 2\mathbf{j} + 2\mathbf{k}\)
              \(\overrightarrow{AB}\cdot\mathbf{j} = |\overrightarrow{AB}|\cos 60^\circ\)
              \(\Rightarrow 2 = \tfrac12\sqrt{(p-1)^2 + 2^2 + 2^2}\)
            marks:
              - code: M1
                note: Equates the scalar product of their \(\overrightarrow{AB}\), a difference of position vectors, with \(\mathbf{j}\) to their \(|\overrightarrow{AB}|\cos 60^\circ\). Condone sign slips.
              - code: A1
                note: Any correct equation in \(p\) alone.
          - scheme: |
              \((p-1)^2 = 8 \Rightarrow p = 1 \pm 2\sqrt{2}\)
            marks:
              - code: A1
                note: Both values, oe, or awrt \(3.83\) and \(-1.83\).
      - part: b
        rows:
          - scheme: |
              \(\overrightarrow{OA}\times\overrightarrow{AB} = 2\mathbf{i} - 2\mathbf{j} + (3-p)\mathbf{k}\)
            marks:
              - code: B1
          - scheme: |
              \(\their{2\mathbf{i} - 2\mathbf{j} + (3-p)\mathbf{k}} = \lambda(2\mathbf{i} - 2\mathbf{j} + \mathbf{k})\)
              \(\Rightarrow \lambda = 1,\ p = \ldots\)
            marks:
              - code: M1
                note: Equates their vector product, with a component in \(p\), to a multiple of the given vector, or equates ratios of components, and solves for \(p\).
          - scheme: |
              \(p = 2\)
            marks:
              - code: A1
                note: cso.
      - part: c
        rows:
          - scheme: |
              \(\overrightarrow{OA}\times\overrightarrow{OB} = 2\mathbf{i} - 2\mathbf{j} + (3-p)\mathbf{k}\)
              \(\tfrac12\sqrt{2^2 + (-2)^2 + (3-p)^2} = \tfrac32\)
            marks:
              - code: M1
                note: Sets half the magnitude of a vector product of two sides, in terms of \(p\), equal to \(\frac32\). Condone slips in the vector product; needs the \(\frac12\).
              - code: A1
                note: Any correct equation in \(p\) alone.
          - scheme: |
              \((3-p)^2 = 1 \Rightarrow p = 2\) or \(p = 4\)
            marks:
              - code: A1
  - q: 4
    stamp: 9512ed9f
    parts:
      - part: a
        rows:
          - scheme: |
              \(\mathbf p\times\mathbf q = \mathbf i(1 - 0) - \mathbf j(1 - 2x)\)
              \(\phantom{\mathbf p\times\mathbf q =} + \mathbf k(0 - x)\)
            marks:
              - code: M1
                note: Attempts \(\mathbf p\times\mathbf q\) by determinant or component formula, giving three components in terms of \(x\). Condone sign slips.
          - scheme: |
              \(\phantom{\mathbf p\times\mathbf q} = \mathbf i + (2x - 1)\mathbf j - x\mathbf k\)
            marks:
              - code: A1
                note: oe, as a column vector.
          - scheme: |
              \(1^2 + (2x - 1)^2 + (-x)^2 = 2\)
              \(\Rightarrow 5x^2 - 4x = 0 \Rightarrow x = \ldots\)
            marks:
              - code: M1
                note: Equates the squared magnitude of their \(\mathbf p\times\mathbf q\) to 2, or its magnitude to \(\sqrt2\), and solves for \(x\) by any means.
          - scheme: |
              \(x = 0\) or \(x = \frac45\)
            marks:
              - code: A1
                note: Both values; 0.8 accepted.
          - scheme: |
              \(1 + 3(2x - 1) - mx = 0\ [\Rightarrow x(6 - m) = 2]\)
            marks:
              - code: M1
                note: Sets the scalar product of their \(\mathbf p\times\mathbf q\) with \(\mathbf i + 3\mathbf j + m\mathbf k\) equal to zero. Need not be simplified.
          - scheme: |
              \(x \neq 0\), so \(x = \frac45\), \(m = \frac72\)
            marks:
              - code: A1
                note: Both values, oe such as 0.8 and 3.5. A0 if \(x = 0\) is retained as a solution.
      - part: b
        rows:
          - scheme: |
              \(|\mathbf p| = \sqrt6\), \(|\mathbf q| = \frac{\sqrt{41}}{5}\)
            marks:
              - code: B1
                note: Both, with \(x = \frac45\); oe such as \(\sqrt{1.64}\).
          - scheme: |
              \(\sqrt2 = \sqrt6 \times \frac{\sqrt{41}}{5}\sin\theta \Rightarrow \theta = \ldots\)
            marks:
              - code: M1
                note: Uses \(|\mathbf p\times\mathbf q| = |\mathbf p||\mathbf q|\sin\theta\) with \(\sqrt2\) and their magnitudes to find \(\theta\). A scalar-product method scores M0 A0.
          - scheme: |
              \(\theta = 26.8^\circ\)
            marks:
              - code: A1
                note: awrt \(26.8^\circ\) or 0.468 radians, or \(\sin^{-1}\frac{5}{\sqrt{123}}\) oe.
  - q: 5
    stamp: 90190a15
    parts:
      - part: a
        rows:
          - scheme: |
              \(\overrightarrow{OR} = 2\overrightarrow{OM} - \overrightarrow{OP} \Rightarrow R(0, 1, 3)\)
              \(\overrightarrow{PR} = -2\mathbf i + 2\mathbf j + 2\mathbf k\)
            marks:
              - code: B1
                note: Correct \(R\) or \(\overrightarrow{PR}\), soi.
          - scheme: |
              \(\overrightarrow{PQ}\times\overrightarrow{PR} = (\mathbf i + 2\mathbf j)\times(-2\mathbf i + 2\mathbf j + 2\mathbf k)\)
            marks:
              - code: M1
                note: Expands the vector product of two side vectors of the triangle, using their \(R\). Condone one slip in a component.
          - scheme: |
              \(\phantom{\overrightarrow{PQ}\times\overrightarrow{PR}} = 4\mathbf i - 2\mathbf j + 6\mathbf k\)
            marks:
              - code: A1
                note: Or its negative.
          - scheme: |
              \(\text{Area} = \tfrac12\sqrt{4^2 + (-2)^2 + 6^2}\)
            marks:
              - code: dM1
                note: Takes half the magnitude of their vector product.
          - scheme: |
              \(\phantom{\text{Area}} = \tfrac12\sqrt{56} = \sqrt{14}\)
            marks:
              - code: A1 AG
                note: Correct vector product and magnitude leading without error to \(\sqrt{14}\).
      - part: b
        rows:
          - scheme: |
              \(\mathbf n = 2\mathbf i - \mathbf j + 3\mathbf k\)
              \(k = (2\mathbf i - \mathbf j + \mathbf k)\cdot(2\mathbf i - \mathbf j + 3\mathbf k) = \ldots\)
            marks:
              - code: M1
                note: Uses their vector product from (a), or a multiple, as \(\mathbf n\), and finds its scalar product with the position vector of \(P\), \(Q\) or \(R\).
          - scheme: |
              \(\mathbf r\cdot(2\mathbf i - \mathbf j + 3\mathbf k) = 8\)
            marks:
              - code: A1
                note: Or any multiple, such as \(\mathbf r\cdot(4\mathbf i - 2\mathbf j + 6\mathbf k) = 16\). A Cartesian equation alone scores A0.
      - part: c
        rows:
          - scheme: |
              \(\text{distance} = \dfrac{8}{\sqrt{2^2 + (-1)^2 + 3^2}}\)
            marks:
              - code: M1
                note: Divides \(|k|\) by \(|\mathbf n|\), both from their plane equation in (b).
          - scheme: |
              \(\phantom{\text{distance}} = \frac{8}{\sqrt{14}} = \frac{4\sqrt{14}}{7}\)
            marks:
              - code: A1
                note: Either form, or any exact equivalent.
  - q: 6
    stamp: d0938e53
    parts:
      - part: a
        rows:
          - scheme: |
              \(\mathbf p\times\mathbf q = 6\mathbf i - 6\mathbf j + 6\mathbf k\)
            marks:
              - code: B1
                note: Or any nonzero multiple of \(\mathbf i - \mathbf j + \mathbf k\).
          - scheme: |
              \(t\mathbf i - \mathbf j + \mathbf k = \lambda\left(\their{\mathbf i - \mathbf j + \mathbf k}\right)\)
              \(\Rightarrow \lambda = 1,\ t = \ldots\)
            marks:
              - code: M1
                note: Sets \(\mathbf r\) as a multiple of their normal vector and compares components, or sets \(\mathbf r \times\) their normal \(= \mathbf 0\), to find \(t\).
          - scheme: |
              \(t = 1\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \((\mathbf p\times\mathbf q)\cdot\mathbf r\)
              \(\phantom{(\mathbf p} = \their{(6\mathbf i - 6\mathbf j + 6\mathbf k)}\cdot(t\mathbf i - \mathbf j + \mathbf k)\)
            marks:
              - code: M1
                note: Forms the scalar product of their vector \(\mathbf p\times\mathbf q\) with \(\mathbf r\), or the determinant with rows \(\mathbf p\), \(\mathbf q\), \(\mathbf r\) in any order.
          - scheme: |
              \(\phantom{(\mathbf p} = 6(t + 2)\)
            marks:
              - code: A1
                note: \(\pm 6(t+2)\) oe, the sign depending on the order.
          - scheme: |
              \(\tfrac16\left|\their{6(t+2)}\right| = 9 \Rightarrow t + 2 = \pm 9\)
              \(\Rightarrow t = \ldots\)
            marks:
              - code: M1
                note: Sets \(\frac16\) of their triple product, or its modulus, equal to 9 or \(\pm 9\) and solves for \(t\). Needs the \(\frac16\).
          - scheme: |
              \(t = 7\) or \(t = -11\)
            marks:
              - code: A1
                note: Both values and no others.
  - q: 7
    stamp: d3d4209b
    parts:
