questions:
  - q: 1
    stamp: 2599992e
    parts:
      - part: ''
        rows:
          - scheme: |
              \((3-\lambda)(-2-\lambda)-2k=0\)
              \(\lambda=4 \Rightarrow 6-2k=0\)
            marks:
              - code: M1
                note: Forms \(\det(\mathbf{A}-\lambda\mathbf{I})=0\) with \(\lambda=4\) substituted at any stage, or uses \(\mathbf{A}\mathbf{v}=4\mathbf{v}\), to reach an equation in \(k\). Condone sign slips.
          - scheme: |
              \(k=3\)
            marks:
              - code: A1
          - scheme: |
              \(\lambda^2-\lambda-12=0 \Rightarrow \lambda=\ldots\)
            marks:
              - code: M1
                note: Solves the characteristic equation with their \(k\) by any means, calculator allowed, or uses sum of eigenvalues \(=\) trace.
          - scheme: |
              \(\lambda=-3\)
            marks:
              - code: A1
          - scheme: |
              \(\lambda=4\): \(\begin{pmatrix}-1 & \their{3}\\ 2 & -6\end{pmatrix}\begin{pmatrix}x\\y\end{pmatrix}=\mathbf{0} \Rightarrow x=3y\)
              \(\lambda=-3\): \(\begin{pmatrix}6 & \their{3}\\ 2 & 1\end{pmatrix}\begin{pmatrix}x\\y\end{pmatrix}=\mathbf{0} \Rightarrow y=-2x\)
            marks:
              - code: M1
                note: Forms \((\mathbf{A}-\lambda\mathbf{I})\mathbf{v}=\mathbf{0}\) or \(\mathbf{A}\mathbf{v}=\lambda\mathbf{v}\) with their \(k\) and one of their eigenvalues, reaching a relation between \(x\) and \(y\).
          - scheme: |
              \(\begin{pmatrix}3\\1\end{pmatrix}\) for \(\lambda=4\), \(\begin{pmatrix}1\\-2\end{pmatrix}\) for \(\lambda=-3\)
            marks:
              - code: A1
                note: Any non-zero multiples, each matched to its eigenvalue.
  - q: 2
    stamp: dc9efcb3
    parts:
      - part: a
        rows:
          - scheme: |
              \(\lambda = 1,\ \lambda = -1\)
            marks:
              - code: B1
                note: Both values, and no others.
      - part: b
        rows:
          - scheme: |
              \((a-\lambda)(b-\lambda) - 0.6^2 = 0\)
            marks:
              - code: M1
                note: Forms \(\det(\mathbf{M}-\lambda\mathbf{I}) = 0\) in \(a\), \(b\), \(\lambda\). Condone sign slips; need not be expanded.
          - scheme: |
              \(\lambda^2 - (a+b)\lambda + ab - 0.36 \equiv \lambda^2 - 1\)
              \(\Rightarrow a + b = 0,\ ab = -0.64 \Rightarrow a = \ldots\)
            marks:
              - code: dM1
                note: Uses their eigenvalues, by comparing coefficients or substituting \(\lambda = \pm1\), to form two equations in \(a\), \(b\), and solves them simultaneously.
          - scheme: |
              \(a = 0.8,\ b = -0.8\)
            marks:
              - code: A1
                note: Both, oe. A0 if \(a = -0.8\), \(b = 0.8\) is not rejected.
      - part: c
        rows:
          - scheme: |
              \(\begin{pmatrix}\their{-0.2} & 0.6\\ 0.6 & \their{-1.8}\end{pmatrix}\begin{pmatrix}x\\y\end{pmatrix} = \begin{pmatrix}0\\0\end{pmatrix}\)
              \(\Rightarrow -0.2x + 0.6y = 0\)
            marks:
              - code: M1
                note: Forms \((\mathbf{M}-\mathbf{I})\mathbf{v} = \mathbf{0}\) or \(\mathbf{M}\mathbf{v} = \mathbf{v}\) with their numerical \(a\), \(b\), reaching a relation between \(x\) and \(y\); or takes the perpendicular to an eigenvector for \(-1\).
          - scheme: |
              \(y = \tfrac13 x\)
            marks:
              - code: A1
                note: Any equivalent equation, such as \(x = 3y\). A direction vector alone scores A0.
  - q: 3
    stamp: 422ddd27
    parts:
      - part: a
        rows:
          - scheme: |
              \((2-\lambda)(5-\lambda)-k^2=0\), \(\lambda=1\):
              \(4-k^2=0 \Rightarrow k=\ldots\)
            marks:
              - code: M1
                note: Substitutes \(\lambda=1\) into \(\det(\mathbf{M}-\lambda\mathbf{I})=0\) and reaches an equation in \(k\). Condone sign slips.
          - scheme: |
              \(k=-2\)
            marks:
              - code: A1
                note: \(k=-2\) only; A0 for \(k=\pm2\) without selecting.
          - scheme: |
              \(\lambda^2-7\lambda+6=0 \Rightarrow \lambda=\ldots\)
            marks:
              - code: M1
                note: 'Obtains the other eigenvalue using their \(k\): solves their characteristic quadratic by any means, or uses the trace or determinant.'
          - scheme: |
              \(\lambda=6\)
            marks:
              - code: A1
          - scheme: |
              \((\mathbf{M}-\lambda\mathbf{I})\begin{pmatrix}x\\y\end{pmatrix}=\mathbf{0}\)
              \(\lambda=1\): \(x-2y=0\); \(\lambda=6\): \(2x+y=0\)
            marks:
              - code: M1
                note: Forms \((\mathbf{M}-\lambda\mathbf{I})\mathbf{v}=\mathbf{0}\) or \(\mathbf{M}\mathbf{v}=\lambda\mathbf{v}\) with their \(k\) and either eigenvalue, reaching a relation between \(x\) and \(y\).
          - scheme: |
              \(\begin{pmatrix}2\\1\end{pmatrix}\), \(\begin{pmatrix}1\\-2\end{pmatrix}\)
            marks:
              - code: A1
                note: Both correct, each any non-zero multiple, matched to its eigenvalue.
      - part: b.i
        rows:
          - scheme: |
              \(\their{\begin{pmatrix}2\\1\end{pmatrix}}\cdot\their{\begin{pmatrix}1\\-2\end{pmatrix}}=\ldots\)
            marks:
              - code: M1
                note: Forms the scalar product of their two eigenvectors, or the product of the gradients of the two invariant lines.
          - scheme: |
              \(=2-2=0\), so the invariant lines are perpendicular
            marks:
              - code: A1
                note: Scalar product 0, or gradient product \(-1\), with the conclusion that the lines are perpendicular.
      - part: b.ii
        rows:
          - scheme: |
              One-way stretch
            marks:
              - code: B1
                note: '``Stretch'''' alone accepted.'
          - scheme: |
              scale factor 6, parallel to \(y=-2x\)
            marks:
              - code: B1
                note: Direction may be given as \(\begin{pmatrix}1\\-2\end{pmatrix}\) or as perpendicular to \(y=\frac12x\).
          - scheme: |
              line of invariant points \(y=\frac12 x\)
            marks:
              - code: B1
                note: Any equivalent equation, such as \(x=2y\).
  - q: 4
    stamp: e13c1ff3
    parts:
      - part: a
        rows:
          - scheme: |
              \(\mathbf{P}=\begin{pmatrix} 1 & 0 & 1 \\ 0 & 1 & 1 \\ 1 & 1 & 1 \end{pmatrix},\ \mathbf{D}=\begin{pmatrix} 2 & 0 & 0 \\ 0 & -1 & 0 \\ 0 & 0 & 1 \end{pmatrix}\)
            marks:
              - code: B1
                note: Eigenvectors in any order as columns, or nonzero multiples of them, with eigenvalues on the diagonal of \(\mathbf{D}\) in the same order.
          - scheme: |
              \(\mathbf{P}^{-1}=\frac{1}{\det\mathbf{P}}\operatorname{adj}\mathbf{P}=\ldots\)
              \(\left[=\begin{pmatrix} 0 & -1 & 1 \\ -1 & 0 & 1 \\ 1 & 1 & -1 \end{pmatrix}\right]\)
            marks:
              - code: M1
                note: Finds \(\mathbf{P}^{-1}\) for their \(\mathbf{P}\) by cofactors, row reduction or calculator. Condone one slip in a cofactor or sign.
          - scheme: |
              \(\mathbf{A}=\mathbf{P}\mathbf{D}\their{\mathbf{P}^{-1}}\)
              \(\phantom{\mathbf{A}}=\begin{pmatrix} 2 & 0 & 1 \\ 0 & -1 & 1 \\ 2 & -1 & 1 \end{pmatrix}\their{\mathbf{P}^{-1}}=\ldots\)
            marks:
              - code: M1
                note: Multiplies their \(\mathbf{P}\), \(\mathbf{D}\) and \(\mathbf{P}^{-1}\) in that order to a \(3\times3\) matrix. Condone arithmetic slips.
          - scheme: |
              \(\mathbf{A}=\begin{pmatrix} 1 & -1 & 1 \\ 2 & 1 & -2 \\ 2 & -1 & 0 \end{pmatrix}\)
            marks:
              - code: A1
                note: cao. A correct \(\mathbf{A}\) without \(\mathbf{P}^{-1}\) and the product \(\mathbf{P}\mathbf{D}\mathbf{P}^{-1}\) seen scores B1 only.
      - part: b
        rows:
          - scheme: |
              \(\mathbf{A}^4=\mathbf{P}\mathbf{D}^4\their{\mathbf{P}^{-1}}\)
              \(\phantom{\mathbf{A}^4}=\begin{pmatrix} 16 & 0 & 1 \\ 0 & 1 & 1 \\ 16 & 1 & 1 \end{pmatrix}\their{\mathbf{P}^{-1}}=\ldots\)
            marks:
              - code: M1
                note: Uses \(\mathbf{A}^4=\mathbf{P}\mathbf{D}^4\mathbf{P}^{-1}\) with their matrices, or multiplies their \(\mathbf{A}\) from (a), including repeated squaring. Condone arithmetic slips.
          - scheme: |
              \(\mathbf{A}^4=\begin{pmatrix} 1 & -15 & 15 \\ 0 & 1 & 0 \\ 0 & -15 & 16 \end{pmatrix}\)
            marks:
              - code: A1
                note: cao.
  - q: 5
    stamp: 67c0cfe0
    parts:
      - part: a.i
        rows:
          - scheme: |
              \(\mathbf{M}\mathbf{v}_1 = \begin{pmatrix}2\\a+10\\2b-8\end{pmatrix} = \lambda_1\begin{pmatrix}1\\2\\0\end{pmatrix}\)
              \(\Rightarrow \lambda_1 = 2\)
            marks:
              - code: B1
      - part: a.ii
        rows:
          - scheme: |
              \(a + 10 = 2 \times \their{2},\quad 2b - 8 = 0\)
              \(\Rightarrow a = \ldots,\ b = \ldots\)
            marks:
              - code: M1
                note: Equates at least one of the second and third components of \(\mathbf{M}\mathbf{v}_1\) with that of their \(\lambda_1\mathbf{v}_1\) and solves. Condone a slip in the product.
          - scheme: |
              \(a = -6,\quad b = 4\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \(\mathbf{M}\mathbf{v}_2 = \begin{pmatrix}4 & -1 & 1\\-6 & 5 & -6\\-8 & 4 & -5\end{pmatrix}\begin{pmatrix}0\\1\\1\end{pmatrix}\)
              \(\phantom{\mathbf{M}\mathbf{v}_2} = \ldots\)
            marks:
              - code: M1
                note: Multiplies \(\mathbf{M}\), with their \(a\) and \(b\), by \(\mathbf{v}_2\); or uses the trace or determinant with their other eigenvalues. Condone one slip.
          - scheme: |
              \(\mathbf{M}\mathbf{v}_2 = \begin{pmatrix}0\\-1\\-1\end{pmatrix} \Rightarrow \lambda_2 = -1\)
            marks:
              - code: A1
          - scheme: |
              \(\begin{pmatrix}1 & -1 & 1\\-6 & 2 & -6\\-8 & 4 & -8\end{pmatrix}\begin{pmatrix}x\\y\\z\end{pmatrix} = \mathbf{0}\)
              \(\Rightarrow x - y + z = 0,\ -6x + 2y - 6z = 0\)
              \(\Rightarrow x : y : z = \ldots\)
            marks:
              - code: M1
                note: Forms \((\mathbf{M}-3\mathbf{I})\mathbf{v} = \mathbf{0}\) or \(\mathbf{M}\mathbf{v} = 3\mathbf{v}\) with their \(a\), \(b\) and solves two equations for the component ratios, or takes a vector product of two rows. Condone one slip.
          - scheme: |
              \(\mathbf{v}_3 = \begin{pmatrix}1\\0\\-1\end{pmatrix}\)
            marks:
              - code: A1
                note: Any nonzero multiple.
      - part: c
        rows:
          - scheme: |
              \(\mathbf{U} = \begin{pmatrix}1 & 0 & 1\\2 & 1 & 0\\0 & 1 & -1\end{pmatrix}\)
              \(\mathbf{D} = \begin{pmatrix}2 & 0 & 0\\0 & -1 & 0\\0 & 0 & 3\end{pmatrix}\)
            marks:
              - code: B1
                note: Columns of \(\mathbf{U}\) nonzero multiples of the three correct eigenvectors in any order, with the eigenvalues in \(\mathbf{D}\) in matching order.
          - scheme: |
              \(\det\mathbf{U} = 1(-1) - 0 + 1(2) \ [= 1]\)
              \(\mathbf{U}^{-1} = \frac{1}{\det\mathbf{U}}\,\mathrm{adj}\,\mathbf{U} = \ldots\)
            marks:
              - code: M1
                note: Attempts the inverse of their \(3 \times 3\) \(\mathbf{U}\), e.g. determinant with matrix of cofactors transposed, or row reduction. Condone one slip; calculator inverse accepted.
          - scheme: |
              \(\mathbf{U}^{-1} = \begin{pmatrix}-1 & 1 & -1\\2 & -1 & 2\\2 & -1 & 1\end{pmatrix}\)
            marks:
              - code: A1
                note: Correct inverse of their correct \(\mathbf{U}\), whatever its ordering or scaling.
  - q: 6
    stamp: 1d540234
    parts:
      - part: a
        rows:
          - scheme: |
              \(\det(\mathbf{M}+2\mathbf{I}) = \begin{vmatrix}3&-2&2\\-2&4&0\\2&0&2\end{vmatrix}\)
              \(\phantom{\det(\mathbf{M}+2\mathbf{I})} = 3(8)+2(-4)+2(-8)\)
            marks:
              - code: M1
                note: Evaluates \(\det(\mathbf{M}+2\mathbf{I})\) by any expansion, or their \(\det(\mathbf{M}-\lambda\mathbf{I})\) at \(\lambda=-2\), or shows \(\mathbf{Mv}=-2\mathbf{v}\) for a nonzero \(\mathbf{v}\).
          - scheme: |
              \(= 0\), so \(-2\) is an eigenvalue
            marks:
              - code: A1
                note: cso, with a conclusion. A0 if the conclusion is missing.
          - scheme: |
              \(-2x+4y=0,\ 2x+2z=0 \Rightarrow \ldots\)
            marks:
              - code: M1
                note: Forms at least two equations from \((\mathbf{M}+2\mathbf{I})\mathbf{v}=\mathbf{0}\) or \(\mathbf{Mv}=-2\mathbf{v}\) and solves for a nonzero vector.
          - scheme: |
              \(\begin{pmatrix}2\\1\\-2\end{pmatrix}\)
            marks:
              - code: A1
                note: Any nonzero multiple.
      - part: b
        rows:
          - scheme: |
              \(\det(\mathbf{M}-\lambda\mathbf{I}) = (1-\lambda)(\lambda^2-2\lambda)\)
              \(\phantom{\det(\mathbf{M}-\lambda\mathbf{I})} +4\lambda-4(2-\lambda)\)
            marks:
              - code: M1
                note: Expands \(\det(\mathbf{M}-\lambda\mathbf{I})\) by any row or column to a cubic in \(\lambda\). Condone sign slips.
          - scheme: |
              \(\lambda^3-3\lambda^2-6\lambda+8=0\)
            marks:
              - code: A1
                note: oe, such as its negative, = 0 may be implied.
          - scheme: |
              \((\lambda+2)(\lambda^2-5\lambda+4)=0 \Rightarrow \lambda=\ldots\)
            marks:
              - code: M1
                note: Obtains a quadratic factor of their cubic using \(\lambda+2\) and solves it. Correct roots from a correct cubic imply the mark.
          - scheme: |
              \(\lambda = 1,\ 4\)
            marks:
              - code: A1
          - scheme: |
              \(\lambda=1\): \(-2y+2z=0,\ -2x+y=0 \Rightarrow \ldots\)
            marks:
              - code: M1
                note: Forms at least two equations from \((\mathbf{M}-\lambda\mathbf{I})\mathbf{v}=\mathbf{0}\) with their eigenvalue in place of 1 and solves for a nonzero vector.
          - scheme: |
              \(\begin{pmatrix}1\\2\\2\end{pmatrix}\)
            marks:
              - code: A1
                note: Any nonzero multiple.
          - scheme: |
              \(\lambda=4\): \(-2x-2y=0,\ 2x-4z=0 \Rightarrow \ldots\)
            marks:
              - code: M1
                note: Forms at least two equations from \((\mathbf{M}-\lambda\mathbf{I})\mathbf{v}=\mathbf{0}\) with their eigenvalue in place of 4 and solves for a nonzero vector.
          - scheme: |
              \(\begin{pmatrix}2\\-2\\1\end{pmatrix}\)
            marks:
              - code: A1
                note: Any nonzero multiple.
          - scheme: |
              Divides each by its length:
              \(\sqrt{4+1+4} = \sqrt{1+4+4} = \sqrt{4+4+1} = 3\)
            marks:
              - code: M1
                note: Divides each of their three eigenvectors by its magnitude \(\sqrt{x^2+y^2+z^2}\).
          - scheme: |
              \(\mathbf{U}=\dfrac{1}{3}\begin{pmatrix} 2 & 1 & 2 \\ 1 & 2 & -2 \\ -2 & 2 & 1 \end{pmatrix}\)
            marks:
              - code: A1
                note: Columns in any order, any column negated; decimals awrt 3 s.f. accepted.
          - scheme: |
              \(\mathbf{D}=\begin{pmatrix} -2 & 0 & 0 \\ 0 & 1 & 0 \\ 0 & 0 & 4 \end{pmatrix}\)
            marks:
              - code: B1
                note: Diagonal entries \(-2\), 1, 4 ordered to match the eigenvectors in their \(\mathbf{U}\); zeros elsewhere.
  - q: 7
    stamp: 77bbf95f
    parts:
      - part: a
        rows:
          - scheme: |
              \(\left(\tfrac38-\lambda\right)^2-\tfrac{5}{16}\times\tfrac54=0\)
              \(\Rightarrow 4\lambda^2-3\lambda-1=0 \Rightarrow \lambda=\ldots\)
            marks:
              - code: M1
                note: Forms \(\det(\mathbf{A}-\lambda\mathbf{I})=0\) as a quadratic and solves it by any means, calculator allowed. Condone sign slips in forming it.
          - scheme: |
              \(\lambda=1,\ \lambda=-\tfrac14\)
            marks:
              - code: A1
          - scheme: |
              \(\lambda=1\): \(-\tfrac58x+\tfrac{5}{16}y=0 \Rightarrow y=\ldots\)
            marks:
              - code: M1
                note: Uses \((\mathbf{A}-\lambda\mathbf{I})\mathbf{v}=\mathbf{0}\) or \(\mathbf{A}\mathbf{v}=\lambda\mathbf{v}\) with one of their eigenvalues to obtain a relation between \(x\) and \(y\).
          - scheme: |
              \(\begin{pmatrix}1\\2\end{pmatrix}\)
            marks:
              - code: A1
                note: Any nonzero multiple, paired with \(\lambda=1\).
          - scheme: |
              \(\lambda=-\tfrac14\): \(\tfrac58x+\tfrac{5}{16}y=0 \Rightarrow \begin{pmatrix}1\\-2\end{pmatrix}\)
            marks:
              - code: A1
                note: Any nonzero multiple, paired with \(\lambda=-\frac14\).
      - part: b
        rows:
          - scheme: |
              \(\mathbf{P}=\begin{pmatrix}1&1\\2&-2\end{pmatrix},\ \mathbf{D}=\begin{pmatrix}1&0\\0&-\frac14\end{pmatrix}\)
            marks:
              - code: B1ft
                note: ft their eigenvalues and eigenvectors, with the columns of \(\mathbf{P}\) in the same order as the eigenvalues in \(\mathbf{D}\).
      - part: c
        rows:
          - scheme: |
              \(\mathbf{A}^n=\mathbf{P}\mathbf{D}^n\mathbf{P}^{-1}\), \(\mathbf{D}^n=\begin{pmatrix}1&0\\0&\left(-\frac14\right)^n\end{pmatrix}\)
            marks:
              - code: M1
                note: Uses \(\mathbf{A}^n=\mathbf{P}\mathbf{D}^n\mathbf{P}^{-1}\) with their \(\mathbf{P}\) and \(\mathbf{D}\), raising the diagonal entries of \(\mathbf{D}\) to the power \(n\).
          - scheme: |
              \(\mathbf{P}^{-1}=-\tfrac14\begin{pmatrix}-2&-1\\-2&1\end{pmatrix}\)
              \(\mathbf{A}^n=\their{\mathbf{P}}\mathbf{D}^n\their{\mathbf{P}^{-1}}=\ldots\)
            marks:
              - code: dM1
                note: Finds their \(\mathbf{P}^{-1}\) by any method and multiplies the three matrices in the correct order to a single matrix. Condone arithmetic slips.
          - scheme: |
              \(\mathbf{A}^n=\begin{pmatrix}\frac12+\frac12\left(-\frac14\right)^n&\frac14-\frac14\left(-\frac14\right)^n\\1-\left(-\frac14\right)^n&\frac12+\frac12\left(-\frac14\right)^n\end{pmatrix}\)
            marks:
              - code: A1
                note: oe, such as \((-1)^n4^{-n}\) for \(\left(-\frac14\right)^n\).
          - scheme: |
              \(\left|-\tfrac14\right|<1 \Rightarrow \left(-\tfrac14\right)^n\to0\)
            marks:
              - code: E1
                note: States \(\left(-\frac14\right)^n\to0\) because its modulus is less than 1, or oe. Not for ``\(n\) is large'' alone.
          - scheme: |
              \(\mathbf{L}=\begin{pmatrix}\frac12&\frac14\\1&\frac12\end{pmatrix}\)
            marks:
              - code: A1ft
                note: ft their \(\mathbf{A}^n\) with each \(\left(-\frac14\right)^n\) term set to 0.
      - part: d
        rows:
          - scheme: |
              \(\their{\mathbf{L}}\begin{pmatrix}x\\y\end{pmatrix}=\begin{pmatrix}\frac12x+\frac14y\\x+\frac12y\end{pmatrix}\)
            marks:
              - code: M1
                note: Finds the image of a general point \((x,y)\) under their \(\mathbf{L}\), or uses the columns of their \(\mathbf{L}\) as image directions.
          - scheme: |
              \(y=2x\)
            marks:
              - code: A1
                note: oe, such as \(2x-y=0\).
  - q: 8
    stamp: 3f49ac00
    parts:
      - part: a
        rows:
          - scheme: |
              \(\det(\mathbf{A}-\lambda\mathbf{I})\)
              \(= (-4-\lambda)[(-7-\lambda)(16-\lambda)+132]\)
              \(\phantom{=}+13[-6(16-\lambda)+72]\)
              \(\phantom{=}+8[132-12(7+\lambda)]\)
            marks:
              - code: M1
                note: Expands \(\det(\mathbf{A}-\lambda\mathbf{I})\) along any row or column, each of three terms an element times its \(2\times2\) minor, or by Sarrus' rule. Condone sign and arithmetic slips.
          - scheme: |
              \(-\lambda^3+5\lambda^2-2\lambda-8=0\)
              \(\Rightarrow \lambda^3-5\lambda^2+2\lambda+8=0\)
            marks:
              - code: A1
                note: Printed equation from a correct expansion without error; collected steps accepted.
          - scheme: |
              \(\lambda=-1\): \(-1-5-2+8=0\)
              \((\lambda+1)(\lambda^2-6\lambda+8)=0 \Rightarrow \lambda=\ldots\)
            marks:
              - code: M1
                note: Shows a root by substitution and obtains a quadratic factor, by division or comparing coefficients, with an attempt to solve it. Condone coefficient slips.
          - scheme: |
              \(\lambda=-1,\ 2,\ 4\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \(\lambda=-1\): \(-3x-13y+8z=0\), \(-6x-6y+6z=0\)
              \(\Rightarrow x:y:z=\ldots\)
            marks:
              - code: M1
                note: Forms \((\mathbf{A}-\lambda\mathbf{I})\mathbf{v}=\mathbf{0}\) for one of their eigenvalues and solves two equations to a ratio \(x:y:z\), or takes a vector product of two rows. Condone arithmetic slips.
          - scheme: |
              \(\lambda=-1\): \(\begin{pmatrix}1\\1\\2\end{pmatrix}\)
            marks:
              - code: A1
                note: 'Each A1: any nonzero multiple; eigenvectors in any order.'
          - scheme: |
              \(\lambda=2\): \(\begin{pmatrix}1\\2\\4\end{pmatrix}\)
            marks:
              - code: A1
          - scheme: |
              \(\lambda=4\): \(\begin{pmatrix}1\\0\\1\end{pmatrix}\)
            marks:
              - code: A1
          - scheme: |
              \(\mathbf{P}=\begin{pmatrix}1&1&1\\1&2&0\\2&4&1\end{pmatrix}\), \(\mathbf{D}=\begin{pmatrix}-1&0&0\\0&2&0\\0&0&4\end{pmatrix}\)
            marks:
              - code: B1ft
                note: 'ft their eigenvalues and eigenvectors: eigenvectors as the columns of \(\mathbf{P}\), eigenvalues in the same order on the diagonal of \(\mathbf{D}\).'
      - part: c
        rows:
          - scheme: |
              \(\mathbf{A}^n=\mathbf{P}\mathbf{D}^n\mathbf{P}^{-1}\)
              \(\mathbf{D}^n=\begin{pmatrix}(-1)^n&0&0\\0&2^n&0\\0&0&4^n\end{pmatrix}\)
            marks:
              - code: M1
                note: Uses \(\mathbf{A}^n=\mathbf{P}\mathbf{D}^n\mathbf{P}^{-1}\) with their diagonal \(\mathbf{D}\) raised to the power \(n\) entrywise. No proof of the result needed.
          - scheme: |
              \(\mathbf{P}^{-1}=\begin{pmatrix}2&3&-2\\-1&-1&1\\0&-2&1\end{pmatrix}\)
            marks:
              - code: B1
                note: Correct inverse of their valid \(\mathbf{P}\).
          - scheme: |
              \((-1)^n\times2+2^n\times(-1)+4^n\times0\)
              \(\phantom{(}=2(-1)^n-2^n\)
            marks:
              - code: A1 AG
                note: Correct substituted sum of three products from valid \(\mathbf{P}\), \(\mathbf{D}^n\), \(\mathbf{P}^{-1}\), leading without error to \(2(-1)^n-2^n\); full matrix product accepted.
  - q: 9
    stamp: f10b4501
    parts:
      - part: a
        rows:
          - scheme: |
              \(\det(\mathbf{M}-\lambda\mathbf{I})\)
              \(= (3-\lambda)[(3-\lambda)(-2-\lambda)+4]\)
              \(\phantom{=} -4[(-2-\lambda)+1]-4[4-(3-\lambda)]\)
            marks:
              - code: M1
                note: Expands \(\det(\mathbf{M}-\lambda\mathbf{I})\) or \(\det(\lambda\mathbf{I}-\mathbf{M})\) along any row or column, with three terms each a 2\(\times\)2 cofactor. Condone sign slips.
          - scheme: |
              \(= (3-\lambda)(\lambda^2-\lambda-2)-4(-1-\lambda)-4(1+\lambda)\)
            marks:
              - code: A1
                note: Correct expansion, need not be simplified.
          - scheme: |
              \(-\lambda^3+4\lambda^2-\lambda-6=0\)
