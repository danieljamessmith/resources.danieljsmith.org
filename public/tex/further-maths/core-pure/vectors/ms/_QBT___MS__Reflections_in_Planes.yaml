questions:
  - q: 1
    stamp: 52eecf06
    parts:
      - part: ''
        rows:
          - scheme: |
              \(\overrightarrow{CD} = 2\mathbf i + \mathbf j - \mathbf k\), \(\overrightarrow{CE} = \mathbf i + 3\mathbf j\)
              \(\mathbf n = \overrightarrow{CD}\times\overrightarrow{CE} = \ldots\)
            marks:
              - code: M1
                note: Finds two vectors in the plane from the given points and attempts their vector product, or solves \(\mathbf n\cdot\overrightarrow{CD} = \mathbf n\cdot\overrightarrow{CE} = 0\). Condone sign slips.
          - scheme: |
              \(\mathbf n = 3\mathbf i - \mathbf j + 5\mathbf k\)
            marks:
              - code: A1
                note: Any nonzero multiple.
          - scheme: |
              \(d = (\mathbf i - \mathbf j + 2\mathbf k)\cdot\their{(3\mathbf i - \mathbf j + 5\mathbf k)} = \ldots\)
            marks:
              - code: M1
                note: Forms the scalar product of their normal with the position vector of \(C\), \(D\) or \(E\).
          - scheme: |
              \(3x - y + 5z = 14\)
            marks:
              - code: A1
                note: oe, including \(\mathbf r\cdot(3\mathbf i - \mathbf j + 5\mathbf k) = 14\) or any multiple.
          - scheme: |
              \(\mathbf p' = \mathbf p - 2\,\dfrac{\mathbf p\cdot\mathbf n - d}{|\mathbf n|^2}\,\mathbf n\), \(\mathbf p = 4\mathbf i - 2\mathbf j + 7\mathbf k\)
            marks:
              - code: M1
                note: Uses the reflection formula with \(A\) and their plane, or forms the line through \(A\) in the direction of their normal.
          - scheme: |
              \(\mathbf p\cdot\mathbf n - d = 12 + 2 + 35 - 14 \ [= 35]\)
              \(|\mathbf n|^2 = 9 + 1 + 25 \ [= 35]\)
            marks:
              - code: dM1
                note: Evaluates \(\mathbf p\cdot\mathbf n - d\) and \(|\mathbf n|^2\) with their values, or substitutes their line into their plane and solves for the parameter.
          - scheme: |
              \(\mathbf p' = (4\mathbf i - 2\mathbf j + 7\mathbf k)\)
              \(\phantom{\mathbf p' =}\, - 2\left(\tfrac{\their{35}}{\their{35}}\right)(3\mathbf i - \mathbf j + 5\mathbf k)\)
            marks:
              - code: dM1
                note: Subtracts twice their projection term times \(\mathbf n\) from \(\mathbf p\), or uses the foot \(F\) with \(\overrightarrow{OB} = \overrightarrow{OA} + 2\overrightarrow{AF}\) oe.
          - scheme: |
              \(B = (-2, 0, -3)\)
            marks:
              - code: A1
                note: Accept a position vector.
  - q: 2
    stamp: 4186d08e
    parts:
      - part: i
        rows:
          - scheme: |
              \(\mathbf n = \begin{pmatrix}2\\1\\0\end{pmatrix}\times\begin{pmatrix}2\\-1\\1\end{pmatrix} = \ldots\)
            marks:
              - code: M1
                note: Forms the vector product of the two direction vectors, or finds a vector perpendicular to both by any method. Condone sign slips.
          - scheme: |
              \(\mathbf n = \begin{pmatrix}1\\-2\\-4\end{pmatrix}\)
            marks:
              - code: A1
                note: Or any nonzero multiple.
          - scheme: |
              \(p = \begin{pmatrix}1\\-2\\-4\end{pmatrix}\cdot\begin{pmatrix}1\\1\\2\end{pmatrix} = \ldots\)
            marks:
              - code: M1
                note: Forms the scalar product of their normal with a point on \(m\).
          - scheme: |
              \(\mathbf r\cdot\begin{pmatrix}1\\-2\\-4\end{pmatrix} = -9\)
            marks:
              - code: A1
                note: oe, the same multiple of normal and \(p\). Must be in the form \(\mathbf r\cdot\mathbf n = p\); a Cartesian equation alone scores A0.
      - part: ii
        rows:
          - scheme: |
              \(\dfrac{\left|\begin{pmatrix}4\\2\\-3\end{pmatrix}\cdot\begin{pmatrix}1\\-2\\-4\end{pmatrix} - (-9)\right|}{\sqrt{1^2+(-2)^2+(-4)^2}}\)
            marks:
              - code: M1
                note: Uses the point-to-plane distance with a point on \(\ell\) and their plane from (i), or any valid method such as the foot of the perpendicular. Condone sign slips.
          - scheme: |
              \(= \sqrt{21}\)
            marks:
              - code: A1
                note: oe, or awrt 4.58.
      - part: iii
        rows:
          - scheme: |
              \(\begin{pmatrix}2\\-1\\1\end{pmatrix}\cdot\begin{pmatrix}1\\-2\\-4\end{pmatrix} = 0 \Rightarrow\) direction \(\begin{pmatrix}2\\-1\\1\end{pmatrix}\) unchanged
            marks:
              - code: B1
                note: Direction of \(\ell\) or a multiple, justified by \(\mathbf b\cdot\mathbf n = 0\) or \(\ell\) parallel to \(\Pi\), or found from two reflected points.
          - scheme: |
              \(\begin{pmatrix}4\\2\\-3\end{pmatrix} - 2\,\dfrac{\begin{pmatrix}4\\2\\-3\end{pmatrix}\cdot\mathbf n - (-9)}{|\mathbf n|^2}\,\mathbf n\)
            marks:
              - code: M1
                note: Applies the reflection formula to a point of \(\ell\) with their normal, or forms the line through that point along their normal.
          - scheme: |
              \(\begin{pmatrix}4\\2\\-3\end{pmatrix}\cdot\mathbf n - (-9) = 21,\quad |\mathbf n|^2 = 21\)
            marks:
              - code: dM1
                note: Evaluates both quantities, or substitutes that line into their plane and solves for its parameter. Condone sign slips.
          - scheme: |
              \(\begin{pmatrix}4\\2\\-3\end{pmatrix} - 2\begin{pmatrix}1\\-2\\-4\end{pmatrix} = \ldots\ [= (2, 6, 5)]\)
            marks:
              - code: dM1
                note: Subtracts twice their component along the normal, or adds to the point twice its displacement to their foot of the perpendicular.
          - scheme: |
              \(\mathbf r = \begin{pmatrix}2\\6\\5\end{pmatrix} + t\begin{pmatrix}2\\-1\\1\end{pmatrix}\)
            marks:
              - code: A1
                note: oe, any point of the line with any multiple of the direction. Must be an equation \(\mathbf r = \ldots\); the point alone scores A0.
  - q: 3
    stamp: c9708c35
    parts:
      - part: a
        rows:
          - scheme: |
              \(3x - y + 2z = 6\)
              \(3(1 + 2\lambda) - (4 + \lambda) + 2\lambda = 6\)
              \(\phantom{A} \Rightarrow \lambda = \ldots\ [= 1]\)
            marks:
              - code: M1
                note: Forms a Cartesian or scalar-product equation of \(\Pi_1\), substitutes the general point of \(\ell_1\) and solves for \(\lambda\). Condone sign or arithmetic slips.
          - scheme: |
              \((1 + 2\times\their{1},\ 4 + \their{1},\ \their{1})\)
            marks:
              - code: dM1
                note: Substitutes their value of \(\lambda\) into the equation of \(\ell_1\).
          - scheme: |
              \((3, 5, 1)\)
            marks:
              - code: A1
                note: Accept the position vector.
      - part: b
        rows:
          - scheme: |
              Reflects \((1, 4, 0)\) along the normal:
              \(\mathbf p' = \mathbf p - 2\,\frac{\mathbf p\cdot\mathbf n - 6}{|\mathbf n|^2}\,\mathbf n\)
            marks:
              - code: M1
                note: Uses the reflection formula with a point of \(\ell_1\) not on \(\Pi_1\), or forms the line through it along \(\mathbf n\).
          - scheme: |
              \(\mathbf p\cdot\mathbf n - 6 = -7\), \(|\mathbf n|^2 = 14\)
            marks:
              - code: dM1
                note: Evaluates \(\mathbf p\cdot\mathbf n - d\) and \(|\mathbf n|^2\), or solves for the parameter where the line along \(\mathbf n\) meets \(\Pi_1\). Condone arithmetic slips.
          - scheme: |
              \(\mathbf p' = \begin{pmatrix}1\\4\\0\end{pmatrix} - 2\left(\frac{\their{{-7}}}{\their{14}}\right)\begin{pmatrix}3\\-1\\2\end{pmatrix}\)
            marks:
              - code: dM1
                note: Subtracts twice their projection term times \(\mathbf n\), or adds twice the displacement from the point to their foot of the perpendicular.
          - scheme: |
              \(\phantom{\mathbf p'} = \begin{pmatrix}4\\3\\2\end{pmatrix}\)
            marks:
              - code: A1
                note: Correct image, with no incorrect values seen.
          - scheme: |
              \(\mathbf b' = \begin{pmatrix}2\\1\\1\end{pmatrix} - 2\left(\frac{7}{14}\right)\begin{pmatrix}3\\-1\\2\end{pmatrix}\)
            marks:
              - code: M1
                note: Finds the reflected direction of \(\ell_1\) by the formula with no \(d\) term, or as the vector joining their \((3, 5, 1)\) from (a) to their image.
          - scheme: |
              \(\phantom{\mathbf b'} = \begin{pmatrix}-1\\2\\-1\end{pmatrix}\)
              \(\mathbf r = \begin{pmatrix}4\\3\\2\end{pmatrix} + \mu\begin{pmatrix}-1\\2\\-1\end{pmatrix}\)
            marks:
              - code: A1 AG
                note: cso. Correct image and a direction parallel to \((-1, 2, -1)\) reached without error, then the printed equation, showing their image lies on the printed line, or \((4, 3, 2)\) on theirs, if another point was reflected.
        alt:
          title: Fixed point from (a)
          rows:
            - scheme: |
                \(P(3, 5, 1)\) from (a) lies in \(\Pi_1\), so is on \(\ell_2\)
              marks:
                - code: B1
                  note: Stated, or used as a point of \(\ell_2\).
            - scheme: |
                \(\mathbf b' = \mathbf b - 2\,\frac{\mathbf b\cdot\mathbf n}{|\mathbf n|^2}\,\mathbf n\)
              marks:
                - code: M1
                  note: Finds the reflected direction of \(\ell_1\) by the formula with no \(d\) term, or reflects a second point of \(\ell_1\) in \(\Pi_1\).
            - scheme: |
                \(\phantom{\mathbf b'} = \begin{pmatrix}2\\1\\1\end{pmatrix} - 2\left(\frac{7}{14}\right)\begin{pmatrix}3\\-1\\2\end{pmatrix}\)
              marks:
                - code: dM1
                  note: Evaluates \(\mathbf b\cdot\mathbf n\) and \(|\mathbf n|^2\) and subtracts twice the projection, or joins their image point to their point from (a). Condone arithmetic slips.
            - scheme: |
                \(\phantom{\mathbf b'} = \begin{pmatrix}-1\\2\\-1\end{pmatrix}\)
              marks:
                - code: A1
                  note: Or any nonzero multiple, with no incorrect values seen.
            - scheme: |
                \(\mu = 1\): \(\begin{pmatrix}4\\3\\2\end{pmatrix} + \begin{pmatrix}-1\\2\\-1\end{pmatrix} = \begin{pmatrix}3\\5\\1\end{pmatrix}\)
              marks:
                - code: M1
                  note: Substitutes their \((3, 5, 1)\) into the printed equation, finding \(\mu\) and checking all three components; or checks \((4, 3, 2)\) on their line through it.
            - scheme: |
                Same point and same direction, so \(\ell_2\) is the printed line
              marks:
                - code: A1 AG
                  note: cso. Direction parallel to \((-1, 2, -1)\), and \((3, 5, 1)\) on the printed line or \((4, 3, 2)\) on theirs, without error, with a conclusion.
      - part: c
        rows:
          - scheme: |
              \(\mathbf b + \mathbf b' = \begin{pmatrix}2\\1\\1\end{pmatrix} + \begin{pmatrix}-1\\2\\-1\end{pmatrix} = \ldots\)
              through \((3, 5, 1)\)
            marks:
              - code: M1
                note: Finds a direction in both planes, such as \(\mathbf b + \mathbf b'\) or the cross product of the planes' normals, and uses it with a point on both, such as their \((3, 5, 1)\).
          - scheme: |
              \(\mathbf r = \begin{pmatrix}3\\5\\1\end{pmatrix} + t\begin{pmatrix}1\\3\\0\end{pmatrix}\)
            marks:
              - code: A1
                note: oe, with any point on the line and any nonzero multiple of \((1, 3, 0)\).
  - q: 4
    stamp: ac93971f
    parts:
      - part: a
        rows:
          - scheme: |
              \(\overrightarrow{BA} = -\mathbf i - 2\mathbf j - \mathbf k,\ \overrightarrow{BC} = -\mathbf i - \mathbf j + (c-1)\mathbf k\)
              \(\overrightarrow{BA}\times\overrightarrow{BC} = \ldots\)
            marks:
              - code: M1
                note: Forms both vectors and expands their vector product by determinant or components. Condone sign slips in the vectors.
          - scheme: |
              \((1-2c)\mathbf i + c\mathbf j - \mathbf k\)
            marks:
              - code: A1
                note: oe, column vector accepted.
      - part: b
        rows:
          - scheme: |
              \((1-2c)\mathbf i + c\mathbf j - \mathbf k = d\mathbf i + 2\mathbf j - \mathbf k\)
              \(\Rightarrow c = \ldots,\ d = 1 - 2c\)
            marks:
              - code: M1
                note: Equates corresponding components of their vector from (a), in terms of \(c\), and the given vector to find \(c\).
          - scheme: |
              \(c = 2,\ d = 1 - 2(2) = -3\)
            marks:
              - code: A1 AG
                note: \(c = 2\) and \(d = -3\) from a correct (a), with \(c = 2\) substituted into \(d = 1 - 2c\).
      - part: c
        rows:
          - scheme: |
              \(\mathbf n = -3\mathbf i + 2\mathbf j - \mathbf k\)
              \(p = \mathbf i\cdot(-3\mathbf i + 2\mathbf j - \mathbf k) = \ldots\)
            marks:
              - code: M1
                note: Takes a normal parallel to \(-3\mathbf i + 2\mathbf j - \mathbf k\) and forms its scalar product with the position vector of \(A\), \(B\) or \(C\), using \(c = 2\) for \(C\).
          - scheme: |
              \(\mathbf r\cdot(-3\mathbf i + 2\mathbf j - \mathbf k) = -3\)
            marks:
              - code: A1
                note: Or any multiple, such as \(\mathbf r\cdot(3\mathbf i - 2\mathbf j + \mathbf k) = 3\). A Cartesian equation alone scores A0.
      - part: d
        rows:
          - scheme: |
              \(\mathbf s' = \mathbf s - 2\,\frac{\mathbf s\cdot\mathbf n - p}{|\mathbf n|^2}\,\mathbf n\)
            marks:
              - code: M1
                note: Uses a correct reflection formula with \(\mathbf s = 3\mathbf i + \mathbf j + 2\mathbf k\) and their \(\mathbf n\) and \(p\) from (c). If not quoted, implied by correct working.
          - scheme: |
              \(\mathbf s\cdot\mathbf n - p = -9 - (-3) = -6\)
              \(|\mathbf n|^2 = 14\)
            marks:
              - code: dM1
                note: Evaluates both \(\mathbf s\cdot\mathbf n - p\) and \(|\mathbf n|^2\) for their \(\mathbf n\) and \(p\). Condone arithmetic slips.
          - scheme: |
              \(\mathbf s' = \mathbf s - 2\left(\their{{-\tfrac{6}{14}}}\right)\mathbf n\)
              \(\phantom{\mathbf s'} = (3\mathbf i + \mathbf j + 2\mathbf k) + \tfrac67(-3\mathbf i + 2\mathbf j - \mathbf k)\)
            marks:
              - code: dM1
                note: Subtracts from \(\mathbf s\) twice their scalar \(\frac{\mathbf s\cdot\mathbf n - p}{|\mathbf n|^2}\) times their \(\mathbf n\). Need not be simplified.
          - scheme: |
              \(\tfrac37\mathbf i + \tfrac{19}{7}\mathbf j + \tfrac87\mathbf k\)
            marks:
              - code: A1
                note: oe, or awrt \(0.429\mathbf i + 2.71\mathbf j + 1.14\mathbf k\). Column vector accepted.
        alt:
          title: Line through \(S\) normal to \(\Pi\)
          rows:
            - scheme: |
                \(\mathbf r = (3\mathbf i + \mathbf j + 2\mathbf k) + \lambda(-3\mathbf i + 2\mathbf j - \mathbf k)\)
              marks:
                - code: M1
                  note: Forms the line through \(S\) with direction their normal from (c).
            - scheme: |
                \(-3(3-3\lambda) + 2(1+2\lambda) - (2-\lambda) = -3\)
                \(\Rightarrow \lambda = \ldots\ [= \tfrac37]\)
              marks:
                - code: dM1
                  note: Substitutes the general point of their line into their plane equation and solves for \(\lambda\). Condone sign slips.
            - scheme: |
                \(\mathbf s' = \mathbf s + 2\times\their{\tfrac37}\,\mathbf n\)
                \(\phantom{\mathbf s'} = (3\mathbf i + \mathbf j + 2\mathbf k) + \tfrac67(-3\mathbf i + 2\mathbf j - \mathbf k)\)
              marks:
                - code: dM1
                  note: Uses the foot of the perpendicular as the midpoint of \(SS'\), by doubling their \(\lambda\) or by \(\mathbf s' = 2\mathbf m - \mathbf s\) with \(\mathbf m\) the foot.
            - scheme: |
                \(\tfrac37\mathbf i + \tfrac{19}{7}\mathbf j + \tfrac87\mathbf k\)
              marks:
                - code: A1
                  note: oe, or awrt \(0.429\mathbf i + 2.71\mathbf j + 1.14\mathbf k\). Column vector accepted.
  - q: 5
    stamp: b7c787a5
    parts:
      - part: a
        rows:
          - scheme: |
              \(2(1+\lambda) - 2\lambda + (1+3\lambda) = 9\)
              \(\Rightarrow \lambda = \ldots\ [= 2]\)
            marks:
              - code: M1
                note: Substitutes the general point of \(\ell\) into the equation of \(\Pi\), in either form, and solves for \(\lambda\). Condone sign slips.
          - scheme: |
              \(\mathbf r = (\mathbf i+\mathbf k) + \their{2}(\mathbf i+2\mathbf j+3\mathbf k)\)
            marks:
              - code: dM1
                note: Substitutes their \(\lambda\) into the equation of \(\ell\).
          - scheme: |
              \((3, 4, 7)\)
            marks:
              - code: A1
                note: Accept a position vector.
      - part: b
        rows:
          - scheme: |
              \(\mathbf r = 4\mathbf j+\mathbf k + t(2\mathbf i-\mathbf j+\mathbf k)\)
            marks:
              - code: M1
                note: Forms the line through \(A\) along \(2\mathbf i-\mathbf j+\mathbf k\), in any form, or finds \(\overrightarrow{AB}\) and compares it with the normal.
          - scheme: |
              \(2(2t)-(4-t)+(1+t) = 9 \Rightarrow t = \ldots\)
            marks:
              - code: dM1
                note: Substitutes their general point into the equation of \(\Pi\) and solves for the parameter, or checks \((4,2,3)\) in \(2x-y+z=9\).
          - scheme: |
              \(t = 2 \Rightarrow B = (2\times 2,\ 4-2,\ 1+2)\)
              \(\phantom{t = 2 \Rightarrow B} = (4, 2, 3)\)
            marks:
              - code: A1 AG
                note: Correct substituted equation leading without error to \(t=2\) and \((4,2,3)\); or both checks correct, with \(\overrightarrow{AB} = 2(2\mathbf i-\mathbf j+\mathbf k)\) and a conclusion.
      - part: c
        rows:
          - scheme: |
              \(\mathbf p' = (4\mathbf j+\mathbf k) - 2\,\frac{-3-9}{6}(2\mathbf i-\mathbf j+\mathbf k)\)
            marks:
              - code: M1
                note: Uses \(\mathbf p - 2\frac{\mathbf p\cdot\mathbf n - d}{|\mathbf n|^2}\mathbf n\) with \(\mathbf n = 2\mathbf i-\mathbf j+\mathbf k\) and \(d = 9\). Condone slips if quoted; if not, implied by correct values.
          - scheme: |
              \(A' = (8, 0, 5)\)
            marks:
              - code: A1
                note: Accept a position vector.
        alt:
          title: Using \(B\) as the midpoint
          rows:
            - scheme: |
                \(\overrightarrow{OA'} = \overrightarrow{OA} + 2\overrightarrow{AB}\)
                \(\phantom{\overrightarrow{OA'}} = 4\mathbf j+\mathbf k + 2(4\mathbf i-2\mathbf j+2\mathbf k)\)
              marks:
                - code: M1
                  note: Uses \(B\) as the midpoint of \(AA'\), by \(\overrightarrow{OA} + 2\overrightarrow{AB}\), \(2\overrightarrow{OB} - \overrightarrow{OA}\) or \(t = 4\) in the line from (b).
            - scheme: |
                \(A' = (8, 0, 5)\)
              marks:
                - code: A1
                  note: Accept a position vector.
      - part: d
        rows:
          - scheme: |
              \((3, 4, 7)\) lies in \(\Pi\), so is on the reflected line
            marks:
              - code: B1
                note: Stated, or used as a point of the reflected line.
          - scheme: |
              Reflects the direction of \(\ell\):
              \(\mathbf u' = \mathbf u - 2\,\frac{\mathbf u\cdot\mathbf n}{|\mathbf n|^2}\,\mathbf n\)
            marks:
              - code: M1
                note: Finds the reflection of \(\mathbf u = \mathbf i+2\mathbf j+3\mathbf k\) using \(\mathbf n\), by the formula with no constant term, or reflects a second point of \(\ell\) in \(\Pi\).
          - scheme: |
              \(\mathbf u' = (\mathbf i+2\mathbf j+3\mathbf k) - 2\left(\tfrac36\right)(2\mathbf i-\mathbf j+\mathbf k)\)
            marks:
              - code: dM1
                note: Evaluates \(\mathbf u\cdot\mathbf n\) and \(|\mathbf n|^2\) and subtracts twice the projection, or joins the image point to their point from (a). Condone arithmetic slips.
          - scheme: |
              \(\mathbf u' = -\mathbf i+3\mathbf j+2\mathbf k\)
            marks:
              - code: A1
                note: Or any nonzero multiple.
          - scheme: |
              \(\mathbf r = 3\mathbf i+4\mathbf j+7\mathbf k + \mu(-\mathbf i+3\mathbf j+2\mathbf k)\)
            marks:
              - code: A1ft
                note: ft their point from (a) and their direction; soi by their \(\mathbf r\times\mathbf a = \mathbf b\).
          - scheme: |
              \(\mathbf r\times\mathbf a = \mathbf c\times\mathbf a\), \(\mathbf c = 3\mathbf i+4\mathbf j+7\mathbf k\),
              \(\mathbf a = \their{{-\mathbf i}+3\mathbf j+2\mathbf k}\)
            marks:
              - code: M1
                note: Takes \(\mathbf a\) as their direction and \(\mathbf b\) as the cross product of a point of their line with it. Condone the order of the product.
          - scheme: |
              \((3\mathbf i+4\mathbf j+7\mathbf k)\times(-\mathbf i+3\mathbf j+2\mathbf k)\)
              \(\phantom{(3\mathbf i} = (8-21)\mathbf i - (6+7)\mathbf j + (9+4)\mathbf k\)
            marks:
              - code: dM1
                note: Attempts the cross product of their point and direction, by determinant or components. Condone sign slips.
          - scheme: |
              \(\mathbf r\times(-\mathbf i+3\mathbf j+2\mathbf k) = -13\mathbf i-13\mathbf j+13\mathbf k\)
            marks:
              - code: A1
                note: Or with \(\mathbf a\) and \(\mathbf b\) both multiplied by the same nonzero \(k\). Must be in the form \(\mathbf r\times\mathbf a = \mathbf b\).
  - q: 6
    stamp: 81f84875
    parts:
      - part: a
        rows:
          - scheme: |
              \(\begin{pmatrix}2\\-1\\1\end{pmatrix}\times\begin{pmatrix}1\\1\\0\end{pmatrix} = \ldots\)
            marks:
              - code: M1
                note: Attempts the vector product of the two direction vectors, or solves two scalar products equal to zero, for a normal.
          - scheme: |
              \(\mathbf n = \begin{pmatrix}-1\\1\\3\end{pmatrix}\)
            marks:
              - code: A1
                note: Or any nonzero multiple.
          - scheme: |
              \(-x + y + 3z = -2\)
            marks:
              - code: B1
                note: oe, in vector or Cartesian form.
          - scheme: |
              \(-(4-\lambda) + (1+\lambda) + 3(2+3\lambda) = -2\)
              \(\Rightarrow \lambda = \ldots\)
            marks:
              - code: M1
                note: Substitutes the general point of a line through \(P\) along their normal into their plane equation and solves for the parameter.
          - scheme: |
              \(\lambda = -\frac{5}{11}\)
            marks:
              - code: A1
                note: Or the correct value for a multiple of \(\mathbf n\).
          - scheme: |
              \(\overrightarrow{OQ} = \begin{pmatrix}4\\1\\2\end{pmatrix} - \frac{5}{11}\begin{pmatrix}-1\\1\\3\end{pmatrix}\)
            marks:
              - code: dM1
                note: Substitutes their \(\lambda\) into their line through \(P\).
          - scheme: |
              \(Q\left(\frac{49}{11}, \frac{6}{11}, \frac{7}{11}\right)\)
            marks:
              - code: A1
                note: Or awrt \((4.45, 0.545, 0.636)\). A position vector is accepted.
      - part: b
        rows:
          - scheme: |
              \(\overrightarrow{PQ} = \frac{5}{11}\begin{pmatrix}1\\-1\\-3\end{pmatrix}\), \(\overrightarrow{QR} = \frac{1}{11}\begin{pmatrix}-16\\5\\-7\end{pmatrix}\)
              \(\begin{pmatrix}1\\-1\\-3\end{pmatrix}\times\begin{pmatrix}-16\\5\\-7\end{pmatrix} = \ldots\)
            marks:
              - code: M1
                note: Forms two non-parallel vectors in the plane from \(P\), \(R\), their \(Q\) or \(\mathbf n\), and attempts their vector product.
          - scheme: |
              \(\begin{pmatrix}22\\55\\-11\end{pmatrix} = 11\begin{pmatrix}2\\5\\-1\end{pmatrix}\)
            marks:
              - code: A1
                note: Or any nonzero multiple.
          - scheme: |
              \(2x + 5y - z = 2(4) + 5(1) - 1(2)\)
            marks:
              - code: M1
                note: Uses their normal with \(P\), \(R\) or their \(Q\) to find the constant, in vector or Cartesian form.
          - scheme: |
              \(2x + 5y - z = 11\)
            marks:
              - code: A1
                note: oe Cartesian equation. A vector form alone scores A0.
      - part: c
        rows:
          - scheme: |
              \(R\) lies on \(\Pi\), so is fixed: \(R\) is on \(\ell_3\)
            marks:
              - code: B1
                note: soi by using \(R\) as a point of \(\ell_3\).
