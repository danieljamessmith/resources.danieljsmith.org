questions:
  - q: 1
    stamp: 4ec480b6
    parts:
      - part: a
        rows:
          - scheme: |
              \(p = -1\): \(2(3) - 2(4) = \ldots\), \(1(3) + 2(4) = \ldots\)
            marks:
              - code: M1
                note: Substitutes \(p = -1\) into \(\mathbf{M}\) and multiplies by the column vector \((3, 4)\). Condone one slip in an entry.
          - scheme: |
              \(6 - 8 = -2\), \(3 + 8 = 11 \Rightarrow (-2, 11)\)
            marks:
              - code: A1 AG
                note: Correct matrix and both products leading without error to \((-2, 11)\).
      - part: b
        rows:
          - scheme: |
              \(p = 2\): \(5x - 2y = x\), \(4x - y = y\)
            marks:
              - code: M1
                note: Substitutes \(p = 2\) and sets \(\mathbf{M}\binom{x}{y} = \binom{x}{y}\), forming at least one equation in \(x\) and \(y\). Condone one slip in an entry.
          - scheme: |
              \(4x - 2y = 0 \Rightarrow y = 2x\), gradient \(2\)
            marks:
              - code: A1
  - q: 2
    stamp: b3e82b79
    parts:
      - part: ''
        rows:
          - scheme: |
              \((x,\ mx+c) \mapsto \bigl((1+4m)x+4c,\ (2+3m)x+3c\bigr)\)
              \((2+3m)x+3c = m\bigl((1+4m)x+4c\bigr)+c\)
            marks:
              - code: M1
                note: Substitutes the image of a general point of \(y=mx+c\) into \(y=mx+c\). Condone slips in the matrix product.
          - scheme: |
              \(2+3m = m+4m^2\), \(\ 3c = (4m+1)c\)
            marks:
              - code: M1
                note: Equates coefficients of \(x\) and constant terms in their equation.
              - code: A1
                note: Both equations correct, oe.
          - scheme: |
              \(2m^2-m-1=0 \Rightarrow m = \ldots\)
            marks:
              - code: M1
                note: Solves their three-term quadratic in \(m\) by factorising, formula, completing the square or calculator.
          - scheme: |
              \(m=-\tfrac12\), \(c=0 \Rightarrow y=-\tfrac12x\)
            marks:
              - code: A1
                note: \(y=-\frac12x\) oe, with \(c=0\) found from the constant equation.
  - q: 3
    stamp: 7a892ff7
    parts:
      - part: a
        rows:
          - scheme: |
              \((p+2)(p-1) - (-5)(-2) = 0\)
            marks:
              - code: M1
                note: Forms \(ad - bc\) for \(\mathbf{M}\) in terms of \(p\) and sets it equal to zero. Condone one sign slip.
          - scheme: |
              \(p^2 + p - 12 = 0\)
            marks:
              - code: A1
                note: Correct three-term quadratic oe.
          - scheme: |
              \((p+4)(p-3) = 0 \Rightarrow p = \ldots\)
            marks:
              - code: dM1
                note: Solves their three-term quadratic by factorising with constants multiplying to their constant term, the formula or completing the square; calculator allowed.
          - scheme: |
              \(p = 3\) or \(p = -4\)
            marks:
              - code: A1
                note: Both values, and no others.
      - part: b
        rows:
          - scheme: |
              \(\begin{pmatrix} 5 & -5 \\ -2 & 2 \end{pmatrix}\begin{pmatrix} x \\ mx \end{pmatrix} = \begin{pmatrix} 5x - 5mx \\ -2x + 2mx \end{pmatrix}\)
            marks:
              - code: M1
                note: Applies \(\mathbf{M}\) to a general point of \(y = mx\) and requires the image to satisfy \(y = mx\). Condone slips in the product.
          - scheme: |
              \(-2x + 2mx = m(5x - 5mx)\)
            marks:
              - code: A1
                note: Correct equation oe; \(x\) may already be cancelled.
          - scheme: |
              \(5m^2 - 3m - 2 = 0 \Rightarrow m = \ldots\)
            marks:
              - code: dM1
                note: Rearranges, after cancelling \(x\), to a three-term quadratic in \(m\) and solves it by factorising, the formula or completing the square; calculator allowed.
          - scheme: |
              \(y = x\)
            marks:
              - code: A1
                note: An equation of the line; \(m = 1\) alone is not enough.
          - scheme: |
              \(y = -\frac25 x\)
            marks:
              - code: A1
                note: oe, such as \(2x + 5y = 0\); \(m = -\frac25\) alone is not enough.
  - q: 4
    stamp: c08f1c0d
    parts:
      - part: a
        rows:
          - scheme: |
              A reflection leaves every point on its mirror line unchanged
            marks:
              - code: E1
                note: States that points on the mirror line are unchanged by the reflection. Not for asserting only that a reflection has invariant points.
          - scheme: |
              The line of invariant points is the mirror line
            marks:
              - code: E1
                note: States that it is the mirror line; accept axis or line of reflection.
      - part: b
        rows:
          - scheme: |
              \(\tfrac15(-3x - 4y) = x,\quad \tfrac15(-4x + 3y) = y\)
              \(\Rightarrow 2x + y = 0\)
            marks:
              - code: M1
                note: Equates the image of \((x, y)\) under \(\mathbf{A}\) to \((x, y)\) and forms at least one linear equation in \(x\) and \(y\). Condone sign slips.
          - scheme: |
              \(y = -2x\)
            marks:
              - code: A1
                note: Accept \(y = -2x + 0\). A0 for \(2x + y = 0\) alone.
      - part: c
        rows:
          - scheme: |
              \(P' = \tfrac15(-12 - 28,\ -16 + 21)\ [= (-8, 1)]\)
            marks:
              - code: M1
                note: Multiplies \(\mathbf{A}\) by the position vector of \(P\). Condone one arithmetic slip.
          - scheme: |
              \(\left(\frac{4 + \text{"}{-8}\text{"}}{2},\ \frac{7 + \text{"}1\text{"}}{2}\right)\)
            marks:
              - code: dM1
                note: Finds the midpoint of \(P\) and their image.
          - scheme: |
              \((-2, 4)\)
            marks:
              - code: A1
      - part: d
        rows:
          - scheme: |
              Perpendicular to the mirror line:
              \((-2)\left(-\tfrac2b\right) = -1 \Rightarrow b = \ldots\)
            marks:
              - code: M1
                note: Sets the product of the gradient of the line and their mirror-line gradient equal to \(-1\), oe. Condone a sign slip in \(-\frac2b\).
          - scheme: |
              \(b = -4\)
            marks:
              - code: A1
  - q: 5
    stamp: 8a4a4837
    parts:
      - part: a
        rows:
          - scheme: |
              Reflection in \(y = \frac{x}{\sqrt3}\)
            marks:
              - code: B1
                note: Reflection.
              - code: B1
                note: In \(y = \frac{x}{\sqrt3}\); accept \(y = \frac{\sqrt3}{3}x\), \(y = x\tan 30^\circ\), or the line through the origin at \(30^\circ\) or \(\frac{\pi}{6}\) to the \(x\)-axis.
          - scheme: |
              Stretch parallel to the \(y\)-axis, scale factor 6
            marks:
              - code: B1
                note: Accept in the \(y\)-direction, or with the \(x\)-axis invariant.
          - scheme: |
              Reflection first, then the stretch
            marks:
              - code: B1
                note: Order stated explicitly, with both transformations named.
      - part: b
        rows:
          - scheme: |
              Inverts each factor, in reverse order:
              \(\mathbf{M}^{-1} = \begin{pmatrix}\frac12 & \frac{\sqrt3}{2}\\ \frac{\sqrt3}{2} & -\frac12\end{pmatrix}^{-1}\begin{pmatrix}1 & 0\\ 0 & 6\end{pmatrix}^{-1}\)
            marks:
              - code: M1
                note: Multiplies the inverses of the two factors in reverse order; condone slips in either inverse. Not for the original order.
          - scheme: |
              \(\mathbf{M}^{-1} = \begin{pmatrix}\frac12 & \frac{\sqrt3}{2}\\ \frac{\sqrt3}{2} & -\frac12\end{pmatrix}\begin{pmatrix}1 & 0\\ 0 & \frac16\end{pmatrix}\)
            marks:
              - code: A1
                note: Both inverses evaluated, in this order. A0 for a single multiplied-out matrix.
      - part: c
        rows:
          - scheme: |
              \(\mathbf{M} = \begin{pmatrix}\frac12 & \frac{\sqrt3}{2}\\ 3\sqrt3 & -3\end{pmatrix}\)
            marks:
              - code: B1
          - scheme: |
              \(\text{"}\mathbf{M}\text{"}\begin{pmatrix}1\\ m\end{pmatrix} = k\begin{pmatrix}1\\ m\end{pmatrix}\)
              \(\Rightarrow \frac12 + \frac{\sqrt3}{2}m = k,\ 3\sqrt3 - 3m = km\)
            marks:
              - code: M1
                note: Applies their \(\mathbf{M}\) to \((x, mx)\) or \((1, m)\) and sets the image on \(y = mx\), giving two equations.
          - scheme: |
              \(3\sqrt3 - 3m = m\left(\frac12 + \frac{\sqrt3}{2}m\right)\)
            marks:
              - code: M1
                note: Eliminates \(k\), or substitutes the image into \(y = mx\), to form an equation in \(m\) alone.
          - scheme: |
              \(\sqrt3 m^2 + 7m - 6\sqrt3 = 0\)
            marks:
              - code: A1
                note: oe
          - scheme: |
              \((\sqrt3 m - 2)(m + 3\sqrt3) = 0 \Rightarrow m = \ldots\)
            marks:
              - code: M1
                note: Solves their three-term quadratic by factors whose constants multiply to their constant term, the formula with their values, or completing the square. Calculator allowed.
          - scheme: |
              \(y = \frac{2}{\sqrt3}x,\quad y = -3\sqrt3 x\)
            marks:
              - code: A1
                note: \(y = \frac{2}{\sqrt3}x\) oe, or awrt \(y = 1.15x\). An equation, not \(m\) alone.
              - code: A1
                note: \(y = -3\sqrt3 x\) oe, or awrt \(y = -5.20x\). An equation, not \(m\) alone.
  - q: 6
    stamp: 862d5a51
    parts:
      - part: a
        rows:
          - scheme: |
              \(\begin{pmatrix}2&-1\\ p&0\end{pmatrix}\begin{pmatrix}0\\y\end{pmatrix} = \begin{pmatrix}-y\\0\end{pmatrix}\)
              not on \(x = 0\) for \(y \neq 0\), so not invariant
            marks:
              - code: B1
                note: Image of a general point, or of a specific point other than the origin, with a statement that it is not on \(x = 0\).
          - scheme: |
              \(\begin{pmatrix}2&-1\\ p&0\end{pmatrix}\begin{pmatrix}x\\mx\end{pmatrix} = \begin{pmatrix}(2-m)x\\px\end{pmatrix}\)
              \(\Rightarrow px = m(2-m)x\)
            marks:
              - code: M1
                note: Finds the image of a general point \((x, mx)\) and substitutes it into \(y = mx\). Condone sign slips in the image.
          - scheme: |
              \(\Rightarrow m^2 - 2m + p = 0\)
            marks:
              - code: A1
                note: Correct substituted equation leading without error to the printed result; combined steps accepted.
          - scheme: |
              No invariant lines \(\Leftrightarrow (-2)^2 - 4p < 0\)
            marks:
              - code: M1
                note: Sets the discriminant of the quadratic in \(m\) negative, or completes the square. Condone slips in the discriminant.
          - scheme: |
              \(p > 1\)
            marks:
              - code: A1
                note: Strict inequality, oe in set notation.
      - part: b
        rows:
          - scheme: |
              \(\det\mathbf{M} = p = -3\)
            marks:
              - code: B1
          - scheme: |
              \(m^2 - 2m - 3 = 0 \Rightarrow m = \ldots\)
            marks:
              - code: M1
                note: Substitutes their value of \(p\) into \(m^2 - 2m + p = 0\) and solves the quadratic by any means; a calculator is allowed.
          - scheme: |
              \(y = 3x\) and \(y = -x\)
            marks:
              - code: A1
                note: Both, as equations of lines. Lines not through the origin need not be considered.
  - q: 7
    stamp: 6c92b08d
    parts:
      - part: a
        rows:
          - scheme: |
              \((x, mx) \mapsto \big(x - 4mx,\ 2x - mx\big)\)
            marks:
              - code: M1
                note: Applies \(\mathbf{B}\) to a general point of the line, such as \((x, mx)\) or \((1, m)\), to find its image. Condone one slip.
          - scheme: |
              \(\dfrac{Y}{X} = \dfrac{(2-m)x}{(1-4m)x} \Rightarrow y = \dfrac{2-m}{1-4m}x\)
            marks:
              - code: A1 AG
                note: Correct image coordinates leading without error to the printed equation, by their ratio or by eliminating \(x\).
          - scheme: |
              \(y = \tfrac14x \mapsto x = 0\)
              \(x = 0 \mapsto y = \tfrac14x\)
            marks:
              - code: B1
                note: Both images, oe such as \(4y = x\) or the \(y\)-axis.
      - part: b
        rows:
          - scheme: |
              \(m = \dfrac{2-m}{1-4m}\)
            marks:
              - code: M1
                note: Equates \(m\) to the image gradient from (a).
          - scheme: |
              \(4m^2 - 2m + 2 = 0\)
            marks:
              - code: A1
                note: oe, such as \(2m^2 - m + 1 = 0\).
          - scheme: |
              \((-2)^2 - 4(4)(2) = \ldots\)
            marks:
              - code: M1
                note: Evaluates the discriminant of their three-term quadratic, or completes the square, to test for real roots.
          - scheme: |
              \(-28 < 0 \Rightarrow\) no real \(m\)
              \(y = \tfrac14x\) and \(x = 0\) map to each other,
              so neither is invariant
              No invariant line through the origin, so none
              parallel to one: \(T\) has no invariant lines
            marks:
              - code: A1 AG
                note: Correct negative discriminant, both special lines shown not invariant from (a), and a conclusion citing the parallel-line fact. A0 if either special line is omitted.
  - q: 8
    stamp: 08f9b843
    parts:
      - part: a
        rows:
          - scheme: |
              \(\mathbf{A}^2 = \begin{pmatrix} b^2+(a-3)(2a-1) & (a-3)(b-2) \\ (2a-1)(b-2) & (2a-1)(a-3)+4 \end{pmatrix}\)
            marks:
              - code: M1
                note: Multiplies \(\mathbf{A}\) by itself and sets the result equal to \(\mathbf{I}\), or equates \(\mathbf{A}\) to its inverse by formula. Condone slips in entries.
          - scheme: |
              \(b^2+(a-3)(2a-1) = 1\), \((a-3)(b-2) = 0\)
              \((2a-1)(b-2) = 0\), \((2a-1)(a-3)+4 = 1\)
            marks:
              - code: A1
                note: All four equations correct; need not be simplified.
          - scheme: |
              \(2a^2 - 7a + 6 = 0 \Rightarrow a = \ldots\)
            marks:
              - code: dM1
                note: Forms a three-term quadratic in \(a\) from the bottom-right entry and solves it by any means.
          - scheme: |
              \(a = \frac32\) or \(a = 2\)
            marks:
              - code: A1
                note: Both values, and no others.
          - scheme: |
              \(a \neq 3 \Rightarrow (a-3)(b-2) = 0 \Rightarrow b = 2\)
            marks:
              - code: A1
                note: \(b = 2\) only, from an off-diagonal equation, with \(a - 3\) or \(2a - 1\) shown or stated non-zero for both values of \(a\).
      - part: b
        rows:
          - scheme: |
              \(\begin{pmatrix} 2 & -\frac32 \\ 2 & -2 \end{pmatrix}\begin{pmatrix} x \\ y \end{pmatrix} = \begin{pmatrix} x \\ y \end{pmatrix}\)
            marks:
              - code: M1
                note: Uses \(\mathbf{A}\) with their smaller \(a\) and their \(b\) from (a), sets the image of \((x, y)\) equal to \((x, y)\) and forms two equations.
          - scheme: |
              \(2x - \frac32 y = x \Rightarrow 2x - 3y = 0\)
              \(2x - 2y = y \Rightarrow 2x - 3y = 0\)
              Same equation, so a line: \(2x - 3y = 0\)
            marks:
              - code: A1
                note: Both equations reduced to the same line and stated equivalent, giving \(2x - 3y = 0\) oe, such as \(y = \frac23 x\).
  - q: 9
    stamp: df0f564e
    parts:
      - part: i
        rows:
          - scheme: |
              \(\begin{pmatrix}a&b\\c&d\end{pmatrix}\begin{pmatrix}1\\-1\end{pmatrix} = \begin{pmatrix}2\\0\end{pmatrix}\)
            marks:
              - code: M1
                note: Equates the image of \((1,-1)\) under a general matrix to \((2,0)\), forming equations in the entries. Condone one slip.
          - scheme: |
              \(a - b = 2,\quad c - d = 0\)
            marks:
              - code: A1
                note: Both, oe.
          - scheme: |
              \(|\det\mathbf A| = \frac{24}{4} \Rightarrow |ad - bc| = 6\)
            marks:
              - code: M1
                note: Equates \(\det\mathbf A\) or \(|\det\mathbf A|\) to \(\frac{24}{4}\); \(\det\mathbf A = 6\) alone, or \(-6\) alone, is enough.
          - scheme: |
              \((b + 2)d - bd = \pm 6 \Rightarrow 2d = \pm 6\)
            marks:
              - code: A1
                note: Correct equation in the remaining entries, oe such as \(2c = \pm 6\); one sign alone accepted.
          - scheme: |
              \(\det(\mathbf A - \mathbf I) = (a - 1)(d - 1) - bc = 0\)
            marks:
              - code: M1
                note: Uses \(\det(\mathbf A - \mathbf I) = 0\), or another valid condition for a line of invariant points, with their entries. Condone sign slips.
          - scheme: |
              \(d - b - 1 = 0\)
            marks:
              - code: A1
                note: oe, in any entries.
          - scheme: |
              \(d = 3 \Rightarrow b = \ldots,\ a = \ldots,\ c = \ldots\)
            marks:
              - code: dM1
                note: Solves their three equations together, choosing a sign where needed, to find all four entries.
          - scheme: |
              \(\mathbf A = \begin{pmatrix}4&2\\3&3\end{pmatrix}\)
            marks:
              - code: A1
                note: Or \(\begin{pmatrix}-2&-4\\-3&-3\end{pmatrix}\).
      - part: ii
        rows:
          - scheme: |
              \(\begin{pmatrix}2&1\\2&3\end{pmatrix}\begin{pmatrix}x\\y\end{pmatrix} = \begin{pmatrix}x\\y\end{pmatrix} \Rightarrow 2x + y = x\)
            marks:
              - code: M1
                note: Sets the image of \((x, y)\) under \(\mathbf B\) equal to \((x, y)\) and forms at least one equation. Condone one slip.
          - scheme: |
              \(y = -x\)
            marks:
              - code: A1
                note: oe such as \(x + y = 0\).
      - part: iii
        rows:
          - scheme: |
              \(\begin{pmatrix}2&1\\2&3\end{pmatrix}\begin{pmatrix}x\\2x + c\end{pmatrix} = \ldots\)
            marks:
              - code: M1
                note: Multiplies \(\mathbf B\) by a general point of the line, such as \((t, 2t + c)\). Condone one slip.
          - scheme: |
              \(\phantom{A} = \begin{pmatrix}4x + c\\8x + 3c\end{pmatrix}\)
            marks:
              - code: A1
          - scheme: |
              \(2(4x + c) + c = 8x + 3c\)
              so the image lies on \(y = 2x + c\): invariant
            marks:
              - code: A1 AG
                note: Correct substitution showing the image satisfies \(y = 2x + c\), without error, and a conclusion that the line is invariant.
