  - q: 9
    stamp: c6cca89e
    parts:
      - part: a
        rows:
          - scheme: |
              \(\alpha = 225\)
            marks:
              - code: B1
                note: Or any \(225 + 360n\), such as \(-135\).
      - part: b
        rows:
          - scheme: |
              \(225k = 360n \Rightarrow 5k = 8n \Rightarrow k = \ldots\)
            marks:
              - code: M1
                note: Sets \(k\) times their \(\alpha\) equal to a multiple of 360, or to 360 times an integer, and attempts the least \(k\).
          - scheme: |
              \(k = 8\)
            marks:
              - code: A1
      - part: c
        rows:
          - scheme: |
              \(\mathbf{N} = \begin{pmatrix}-1&0&0\\0&1&0\\0&0&1\end{pmatrix}\)
            marks:
              - code: B1
      - part: d
        rows:
          - scheme: |
              \(\mathbf{N}\mathbf{M}\begin{pmatrix}1\\2\\3\end{pmatrix} = \mathbf{N}\begin{pmatrix}-2\sqrt2\\2\\-\sqrt2\end{pmatrix} = \ldots\)
            marks:
              - code: M1
                note: Multiplies \((1, 2, 3)\) by \(\mathbf{M}\), then by their reflection matrix \(\mathbf{N}\), or by their \(\mathbf{NM}\), in that order. Condone slips.
          - scheme: |
              \(\phantom{\mathbf{N}\mathbf{M}} = \begin{pmatrix}2\sqrt2\\2\\-\sqrt2\end{pmatrix} \Rightarrow B = (2\sqrt2, 2, -\sqrt2)\)
            marks:
              - code: A1 AG
                note: Correct products with \(\mathbf{M}\) and the correct \(\mathbf{N}\), surds simplified, leading without error to the printed coordinates.
      - part: e
        rows:
          - scheme: |
              \(|\overrightarrow{OA}| = \sqrt{14}\), \(|\overrightarrow{OB}| = \sqrt{8 + 4 + 2} = \sqrt{14}\)
            marks:
              - code: B1
          - scheme: |
              \(\cos\angle AOB = \frac{2\sqrt2 + 4 - 3\sqrt2}{\sqrt{14}\sqrt{14}}\)
            marks:
              - code: M1
                note: Divides a three-term scalar product of \(\overrightarrow{OA}\) and \(\overrightarrow{OB}\) by their magnitudes, or uses the cosine rule with their \(|AB|\). Condone slips.
          - scheme: |
              \(\phantom{\cos\angle AOB} = \frac{4 - \sqrt2}{14} \Rightarrow \angle AOB = 79.4^\circ\)
            marks:
              - code: A1 AG
                note: Correct \(\cos\angle AOB = \frac{4-\sqrt2}{14}\) oe, leading without error to \(79.4^\circ\).
      - part: f
        rows:
          - scheme: |
              \(\text{Area} = \frac12\sqrt{14}\sqrt{14}\sin 79.4^\circ\)
            marks:
              - code: M1
                note: Uses \(\frac12|\overrightarrow{OA}||\overrightarrow{OB}|\sin\angle AOB\) with their magnitudes and \(79.4^\circ\), a more accurate angle or the exact sine.
          - scheme: |
              \(\phantom{\text{Area}} = 6.88\)
            marks:
              - code: A1
  - q: 10
    stamp: f434f663
    parts:
      - part: a
        rows:
          - scheme: |
              \(\mathbf{R} = \begin{pmatrix}1&0&0\\0&\cos\theta&-\sin\theta\\0&\sin\theta&\cos\theta\end{pmatrix}\)
              \(\Rightarrow \mathbf{R}^{-1} = \begin{pmatrix}1&0&0\\0&\cos\theta&\sin\theta\\0&-\sin\theta&\cos\theta\end{pmatrix}\)
            marks:
              - code: B1
                note: Correct \(\mathbf{R}\) or \(\mathbf{R}^{-1}\), stated or used.
          - scheme: |
              \(\mathbf{A} = \mathbf{R}^{-1}\mathbf{B} = \ldots\)
            marks:
              - code: M1
                note: Uses \(\mathbf{A} = \mathbf{R}^{-1}\mathbf{B}\), not \(\mathbf{B}\mathbf{R}^{-1}\), with their \(\mathbf{R}^{-1}\) of a rotation matrix's form, and attempts the product. Condone slips in multiplying.
          - scheme: |
              \(\mathbf{A} = \begin{pmatrix}1&0&0\\0&0&\cos^2\theta+\sin^2\theta\\0&\sin^2\theta+\cos^2\theta&0\end{pmatrix}\)
              \(\phantom{\mathbf{A}} = \begin{pmatrix}1&0&0\\0&0&1\\0&1&0\end{pmatrix}\), so no \(\theta\)
            marks:
              - code: A1 AG
                note: Correct product simplified by \(\sin^2\theta+\cos^2\theta=1\) to a matrix free of \(\theta\), with a conclusion that \(\mathbf{A}\) is independent of \(\theta\).
      - part: b
        rows:
          - scheme: |
              Reflection in the plane \(y = z\)
            marks:
              - code: B1
                note: Needs reflection and the plane, \(y = z\) oe.
  - q: 11
    stamp: d7a93447
    parts:
      - part: a
        rows:
          - scheme: |
              Rotation about the origin
            marks:
              - code: B1
          - scheme: |
              through angle \(\theta\) anticlockwise
            marks:
              - code: B1
                note: Accept clockwise through \(2\pi - \theta\).
      - part: b.i
        rows:
          - scheme: |
              \(\det(\mathbf{M}) = \cos^2\theta + \sin^2\theta = 1\)
            marks:
              - code: B1
      - part: b.ii
        rows:
          - scheme: |
              \(|\det(\mathbf{M})| = 1 \Rightarrow\) area is preserved
            marks:
              - code: E1
                note: States that area is preserved, or the area scale factor is 1, linked to the determinant.
          - scheme: |
              \(\det(\mathbf{M}) > 0 \Rightarrow\) orientation is preserved
            marks:
              - code: E1
                note: States that orientation is preserved, or that \(T\) involves no reflection, linked to the determinant being positive.
      - part: c
        rows:
          - scheme: |
              \(n = 1\): \(\cos 1\theta = \cos\theta\), \(\sin 1\theta = \sin\theta\)
              \(\Rightarrow \mathbf{M}^1 = \mathbf{M}\), so true for \(n = 1\)
            marks:
              - code: B1
                note: Formula evaluated at \(n = 1\) and seen to give \(\mathbf{M}\).
          - scheme: |
              Assumes true for \(n = k\):
              \(\mathbf{M}^{k+1} = \mathbf{M}^k\mathbf{M}\)
            marks:
              - code: M1
                note: Assumes the result for \(n = k\) and writes \(\mathbf{M}^{k+1}\) as \(\mathbf{M}^k\mathbf{M}\) or \(\mathbf{M}\mathbf{M}^k\). Not if the result for \(n = k\) is stated as fact.
          - scheme: |
              \(\begin{pmatrix}\cos k\theta & -\sin k\theta \\ \sin k\theta & \cos k\theta\end{pmatrix}\begin{pmatrix}\cos\theta & -\sin\theta \\ \sin\theta & \cos\theta\end{pmatrix} = \ldots\)
            marks:
              - code: M1
                note: Multiplies the assumed form of \(\mathbf{M}^k\) and \(\mathbf{M}\), in either order, each entry a sum of two products. Condone sign slips.
          - scheme: |
              \(\begin{pmatrix} c & -s \\ s & c\end{pmatrix}\), where
              \(c = \cos k\theta\cos\theta - \sin k\theta\sin\theta\)
              \(s = \sin k\theta\cos\theta + \cos k\theta\sin\theta\)
            marks:
              - code: A1
                note: All four entries correct, unsimplified.
          - scheme: |
              \(\Rightarrow \mathbf{M}^{k+1} = \begin{pmatrix}\cos(k+1)\theta & -\sin(k+1)\theta \\ \sin(k+1)\theta & \cos(k+1)\theta\end{pmatrix}\)
            marks:
              - code: A1
                note: cso. All four entries in the form for \(n = k + 1\), using the addition formulae.
          - scheme: |
              True for \(n = 1\); true for \(n = k\)
              \(\Rightarrow\) true for \(n = k + 1\)
              \(\Rightarrow\) true for all positive integers \(n\)
            marks:
              - code: E1
                note: Concludes with all three points, true for \(n = 1\), true for \(n = k\) implies true for \(n = k + 1\), and so true for all positive integers \(n\).
      - part: d
        rows:
          - scheme: |
              Rotation through \(n\theta\) anticlockwise about the origin
            marks:
              - code: B1ft
                note: ft their description in (a) with \(\theta\) replaced by \(n\theta\). Needs the centre, angle and sense. Condone the angle not reduced modulo \(2\pi\).
