  - q: 2
    stamp: 6c2b76b6
    parts:
      - part: a
        rows:
          - scheme: |
              \(\begin{pmatrix}0&-1\\1&0\end{pmatrix}\begin{pmatrix}-2&1&1\\1&1&5\end{pmatrix} = \ldots\)
            marks:
              - code: M1
                note: Applies \(\mathbf{P}\) to the vertices, by multiplying or by the rule \((x,y) \mapsto (-y,x)\). One correct image is enough.
          - scheme: |
              \(A'(-1,-2)\), \(B'(-1,1)\), \(C'(-5,1)\)
            marks:
              - code: A1
                note: All three, as coordinates or column vectors.
      - part: b
        rows:
          - scheme: |
              Rotation about the origin
            marks:
              - code: B1
                note: Needs rotation and the centre \(O\) or \((0,0)\).
          - scheme: |
              through \(90^\circ\) anticlockwise
            marks:
              - code: B1
                note: Accept \(\frac{\pi}{2}\) anticlockwise or \(270^\circ\) clockwise. Condone \(+90^\circ\) with no direction.
      - part: c
        rows:
          - scheme: |
              \(\mathbf{QR} = \begin{pmatrix}1&4\\3&0\end{pmatrix}\)
            marks:
              - code: B1
      - part: d
        rows:
          - scheme: |
              \(\det(\mathbf{QR}) = 1\times 0 - 4\times 3\)
            marks:
              - code: M1
                note: Uses \(ad - bc\) on their \(2\times2\) \(\mathbf{QR}\), or multiplies \(\det\mathbf{Q}\) by \(\det\mathbf{R}\). Condone one sign slip.
          - scheme: |
              \(\phantom{\det(\mathbf{QR})} = -12\)
            marks:
              - code: A1
      - part: e
        rows:
          - scheme: |
              \(\text{Area of } T = \tfrac12\times 3\times 4 = 6\)
            marks:
              - code: B1
          - scheme: |
              \(\text{Area of } T'' = |\their{{-12}}| \times 6\)
            marks:
              - code: M1
                note: Multiplies their area of \(T\) by the modulus of their determinant from (d). Not for an area found from the vertices of \(T''\).
          - scheme: |
              \(\phantom{\text{Area of } T''} = 72\)
            marks:
              - code: A1ft
                note: ft their area of \(T\) and their determinant.
  - q: 3
    stamp: 90984dfd
    parts:
      - part: i.a
        rows:
          - scheme: |
              \(\begin{pmatrix}0 & 1\\1 & 0\end{pmatrix}\)
            marks:
              - code: B1
      - part: i.b
        rows:
          - scheme: |
              \(\begin{pmatrix}\frac12 & \frac{\sqrt3}{2}\\-\frac{\sqrt3}{2} & \frac12\end{pmatrix}\)
            marks:
              - code: B1
                note: Exact values, or awrt 0.866 for \(\frac{\sqrt3}{2}\).
      - part: i.c
        rows:
          - scheme: |
              \(\begin{pmatrix}0 & 1\\1 & 0\end{pmatrix}\begin{pmatrix}\frac12 & \frac{\sqrt3}{2}\\-\frac{\sqrt3}{2} & \frac12\end{pmatrix} = \begin{pmatrix}-\frac{\sqrt3}{2} & \frac12\\\frac12 & \frac{\sqrt3}{2}\end{pmatrix}\)
            marks:
              - code: B1ft
                note: ft their (a) times their (b), in that order. Not for the product in the reverse order.
      - part: ii
        rows:
          - scheme: |
              \(\det\begin{pmatrix}2 & 5\\1 & -1\end{pmatrix} = -2 - 5 = -7\)
            marks:
              - code: B1
          - scheme: |
              Area of \(T = \dfrac{84}{\their{7}} = 12\)
            marks:
              - code: M1
                note: Divides 84 by the modulus of their determinant, or equates their scale factor times the area of \(T\) to 84.
              - code: A1
          - scheme: |
              \(\tfrac12\left|\det\begin{pmatrix}4 & k-1\\3 & -3\end{pmatrix}\right|\)
              \(\phantom{A} = \tfrac12\left|-12 - 3(k-1)\right|\)
            marks:
              - code: M1
                note: Finds the area of \(T\) in terms of \(k\) by any method, such as half a determinant of two side vectors or the shoelace formula. Condone sign slips.
          - scheme: |
              \(\phantom{A} = \tfrac32(k+3)\)
            marks:
              - code: A1
                note: \(\frac32(k+3)\) or \(\frac32|k+3|\) oe.
          - scheme: |
              \(\tfrac32(k+3) = 12 \Rightarrow k = 5\)
            marks:
              - code: A1
                note: \(k = 5\) only; A0 if \(k = -11\) is also given.
  - q: 4
    stamp: a9c044c0
    parts:
      - part: a
        rows:
          - scheme: |
              \(\begin{pmatrix}3\\1\end{pmatrix},\ \begin{pmatrix}2\\3\end{pmatrix}\)
              \(\text{Area of } S = \left|\det\begin{pmatrix}3&2\\1&3\end{pmatrix}\right| = \ldots\)
            marks:
              - code: M1
                note: Finds the area of \(S\) by any valid method, such as the determinant of two adjacent side vectors from one vertex. Condone a sign slip.
          - scheme: |
              \(\text{Area of } S = 7\)
            marks:
              - code: A1
          - scheme: |
              \(\their{7}\,|\det\mathbf P| = 35\)
            marks:
              - code: M1
                note: Equates their area of \(S\) times \(\det\mathbf P\), with or without the modulus, to 35, oe.
          - scheme: |
              \(\det\mathbf P = p^2 + 2p - 3 = \pm 5\)
            marks:
              - code: A1
                note: Correct \(\det\mathbf P\) in any form, such as \((p+1)^2 - 4\), equated to 5 or to \(\pm 5\).
          - scheme: |
              \(p^2 + 2p - 8 = 0 \Rightarrow p = \ldots\)
            marks:
              - code: dM1
                note: Solves their quadratic in \(p\) by factorising, the formula, completing the square or a calculator.
          - scheme: |
              \(p = 2\) \((p = -4 \text{ rejected})\)
            marks:
              - code: A1
                note: \(p = 2\) only, with \(-4\) rejected. The case \(\det\mathbf P = -5\) need not be solved.
      - part: b
        rows:
          - scheme: |
              \(\begin{pmatrix}0&1\\1&0\end{pmatrix}\)
            marks:
              - code: B1
          - scheme: |
              \(\begin{pmatrix}2&0\\0&1\end{pmatrix}\)
            marks:
              - code: B1
          - scheme: |
              \(\mathbf Q = \begin{pmatrix}2&0\\0&1\end{pmatrix}\begin{pmatrix}0&1\\1&0\end{pmatrix}\)
              \(\phantom{\mathbf Q} = \begin{pmatrix}0&2\\1&0\end{pmatrix}\)
            marks:
              - code: B1ft
                note: ft their two matrices, stretch times reflection in that order, multiplied correctly.
      - part: c
        rows:
          - scheme: |
              \(\mathbf R = \mathbf Q\mathbf P = \begin{pmatrix}0&2\\1&0\end{pmatrix}\begin{pmatrix}3&2\\2&3\end{pmatrix}\)
              \(\phantom{\mathbf R} = \begin{pmatrix}4&6\\3&2\end{pmatrix}\)
            marks:
              - code: B1ft
                note: ft their \(\mathbf Q\) and their \(p\), with \(\mathbf Q\mathbf P\), in that order, multiplied correctly.
  - q: 5
    stamp: 17fee7b4
    parts:
      - part: i
        rows:
          - scheme: |
              \(\mathbf{A}^2 = \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}\)
            marks:
              - code: B1
      - part: ii
        rows:
          - scheme: |
              A reflection applied twice returns every point
              to itself, so \(\mathbf{A}^2 = \mathbf{I}\) is consistent
            marks:
              - code: E1
                note: States that reflecting twice leaves every point unchanged, or that a reflection is self-inverse, and links this to \(\mathbf{A}^2 = \mathbf{I}\).
      - part: iii
        rows:
          - scheme: |
              \(-\tfrac12 x + \tfrac{\sqrt3}{2}y = x\)
              \(\tfrac{\sqrt3}{2}x + \tfrac12 y = y\)
            marks:
              - code: M1
                note: Sets \(\mathbf{A}\) times a general point \((x, y)\) equal to \((x, y)\), forming at least one equation. Condone slips in multiplying.
          - scheme: |
              \(y = \sqrt3\,x\)
            marks:
              - code: A1
                note: oe, such as \(\sqrt3\,x - y = 0\).
      - part: iv
        rows:
          - scheme: |
              Rotation about the origin
            marks:
              - code: B1
                note: Needs the centre, the origin or \((0, 0)\).
          - scheme: |
              through \(120^\circ\) anticlockwise
            marks:
              - code: B1
                note: Accept \(\frac{2\pi}{3}\), or \(240^\circ\) clockwise. The direction is required.
      - part: v
        rows:
          - scheme: |
              \(\mathbf{BA} = \begin{pmatrix} -\frac12 & -\frac{\sqrt3}{2} \\ -\frac{\sqrt3}{2} & \frac12 \end{pmatrix}\)
            marks:
              - code: B1
                note: The product in the order \(\mathbf{BA}\); \(\mathbf{AB}\) scores B0.
      - part: vi
        rows:
          - scheme: |
              \(-\tfrac12 x - \tfrac{\sqrt3}{2}y = x\)
              \(-\tfrac{\sqrt3}{2}x + \tfrac12 y = y\)
            marks:
              - code: M1
                note: Sets their \(2 \times 2\) matrix from (v) times \((x, y)\) equal to \((x, y)\), forming at least one equation. Condone slips in multiplying.
          - scheme: |
              \(y = -\sqrt3\,x\)
            marks:
              - code: A1ft
                note: oe. ft their matrix from (v), where its invariant points form a line.
  - q: 6
    stamp: 7a969743
    parts:
      - part: a
        rows:
          - scheme: |
              Stretch parallel to the \(y\)-axis, scale factor \(k\)
            marks:
              - code: B1
                note: Names a stretch; its direction and scale factor are not needed, but B0 if a wrong one is given.
          - scheme: |
              then reflection in the line \(y = x\)
            marks:
              - code: B1
                note: The reflection, after the stretch; its mirror line is not needed, but B0 if wrong. Reflection first scores B1 B1 only with the stretch parallel to the \(x\)-axis; otherwise B1 B0.
      - part: b
        rows:
          - scheme: |
              \(\mathbf{M} = \begin{pmatrix} 0 & k \\ 1 & 0 \end{pmatrix}\), \(\det \mathbf{M} = -k\)
              Area \(= k\)
            marks:
              - code: B1
                note: Must be positive.
          - scheme: |
              \(\mathbf{M}^{-1} = -\frac{1}{k}\begin{pmatrix} 0 & -k \\ -1 & 0 \end{pmatrix}\)
            marks:
              - code: M1
                note: Attempts the inverse of their \(\mathbf{M}\), by the determinant and adjugate, or as the inverses of the two matrices in reverse order. Condone one sign slip.
          - scheme: |
              \(\phantom{\mathbf{M}^{-1}} = \begin{pmatrix} 0 & 1 \\ \frac{1}{k} & 0 \end{pmatrix}\)
            marks:
              - code: A1
      - part: c
        rows:
          - scheme: |
              \(\begin{pmatrix} 0 & k \\ 1 & 0 \end{pmatrix}\begin{pmatrix} x \\ \frac{x}{\sqrt{k}} \end{pmatrix} = \ldots\)
            marks:
              - code: M1
                note: Applies their \(\mathbf{M}\) to a general point of the line, such as \(\left(x, \frac{x}{\sqrt{k}}\right)\) or \((x, mx)\), or to its direction vector.
          - scheme: |
              \(= \begin{pmatrix} \sqrt{k}\,x \\ x \end{pmatrix}\)
            marks:
              - code: A1
                note: oe, such as \(\left(\frac{kx}{\sqrt{k}}, x\right)\).
          - scheme: |
              \(X = \sqrt{k}\,x,\ Y = x \Rightarrow Y = \frac{X}{\sqrt{k}}\)
              so the line is invariant
            marks:
              - code: A1 AG
                note: cso. Image shown to satisfy \(y = \frac{x}{\sqrt{k}}\), or to be a multiple of the direction vector, with a conclusion. Via \((x, mx)\), needs \(m^2 = \frac{1}{k}\) and \(m = \frac{1}{\sqrt{k}}\).
  - q: 7
