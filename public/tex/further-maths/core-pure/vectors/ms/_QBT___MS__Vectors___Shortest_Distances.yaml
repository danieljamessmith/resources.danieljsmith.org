questions:
  - q: 1
    stamp: 515b7f68
    parts:
      - part: a
        rows:
          - scheme: |
              \(\frac{\lvert 3(5) + 1(-5) + 2(3) + 4\rvert}{\sqrt{3^2 + 1^2 + 2^2}}\)
            marks:
              - code: M1
                note: Substitutes \(P\) and the plane into the distance formula, or finds the foot of the perpendicular. Condone one sign slip.
          - scheme: |
              \(= \frac{20}{\sqrt{14}}\ \left[= \frac{10\sqrt{14}}{7}\right]\)
            marks:
              - code: A1
                note: \(\frac{20}{\sqrt{14}}\) oe, or awrt 5.35.
      - part: b
        rows:
          - scheme: |
              \(2 + \lambda = 5 \Rightarrow \lambda = 3\)
            marks:
              - code: M1
                note: Equates one component of the general point of \(L\) to that of \(P\) and solves for \(\lambda\).
          - scheme: |
              \(y = 1 - 2(3) = -5\), \(z = -3 + 2(3) = 3\)
              so \(P\) lies on \(L\)
            marks:
              - code: A1 AG
                note: Both other components shown to match \(P\) at \(\lambda = 3\), or \(\lambda = 3\) from all three, with a conclusion.
      - part: c
        rows:
          - scheme: |
              \(3(2 + \lambda) + (1 - 2\lambda) + 2(-3 + 2\lambda) = -4\)
              \(\Rightarrow \lambda = \ldots\)
            marks:
              - code: M1
                note: Substitutes all three components of \(L\) into the plane equation and solves for \(\lambda\). Condone sign slips.
          - scheme: |
              \(\lambda = \their{{-1}} \Rightarrow (2 - 1,\ 1 + 2,\ -3 - 2)\)
            marks:
              - code: dM1
                note: Substitutes their \(\lambda\) into the equation of \(L\).
          - scheme: |
              \((1, 3, -5)\)
            marks:
              - code: A1
      - part: d
        rows:
          - scheme: |
              \(\mathbf{u}\cdot\mathbf{n} = 3 - 2 + 4 = 5\), \(\lvert\mathbf{u}\rvert = 3\), \(\lvert\mathbf{n}\rvert = \sqrt{14}\)
            marks:
              - code: B1
                note: All three values, seen or used.
          - scheme: |
              \(\sin\theta = \frac{\their{5}}{\their{3}\,\their{\sqrt{14}}} \Rightarrow \theta = \ldots\)
            marks:
              - code: M1
                note: Uses \(\sin\theta = \frac{\lvert\mathbf{u}\cdot\mathbf{n}\rvert}{\lvert\mathbf{u}\rvert\lvert\mathbf{n}\rvert}\) with their values, or finds the angle with the normal by cosine and subtracts it from \(90^\circ\).
          - scheme: |
              \(\theta = 26.5^\circ\)
            marks:
              - code: A1
                note: awrt \(26.5^\circ\), or awrt 0.462 radians.
      - part: e
        rows:
          - scheme: |
              \(PC = \left(3 - (-1)\right) \times 3 = \ldots\ [= 12]\)
            marks:
              - code: M1
                note: Finds \(PC\) as the change in \(\lambda\) times their \(\lvert\mathbf{u}\rvert\), or as the magnitude of \(\overrightarrow{PC}\) using their point from (c).
          - scheme: |
              \(\their{12} \times \their{\frac{5}{3\sqrt{14}}}\)
            marks:
              - code: dM1
                note: Multiplies their \(PC\) by their \(\sin\theta\) from (d), or by the cosine of their angle with the normal.
          - scheme: |
              \(= \frac{20}{\sqrt{14}}\), as in (a)
            marks:
              - code: A1
                note: \(\frac{20}{\sqrt{14}}\) oe, or awrt 5.35, with a statement that it agrees with (a).
  - q: 2
    stamp: e3c9839b
    parts:
      - part: a
        rows:
          - scheme: |
              \(\overrightarrow{CD} = \begin{pmatrix}3\\3\\-3\end{pmatrix}\)
            marks:
              - code: B1
                note: Or any nonzero multiple, such as \(\mathbf i + \mathbf j - \mathbf k\).
          - scheme: |
              \(\sin\alpha = \frac{\lvert(1)(1)+(1)(1)+(-1)(1)\rvert}{\sqrt3\sqrt3}\)
            marks:
              - code: M1
                note: Uses the scalar product of their direction of \(CD\) and \(\mathbf i + \mathbf j + \mathbf k\) over the product of magnitudes, as \(\sin\alpha\), or as a cosine then subtracts from \(90^\circ\).
          - scheme: |
              \(\sin\alpha = \frac13\)
            marks:
              - code: A1
                note: Or the cosine of the angle with the normal \(= \frac13\).
          - scheme: |
              \(\alpha = 19.5^\circ\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \(\mathbf r = \begin{pmatrix}0\\0\\2\end{pmatrix} + t\begin{pmatrix}1\\1\\-1\end{pmatrix}\)
            marks:
              - code: M1
                note: Uses \(C\) or \(D\) and their direction of \(CD\) from (a) in a vector or parametric equation.
          - scheme: |
              \((x, y, z) = (t, t, 2 - t)\)
            marks:
              - code: A1
                note: oe for their point and parameter.
          - scheme: |
              \(P_1\colon\ t + t + 2 - t = 3 \Rightarrow t = \ldots\)
              \(P_2\colon\ 2t - t = 1 \Rightarrow t = \ldots\)
            marks:
              - code: M1
                note: Substitutes their general point into both plane equations and solves each, or into one and tests the resulting point in the other.
          - scheme: |
              \(t = 1\) from both, so the point is common to \(P_1\) and \(P_2\)
            marks:
              - code: A1
                note: The same parameter from both, or the point from one shown to satisfy the other, with a conclusion that it is common. A0 if the conclusion is missing.
          - scheme: |
              \((1, 1, 1)\)
            marks:
              - code: A1
      - part: c.i
        rows:
          - scheme: |
              \((\mathbf i + \mathbf j + \mathbf k) \times (2\mathbf i - \mathbf j)\)
              \(\phantom{(} = \mathbf i(0 + 1) - \mathbf j(0 - 2) + \mathbf k(-1 - 2)\)
            marks:
              - code: M1
                note: Expands a determinant or uses the component formula for all three components. Condone one sign slip.
          - scheme: |
              \(= \mathbf i + 2\mathbf j - 3\mathbf k\)
            marks:
              - code: A1
      - part: c.ii
        rows:
          - scheme: |
              \(\lvert\mathbf i + 2\mathbf j - 3\mathbf k\rvert = \sqrt{14}\)
              \(\lvert\mathbf i + \mathbf j + \mathbf k\rvert = \sqrt3,\ \lvert 2\mathbf i - \mathbf j\rvert = \sqrt5\)
            marks:
              - code: B1
                note: All three needed.
          - scheme: |
              \(\sin\theta = \frac{\their{\sqrt{14}}}{\sqrt3\sqrt5} \Rightarrow \theta = \ldots\)
            marks:
              - code: M1
                note: Divides the magnitude of their vector from (c)(i) by the product of the normals' magnitudes as \(\sin\theta\), and finds \(\theta\). Not for a scalar-product route that doesn't use (c)(i).
          - scheme: |
              \(\theta = 75.0^\circ\)
            marks:
              - code: A1
      - part: c.iii
        rows:
          - scheme: |
              \(\begin{pmatrix}0\\0\\2\end{pmatrix} - \begin{pmatrix}1\\1\\1\end{pmatrix} = \begin{pmatrix}-1\\-1\\1\end{pmatrix}\)
              \(\begin{pmatrix}-1\\-1\\1\end{pmatrix} \times \begin{pmatrix}1\\2\\-3\end{pmatrix} = \ldots\)
            marks:
              - code: M1
                note: Forms the vector from a point on both planes, such as their point from (b), to \(C\), and crosses it with their direction from (c)(i). Condone sign slips.
          - scheme: |
              \(\begin{pmatrix}1\\-2\\-1\end{pmatrix}\)
            marks:
              - code: A1
                note: Or its negative.
          - scheme: |
              \(\text{dist} = \frac{\their{\sqrt6}}{\sqrt{14}}\)
            marks:
              - code: dM1
                note: Divides the magnitude of their cross product by the magnitude of their direction.
          - scheme: |
              \(= \sqrt{\tfrac37} \approx 0.655\)
            marks:
              - code: A1
  - q: 3
    stamp: c6ad0b88
    parts:
      - part: a
        rows:
          - scheme: |
              \((1)(1) + (-2)(2) + (3)(1) = \ldots\)
              \((1)(4) + (-2)(-1) + (3)(-2) = \ldots\)
            marks:
              - code: M1
                note: Forms the scalar product of the vector with both direction vectors, or finds the vector product of the direction vectors.
          - scheme: |
              \(1 - 4 + 3 = 0\) and \(4 + 2 - 6 = 0\)
              Perpendicular to both direction vectors \(\Rightarrow\) perpendicular to \(\Pi\)
            marks:
              - code: A1 AG
                note: Both products shown evaluated to zero, or the vector product shown to be a multiple of the vector, with a conclusion.
      - part: b
        rows:
          - scheme: |
              \(x - 2y + 3z = (1)(2) + (-2)(-1) + (3)(3) = \ldots\)
            marks:
              - code: M1
                note: Substitutes \((2, -1, 3)\), or another point of \(\Pi\), into \(x - 2y + 3z = d\), or expands \((\mathbf{i} - 2\mathbf{j} + 3\mathbf{k})\cdot(\mathbf{r} - \mathbf{a}) = 0\). Condone sign slips.
          - scheme: |
              \(x - 2y + 3z = 13\)
            marks:
              - code: A1
                note: Cartesian form, oe. \(\mathbf{r}\cdot(\mathbf{i} - 2\mathbf{j} + 3\mathbf{k}) = 13\) alone scores A0.
      - part: c
        rows:
          - scheme: |
              \(A = (-2 + t,\ 1 + t,\ 4 + t)\)
              \(\frac{|(-2 + t) - 2(1 + t) + 3(4 + t) - \their{13}|}{\sqrt{1 + 4 + 9}}\)
              \(\phantom{A} = \frac{9}{\sqrt{14}}\)
            marks:
              - code: M1
                note: Uses a general point of \(\ell\) in a point-to-plane distance with their plane from (b), set equal to \(\frac{9}{\sqrt{14}}\), or an equivalent method such as parallel planes. Condone sign slips.
          - scheme: |
              \(|2t - 5| = 9\)
            marks:
              - code: A1
                note: oe, such as \((2t - 5)^2 = 81\) or \(2t - 5 = \pm 9\).
          - scheme: |
              \(2t - 5 = 9\) or \(2t - 5 = -9 \Rightarrow t = \ldots\ [= 7, -2]\)
            marks:
              - code: dM1
                note: Solves both cases, or their quadratic, for two values of \(t\).
          - scheme: |
              \(A = (5, 8, 11)\) or \((-4, -1, 2)\)
            marks:
              - code: A1
                note: Both points, as coordinates or position vectors, and no others.
  - q: 4
    stamp: 69cf6d3b
    parts:
      - part: a
        rows:
          - scheme: |
              \(\overrightarrow{AB} = \begin{pmatrix}1\\2\\0\end{pmatrix}\), \(\overrightarrow{AC} = \begin{pmatrix}1\\0\\-1\end{pmatrix}\)
              \(\overrightarrow{AB}\times\overrightarrow{AC} = \ldots\)
            marks:
              - code: M1
                note: Finds two non-parallel vectors in the plane and attempts their cross product, or solves two scalar products with them equal to zero. Condone sign slips.
          - scheme: |
              \(\mathbf n = \begin{pmatrix}-2\\1\\-2\end{pmatrix}\)
            marks:
              - code: A1
                note: Any nonzero multiple.
          - scheme: |
              \(2x - y + 2z = 2(1) - (-2) + 2(3)\)
            marks:
              - code: M1
                note: Substitutes a point of \(\Pi\) into \(ax + by + cz = d\) or \(\mathbf r\cdot\mathbf n = d\), with their normal, to find \(d\).
          - scheme: |
              \(2x - y + 2z = 10\)
            marks:
              - code: A1
                note: oe, including \(\mathbf r\cdot\begin{pmatrix}2\\-1\\2\end{pmatrix} = 10\) or any multiple.
          - scheme: |
              \(\text{dist} = \frac{\lvert 2(4) - 1 + 2(0) - 10\rvert}{\sqrt{2^2 + (-1)^2 + 2^2}} = \ldots\)
            marks:
              - code: M1
                note: Uses the point-to-plane formula with \(D\) and their plane \(ax + by + cz = d\), or projects \(\overrightarrow{AD}\) onto their normal. Condone sign slips.
          - scheme: |
              \(= 1\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \(\begin{pmatrix}2\\1\\2\end{pmatrix}\times\begin{pmatrix}1\\-2\\1\end{pmatrix} = \ldots\)
            marks:
              - code: M1
                note: Attempts the cross product of the two direction vectors, or solves two scalar products with them equal to zero. Condone sign slips.
          - scheme: |
              \(= \begin{pmatrix}5\\0\\-5\end{pmatrix}\)
            marks:
              - code: A1
                note: Any nonzero multiple.
          - scheme: |
              \(\begin{pmatrix}2\\-3\\5\end{pmatrix}\cdot\their{\begin{pmatrix}5\\0\\-5\end{pmatrix}}\ [= -15]\)
              \(\text{dist} = \frac{15}{\sqrt{5^2 + 0^2 + (-5)^2}} = \ldots\)
            marks:
              - code: dM1
                note: Divides the scalar product of a vector joining the lines with their normal by the normal's magnitude. Condone a missing modulus.
          - scheme: |
              \(= \frac{3\sqrt2}{2}\)
            marks:
              - code: A1
                note: Any exact form, such as \(\frac{3}{\sqrt2}\).
  - q: 5
    stamp: 445f3ce3
    parts:
      - part: i
        rows:
          - scheme: |
              Sets \(z = t\): \(x - y + t = 6,\ 2x + y - t = 3\)
              \(\phantom{A} \Rightarrow x = \ldots,\ y = \ldots\)
            marks:
              - code: M1
                note: Solves the plane equations with one variable as parameter, or crosses the normals and finds a common point. Condone slips.
          - scheme: |
              \(\mathbf r = \begin{pmatrix}3\\-3\\0\end{pmatrix} + t\begin{pmatrix}0\\1\\1\end{pmatrix}\)
            marks:
              - code: A1
                note: Any point on \(\ell_2\) and any multiple of the direction.
          - scheme: |
              \(\begin{pmatrix}1\\2\\-1\end{pmatrix}\times\their{\begin{pmatrix}0\\1\\1\end{pmatrix}} = \ldots\)
            marks:
              - code: M1
                note: Forms the vector product of the two directions, or finds a vector perpendicular to both. At least two components correct for their vectors.
          - scheme: |
              \(\phantom{A} = \begin{pmatrix}3\\-1\\1\end{pmatrix}\)
            marks:
              - code: A1
                note: Or any nonzero multiple.
          - scheme: |
              \(\dfrac{\left|\begin{pmatrix}1\\-2\\-3\end{pmatrix}\cdot\their{\begin{pmatrix}3\\-1\\1\end{pmatrix}}\right|}{\sqrt{11}} = \ldots\)
            marks:
              - code: dM1
                note: Divides the scalar product of a vector joining the two lines with their normal by the normal's magnitude. Condone a missing modulus.
          - scheme: |
              \(\dfrac{2}{\sqrt{11}}\)
            marks:
              - code: A1
                note: oe, or awrt 0.603.
      - part: ii
        rows:
          - scheme: |
              \(\their{\begin{pmatrix}3\\-1\\1\end{pmatrix}}\cdot\begin{pmatrix}2\\-1\\3\end{pmatrix} = \ldots\)
            marks:
              - code: M1
                note: Forms \(ax + by + cz = d\) with their normal from (i) and finds \(d\) from a point on \(\ell_1\).
          - scheme: |
              \(3x - y + z = 10\)
            marks:
              - code: A1
                note: Any Cartesian equivalent. Not for a vector equation alone.
  - q: 6
    stamp: 152092d0
    parts:
      - part: a
        rows:
          - scheme: |
              \(\det\begin{pmatrix}1&\lambda&1\\2&-1&2\\2&1&-1\end{pmatrix}\)
              \(\phantom{\det} = 1(1-2) - \lambda(-2-4) + 1(2+2)\)
            marks:
              - code: M1
                note: Expands the determinant of the coefficient matrix by any row or column, giving an expression in \(\lambda\). Condone sign slips.
          - scheme: |
              \(\phantom{\det} = 6\lambda + 3\)
            marks:
              - code: A1
                note: oe, such as \(3(2\lambda+1)\).
          - scheme: |
              \(6\lambda + 3 = 0 \Rightarrow \lambda = -\tfrac12\)
              Unique point for all \(\lambda \neq -\tfrac12\)
            marks:
              - code: A1
                note: Needs the conclusion that the point is unique for every other \(\lambda\). The case \(\lambda = -\frac12\) need not be examined further.
      - part: b
        rows:
          - scheme: |
              \(\begin{pmatrix}x\\y\\z\end{pmatrix} = \begin{pmatrix}1&2&1\\2&-1&2\\2&1&-1\end{pmatrix}^{-1}\begin{pmatrix}4\\3\\5\end{pmatrix}\)
            marks:
              - code: M1
                note: Writes the system as \(\mathbf{A}\mathbf{x} = \mathbf{b}\) with \(\lambda = 2\) and uses \(\mathbf{x} = \mathbf{A}^{-1}\mathbf{b}\). Not for solving the equations without matrices.
          - scheme: |
              \(\mathbf{A}^{-1} = \frac{1}{15}\begin{pmatrix}-1&3&5\\6&-3&0\\4&3&-5\end{pmatrix}\)
            marks:
              - code: B1
                note: Any equivalent form; an inverse from a calculator is accepted.
          - scheme: |
              \(\begin{pmatrix}x\\y\\z\end{pmatrix} = \begin{pmatrix}2\\1\\0\end{pmatrix}\), \(P = (2, 1, 0)\)
            marks:
              - code: A1
      - part: c
        rows:
          - scheme: |
              \(\frac{x+1}{1} = \frac{y-1}{-1} = \frac{z}{1} = t\)
              \(\Rightarrow x = t - 1,\ y = 1 - t,\ z = t\)
            marks:
              - code: M1
                note: Sets the ratios equal to a parameter and writes \(x\), \(y\), \(z\) in terms of it, or reads a point and a direction from the Cartesian form. Condone sign slips.
          - scheme: |
              \(\mathbf{r} = \begin{pmatrix}-1\\1\\0\end{pmatrix} + t\begin{pmatrix}1\\-1\\1\end{pmatrix}\)
            marks:
              - code: A1
                note: Any point of \(\ell\) and any multiple of its direction, with \(\mathbf{r} =\) or equivalent.
      - part: d
        rows:
          - scheme: |
              \(\their{\begin{pmatrix}2\\1\\0\end{pmatrix}} - \begin{pmatrix}-1\\1\\0\end{pmatrix} = \begin{pmatrix}3\\0\\0\end{pmatrix}\)
              \(\begin{pmatrix}3\\0\\0\end{pmatrix} \times \begin{pmatrix}1\\-1\\1\end{pmatrix} = \ldots\)
            marks:
              - code: M1
                note: Forms the vector from any point of \(\ell\) to their \(P\) and its vector product with the direction of \(\ell\). Condone sign slips.
          - scheme: |
              \(\phantom{\begin{pmatrix}3\\0\\0\end{pmatrix}} = \begin{pmatrix}0\\-3\\-3\end{pmatrix}\)
            marks:
              - code: A1
                note: oe, such as its negative, or the multiple that their multiple of the direction gives.
          - scheme: |
              \(\dfrac{\sqrt{0^2 + (-3)^2 + (-3)^2}}{\sqrt{1^2 + (-1)^2 + 1^2}} = \ldots\)
            marks:
              - code: dM1
                note: Divides the magnitude of their vector product by the magnitude of their direction of \(\ell\).
          - scheme: |
              \(= \sqrt6\)
            marks:
              - code: A1
                note: \(\sqrt6\) or awrt 2.45.
      - part: e.i
        rows:
          - scheme: |
              \(\begin{pmatrix}1\\-1\\1\end{pmatrix} \cdot \begin{pmatrix}2\\1\\-1\end{pmatrix} = 2 - 1 - 1\)
            marks:
              - code: M1
                note: Forms the scalar product of the direction of \(\ell\) with the normal of the plane.
          - scheme: |
              \(\phantom{\begin{pmatrix}1\\-1\\1\end{pmatrix}} = 0\)
            marks:
              - code: A1
          - scheme: |
              \(2(-1) + 1 - 0 = -1 \neq 5\)
              so \(\ell\) is not in the plane, and is parallel to it
            marks:
              - code: A1 AG
                note: Needs the zero scalar product and a point of \(\ell\) shown not to satisfy the plane's equation, then a conclusion of parallel in words.
      - part: e.ii
        rows:
          - scheme: |
              \(\dfrac{\left|2(-1) + 1(1) - 1(0) - 5\right|}{\sqrt{2^2 + 1^2 + (-1)^2}} = \ldots\)
            marks:
              - code: M1
                note: Substitutes any point of \(\ell\) into the point-to-plane distance formula, or uses the parallel plane through \(\ell\). Unquoted, implied only by a correct substitution.
          - scheme: |
              \(= \frac{6}{\sqrt6} = \sqrt6\)
            marks:
              - code: A1
                note: \(\sqrt6\) or awrt 2.45.
  - q: 7
    stamp: 7f54bcba
    parts:
      - part: a.i
        rows:
          - scheme: |
              \(\mathbf{u}\cdot\mathbf{v} = \lambda - 4\)
            marks:
              - code: B1
      - part: a.ii
        rows:
          - scheme: |
              \(\mathbf{u}\times\mathbf{v} = (2-2)\mathbf{i} - (-\lambda-2)\mathbf{j}\)
              \(\phantom{\mathbf{u}\times\mathbf{v} =} + (\lambda+2)\mathbf{k}\)
            marks:
              - code: M1
                note: Attempts all three components by a determinant or the component formula. Condone sign slips.
          - scheme: |
              \(\phantom{\mathbf{u}\times\mathbf{v}} = (\lambda+2)(\mathbf{j}+\mathbf{k})\)
            marks:
              - code: A1
                note: oe, such as a column vector; need not be factorised.
      - part: b.i
        rows:
          - scheme: |
              \(\lvert 2\mathbf{i}-2\mathbf{j}+2\mathbf{k}\rvert = 2\sqrt3\), \(\lvert\mathbf{i}+\mathbf{j}-\mathbf{k}\rvert = \sqrt3\)
            marks:
              - code: B1
          - scheme: |
              \(\cos\theta = \dfrac{\lvert\their{2-4}\rvert}{2\sqrt3\times\sqrt3} = \ldots\)
            marks:
              - code: M1
                note: Divides their (a)(i) at \(\lambda = 2\) by the product of their magnitudes in the cosine formula. Condone a missing modulus.
          - scheme: |
              \(\theta = 70.5^\circ\)
            marks:
              - code: A1
                note: awrt \(70.5^\circ\) or 1.23 rad, or \(\cos^{-1}\frac13\).
      - part: b.ii
        rows:
          - scheme: |
              \((\mathbf{i}-2\mathbf{j}+2\mathbf{k})\times(\mathbf{i}+\mathbf{j}-\mathbf{k}) = 3(\mathbf{j}+\mathbf{k})\)
            marks:
              - code: B1ft
                note: ft their (a)(ii) at \(\lambda = 1\); any nonzero multiple accepted.
          - scheme: |
              \(\dfrac{\lvert(\mathbf{i}+3\mathbf{j}+4\mathbf{k})\cdot\their{(3\mathbf{j}+3\mathbf{k})}\rvert}{\lvert\their{3\mathbf{j}+3\mathbf{k}}\rvert}\)
              \(\phantom{A} = \ldots\)
            marks:
              - code: M1
                note: Divides the scalar product of a vector joining the two lines with their common normal by its magnitude. Condone sign slips in the joining vector.
          - scheme: |
              \(\dfrac{7\sqrt2}{2}\)
            marks:
              - code: A1
                note: \(\frac{7\sqrt2}{2}\) or \(\frac72\sqrt2\). Not for \(\frac{7}{\sqrt2}\) or a decimal alone.
  - q: 8
    stamp: ca647246
    parts:
      - part: a
        rows:
          - scheme: |
              \(\overrightarrow{AD} = \begin{pmatrix}1\\1\\m\end{pmatrix}\), \(\overrightarrow{BC} = \begin{pmatrix}-1\\1\\2\end{pmatrix}\), \(\overrightarrow{AB} = \begin{pmatrix}1\\0\\0\end{pmatrix}\)
            marks:
              - code: B1
                note: All three, oe; any vector joining a point of one line to a point of the other in place of \(\overrightarrow{AB}\).
          - scheme: |
              \(\begin{pmatrix}1\\1\\m\end{pmatrix}\times\begin{pmatrix}-1\\1\\2\end{pmatrix} = \begin{pmatrix}2-m\\-2-m\\2\end{pmatrix}\)
            marks:
              - code: M1
                note: Attempts the vector product of their two direction vectors. Condone sign slips.
              - code: A1
                note: oe, such as its negative.
          - scheme: |
              \(\dfrac{\left|\overrightarrow{AB}\cdot\their{\mathbf{n}}\right|}{\left|\their{\mathbf{n}}\right|} = \dfrac{1}{\sqrt{14}}\), \(\mathbf{n}\) their vector product
            marks:
              - code: M1
                note: Uses the scalar product of their joining vector with their vector product, divided by its magnitude, and sets it equal to \(\frac{1}{\sqrt{14}}\).
          - scheme: |
              \(\dfrac{|2-m|}{\sqrt{2m^2+12}} = \dfrac{1}{\sqrt{14}}\)
            marks:
              - code: A1
                note: Correct equation oe, need not be simplified. Condone a missing modulus.
          - scheme: |
              \(14(2-m)^2 = 2m^2+12\)
              \(\Rightarrow 3m^2-14m+11 = 0 \Rightarrow m = \ldots\)
            marks:
              - code: dM1
                note: Squares and solves their three-term quadratic in \(m\) by any means, a calculator included.
          - scheme: |
              \(m = 1\) or \(m = \tfrac{11}{3}\); \(m\) is an integer, so \(m = 1\)
            marks:
              - code: A1 AG
                note: cso. Both roots from a correct quadratic, with \(\frac{11}{3}\) rejected as not an integer. A0 if \(m = 1\) is only verified.
      - part: b
        rows:
          - scheme: |
              \(\overrightarrow{AC}\times\overrightarrow{AD} = \begin{pmatrix}0\\1\\2\end{pmatrix}\times\begin{pmatrix}1\\1\\1\end{pmatrix} = \begin{pmatrix}-1\\2\\-1\end{pmatrix}\)
            marks:
              - code: M1
                note: Attempts the vector product of a vector from a point on the line to \(C\) with the line's direction, using \(m = 1\). Condone sign slips.
              - code: A1
                note: Or its negative.
          - scheme: |
              \(d = \dfrac{\left|\their{{-\mathbf{i}+2\mathbf{j}-\mathbf{k}}}\right|}{\left|\overrightarrow{AD}\right|} = \dfrac{\sqrt{6}}{\sqrt{3}}\)
            marks:
              - code: dM1
                note: Divides the magnitude of their vector product by the magnitude of their direction vector.
          - scheme: |
              \(d = \sqrt{2}\)
            marks:
              - code: A1
                note: Or awrt 1.41.
      - part: c
        rows:
          - scheme: |
              \(\overrightarrow{AB}\times\overrightarrow{AD} = \begin{pmatrix}1\\0\\0\end{pmatrix}\times\begin{pmatrix}1\\1\\1\end{pmatrix} = \begin{pmatrix}0\\-1\\1\end{pmatrix}\)
            marks:
              - code: M1
                note: Attempts the vector product of two non-parallel vectors in plane \(ABD\), or finds a normal from two scalar products set to zero. Condone sign slips.
              - code: A1
                note: Any nonzero multiple.
          - scheme: |
              \(\mathbf{n}_{ACD} = \begin{pmatrix}-1\\2\\-1\end{pmatrix}\)
            marks:
              - code: B1
                note: Any nonzero multiple; may be taken from (b).
          - scheme: |
              \(\cos\theta = \dfrac{\left|\their{(0, -1, 1)}\cdot\their{(-1, 2, -1)}\right|}{\sqrt{2}\,\sqrt{6}}\)
            marks:
              - code: M1
                note: Uses the scalar product of their two normals divided by the product of their magnitudes.
          - scheme: |
              \(\cos\theta = \dfrac{3}{\sqrt{12}} = \dfrac{\sqrt{3}}{2}\)
              so the acute angle is \(\cos^{-1}\left(\frac{\sqrt{3}}{2}\right)\)
            marks:
              - code: A1 AG
                note: cso, from correct normals. A negative cosine must be made positive, or the obtuse angle replaced by its supplement. Needs a concluding statement.
