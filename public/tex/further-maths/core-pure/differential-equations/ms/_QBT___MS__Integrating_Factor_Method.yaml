          - scheme: |
              \(\frac{x^3}{3}-\frac{3x^2}{2}+3x-\ln x\)
            marks:
              - code: A1
                note: Condone \(\ln|x|\).
          - scheme: |
              \(y=\frac{x}{(x-1)^2}\left(\frac{x^3}{3}-\frac{3x^2}{2}+3x-\ln x+c\right)\)
            marks:
              - code: A1
                note: oe; \(y\) need not be the subject.
          - scheme: |
              \(2=\frac{2}{1^2}\left(\frac{8}{3}-6+6-\ln 2+c\right)\Rightarrow c=\ldots\)
              \([c=\ln 2-\tfrac53]\)
