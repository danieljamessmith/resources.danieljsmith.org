          - scheme: |
              \(y\sin x = \arctan(\ln(\sin x))\)
            marks:
              - code: A1
                note: Correct integral; the constant need not appear yet.
          - scheme: |
              \(y = \frac{\arctan(\ln(\sin x)) + c}{\sin x}\)
            marks:
              - code: A1
                note: oe, such as \(y\sin x = \arctan(\ln(\sin x)) + c\). Needs the constant.
  - q: 12
