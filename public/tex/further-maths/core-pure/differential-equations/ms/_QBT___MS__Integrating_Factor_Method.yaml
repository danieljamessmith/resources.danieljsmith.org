  - q: 9
    stamp: 1585119a
    parts:
      - part: a
        rows:
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}x}-\coth x\,y=\cosh^3 x\)
            marks:
              - code: B1
          - scheme: |
              \(e^{\int -\coth x\,\mathrm{d}x}=e^{-\ln(\sinh x)}\)
            marks:
              - code: M1
                note: Integrates their \(P\), of the form \(k\coth x\), to \(k\ln(\sinh x)\) and forms \(e^{\int P\,\mathrm{d}x}\). Condone a sign slip.
          - scheme: |
              \(\frac{1}{\sinh x}\)
            marks:
              - code: A1
                note: oe, such as \(\operatorname{cosech} x\). Condone \(|\sinh x|\).
      - part: b
        rows:
          - scheme: |
              \(\frac{\mathrm{d}}{\mathrm{d}x}\left(\frac{y}{\sinh x}\right)=\frac{\cosh^3 x}{\sinh x}\)
            marks:
              - code: M1
                note: Multiplies by their integrating factor \(\mu\), a function of \(x\), to reach \(\frac{\mathrm{d}}{\mathrm{d}x}(\mu y)=\mu Q\), or writes \(\mu y=\int\mu Q\,\mathrm{d}x\).
          - scheme: |
              \(\frac{y}{\sinh x}=\int\frac{\cosh x(1+\sinh^2 x)}{\sinh x}\,\mathrm{d}x\)
              \(\phantom{\frac{y}{\sinh x}}=\int\left(\frac1u+u\right)\mathrm{d}u=\ldots\)
            marks:
              - code: dM1
                note: Uses \(\cosh^2 x=1+\sinh^2 x\) and integrates the right side to the form \(p\ln(\sinh x)+q\sinh^2 x\), \(q\cosh^2 x\) or \(q\cosh 2x\), by any valid method. Condone coefficient slips.
          - scheme: |
              \(\ln(\sinh x)+\tfrac12\sinh^2 x\)
            marks:
              - code: A1
                note: oe, such as \(\frac14\cosh 2x\) or \(\frac12\cosh^2 x\) for \(\frac12\sinh^2 x\).
          - scheme: |
              \(y=\sinh x\ln(\sinh x)+\tfrac12\sinh^3 x+c\sinh x\)
            marks:
              - code: A1
                note: Needs the constant; \(y\) need not be the subject.
          - scheme: |
              \(\sinh(\ln(1+\sqrt2))=1\)
              \(\Rightarrow 2=0+\tfrac12+c\Rightarrow c=\ldots\)
            marks:
              - code: M1
                note: Substitutes \(y=2\) and \(\sinh x=1\), from the exponential definition or a calculator, into a general solution with a constant, to find it.
          - scheme: |
              \(y=\sinh x\ln(\sinh x)+\tfrac12\sinh^3 x+\tfrac32\sinh x\)
            marks:
              - code: A1
                note: Any equivalent exact form for \(y\); \(c\) depends on the form of their integral.
  - q: 10
    stamp: 3097011d
    parts:
      - part: a
        rows:
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}x}+y\tan x=x\sec x\)
            marks:
              - code: B1
          - scheme: |
              \(e^{\int\tan x\,\mathrm{d}x}=e^{\ln(\sec x)}\)
            marks:
              - code: M1
                note: Forms \(e^{\int P\,\mathrm{d}x}\) with \(P\) the coefficient of \(y\) in their standard form, integrating to a log form such as \(\pm\ln(\cos x)\).
          - scheme: |
              \(\phantom{e^{\int\tan x\,\mathrm{d}x}}=\sec x\)
            marks:
              - code: A1 AG
                note: cso from a correct integral to \(\sec x\). Condone omitted modulus signs.
      - part: b
        rows:
          - scheme: |
              \(\sec x\frac{\mathrm{d}y}{\mathrm{d}x}+y\sec x\tan x=x\sec^2 x\)
              \(\Rightarrow \frac{\mathrm{d}}{\mathrm{d}x}(y\sec x)=x\sec^2 x\)
            marks:
              - code: M1
                note: Multiplies their standard form by \(\sec x\) and writes LHS as \(\frac{\mathrm{d}}{\mathrm{d}x}(y\sec x)\); implied by \(y\sec x=\int x\sec^2 x\,\mathrm{d}x\).
          - scheme: |
              \(y\sec x=x\tan x-\int\tan x\,\mathrm{d}x\)
            marks:
              - code: dM1
                note: Integrates by parts with \(u=x\) to the form \(x\tan x\pm\int\tan x\,\mathrm{d}x\). Condone sign slips.
          - scheme: |
              \(\int x\sec^2 x\,\mathrm{d}x=x\tan x+\ln(\cos x)\)
            marks:
              - code: A1
                note: oe, such as \(x\tan x-\ln(\sec x)\); condone omitted modulus.
          - scheme: |
              \(y=x\sin x+\cos x\ln(\cos x)+c\cos x\)
            marks:
              - code: A1
                note: oe, including \(y\sec x=x\tan x+\ln(\cos x)+c\). Constant must be present.
          - scheme: |
              \(\sqrt2=\frac{\pi}{4}+\ln\frac{\sqrt2}{2}+c\Rightarrow c=\ldots\)
            marks:
              - code: M1
                note: Substitutes \(x=\frac{\pi}{4}\), \(y=1\) into their general solution containing a constant and solves for it.
          - scheme: |
              \(y=x\sin x+\cos x\left[\ln(\cos x)+\sqrt2-\frac{\pi}{4}+\frac12\ln2\right]\)
            marks:
              - code: A1
                note: oe, including \(y\sec x=\ldots\); constant exact or awrt 0.975.
  - q: 11
    stamp: 74c281ec
    parts:
      - part: ''
        rows:
          - scheme: |
              \(e^{\int \cot x\,\mathrm{d}x} = e^{\ln(\sin x)}\)
            marks:
              - code: M1
                note: Uses \(e^{\int \cot x\,\mathrm{d}x}\) with \(\cot x\) integrated to the form \(k\ln(\sin x)\). Condone a missing modulus.
