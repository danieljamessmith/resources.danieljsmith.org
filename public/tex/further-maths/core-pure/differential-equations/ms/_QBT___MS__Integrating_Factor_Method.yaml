questions:
  - q: 1
    stamp: f63424c6
    parts:
      - part: a
        rows:
          - scheme: |
              \(e^{\int \frac{2x}{x^2+1}\,\mathrm{d}x} = e^{\ln(x^2+1)}\)
            marks:
              - code: M1
                note: Forms \(e^{\int P\,\mathrm{d}x}\) with the given \(P\) and integrates to the form \(e^{k\ln(x^2+1)}\).
          - scheme: |
              \(\phantom{e} = x^2+1\)
            marks:
              - code: A1
          - scheme: |
              \((x^2+1)y = \int 6x(x^2+1)\,\mathrm{d}x\)
              \(\phantom{(x^2+1)y} = \ldots\)
            marks:
              - code: dM1
                note: Multiplies through by their integrating factor, LHS of the form (their factor)\(\times y\), and integrates the RHS with at least one power increased by 1.
          - scheme: |
              \(y = \dfrac{\frac32x^4+3x^2+c}{x^2+1}\)
            marks:
              - code: A1
                note: oe, in the form \(y = \ldots\), with a constant of integration.
      - part: b
        rows:
          - scheme: |
              \(\frac72 = \dfrac{c}{1} \Rightarrow c = \ldots\ [= \tfrac72]\)
            marks:
              - code: M1
                note: Substitutes \(x=0\), \(y=\frac72\) into their general solution containing a constant and finds the constant.
          - scheme: |
              \(4(x^2+1) = \frac32x^4+3x^2+\text{"}\tfrac72\text{"}\)
              \(\Rightarrow 3x^4-2x^2-1 = 0 \Rightarrow x^2 = \ldots\)
            marks:
              - code: M1
                note: Sets their particular solution equal to 4 and solves the resulting three-term quadratic in \(x^2\) by any method, calculator allowed, reaching \(x^2 = \ldots\)
          - scheme: |
              \(x = 1\)
            marks:
              - code: A1
                note: Only \(x = 1\) given as the answer.
  - q: 2
    stamp: 17f26d57
    parts:
      - part: a
        rows:
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}x}-\frac{2}{1+x}y=(1+x)^3\)
              \(e^{\int -\frac{2}{1+x}\,\mathrm{d}x} = \ldots\)
            marks:
              - code: M1
                note: Divides by \(1+x\) and attempts \(e^{\int P\,\mathrm{d}x}\) with their \(P\), reaching the form \(e^{k\ln(1+x)}\) or \((1+x)^k\). Condone sign slips.
          - scheme: |
              \(e^{-2\ln(1+x)} = (1+x)^{-2}\)
            marks:
              - code: A1
                note: oe, such as \(\frac{1}{(1+x)^2}\); not left as \(e^{-2\ln(1+x)}\).
          - scheme: |
              \(\frac{\mathrm{d}}{\mathrm{d}x}\left(y(1+x)^{-2}\right)=1+x\)
              \(\Rightarrow y(1+x)^{-2}=\int(1+x)\,\mathrm{d}x = \ldots\)
            marks:
              - code: dM1
                note: 'Multiplies their standard form by their integrating factor and integrates: LHS as \(y\,\times\) their integrating factor, at least one RHS term with power increased by 1.'
          - scheme: |
              \(y=(1+x)^2\left(\frac{x^2}{2}+x+c\right)\)
            marks:
              - code: A1
                note: Any equivalent form with an arbitrary constant, such as \(y=\frac12(1+x)^4+c(1+x)^2\). Must be \(y=\ldots\).
      - part: b
        rows:
          - scheme: |
              \(-1=(1+0)^2\left(0+0+c\right) \Rightarrow c=\ldots\ [=-1]\)
            marks:
              - code: M1
                note: Substitutes \(x=0\), \(y=-1\) into their general solution with an arbitrary constant and finds the constant.
          - scheme: |
              \((1+x)^2\left(\frac{x^2}{2}+x-1\right)=0\)
              \(\Rightarrow x^2+2x-2=0 \Rightarrow x=\ldots\)
            marks:
              - code: M1
                note: Sets their particular solution to 0 and solves the remaining quadratic factor by any means, calculator allowed, to \(x=\ldots\).
          - scheme: |
              \(x=\sqrt{3}-1\)
            marks:
              - code: A1
                note: Exact, with \(-1-\sqrt{3}\) rejected or not given.
  - q: 3
    stamp: 69cb0f76
    parts:
      - part: a
        rows:
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}x}+\frac{1}{1+x}y=\frac{\ln(1+x)}{1+x}\)
              \(e^{\int \frac{1}{1+x}\,\mathrm{d}x}=e^{\ln(1+x)}\)
            marks:
              - code: M1
                note: Divides by \(1+x\) and forms \(e^{\int P\,\mathrm{d}x}\) with \(P=\frac{k}{1+x}\), or recognises the LHS as \(\frac{\mathrm{d}}{\mathrm{d}x}\left((1+x)y\right)\).
          - scheme: |
              \(= 1+x\)
            marks:
              - code: A1
                note: Or \(\frac{\mathrm{d}}{\mathrm{d}x}\left((1+x)y\right)=\ln(1+x)\) stated. Accept \(|1+x|\).
          - scheme: |
              \((1+x)y=\int\ln(1+x)\,\mathrm{d}x\)
              \(\phantom{(1+x)y} = x\ln(1+x)-\int\frac{x}{1+x}\,\mathrm{d}x\)
            marks:
              - code: dM1
                note: Multiplies through by their integrating factor and integrates \(\ln(1+x)\) by parts to the form \(\alpha x\ln(1+x)-\int g(x)\,\mathrm{d}x\), or uses \(\int\ln u\,\mathrm{d}u=u\ln u-u\) with \(u=1+x\).
          - scheme: |
              \(\phantom{(1+x)y} = (1+x)\ln(1+x)-x\ (+c)\)
            marks:
              - code: A1
                note: oe, such as \((1+x)\ln(1+x)-(1+x)\).
          - scheme: |
              \(y=\ln(1+x)+\frac{c-x}{1+x}\)
            marks:
              - code: A1
                note: cso. Any equivalent form \(y=\ldots\) with the arbitrary constant divided by \(1+x\). Accept \(\ln|1+x|\).
      - part: b
        rows:
          - scheme: |
              \(-1=\ln 1+\frac{c-0}{1+0}\Rightarrow c=-1\)
              \(0=\ln(1+x)-1\Rightarrow x=\ldots\)
            marks:
              - code: M1
                note: Substitutes \(x=0\), \(y=-1\) into their general solution containing an arbitrary constant, then sets \(y=0\) and solves for \(x\).
          - scheme: |
              \(x=e-1\)
            marks:
              - code: A1
                note: Or awrt 1.72.
  - q: 4
    stamp: 84b6d238
    parts:
      - part: a
        rows:
          - scheme: |
              \(\frac{\mathrm{d}}{\mathrm{d}x}\ln(\sec x+\tan x)=\frac{\sec x\tan x+\sec^2 x}{\sec x+\tan x}\)
            marks:
              - code: M1
                note: Obtains a quotient of the form \(\frac{f'(x)}{\sec x+\tan x}\) with an attempt at \(f'(x)\). Condone one slip in the derivatives of \(\sec x\) or \(\tan x\).
          - scheme: |
              \(\phantom{A}=\frac{\sec x(\tan x+\sec x)}{\sec x+\tan x}=\sec x\)
            marks:
              - code: A1 AG
                note: Correct derivative simplified without error to \(\sec x\), by factorising or otherwise. A0 for a jump from the quotient to \(\sec x\) with no simplification shown.
      - part: b
        rows:
          - scheme: |
              \(e^{\int -2\tan x\,\mathrm{d}x}=e^{-2\ln \sec x}\)
            marks:
              - code: M1
                note: Attempts \(e^{\int -2\tan x\,\mathrm{d}x}\), integrating \(\tan x\) to \(\pm\ln\sec x\) or \(\pm\ln\cos x\). Condone sign slips and a missing modulus.
          - scheme: |
              \(\cos^2 x\)
            marks:
              - code: A1
                note: oe such as \(\frac{1}{\sec^2 x}\); not left in exponential form.
          - scheme: |
              \(y\cos^2 x=\int \sec x\,\mathrm{d}x\)
              \(\phantom{y\cos^2 x}=\ln(\sec x+\tan x)+c\)
            marks:
              - code: dM1
                note: Writes \(y\times\) their integrating factor \(=\int\) their integrating factor \(\times\sec^3 x\,\mathrm{d}x\) and integrates, using part (a) where the integrand is \(\sec x\).
          - scheme: |
              \(y=\sec^2 x\bigl(\ln(\sec x+\tan x)+c\bigr)\)
            marks:
              - code: A1
                note: \(y=\ldots\) oe, with the constant also multiplied by \(\sec^2 x\). Condone a modulus.
  - q: 5
    stamp: fa6ecd28
    parts:
      - part: ''
        rows:
          - scheme: |
              \(e^{\int -\tan x\,\mathrm{d}x} = e^{-\ln(\sec x)}\)
            marks:
              - code: M1
                note: Integrates \(\pm\tan x\) inside the exponential to the form \(\pm\ln(\sec x)\) or \(\pm\ln(\cos x)\). Condone sign slips and a missing modulus.
          - scheme: |
              \(= \cos x\)
            marks:
              - code: A1
                note: oe, such as \(\frac{1}{\sec x}\).
          - scheme: |
              \(y\cos x = \int \frac{\cos x}{\sqrt{1+\sin x}}\,\mathrm{d}x\)
              \(\phantom{y\cos x} = \int u^{-1/2}\,\mathrm{d}u = \ldots\)
            marks:
              - code: dM1
                note: Writes \(y\) times their integrating factor equal to the integral of \(Q\) times it, and integrates to the form \(k\sqrt{1+\sin x}\), by substitution or inspection.
          - scheme: |
              \(\phantom{y\cos x} = 2\sqrt{1+\sin x}\)
            marks:
              - code: A1
          - scheme: |
              \(y = \frac{2\sqrt{1+\sin x}+c}{\cos x}\)
            marks:
              - code: A1
                note: oe, such as \(y\cos x = 2\sqrt{1+\sin x}+c\); constant added before dividing. \(y\) need not be the subject.
  - q: 6
    stamp: 9c3ec1d2
    parts:
      - part: a
        rows:
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}x} + \frac{1}{x^2}y = \frac{1}{x^2}\)
            marks:
              - code: B1
          - scheme: |
              \(e^{\int x^{-2}\,\mathrm{d}x} = e^{\ldots}\)
            marks:
              - code: M1
                note: Uses \(e^{\int P\,\mathrm{d}x}\) with their \(P\) from a form \(\frac{\mathrm{d}y}{\mathrm{d}x} + Py = Q\), raising the power by 1. Not for quoting the formula alone.
          - scheme: |
              \(\int x^{-2}\,\mathrm{d}x = -x^{-1} \Rightarrow e^{-1/x}\)
            marks:
              - code: A1 AG
                note: Correct integral from a correct standard form, leading without error to \(e^{-1/x}\).
      - part: b
        rows:
          - scheme: |
              \(\frac{\mathrm{d}}{\mathrm{d}x}\left(ye^{-1/x}\right) = \frac{e^{-1/x}}{x^2}\)
            marks:
              - code: M1
                note: Multiplies their standard form by \(e^{-1/x}\) and writes LHS as \(\frac{\mathrm{d}}{\mathrm{d}x}(ye^{-1/x})\). Condone slips on RHS.
          - scheme: |
              \(ye^{-1/x} = \int \frac{e^{-1/x}}{x^2}\,\mathrm{d}x = \ldots\)
            marks:
              - code: dM1
                note: Integrates both sides, RHS to the form \(ke^{-1/x}\), by inspection or substitution. The constant need not appear.
          - scheme: |
              \(ye^{-1/x} = e^{-1/x} + c \Rightarrow y = 1 + ce^{1/x}\)
            marks:
              - code: A1
                note: oe, including the unrearranged form. Needs the constant.
          - scheme: |
              \(3 = 1 + ce \Rightarrow c = \ldots\)
            marks:
              - code: M1
                note: Substitutes \(x = 1\), \(y = 3\) into their general solution with an arbitrary constant and solves for the constant.
          - scheme: |
              \(y = 1 + 2e^{1/x - 1}\)
            marks:
              - code: A1
                note: oe, such as \(y = 1 + \frac{2}{e}e^{1/x}\), or with the coefficient awrt 0.736.
  - q: 7
    stamp: db22fc31
    parts:
      - part: ''
        rows:
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}x} - y\coth x = \cosh x\)
              \(e^{-\int \coth x\,\mathrm{d}x} = e^{-\ln(\sinh x)}\)
            marks:
              - code: M1
                note: Divides by \(\sinh x\) and attempts \(e^{\int P\,\mathrm{d}x}\) with \(P = \pm\coth x\), integrating to the form \(\pm\ln(\sinh x)\). Condone a sign slip.
          - scheme: |
              \(\phantom{e^{-\int \coth x\,\mathrm{d}x}} = \frac{1}{\sinh x}\)
            marks:
              - code: A1
                note: oe, such as \(\operatorname{cosech} x\).
          - scheme: |
              \(\frac{y}{\sinh x} = \int \coth x\,\mathrm{d}x\)
            marks:
              - code: dM1
                note: Writes \(y \times\) their integrating factor \(=\int\) (their integrating factor \(\times \cosh x\)) \(\mathrm{d}x\) and attempts the integral.
          - scheme: |
              \(\frac{y}{\sinh x} = \ln(\sinh x) + c\)
            marks:
              - code: A1
                note: Any equivalent form, with the constant.
          - scheme: |
              \(\sinh\bigl(\ln(1+\sqrt{2})\bigr) = 1\)
              \(\Rightarrow 2 = 1(\ln 1 + c) \Rightarrow c = \ldots\)
            marks:
              - code: M1
                note: Substitutes \(x = \ln(1+\sqrt{2})\), \(y = 2\) into their general solution with a constant, evaluating \(\sinh\bigl(\ln(1+\sqrt{2})\bigr)\) by any means, to find \(c\).
          - scheme: |
              \(y = \sinh x\bigl(\ln(\sinh x) + 2\bigr)\)
            marks:
              - code: A1
                note: Any equivalent exact form, such as \(y = \sinh x\ln(\sinh x) + 2\sinh x\).
  - q: 8
