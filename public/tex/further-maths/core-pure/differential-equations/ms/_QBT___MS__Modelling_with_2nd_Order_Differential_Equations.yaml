questions:
  - q: 1
    stamp: 540ffcd7
    parts:
      - part: a.i
        rows:
          - scheme: |
              \(p = 0\)
            marks:
              - code: B1
      - part: a.ii
        rows:
          - scheme: |
              Real suspension is damped, so the amplitude decreases;
              simple harmonic motion keeps a constant amplitude
            marks:
              - code: E1
                note: States that damping (shock absorbers, friction, energy loss) makes oscillations die away, unlike simple harmonic motion's constant amplitude. Either idea alone, clearly expressed, is enough.
      - part: b
        rows:
          - scheme: |
              \(4\lambda^2 + p\lambda + 9 = 0\)
              \(p^2 - 4(4)(9) \geq 0 \Rightarrow p \ldots\)
            marks:
              - code: M1
                note: Uses the discriminant of the auxiliary equation with the condition for real roots. Condone \(>\) for \(\geq\) and a numerical slip.
          - scheme: |
              \(p \geq 12\)
            marks:
              - code: A1
                note: Must include \(p = 12\) and no negative values; condone \(p \leq -12\) also stated if \(p \geq 12\) is then given as the answer.
      - part: c
        rows:
          - figure: 1
            marks:
              - code: B1
                note: Oscillation about the \(t\)-axis with decreasing amplitude, starting at positive \(y\) with zero gradient and crossing the axis.
                feature: shape
  - q: 2
    stamp: 18859d87
    parts:
      - part: a
        rows:
          - scheme: |
              \(\lambda^2+\lambda-6=0 \Rightarrow \lambda=\ldots\)
            marks:
              - code: M1
                note: Forms the auxiliary equation and solves it by factorising with product of constants \(-6\), the formula or completing the square; calculator allowed.
          - scheme: |
              \(\lambda=-3,\ 2\)
              \((E=)\ Ae^{-3t}+Be^{2t}\)
            marks:
              - code: A1
          - scheme: |
              \(-6k=-12 \Rightarrow k=2\)
            marks:
              - code: B1
          - scheme: |
              \(E\) tends to a finite limit \(\Rightarrow B=0\)
            marks:
              - code: B1
                note: \(B=0\) stated or used, the coefficient of \(e^{2t}\) removed.
          - scheme: |
              \(\frac{\mathrm{d}E}{\mathrm{d}t}=-3Ae^{-3t} \Rightarrow -3A=-9 \Rightarrow A=\ldots\)
              \(E=\their{3}e^{-3\ln 2}+\their{2}\)
            marks:
              - code: M1
                note: Differentiates their solution of the form \(Ae^{-3t}+c\), uses \(\frac{\mathrm{d}E}{\mathrm{d}t}=-9\) at \(t=0\) to find \(A\), and substitutes \(t=\ln 2\). Condone sign slips.
          - scheme: |
              \(E=\frac{19}{8}\)
            marks:
              - code: A1
                note: \(\frac{19}{8}\) oe, such as 2.375.
      - part: b
        rows:
          - scheme: |
              \(E\to 2\)
            marks:
              - code: B1ft
                note: ft their constant particular integral, for a solution whose remaining exponential term decays.
  - q: 3
    stamp: 9fe5da11
    parts:
      - part: a
        rows:
          - scheme: |
              \(3k(-0.10) + 2k(0) + 5(0.18) = 0 \Rightarrow k = \ldots\)
            marks:
              - code: M1
                note: Substitutes all three initial values into the differential equation. Condone a sign slip.
          - scheme: |
              \(k = 3\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \(9\lambda^2 + 6\lambda + 5 = 0 \Rightarrow \lambda = \ldots\)
            marks:
              - code: M1
                note: Forms the auxiliary equation with their positive \(k\) and solves it by any means; calculator allowed.
          - scheme: |
              \(\lambda = -\frac13 \pm \frac23 i\)
              \(x = e^{-t/3}\left(A\cos\frac{2t}{3} + B\sin\frac{2t}{3}\right)\)
            marks:
              - code: A1
                note: oe, such as \(Re^{-t/3}\cos\left(\frac{2t}{3} - \alpha\right)\).
          - scheme: |
              \(t = 0,\ x = 0.18 \Rightarrow A = 0.18\)
            marks:
              - code: M1
                note: Uses \(x = 0.18\) at \(t = 0\) in their general solution with two arbitrary constants to find one constant.
          - scheme: |
              \(\frac{\mathrm{d}x}{\mathrm{d}t} = -\frac13 e^{-t/3}\left(A\cos\frac{2t}{3} + B\sin\frac{2t}{3}\right)\)
              \(\phantom{\frac{\mathrm{d}x}{\mathrm{d}t}} + e^{-t/3}\left(-\frac{2A}{3}\sin\frac{2t}{3} + \frac{2B}{3}\cos\frac{2t}{3}\right)\)
              \(t = 0:\ 0 = -\frac13 A + \frac23 B \Rightarrow B = \ldots\)
            marks:
              - code: M1
                note: Differentiates their solution of the form \(e^{pt}(A\cos qt + B\sin qt)\) by the product rule, sets \(\frac{\mathrm{d}x}{\mathrm{d}t} = 0\) at \(t = 0\) and solves. Condone coefficient slips.
          - scheme: |
              \(x = e^{-t/3}\left(0.18\cos\frac{2t}{3} + 0.09\sin\frac{2t}{3}\right)\)
            marks:
              - code: A1
                note: oe, exact or decimal coefficients; needs \(x = \ldots\)
      - part: c
        rows:
          - scheme: |
              \(1.2 + e^{-1.5}\left(\their{0.18}\cos 3 + \their{0.09}\sin 3\right)\)
            marks:
              - code: M1
                note: Substitutes \(t = 4.5\) into their particular solution and adds 1.2.
          - scheme: |
              \(= 1.16\) m
            marks:
              - code: A1
                note: awrt 1.16
      - part: d
        rows:
          - scheme: |
              Spring and damping forces assumed proportional to displacement and velocity
            marks:
              - code: E1
                note: States any valid limitation, such as forces not exactly linear, spring exceeding its elastic limit, or the track's length limiting the motion. Not for a bare ``unrealistic''.
  - q: 4
    stamp: f9efb300
    parts:
      - part: a.i
        rows:
          - scheme: |
              \(m\frac{\mathrm{d}^2x}{\mathrm{d}t^2} = -9mx\)
              \(\Rightarrow \frac{\mathrm{d}^2x}{\mathrm{d}t^2}+9x=0\)
            marks:
              - code: B1
                note: Needs \(F=ma\) with the force as \(-9mx\), leading to the printed equation.
      - part: a.ii
        rows:
          - scheme: |
              Simple harmonic motion
            marks:
              - code: B1
                note: Accept SHM.
      - part: a.iii
        rows:
          - scheme: |
              \(T = \frac{2\pi}{3}\) (s)
            marks:
              - code: B1
                note: Or awrt 2.09.
      - part: a.iv
        rows:
          - scheme: |
              \(\lambda^2+9=0 \Rightarrow \lambda = \ldots\)
            marks:
              - code: M1
                note: Forms the auxiliary equation and solves it, or quotes the solution form for \(\ddot{x} = -\omega^2 x\) with \(\omega = 3\). Implied by a correct general solution.
          - scheme: |
              \(\lambda = \pm 3i\)
              \(x = A\cos 3t + B\sin 3t\)
            marks:
              - code: A1
                note: Needs \(x =\); any letters for the constants.
          - scheme: |
              \(t=0,\ x=1 \Rightarrow A = \ldots\ [=1]\)
            marks:
              - code: M1
                note: Substitutes \(t=0\), \(x=1\) into their general solution with two arbitrary constants.
          - scheme: |
              \(\frac{\mathrm{d}x}{\mathrm{d}t} = -3A\sin 3t + 3B\cos 3t\)
              \(t=0,\ \frac{\mathrm{d}x}{\mathrm{d}t} = -6 \Rightarrow B = \ldots\ [=-2]\)
            marks:
              - code: M1
                note: Differentiates their general solution and substitutes \(t=0\) with \(\frac{\mathrm{d}x}{\mathrm{d}t} = \pm 6\).
          - scheme: |
              \(x = \cos 3t - 2\sin 3t\)
            marks:
              - code: A1
      - part: a.v
        rows:
          - scheme: |
              Amplitude \(= \sqrt{\their{1}^2 + \their{(-2)}^2}\)
            marks:
              - code: M1
                note: Uses \(\sqrt{A^2+B^2}\) with their \(A\) and \(B\), or finds \(R\) in \(R\cos(3t+\alpha)\) oe.
          - scheme: |
              \(= \sqrt{5}\) (m)
            marks:
              - code: A1
                note: Or awrt 2.24.
      - part: b.i
        rows:
          - scheme: |
              \(m\frac{\mathrm{d}^2x}{\mathrm{d}t^2} = -6m\frac{\mathrm{d}x}{\mathrm{d}t} - 9mx\)
              \(\Rightarrow \frac{\mathrm{d}^2x}{\mathrm{d}t^2}+6\frac{\mathrm{d}x}{\mathrm{d}t}+9x=0\)
            marks:
              - code: B1
                note: Needs \(F=ma\) with both forces signed correctly, \(-6m\frac{\mathrm{d}x}{\mathrm{d}t}\) and \(-9mx\), leading to the printed equation.
      - part: b.ii
        rows:
          - scheme: |
              \(\lambda^2+6\lambda+9=0\): \(6^2-4\times 9 = 0\)
              Repeated root, so critically damped
            marks:
              - code: B1
                note: 'Critically damped, with a reason: a repeated root, or discriminant shown to be zero.'
      - part: b.iii
        rows:
          - scheme: |
              \(\lambda^2+6\lambda+9=0 \Rightarrow \lambda = \ldots\)
            marks:
              - code: M1
                note: Forms the auxiliary equation and solves it by any means; may be seen in (b)(ii).
          - scheme: |
              \(\lambda = -3\) (repeated)
            marks:
              - code: A1
          - scheme: |
              \(x = (A+Bt)e^{-3t}\)
            marks:
              - code: A1
                note: Needs \(x =\); any letters for the constants.
      - part: c.i
        rows:
          - scheme: |
              \((x =)\ a\cos 4t + b\sin 4t\)
            marks:
              - code: B1
          - scheme: |
              \(-16a\cos 4t - 16b\sin 4t + 6(-4a\sin 4t + 4b\cos 4t)\)
              \(\phantom{=} + 9(a\cos 4t + b\sin 4t) = 25\cos 4t\)
            marks:
              - code: M1
                note: Differentiates their trial function twice, substitutes into the differential equation and equates coefficients of \(\cos 4t\) and \(\sin 4t\). Condone sign and coefficient slips.
          - scheme: |
              \(-7a+24b=25,\quad -24a-7b=0\)
            marks:
              - code: A1
                note: Both equations correct, oe.
          - scheme: |
              \(\Rightarrow a = \ldots,\ b = \ldots\)
            marks:
              - code: dM1
                note: Solves their pair of simultaneous equations for \(a\) and \(b\) by any means.
          - scheme: |
              \(a = -\frac{7}{25},\ b = \frac{24}{25}\)
            marks:
              - code: A1
          - scheme: |
              \(x = (A+Bt)e^{-3t} \their{- \frac{7}{25}\cos 4t + \frac{24}{25}\sin 4t}\)
              \(t=0,\ x=1 \Rightarrow A = \ldots\ [=\frac{32}{25}]\)
            marks:
              - code: M1
                note: Substitutes \(t=0\), \(x=1\) into a general solution of the form \((A+Bt)e^{-3t} +\) their particular integral.
          - scheme: |
              \(\frac{\mathrm{d}x}{\mathrm{d}t} = (B-3A-3Bt)e^{-3t}\)
              \(\phantom{\frac{\mathrm{d}x}{\mathrm{d}t}} + \frac{28}{25}\sin 4t + \frac{96}{25}\cos 4t\)
              \(t=0,\ \frac{\mathrm{d}x}{\mathrm{d}t}=-6 \Rightarrow B = \ldots\ [=-6]\)
            marks:
              - code: M1
                note: Differentiates their general solution, using the product rule on \(Bte^{-3t}\), and substitutes \(t=0\) with \(\frac{\mathrm{d}x}{\mathrm{d}t} = \pm 6\).
          - scheme: |
              \(x = \left(\frac{32}{25}-6t\right)e^{-3t}\)
              \(\phantom{x =} - \frac{7}{25}\cos 4t + \frac{24}{25}\sin 4t\)
            marks:
              - code: A1
                note: oe; needs \(x =\).
      - part: c.ii
        rows:
          - scheme: |
              \(\left(\frac{32}{25}-6t\right)e^{-3t} \to 0\), \(\omega = 4\)
              \(T = \frac{2\pi}{4}\)
            marks:
              - code: M1
                note: States the exponential terms tend to 0 and uses \(T = \frac{2\pi}{\omega}\) with \(\omega\) from their particular integral.
          - scheme: |
              \(= \frac{\pi}{2} \approx 1.57\), consistent with 1.6
            marks:
              - code: A1
                note: \(\frac{\pi}{2}\) or awrt 1.57, with a conclusion that this is consistent with 1.6.
  - q: 5
    stamp: 6c457f24
    parts:
      - part: a
        rows:
          - scheme: |
              \(\lambda^2+2\lambda+10=0 \Rightarrow \lambda=\ldots\)
            marks:
              - code: M1
                note: Forms the auxiliary equation and solves it by any method; calculator allowed.
          - scheme: |
              \(\lambda=-1\pm 3i\)
              \(q=e^{-t}(A\cos 3t+B\sin 3t)\)
            marks:
              - code: A1
          - scheme: |
              \(q=a\cos 3t+b\sin 3t\)
            marks:
              - code: B1
          - scheme: |
              \(-9a\cos 3t-9b\sin 3t+2(-3a\sin 3t+3b\cos 3t)\)
              \(\phantom{-9a}+10(a\cos 3t+b\sin 3t)=37\cos 3t\)
            marks:
              - code: M1
                note: Differentiates a trial function of the form \(a\cos 3t+b\sin 3t\) twice, substitutes and equates coefficients of \(\cos 3t\) and \(\sin 3t\). Condone sign and coefficient slips.
          - scheme: |
              \(a+6b=37,\quad b-6a=0\)
            marks:
              - code: A1
          - scheme: |
              \(a=1,\quad b=6\)
            marks:
              - code: A1
          - scheme: |
              \(q=e^{-t}(A\cos 3t+B\sin 3t)+\cos 3t+6\sin 3t\)
            marks:
              - code: A1ft
                note: ft their complementary function, with two arbitrary constants, plus their particular integral with numerical coefficients.
          - scheme: |
              \(1=A+1 \Rightarrow A=\ldots\)
            marks:
              - code: M1
                note: Substitutes \(t=0\), \(q=1\) into their general solution with two arbitrary constants.
          - scheme: |
              \(\frac{\mathrm{d}q}{\mathrm{d}t}=-e^{-t}(A\cos 3t+B\sin 3t)\)
              \(\phantom{\frac{\mathrm{d}q}{\mathrm{d}t}=}+e^{-t}(-3A\sin 3t+3B\cos 3t)\)
              \(\phantom{\frac{\mathrm{d}q}{\mathrm{d}t}=}-3\sin 3t+18\cos 3t\)
              \(15=3B-A+18 \Rightarrow B=\ldots\)
            marks:
              - code: M1
                note: Differentiates their general solution, using the product rule on the exponential term, and substitutes \(t=0\), \(\frac{\mathrm{d}q}{\mathrm{d}t}=15\). Condone sign slips.
          - scheme: |
              \(q=\cos 3t+6\sin 3t-e^{-t}\sin 3t\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \(q\approx\cos 3t+6\sin 3t\)
            marks:
              - code: B1
                note: No justification for discarding \(e^{-t}\sin 3t\) is needed.
          - scheme: |
              \(R\cos\alpha=1,\quad R\sin\alpha=6\)
              \(\Rightarrow R=\ldots,\quad \tan\alpha=\ldots\)
            marks:
              - code: M1
                note: Compares coefficients for their \(q\approx p\cos 3t+r\sin 3t\) and finds \(R\) or \(\alpha\). Condone sign slips or \(\tan\alpha=\frac{1}{6}\).
          - scheme: |
              \(R=\sqrt{37}\)
            marks:
              - code: A1
                note: Or awrt 6.08.
          - scheme: |
              \(q\approx\sqrt{37}\cos(3t-\arctan 6)\)
            marks:
              - code: A1
                note: \(\alpha=\arctan 6\) or awrt 1.41, in the stated form \(R\cos(3t-\alpha)\). Values of \(R\) and \(\alpha\) alone, or \(80.5^\circ\), do not score.
  - q: 6
    stamp: 70c56ecf
    parts:
      - part: a
        rows:
          - scheme: |
              \(m\frac{\mathrm{d}^2y}{\mathrm{d}t^2} = -c\frac{\mathrm{d}y}{\mathrm{d}t} - ky\)
              \(\Rightarrow m\frac{\mathrm{d}^2y}{\mathrm{d}t^2} + c\frac{\mathrm{d}y}{\mathrm{d}t} + ky = 0\)
            marks:
              - code: M1
                note: Applies Newton's second law with a spring force proportional to \(y\) and a resistance proportional to \(\frac{\mathrm{d}y}{\mathrm{d}t}\), weight absent or cancelled by the equilibrium tension. Condone sign slips.
              - code: A1
                note: Printed equation, with both forces correctly signed against displacement and motion.
          - scheme: |
              \(m\lambda^2 + c\lambda + k = 0\)
              \(\Rightarrow \lambda = \frac{-c \pm \sqrt{c^2 - 4mk}}{2m}\)
            marks:
              - code: M1
                note: Forms the auxiliary equation and solves it by the quadratic formula or completing the square. Condone sign slips.
          - scheme: |
              \(\lambda = -\frac{c}{2m} \pm i\frac{\sqrt{4km - c^2}}{2m}\)
            marks:
              - code: A1
                note: Needs \(\sqrt{c^2-4km}\) written as \(i\sqrt{4km-c^2}\), oe.
          - scheme: |
              \(y = e^{-\frac{ct}{2m}}\Big(P\cos\left(\frac{\sqrt{4km-c^2}}{2m}t\right)\)
              \(\phantom{y = e^{-\frac{ct}{2m}}\Big(} + Q\sin\left(\frac{\sqrt{4km-c^2}}{2m}t\right)\Big)\)
            marks:
              - code: A1 AG
                note: Printed solution from correct complex roots via \(e^{\alpha t}(P\cos\beta t + Q\sin\beta t)\), with no errors.
      - part: b.i
        rows:
          - scheme: |
              \(y = e^{-3t}(P\cos 4t + Q\sin 4t)\)
            marks:
              - code: B1
          - scheme: |
              \(t = 0,\ y = 0.12 \Rightarrow P = \ldots\)
            marks:
              - code: M1
                note: Substitutes \(t = 0\), \(y = 0.12\) into their solution of the form \(e^{-at}(P\cos bt + Q\sin bt)\).
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}t} = -3e^{-3t}(P\cos 4t + Q\sin 4t)\)
              \(\phantom{\frac{\mathrm{d}y}{\mathrm{d}t} =} + e^{-3t}(-4P\sin 4t + 4Q\cos 4t)\)
              \(t = 0: -3P + 4Q = -0.12 \Rightarrow Q = \ldots\)
            marks:
              - code: M1
                note: Differentiates their solution by the product rule and substitutes \(t = 0\), \(\frac{\mathrm{d}y}{\mathrm{d}t} = -0.12\). Condone sign slips.
          - scheme: |
              \(P = 0.12,\ Q = 0.06\)
            marks:
              - code: A1
      - part: b.ii
        rows:
          - scheme: |
              \(e^{-3t}(0.12\cos 4t + 0.06\sin 4t) = 0\)
              \(\Rightarrow 0.12\cos 4t + 0.06\sin 4t = 0\)
            marks:
              - code: M1
                note: Sets their \(y = 0\) and removes the non-zero exponential factor.
          - scheme: |
              \(\tan 4t = -2\)
            marks:
              - code: A1
                note: oe, including a correct harmonic form equated to zero.
          - scheme: |
              \(4t = \pi - \arctan 2\ [= 2.034\ldots]\)
            marks:
              - code: M1
                note: Finds the smallest positive \(4t\) satisfying their equation, e.g. adds \(\pi\) to a negative principal value.
              - code: A1
                note: oe, or awrt 2.03.
          - scheme: |
              \(t = \frac{\pi - \arctan 2}{4} \approx 0.509\)
            marks:
              - code: A1
                note: Exact form or awrt 0.509.
      - part: c
        rows:
          - scheme: |
              \(5\frac{\mathrm{d}^2y}{\mathrm{d}t^2} + 125y = 0\)
              \(\Rightarrow 5\lambda^2 + 125 = 0 \Rightarrow \lambda = \ldots\)
            marks:
              - code: M1
                note: Sets \(c = 0\) and solves the auxiliary equation by any method.
          - scheme: |
              \(\lambda = \pm 5i\)
              \(y = A\cos 5t + B\sin 5t\)
            marks:
              - code: A1
          - scheme: |
              \(t = 0,\ y = 0.12 \Rightarrow A = \ldots\)
            marks:
              - code: M1
                note: Substitutes \(t = 0\), \(y = 0.12\) into their solution of the form \(A\cos\omega t + B\sin\omega t\).
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}t} = -5A\sin 5t + 5B\cos 5t\)
              \(t = 0: 5B = -0.12 \Rightarrow B = \ldots\)
            marks:
              - code: M1
                note: Differentiates their solution and substitutes \(t = 0\), \(\frac{\mathrm{d}y}{\mathrm{d}t} = -0.12\). Condone sign slips.
          - scheme: |
              \(y = 0.12\cos 5t - 0.024\sin 5t\)
            marks:
              - code: A1
                note: \(y\) in terms of \(t\), oe such as a correct harmonic form, constants to 2 s.f.; A0 for \(A\) and \(B\) stated alone.
  - q: 7
    stamp: d94f0d8e
    parts:
      - part: a
        rows:
          - scheme: |
              \(4\lambda^2+4\lambda+5=0 \Rightarrow \lambda=\ldots\)
