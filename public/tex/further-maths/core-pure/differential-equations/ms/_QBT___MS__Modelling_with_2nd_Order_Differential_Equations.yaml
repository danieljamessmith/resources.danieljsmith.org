              \(\frac{\mathrm{d}m}{\mathrm{d}t}=-\tfrac12e^{-t/2}(A\cos t+B\sin t)\)
              \(\phantom{\frac{\mathrm{d}m}{\mathrm{d}t}=}+e^{-t/2}(-A\sin t+B\cos t)\)
