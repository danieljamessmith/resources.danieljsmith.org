            marks:
              - code: M1
                note: Differentiates their general solution by the product rule, both terms present, and substitutes \(t=0\), \(\frac{\mathrm{d}m}{\mathrm{d}t}=5\). Condone sign slips.
          - scheme: |
              \(m=4+e^{-t/2}(-4\cos t+3\sin t)\)
            marks:
              - code: A1
          - scheme: |
              \(\frac{\mathrm{d}m}{\mathrm{d}t}=e^{-t/2}\left(\tfrac52\sin t+5\cos t\right)=0\)
            marks:
              - code: M1
                note: Differentiates their particular solution by the product rule and sets the derivative to 0. Need not be simplified.
          - scheme: |
              \(\tan t=-2\)
            marks:
              - code: A1
                note: oe
          - scheme: |
              \(t=\pi-\arctan 2\ [\approx 2.03]\)
            marks:
              - code: A1
                note: oe, or awrt 2.03. No justification that this gives the greatest value is required.
          - scheme: |
              \(m=4+e^{-\their{2.03}/2}\left(-4\cos\their{2.03}+3\sin\their{2.03}\right)\)
              \(\phantom{m}=\ldots\)
            marks:
              - code: dM1
                note: Substitutes their first positive root of \(\frac{\mathrm{d}m}{\mathrm{d}t}=0\) into their particular solution.
          - scheme: |
              \(m_{\max}\approx 5.62\) (kg)
            marks:
              - code: A1
                note: awrt 5.62, or exact \(4+2\sqrt5\,e^{-(\pi-\arctan 2)/2}\).
      - part: c
        rows:
          - scheme: |
              \(m(8)=4+e^{-4}(-4\cos 8+3\sin 8)=\ldots\)
            marks:
              - code: M1
                note: Substitutes \(t=8\) into their particular solution from (b), in radians, and evaluates.
          - scheme: |
              \(m(8)\approx 4.065>4.05\), so no label is printed
            marks:
              - code: A1
                note: awrt 4.07 (or 4.065), compared with 4.05, and concludes no label is printed.
