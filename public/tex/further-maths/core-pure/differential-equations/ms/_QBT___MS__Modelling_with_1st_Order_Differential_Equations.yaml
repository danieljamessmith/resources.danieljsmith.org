questions:
  - q: 1
    stamp: 2f508efc
    parts:
      - part: a
        rows:
          - scheme: |
              \(2\frac{\mathrm{d}v}{\mathrm{d}t} = \frac{12t-4v}{1+t}\)
              \(\Rightarrow \frac{\mathrm{d}v}{\mathrm{d}t}+\frac{\ldots}{1+t}v = \ldots\)
            marks:
              - code: M1
                note: Uses \(F=ma\) with acceleration \(\frac{\mathrm{d}v}{\mathrm{d}t}\) and collects the \(v\) term on the LHS. Condone a slip dividing by the mass.
          - scheme: |
              \(P(t)=\frac{2}{1+t}\), \(Q(t)=\frac{6t}{1+t}\)
            marks:
              - code: A1
                note: Both correct, oe.
      - part: b
        rows:
          - scheme: |
              \(e^{\int \frac{2}{1+t}\,\mathrm{d}t}\)
            marks:
              - code: M1
                note: Uses \(e^{\int P\,\mathrm{d}t}\) with their \(P(t)\) of the form \(\frac{k}{1+t}\).
          - scheme: |
              \(= e^{2\ln(1+t)} = (1+t)^2\)
            marks:
              - code: A1
          - scheme: |
              \((1+t)^2v = \int 6t(1+t)\,\mathrm{d}t\)
            marks:
              - code: dM1
                note: Writes LHS as their integrating factor times \(v\), and integrates their \(Q(t)\) times it, at least one power increased by 1.
          - scheme: |
              \((1+t)^2v = 3t^2+2t^3+c\)
            marks:
              - code: A1
                note: Constant required; oe.
          - scheme: |
              \(t=0,\ v=-5 \Rightarrow c = \ldots\ [=-5]\)
            marks:
              - code: M1
                note: Substitutes \(t=0\), \(v=-5\) into their general solution containing a constant.
          - scheme: |
              \(v=\frac{2t^3+3t^2-5}{(1+t)^2}\)
            marks:
              - code: A1
                note: oe.
          - scheme: |
              \(2t^3+3t^2-5=0\)
              \(\Rightarrow (t-1)(2t^2+5t+5)=0\)
            marks:
              - code: M1
                note: Sets their numerator equal to zero and finds a root by any means, e.g. factor theorem then factorising; a calculator root is accepted.
          - scheme: |
              \(2t^2+5t+5>0\) for \(t\ge 0\) \(\Rightarrow t=1\)
            marks:
              - code: A1
                note: \(t=1\) with the quadratic factor shown non-zero for \(t\ge0\) (negative discriminant or positive terms), or another argument excluding an earlier root.
  - q: 2
    stamp: cdbe1640
    parts:
      - part: a
        rows:
          - scheme: |
              \(V = 600 + 20t - 30t = 600 - 10t\)
            marks:
              - code: B1
                note: oe, e.g. \(10(60-t)\).
          - scheme: |
              Rate in \(= 20 \times 3 = 60\)
            marks:
              - code: B1
          - scheme: |
              Rate out \(= 30 \times \frac{x}{600 - 10t}\)
            marks:
              - code: M1
                note: Uses outflow rate \(\times\) \(x\) over their volume, where the volume depends on \(t\). Not for \(\frac{x}{600}\).
          - scheme: |
              \(\frac{\mathrm{d}x}{\mathrm{d}t} = 60 - \frac{30x}{600 - 10t} = 60 - \frac{3x}{60 - t}\)
            marks:
              - code: A1 AG
                note: Rate in minus rate out, both correct, leading without error to the printed equation; combined simplification accepted.
      - part: b
        rows:
          - scheme: |
              \(\frac{\mathrm{d}x}{\mathrm{d}t} + \frac{3x}{60-t} = 60\)
              \(\Rightarrow \mu = e^{\int \frac{3}{60-t}\,\mathrm{d}t}\)
            marks:
              - code: M1
                note: Rearranges to \(\frac{\mathrm{d}x}{\mathrm{d}t} + Px = Q\) and forms \(e^{\int P\,\mathrm{d}t}\) with \(P = \pm\frac{3}{60-t}\). Condone a sign slip.
          - scheme: |
              \(\phantom{\Rightarrow \mu} = (60-t)^{-3}\)
            marks:
              - code: A1
                note: oe, e.g. \(\frac{1}{(60-t)^3}\).
          - scheme: |
              \(\frac{x}{(60-t)^3} = \int 60(60-t)^{-3}\,\mathrm{d}t\)
            marks:
              - code: dM1
                note: Writes LHS as \(x \times\) their integrating factor and integrates RHS, at least one power increased by 1. Condone sign and coefficient slips.
          - scheme: |
              \(\frac{x}{(60-t)^3} = 30(60-t)^{-2} + c\)
            marks:
              - code: A1
                note: Must include the constant; oe, e.g. \(x = 30(60-t) + c(60-t)^3\).
          - scheme: |
              \(t = 0,\ x = 0 \Rightarrow c = \ldots\ [= -\tfrac{1}{120}]\)
              \(t = 30 \Rightarrow x = \ldots\)
            marks:
              - code: M1
                note: Uses \(x = 0\) at \(t = 0\) in their general solution with a constant to find it, then substitutes \(t = 30\).
          - scheme: |
              \(x = 675\)
            marks:
              - code: A1
      - part: c
        rows:
          - scheme: |
              Mixing is not instant or uniform; refine by letting the concentration vary through the tank
            marks:
              - code: E1
                note: States a valid limitation, such as non-instant mixing or non-constant flow rates, and a refinement addressing it. Both needed.
  - q: 3
    stamp: fa88be45
    parts:
      - part: a
        rows:
          - scheme: |
              \(V = 600 - 3t\)
            marks:
              - code: B1
                note: oe, eg \(3(200-t)\).
          - scheme: |
              Rate in \(= 6 \times 2 = 12\)
            marks:
              - code: B1
          - scheme: |
              Rate out \(= 9 \times \dfrac{x}{600-3t}\)
            marks:
              - code: M1
                note: Multiplies 9 by \(x\) divided by their volume, which must be a linear expression in \(t\).
          - scheme: |
              \(\dfrac{\mathrm{d}x}{\mathrm{d}t} = 12 - \dfrac{9x}{600-3t} = 12 - \dfrac{3x}{200-t}\)
            marks:
              - code: A1 AG
                note: Rate in minus correct rate out, leading without error to the printed equation; cancelling by 3 may be combined.
      - part: b
        rows:
          - scheme: |
              \(\dfrac{\mathrm{d}x}{\mathrm{d}t} + \dfrac{3}{200-t}x = 12\)
              \(\Rightarrow e^{\int \frac{3}{200-t}\,\mathrm{d}t} = e^{-3\ln(200-t)}\)
            marks:
              - code: M1
                note: Attempts \(e^{\int P\,\mathrm{d}t}\) with \(P = \pm\frac{3}{200-t}\), integrating to the form \(k\ln(200-t)\). Condone sign slips.
          - scheme: |
              \(= (200-t)^{-3}\)
            marks:
              - code: A1
                note: oe, eg \(\frac{1}{(200-t)^3}\).
          - scheme: |
              \(x(200-t)^{-3} = \int 12(200-t)^{-3}\,\mathrm{d}t = \ldots\)
            marks:
              - code: dM1
                note: Multiplies through by their integrating factor, LHS as \(x \times\) their factor, and integrates the RHS with the power of \((200-t)\) increased by 1.
          - scheme: |
              \(x = 6(200-t) + c(200-t)^3\)
            marks:
              - code: A1
                note: oe, including \(x(200-t)^{-3} = 6(200-t)^{-2} + c\). Constant required.
          - scheme: |
              \(t = 0,\ x = 0\)
              \(\Rightarrow 0 = 1200 + 200^3 c \Rightarrow c = \ldots\)
            marks:
              - code: M1
                note: Substitutes \(t = 0\), \(x = 0\) into their general solution containing a constant and solves for it.
          - scheme: |
              \(x = 6(200-t) - \frac{3}{20000}(200-t)^3\)
            marks:
              - code: A1
                note: oe.
          - scheme: |
              \(\dfrac{\text{"}x\text{"}}{3(200-t)} = 1.5\)
              \(\Rightarrow (200-t)^2 = 10000 \Rightarrow t = \ldots\)
            marks:
              - code: M1
                note: Sets their \(x\) divided by their volume equal to 1.5, or their \(x\) equal to 1.5 times their volume, and solves for \(t\).
          - scheme: |
              \(t = 100\) (minutes)
            marks:
              - code: A1
                note: A0 if \(t = 300\) is also given as an answer.
      - part: c
        rows:
          - scheme: |
              Allow the concentration to vary within the tank (non-uniform mixing)
            marks:
              - code: E1
                note: States a refinement changing a modelling assumption, eg non-uniform mixing, time to dissolve, variable flow rates. Not for vague accuracy comments.
  - q: 4
    stamp: e722a7f3
    parts:
      - part: a
        rows:
          - scheme: |
              (i) \(V = 15\) litres
            marks:
              - code: B1
                note: Or 15000 ml.
          - scheme: |
              (ii) Rate in \(= 0.2(4+e^{-0.1t})\)
              \(\phantom{(ii) Rate in} = 0.8+0.2e^{-0.1t}\)
            marks:
              - code: B1
                note: oe, such as \(\frac{200}{1000}(4+e^{-0.1t})\).
          - scheme: |
              Rate out \(= 0.3 \times \frac{m}{15}\)
            marks:
              - code: M1
                note: Forms rate out as the outflow rate times \(m\) divided by their constant volume from (i), in consistent units.
          - scheme: |
              \(\frac{\mathrm{d}m}{\mathrm{d}t} = 0.8+0.2e^{-0.1t}-\frac{m}{50}\)
            marks:
              - code: A1 AG
                note: Rate in minus rate out, both correct, leading without error to the printed equation.
      - part: b
        rows:
          - scheme: |
              \(e^{\int \frac{1}{50}\,\mathrm{d}t} = e^{t/50}\)
            marks:
              - code: B1
                note: oe, such as \(e^{0.02t}\).
          - scheme: |
              \(me^{t/50} = \int \left(0.8e^{t/50}+0.2e^{-0.08t}\right)\mathrm{d}t\)
              \(\phantom{me^{t/50}} = \ldots\)
            marks:
              - code: M1
                note: Writes LHS as \(m\) times their integrating factor of the form \(e^{kt}\), multiplies the RHS by it and integrates at least one term to the form \(pe^{qt}\).
          - scheme: |
              \(me^{t/50} = 40e^{t/50}-2.5e^{-0.08t}+c\)
            marks:
              - code: A1
                note: oe, including \(m = 40-2.5e^{-0.1t}+ce^{-0.02t}\). Constant required.
          - scheme: |
              \(t=0,\ m=6 \Rightarrow 6 = 40-2.5+c \Rightarrow c = \ldots\)
            marks:
              - code: M1
                note: Substitutes \(t=0\), \(m=6\) into their general solution containing a constant and solves for it.
          - scheme: |
              \(m = 40-2.5e^{-0.1t}-31.5e^{-0.02t}\)
            marks:
              - code: A1
                note: oe, with \(m\) as the subject.
      - part: c
        rows:
          - scheme: |
              \(\frac{m(30)}{15} = \frac{40-2.5e^{-3}-31.5e^{-0.6}}{15} = \ldots\)
            marks:
              - code: M1
                note: Substitutes \(t=30\) into their \(m\) and divides by their volume from (a)(i).
          - scheme: |
              \(= 1.51\), close to \(1.52\), so the model is good
            marks:
              - code: A1ft
                note: 'ft their \(m\): their value (awrt 1.51 if correct) compared with 1.52, concluding the model is good if within 1.44 to 1.60, poor otherwise.'
  - q: 5
    stamp: 91b49b6c
    parts:
      - part: a
        rows:
          - scheme: |
              \(2\frac{\mathrm{d}v}{\mathrm{d}t}=-2t(v+3)\)
              \(\Rightarrow \frac{\mathrm{d}v}{\mathrm{d}t}+tv=-3t\)
            marks:
              - code: M1
                note: Uses \(F=ma\) with mass 2 and acceleration \(\frac{\mathrm{d}v}{\mathrm{d}t}\), and rearranges to the given form. Condone sign slips.
          - scheme: |
              \(P(t)=t,\ Q(t)=-3t\)
            marks:
              - code: A1
                note: Both correct.
      - part: b
        rows:
          - scheme: |
              \(e^{\int t\,\mathrm{d}t}=e^{t^2/2}\)
            marks:
              - code: B1
          - scheme: |
              \(ve^{t^2/2}=\int -3te^{t^2/2}\,\mathrm{d}t\)
              \(\phantom{ve^{t^2/2}}=-3e^{t^2/2}+c\)
            marks:
              - code: M1
                note: Multiplies through by their integrating factor of the form \(e^{f(t)}\) and integrates both sides, RHS to the form \(ke^{t^2/2}\). Condone sign and coefficient slips.
              - code: A1
                note: Correct, with constant, oe such as \(v=-3+ce^{-t^2/2}\).
          - scheme: |
              \(5=-3+c\Rightarrow c=\ldots\)
            marks:
              - code: M1
                note: Substitutes \(t=0\), \(v=5\) into their general solution containing a constant to find it.
          - scheme: |
              \(v=-3+8e^{-t^2/2}\)
            marks:
              - code: A1
                note: oe, with \(v\) the subject.
          - scheme: |
              \(8e^{-t^2/2}=3\Rightarrow -\frac{t^2}{2}=\ln\frac38\)
              \(\Rightarrow t^2=\ldots\)
            marks:
              - code: M1
                note: Sets their \(v\) of the form \(a+be^{-t^2/2}\) to zero and takes logarithms correctly to reach \(t^2=\ldots\) or \(t=\ldots\).
          - scheme: |
              \(t=\sqrt{2\ln\frac83}\ [\approx 1.40]\)
            marks:
              - code: A1
                note: Exact form or awrt 1.40, positive value only.
  - q: 6
    stamp: 581319d7
    parts:
      - part: a
        rows:
          - scheme: |
              \(e^{\int(1-\cot t)\,\mathrm{d}t} = e^{t-\ln(\sin t)}\)
            marks:
              - code: M1
                note: Uses \(e^{\int(1-\cot t)\,\mathrm{d}t}\) and integrates at least one term correctly.
          - scheme: |
              \(\phantom{e^{\int}} = \frac{e^t}{\sin t}\)
            marks:
              - code: A1
                note: oe, e.g. \(e^t\operatorname{cosec} t\).
          - scheme: |
              \(\frac{\mathrm{d}}{\mathrm{d}t}\left(\frac{e^t}{\sin t}R\right) = \frac{1}{1+t^2}\)
              \(\Rightarrow \frac{e^t}{\sin t}R = \int\frac{1}{1+t^2}\,\mathrm{d}t = \ldots\)
            marks:
              - code: dM1
                note: Multiplies through by their integrating factor, takes LHS as their factor \(\times R\), and integrates RHS to the form \(k\arctan t\). Constant may be absent.
          - scheme: |
              \(\frac{e^t}{\sin t}R = \arctan t + c\)
            marks:
              - code: A1
                note: Must include the constant; \(R\) need not be the subject.
          - scheme: |
              \(\pi e^{-1}\sin 1 = e^{-1}\sin 1\,(\arctan 1 + c)\)
              \(\Rightarrow c = \ldots\)
            marks:
              - code: M1
                note: Substitutes \(t = 1\), \(R = \pi e^{-1}\sin 1\) into their general solution containing a constant and solves for it.
          - scheme: |
              \(\pi = \frac{\pi}{4} + c \Rightarrow c = \frac{3\pi}{4}\)
              \(R = e^{-t}\sin t\left(\arctan t + \frac{3\pi}{4}\right)\)
            marks:
              - code: A1 AG
                note: cso. Correct substituted equation with \(\arctan 1 = \frac{\pi}{4}\), leading without error to the printed \(R\).
      - part: b
        rows:
          - scheme: |
              \(R = 0\), \(e^{-t} > 0\), \(\arctan t + \frac{3\pi}{4} > 0\)
              \(\Rightarrow \sin t = 0\)
            marks:
              - code: M1
                note: Sets \(R = 0\) and reduces to \(\sin t = 0\). No justification that the other factors are nonzero is needed.
          - scheme: |
              \(t = \pi\) seconds
            marks:
              - code: A1
                note: Or awrt 3.14. A0 for \(t = n\pi\) without selecting \(\pi\).
      - part: c
        rows:
          - scheme: |
              \(\frac{\mathrm{d}R}{\mathrm{d}t} = -e^{-t}\sin t\left(\arctan t + \frac{3\pi}{4}\right)\)
              \(\phantom{\frac{\mathrm{d}R}{\mathrm{d}t}} + e^{-t}\cos t\left(\arctan t + \frac{3\pi}{4}\right)\)
              \(\phantom{\frac{\mathrm{d}R}{\mathrm{d}t}} + \frac{e^{-t}\sin t}{1+t^2}\)
            marks:
              - code: M1
                note: Uses the product rule, giving a sum of terms each with one factor differentiated. Condone sign and coefficient slips.
              - code: A1
                note: oe; need not be simplified.
          - scheme: |
              \(t = 0 \Rightarrow \frac{\mathrm{d}R}{\mathrm{d}t} = \frac{3\pi}{4}\)
            marks:
              - code: A1
  - q: 7
    stamp: e2dcef58
    parts:
      - part: a
        rows:
          - scheme: |
              \(\frac{\mathrm{d}V}{\mathrm{d}t}-\frac{3-2t}{3t-t^2}V=\frac{3t-t^2}{1+(t-1)^2}\)
              \(e^{\int -\frac{3-2t}{3t-t^2}\,\mathrm{d}t} = \ldots\)
            marks:
              - code: M1
                note: Divides by \(3t-t^2\) and uses \(e^{\int P\,\mathrm{d}t}\) with their \(P\). Condone a sign slip in \(P\).
          - scheme: |
              \(e^{-\ln(3t-t^2)}=\frac{1}{3t-t^2}\)
            marks:
              - code: A1
          - scheme: |
              \(\frac{\mathrm{d}}{\mathrm{d}t}\left(\frac{V}{3t-t^2}\right)=\frac{1}{1+(t-1)^2}\)
              \(\Rightarrow \frac{V}{3t-t^2}=\ldots\)
            marks:
              - code: dM1
                note: Multiplies through by their integrating factor, writes the LHS as the derivative of \(V \times\) it, and integrates the RHS to a form \(k\arctan(t-1)\).
          - scheme: |
              \(\frac{V}{3t-t^2}=\arctan(t-1)+c\)
            marks:
              - code: A1
          - scheme: |
              \(\frac{4}{3-1}=\arctan 0+c \Rightarrow c=\ldots\)
            marks:
              - code: M1
                note: Substitutes \(t=1\), \(V=4\) into their general solution containing a constant and solves for the constant.
          - scheme: |
              \(c=2\)
              \(\Rightarrow V=(3t-t^2)\left(\arctan(t-1)+2\right)\)
            marks:
              - code: A1 AG
                note: Correct substituted condition giving \(c=2\), leading without error to the printed result.
      - part: b
        rows:
          - scheme: |
              \((3t-t^2)\left(\arctan(t-1)+2\right)=0\)
              \(\arctan(t-1)+2>2-\frac{\pi}{2}>0\)
              \(\Rightarrow 3t-t^2=0 \Rightarrow t=\ldots\)
            marks:
              - code: M1
                note: Sets \(V=0\) and solves \(3t-t^2=0\). No justification that \(\arctan(t-1)+2\neq 0\) is needed.
          - scheme: |
              \(t=3\): the pulse lasts 3 seconds
            marks:
              - code: A1
                note: 3 alone selected as the length; A0 if \(t=0\) is also given as an answer.
      - part: c
        rows:
          - scheme: |
              \(\frac{\mathrm{d}V}{\mathrm{d}t}=(3-2t)\left(\arctan(t-1)+2\right)\)
              \(\phantom{\frac{\mathrm{d}V}{\mathrm{d}t}}+\frac{3t-t^2}{1+(t-1)^2}\)
            marks:
              - code: M1
                note: 'Uses the product rule: a sum of two products, each with one factor differentiated. Condone slips in the derivatives.'
              - code: A1
          - scheme: |
              \(t=0\): \(3\left(\arctan(-1)+2\right)=6-\frac{3\pi}{4}\)
            marks:
              - code: A1
                note: oe exact, such as \(3\left(2-\frac{\pi}{4}\right)\).
  - q: 8
    stamp: c3dc9d24
    parts:
      - part: a.i
        rows:
          - scheme: |
              \(\frac{\mathrm{d}C}{\mathrm{d}t} = -kC\)
            marks:
              - code: B1
                note: oe, with the sign showing a decrease; any letter for the constant.
      - part: a.ii
        rows:
          - scheme: |
              \(\frac{\mathrm{d}C}{\mathrm{d}t} = -kAe^{-kt}\)
            marks:
              - code: M1
                note: Differentiates to the form \(pAe^{-kt}\) and substitutes into, or compares with, their equation from (a)(i).
          - scheme: |
              \(\phantom{\frac{\mathrm{d}C}{\mathrm{d}t}} = -kC\)
            marks:
              - code: A1
                note: Correct derivative shown equal to \(-kC\), with a statement that the equation is satisfied.
          - scheme: |
              \(C(0) = Ae^{0} = A\)
              \(k>0 \Rightarrow e^{-kt} \to 0 \Rightarrow C \to 0\)
            marks:
              - code: B1
                note: Both conditions shown.
      - part: b
        rows:
          - scheme: |
              \(e^{\int \frac{2t}{1+t^2}\,\mathrm{d}t} = e^{\ln(1+t^2)}\)
            marks:
              - code: M1
                note: Uses \(e^{\int P\,\mathrm{d}t}\) and integrates to the form \(\lambda\ln(1+t^2)\).
          - scheme: |
              \(\phantom{e^{\int}} = 1+t^2\)
            marks:
              - code: A1 AG
                note: From \(e^{\ln(1+t^2)}\) without error.
      - part: c.i
        rows:
          - scheme: |
              \(\frac{\mathrm{d}}{\mathrm{d}t}\left((1+t^2)C\right) = 0\)
              \(\Rightarrow (1+t^2)C = K\)
            marks:
              - code: M1
                note: Multiplies by \(1+t^2\) and integrates, LHS to \((1+t^2)C\); or separates variables and integrates both sides.
              - code: A1
                note: oe, with a constant.
          - scheme: |
              \(t=0,\ C=A \Rightarrow K = \ldots\ [=A]\)
            marks:
              - code: M1
                note: Substitutes \(t=0\), \(C=A\) into their solution with a constant to find it.
          - scheme: |
              \(C = \frac{A}{1+t^2}\)
            marks:
              - code: A1 AG
                note: From a correct general solution and \(K=A\), without error.
      - part: c.ii
        rows:
          - scheme: |
              \(\frac{A}{1+t^2} = \frac{A}{2} \Rightarrow t = \ldots\)
            marks:
              - code: M1
                note: Sets the given expression equal to \(\frac{A}{2}\) and solves for \(t\).
          - scheme: |
              \(t = 1\) hour \(= 60\) minutes
            marks:
              - code: A1
                note: 60 minutes or 1 hour, with no negative value given as the answer.
      - part: d
        rows:
          - scheme: |
              \((1+t^2)\frac{\mathrm{d}C}{\mathrm{d}t} + 2tC = te^{-t}\)
              \(\Rightarrow \frac{\mathrm{d}}{\mathrm{d}t}\left((1+t^2)C\right) = te^{-t}\)
            marks:
              - code: M1
                note: Multiplies through by \(1+t^2\); RHS need not be simplified.
              - code: A1
                note: LHS as the derivative of \((1+t^2)C\), or implied by integrating to \((1+t^2)C\).
          - scheme: |
              \(\int te^{-t}\,\mathrm{d}t = -te^{-t} + \int e^{-t}\,\mathrm{d}t\)
            marks:
              - code: M1
                note: Integrates by parts with \(u=t\), reaching the form \(\pm te^{-t} \pm \int e^{-t}\,\mathrm{d}t\). Condone sign slips.
          - scheme: |
              \((1+t^2)C = -(1+t)e^{-t} + K\)
            marks:
              - code: A1
                note: oe, with a constant.
          - scheme: |
              \(t=0,\ C=A \Rightarrow A = -1 + K\)
              \(\Rightarrow K = \ldots\)
            marks:
              - code: M1
                note: Substitutes \(t=0\), \(C=A\) into their solution with a constant to find it.
          - scheme: |
              \(C = \frac{A+1-(1+t)e^{-t}}{1+t^2}\)
            marks:
              - code: A1 AG
                note: From a correct general solution and \(K=A+1\), without error.
      - part: e
        rows:
          - scheme: |
              \(\frac{6-(1+t)e^{-t}}{1+t^2} = 2.5 \Rightarrow t = \ldots\)
            marks:
              - code: M1
                note: Sets model (d) with \(A=5\) equal to 2.5 and solves for \(t\); calculator or numerical method accepted.
          - scheme: |
              \(t = 1.055\ldots\) hours \(\approx 63\) minutes
              Closer to 63 than 60, so model (d)
            marks:
              - code: A1ft
