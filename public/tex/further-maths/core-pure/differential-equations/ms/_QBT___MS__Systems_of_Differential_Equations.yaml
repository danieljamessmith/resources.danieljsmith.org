questions:
  - q: 1
    stamp: b6028e73
    parts:
      - part: a
        rows:
          - scheme: |
              \(\frac{\mathrm{d}^2x}{\mathrm{d}t^2}+\frac{\mathrm{d}y}{\mathrm{d}t}=5\frac{\mathrm{d}x}{\mathrm{d}t}\)
              \(\Rightarrow \frac{\mathrm{d}^2x}{\mathrm{d}t^2}+6x-2y=5\frac{\mathrm{d}x}{\mathrm{d}t}\)
            marks:
              - code: M1
                note: Differentiates the first equation and replaces \(\frac{\mathrm{d}y}{\mathrm{d}t}\) using the second. Condone sign slips.
          - scheme: |
              \(\frac{\mathrm{d}^2x}{\mathrm{d}t^2}+6x-2\left(5x-\frac{\mathrm{d}x}{\mathrm{d}t}\right)=5\frac{\mathrm{d}x}{\mathrm{d}t}\)
            marks:
              - code: dM1
                note: Substitutes \(y\) from the first equation to reach an equation in \(x\) and its derivatives only. Condone sign slips.
          - scheme: |
              \(\frac{\mathrm{d}^2x}{\mathrm{d}t^2}-3\frac{\mathrm{d}x}{\mathrm{d}t}-4x=0\)
            marks:
              - code: A1 AG
                note: Correct substituted equation leading without error to the printed result; collected steps accepted.
      - part: b
        rows:
          - scheme: |
              \(\lambda^2-3\lambda-4=0 \Rightarrow \lambda=\ldots\)
            marks:
              - code: M1
                note: Forms the auxiliary equation and solves it by any method, calculator allowed.
          - scheme: |
              \(\lambda=4,\ -1\)
              \(x=Ae^{4t}+Be^{-t}\)
            marks:
              - code: A1
          - scheme: |
              \(\frac{\mathrm{d}x}{\mathrm{d}t}=4Ae^{4t}-Be^{-t}\)
              \(y=5\left(Ae^{4t}+Be^{-t}\right)-\left(4Ae^{4t}-Be^{-t}\right)\)
            marks:
              - code: M1
                note: Differentiates their \(x\), of the form \(Ae^{pt}+Be^{qt}\), and substitutes into \(y=5x-\frac{\mathrm{d}x}{\mathrm{d}t}\). Condone sign slips.
          - scheme: |
              \(y=Ae^{4t}+6Be^{-t}\)
            marks:
              - code: A1
          - scheme: |
              \(A+B=1,\quad A+6B=3\)
            marks:
              - code: M1
                note: Substitutes \(t=0\), \(x=1\) and \(y=3\) into their \(x\) and \(y\) to form two equations in \(A\) and \(B\).
          - scheme: |
              \(\Rightarrow A=\ldots,\ B=\ldots\)
            marks:
              - code: dM1
                note: Solves their two equations by any means, calculator allowed.
          - scheme: |
              \(x=\frac35e^{4t}+\frac25e^{-t}\)
              \(y=\frac35e^{4t}+\frac{12}5e^{-t}\)
            marks:
              - code: A1
                note: Both, oe.
  - q: 2
    stamp: f4844428
    parts:
      - part: ''
        rows:
          - scheme: |
              \(y = -\frac{\mathrm{d}x}{\mathrm{d}t} \Rightarrow \frac{\mathrm{d}y}{\mathrm{d}t} = -\frac{\mathrm{d}^2x}{\mathrm{d}t^2}\)
              \(\Rightarrow -\frac{\mathrm{d}^2x}{\mathrm{d}t^2} - x = 2e^t\)
            marks:
              - code: M1
                note: Differentiates one equation and substitutes from the other to reach a second-order equation in \(x\) alone, or \(y\) alone. Condone sign slips.
          - scheme: |
              \(\frac{\mathrm{d}^2x}{\mathrm{d}t^2} + x = -2e^t\)
            marks:
              - code: A1
                note: oe, or \(\frac{\mathrm{d}^2y}{\mathrm{d}t^2} + y = 2e^t\).
          - scheme: |
              \(t = 0: \frac{\mathrm{d}x}{\mathrm{d}t} + 1 = 0 \Rightarrow \frac{\mathrm{d}x}{\mathrm{d}t} = -1\)
            marks:
              - code: B1
                note: Or \(\frac{\mathrm{d}y}{\mathrm{d}t} = 2\) at \(t = 0\) where \(x\) is eliminated.
          - scheme: |
              \(\lambda^2 + 1 = 0 \Rightarrow \lambda = \ldots\)
            marks:
              - code: M1
                note: Forms the auxiliary equation of their second-order equation and solves it by any method.
          - scheme: |
              \(\lambda = \pm i\)
              \(x = A\cos t + B\sin t\)
            marks:
              - code: A1
                note: oe, in the variable of their equation.
          - scheme: |
              \(x = ae^t \Rightarrow ae^t + ae^t = -2e^t \Rightarrow a = \ldots\)
            marks:
              - code: M1
                note: Substitutes a particular integral \(ae^t\) into their second-order equation and finds \(a\). Condone sign slips.
          - scheme: |
              \(x = A\cos t + B\sin t - e^t\)
            marks:
              - code: A1
          - scheme: |
              \(A - 1 = 0\)
              \(\frac{\mathrm{d}x}{\mathrm{d}t} = -A\sin t + B\cos t - e^t\)
              \(\Rightarrow B - 1 = -1 \Rightarrow A = \ldots,\ B = \ldots\)
            marks:
              - code: M1
                note: Uses both initial conditions in their general solution of the form \(A\cos t + B\sin t +\) their particular integral, and its attempted derivative, to find \(A\) and \(B\).
          - scheme: |
              \(x = \cos t - e^t\)
            marks:
              - code: A1
          - scheme: |
              \(\frac{\mathrm{d}x}{\mathrm{d}t} = -\sin t - e^t \Rightarrow y = -\frac{\mathrm{d}x}{\mathrm{d}t} = \ldots\)
            marks:
              - code: M1
                note: Differentiates their \(x\) and uses \(y = -\frac{\mathrm{d}x}{\mathrm{d}t}\), or any valid route to \(y\) leaving no undetermined constants.
          - scheme: |
              \(y = \sin t + e^t\)
            marks:
              - code: A1
  - q: 3
    stamp: 6dff6752
    parts:
      - part: ''
        rows:
          - scheme: |
              \(x = -\frac{\mathrm{d}y}{\mathrm{d}t} - y - 1 \Rightarrow \frac{\mathrm{d}x}{\mathrm{d}t} = -\frac{\mathrm{d}^2y}{\mathrm{d}t^2} - \frac{\mathrm{d}y}{\mathrm{d}t}\)
              \(-\frac{\mathrm{d}^2y}{\mathrm{d}t^2} - \frac{\mathrm{d}y}{\mathrm{d}t}\)
              \(\phantom{-} = 3\left(-\frac{\mathrm{d}y}{\mathrm{d}t} - y - 1\right) + 4y + 7\)
            marks:
              - code: M1
                note: Makes \(x\) the subject of the second equation, differentiates and substitutes both into the first. Condone sign slips. Eliminating \(y\) instead, giving \(\frac{\mathrm{d}^2x}{\mathrm{d}t^2} - 2\frac{\mathrm{d}x}{\mathrm{d}t} + x = 3\), earns the corresponding marks.
          - scheme: |
              \(\frac{\mathrm{d}^2y}{\mathrm{d}t^2} - 2\frac{\mathrm{d}y}{\mathrm{d}t} + y = -4\)
            marks:
              - code: A1
                note: oe
          - scheme: |
              \(\lambda^2 - 2\lambda + 1 = 0 \Rightarrow \lambda = \ldots\)
            marks:
              - code: M1
                note: Forms the auxiliary equation of their second-order equation and solves it by any means.
          - scheme: |
              \(\lambda = 1\) (repeated)
              \((y =)\ (A + Bt)e^t\)
            marks:
              - code: A1
          - scheme: |
              \(y = k \Rightarrow k = -4\)
            marks:
              - code: B1
          - scheme: |
              \(y = (A + Bt)e^t - 4\)
            marks:
              - code: A1ft
                note: ft their complementary function plus their constant particular integral; must be \(y = \ldots\).
          - scheme: |
              \(y(0) = -3 \Rightarrow A - 4 = -3 \Rightarrow A = \ldots\ [= 1]\)
            marks:
              - code: M1
                note: Substitutes \(t = 0\), \(y = -3\) into their general solution to find \(A\).
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}t} = (A + Bt + B)e^t\)
              \(x = -(A + Bt + B)e^t - (A + Bt)e^t + 4 - 1\)
            marks:
              - code: M1
                note: Differentiates their \(y\), with the product rule on \((A + Bt)e^t\), and substitutes into \(x\) made the subject of the second equation, or an equivalent relation from the system.
          - scheme: |
              \(x = -(2A + 2Bt + B)e^t + 3\)
            marks:
              - code: A1
                note: oe, in terms of \(A\) and \(B\) or with \(A = 1\).
          - scheme: |
              \(x(0) = 5 \Rightarrow -(2 + B) + 3 = 5 \Rightarrow B = \ldots\)
            marks:
              - code: M1
                note: Substitutes \(t = 0\), \(x = 5\) into their \(x\), or uses \(\frac{\mathrm{d}y}{\mathrm{d}t} = -3\) at \(t = 0\), to find \(B\).
          - scheme: |
              \(x = (2 + 8t)e^t + 3\)
              \(y = (1 - 4t)e^t - 4\)
            marks:
              - code: A1
                note: Both, oe.
  - q: 4
    stamp: 155014c0
    parts:
      - part: a
        rows:
          - scheme: |
              \(x+2y-7=0,\ 2x+y-8=0 \Rightarrow x = \ldots,\ y = \ldots\)
            marks:
              - code: M1
                note: Sets both expressions equal to zero and solves the simultaneous equations by any method.
          - scheme: |
              \((3,\ 2)\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \(\frac{\mathrm{d}^2x}{\mathrm{d}t^2} = \frac{\mathrm{d}x}{\mathrm{d}t} + 2\frac{\mathrm{d}y}{\mathrm{d}t}\)
              \(\phantom{\frac{\mathrm{d}^2x}{\mathrm{d}t^2}} = \frac{\mathrm{d}x}{\mathrm{d}t} + 4x + 2y - 16\)
              with \(2y = \frac{\mathrm{d}x}{\mathrm{d}t} - x + 7\)
            marks:
              - code: M1
                note: Differentiates one equation, substitutes the other and eliminates one variable to reach a second-order equation in a single variable. Condone sign slips.
          - scheme: |
              \(\frac{\mathrm{d}^2x}{\mathrm{d}t^2} - 2\frac{\mathrm{d}x}{\mathrm{d}t} - 3x = -9\)
            marks:
              - code: A1
                note: oe
          - scheme: |
              \(\lambda^2 - 2\lambda - 3 = 0 \Rightarrow \lambda = \ldots\)
            marks:
              - code: M1
                note: Forms the auxiliary equation of their second-order equation and solves it by factorising, formula or completing the square; calculator allowed.
          - scheme: |
              \(Ae^{3t} + Be^{-t}\)
            marks:
              - code: A1
          - scheme: |
              \(-3k = -9 \Rightarrow k = 3\)
            marks:
              - code: B1
          - scheme: |
              \(x = Ae^{3t} + Be^{-t} + 3\)
            marks:
              - code: A1ft
                note: ft their complementary function plus their constant particular integral.
          - scheme: |
              \(A + B + 3 = 4\)
              \(3A - B = 4 + 2(0) - 7\)
            marks:
              - code: M1
                note: 'Forms two equations in \(A\) and \(B\): \(x(0) = 4\) and a second condition from the system at \(t = 0\), e.g. \(\frac{\mathrm{d}x}{\mathrm{d}t} = -3\) in their differentiated solution. Condone slips.'
          - scheme: |
              \(\Rightarrow A = \ldots,\ B = \ldots\)
            marks:
              - code: dM1
                note: Solves their two equations for \(A\) and \(B\); calculator allowed.
          - scheme: |
              \(x = 3 - \frac12 e^{3t} + \frac32 e^{-t}\)
            marks:
              - code: A1
                note: oe
          - scheme: |
              \(2y = \their{-\frac32 e^{3t} - \frac32 e^{-t}}\)
              \(\phantom{2y =} - \their{3 - \frac12 e^{3t} + \frac32 e^{-t}} + 7\)
            marks:
              - code: M1
                note: Substitutes their \(x\) and their \(\frac{\mathrm{d}x}{\mathrm{d}t}\) into the first equation to find \(y\), with their \(x\) of the form \(pe^{\alpha t} + qe^{\beta t} + c\), numerical constants.
          - scheme: |
              \(y = 2 - \frac12 e^{3t} - \frac32 e^{-t}\)
            marks:
              - code: A1
                note: oe
  - q: 5
    stamp: 2595f556
    parts:
      - part: ''
        rows:
          - scheme: |
              \(y = 2x - \frac{\mathrm{d}x}{\mathrm{d}t} \Rightarrow \frac{\mathrm{d}y}{\mathrm{d}t} = 2\frac{\mathrm{d}x}{\mathrm{d}t} - \frac{\mathrm{d}^2x}{\mathrm{d}t^2}\)
              \(2\frac{\mathrm{d}x}{\mathrm{d}t} - \frac{\mathrm{d}^2x}{\mathrm{d}t^2} = x + 2\left(2x - \frac{\mathrm{d}x}{\mathrm{d}t}\right)\)
            marks:
              - code: M1
                note: Makes one variable the subject of one equation, differentiates it and substitutes into the other, eliminating that variable. Condone sign slips.
          - scheme: |
              \(\frac{\mathrm{d}^2x}{\mathrm{d}t^2} - 4\frac{\mathrm{d}x}{\mathrm{d}t} + 5x = 0\)
            marks:
              - code: A1
                note: oe, including the same equation in \(y\).
          - scheme: |
              \(\lambda^2 - 4\lambda + 5 = 0 \Rightarrow \lambda = \ldots\)
            marks:
              - code: M1
                note: Forms the auxiliary equation of their second-order equation and solves it by any means, calculator allowed.
          - scheme: |
              \([\lambda = 2 \pm i]\)
              \(x = e^{2t}(A\cos t + B\sin t)\)
            marks:
              - code: A1
                note: Any letters for the constants; must be in terms of \(t\).
          - scheme: |
              \(t = 0: \frac{\mathrm{d}x}{\mathrm{d}t} = 2(1) - 2 = 0\)
            marks:
              - code: B1
          - scheme: |
              \(\frac{\mathrm{d}x}{\mathrm{d}t} = 2e^{2t}(A\cos t + B\sin t)\)
              \(\phantom{\frac{\mathrm{d}x}{\mathrm{d}t}} + e^{2t}(-A\sin t + B\cos t)\)
            marks:
              - code: M1
                note: Differentiates their complementary function by the product rule, with both terms present. Condone sign slips in differentiating \(\sin t\) and \(\cos t\).
          - scheme: |
              \(A = 1,\ 2A + B = 0 \Rightarrow B = \ldots\)
            marks:
              - code: dM1
                note: Substitutes \(t = 0\) into their \(x\) and their derivative, using \(x = 1\) and their value of \(\frac{\mathrm{d}x}{\mathrm{d}t}\), and solves for both constants.
          - scheme: |
              \(f(t) = e^{2t}(\cos t - 2\sin t)\)
            marks:
              - code: A1
                note: oe simplified, such as \(e^{2t}\cos t - 2e^{2t}\sin t\).
          - scheme: |
              \(y = 2e^{2t}(\cos t - 2\sin t) + 5e^{2t}\sin t\)
            marks:
              - code: M1
                note: Finds the second function from their first using one of the given equations, or by solving its own second-order equation with both its initial conditions.
          - scheme: |
              \(g(t) = e^{2t}(2\cos t + \sin t)\)
            marks:
              - code: A1
                note: oe simplified, such as \(2e^{2t}\cos t + e^{2t}\sin t\).
