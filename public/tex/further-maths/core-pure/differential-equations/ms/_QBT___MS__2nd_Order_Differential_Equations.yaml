              - code: A1
          - scheme: |
              \((y =)\ a\sin x + b\cos x\)
            marks:
              - code: B1
          - scheme: |
              \(y' = a\cos x - b\sin x,\ y'' = -a\sin x - b\cos x\)
              \((-a\sin x - b\cos x) - (a\cos x - b\sin x)\)
              \(\phantom{(} - 6(a\sin x + b\cos x) = 50\sin x\)
            marks:
              - code: M1
                note: Differentiates a particular integral of the form \(a\sin x + b\cos x\) twice, substitutes into the equation and equates coefficients of \(\sin x\) and \(\cos x\). Condone sign slips.
          - scheme: |
              \(b - 7a = 50,\ \ -a - 7b = 0\)
            marks:
              - code: A1
                note: oe
          - scheme: |
              \(\Rightarrow a = \ldots,\ b = \ldots\)
            marks:
              - code: dM1
                note: Solves their two simultaneous equations for \(a\) and \(b\), by any means including a calculator.
          - scheme: |
              \((y =)\ -7\sin x + \cos x\)
            marks:
              - code: A1
          - scheme: |
              \(y = Ae^{3x} + Be^{-2x} - 7\sin x + \cos x\)
            marks:
              - code: A1ft
                note: ft their complementary function plus their particular integral; must be \(y = \ldots\) in terms of \(x\).
          - scheme: |
              \(3 = A + B + 1\)
            marks:
              - code: M1
                note: Substitutes \(x = 0\), \(y = 3\) into their general solution, of the form complementary function with two arbitrary constants plus particular integral.
          - scheme: |
              \(y' = 3Ae^{3x} - 2Be^{-2x} - 7\cos x - \sin x\)
              \(-6 = 3A - 2B - 7 \Rightarrow A = \ldots,\ B = \ldots\)
            marks:
              - code: M1
                note: Differentiates their general solution, substitutes \(x = 0\), \(y' = -6\), and solves with their first equation for \(A\) and \(B\). Condone slips in differentiation.
          - scheme: |
              \(y = e^{3x} + e^{-2x} - 7\sin x + \cos x\)
            marks:
              - code: A1
                note: Must be \(y = \ldots\).
