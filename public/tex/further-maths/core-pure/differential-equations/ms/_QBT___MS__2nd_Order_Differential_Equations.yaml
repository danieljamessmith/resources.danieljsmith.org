          - scheme: |
              \(\frac{\mathrm{d}^2 y}{\mathrm{d}x^2}-2\frac{\mathrm{d}y}{\mathrm{d}x}+y=3e^x\)
            marks:
              - code: B1
          - scheme: |
              \(\lambda^2-2\lambda+1=0 \Rightarrow \lambda=\ldots\)
            marks:
              - code: M1
