              \(\phantom{=} - 3\sin 3t + 6\cos 3t\)
              \(7 = -2A + 3B + 6 \Rightarrow B = \ldots\)
            marks:
              - code: M1
                note: Differentiates their general solution, with the product rule on the complementary function, substitutes \(t = 0\), \(\frac{\mathrm{d}y}{\mathrm{d}t} = 7\) and solves for both constants. Condone sign slips.
          - scheme: |
              \(y = e^{-2t}(4\cos 3t + 3\sin 3t) + \cos 3t + 2\sin 3t\)
            marks:
              - code: A1
                note: Needs \(y = \ldots\); \(A = 4\), \(B = 3\) alone is not enough.
