questions:
  - q: 1
    stamp: 0505de09
    parts:
      - part: a
        rows:
          - scheme: |
              \(\lambda^2 + 4 = 0 \Rightarrow \lambda = \ldots\)
            marks:
              - code: M1
                note: Forms the auxiliary equation and solves it by any method.
          - scheme: |
              \(\lambda = \pm 2i\)
              \((y =)\ C_1\cos 2x + C_2\sin 2x\)
            marks:
              - code: A1
                note: Must be in terms of \(\cos 2x\) and \(\sin 2x\), oe such as \(R\cos(2x + \alpha)\).
      - part: b
        rows:
          - scheme: |
              \(y = x(A\cos 2x + B\sin 2x)\)
              \(y' = A\cos 2x + B\sin 2x\)
              \(\phantom{y'} + x(-2A\sin 2x + 2B\cos 2x)\)
              \(y'' = -4A\sin 2x + 4B\cos 2x\)
              \(\phantom{y''} - 4x(A\cos 2x + B\sin 2x)\)
              \(4B\cos 2x - 4A\sin 2x = 8\cos 2x - 12\sin 2x\)
              \(\Rightarrow A = \ldots,\ B = \ldots\)
            marks:
              - code: M1
                note: Differentiates the given form twice by the product rule, substitutes into the equation and equates coefficients of \(\cos 2x\) and \(\sin 2x\). Condone slips in differentiation.
          - scheme: |
              \(A = 3\) or \(B = 2\)
            marks:
              - code: A1
          - scheme: |
              \(x(3\cos 2x + 2\sin 2x)\)
            marks:
              - code: A1
                note: Both constants correct, in the particular integral or stated.
          - scheme: |
              \((y =)\ C_1\cos 2x + C_2\sin 2x\)
              \(\phantom{(y =)} + x(3\cos 2x + 2\sin 2x)\)
            marks:
              - code: A1ft
                note: ft their complementary function from (a) plus their particular integral of the form \(x(p\cos 2x + q\sin 2x)\) with numerical \(p\), \(q\).
  - q: 2
    stamp: 0e5059c2
    parts:
      - part: ''
        rows:
          - scheme: |
              \(\lambda^2+4\lambda+5=0 \Rightarrow \lambda=\ldots\)
            marks:
              - code: M1
                note: Forms the auxiliary equation and solves it by formula, completing the square or calculator.
          - scheme: |
              \(\lambda=-2\pm i\)
              \((y=)\ e^{-2t}(A\cos t+B\sin t)\)
            marks:
              - code: A1
          - scheme: |
              \(y=a\cos t+b\sin t\)
            marks:
              - code: B1
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}t}=-a\sin t+b\cos t\), \(\frac{\mathrm{d}^2y}{\mathrm{d}t^2}=-a\cos t-b\sin t\)
              \((-a+4b+5a)\cos t+(-b-4a+5b)\sin t\)
              \(\phantom{(-a+4b} =8\cos t\)
            marks:
              - code: M1
                note: Differentiates their trial function twice, substitutes into the equation and equates coefficients of \(\cos t\) and \(\sin t\). Condone sign slips in the derivatives.
          - scheme: |
              \(4a+4b=8,\quad -4a+4b=0\)
            marks:
              - code: A1
                note: oe
          - scheme: |
              \(\Rightarrow a=\ldots,\ b=\ldots\)
            marks:
              - code: dM1
                note: Solves their two linear equations for both \(a\) and \(b\), by any means.
          - scheme: |
              \((y=)\ \cos t+\sin t\)
            marks:
              - code: A1
          - scheme: |
              \(y=e^{-2t}(A\cos t+B\sin t)+\cos t+\sin t\)
            marks:
              - code: A1ft
                note: ft their complementary function with two arbitrary constants plus their particular integral; must be \(y=\ldots\) in terms of \(t\).
          - scheme: |
              \(t=0,\ y=3:\ 3=A+1 \Rightarrow A=\ldots\)
            marks:
              - code: M1
                note: Substitutes \(t=0\), \(y=3\) into their general solution with two arbitrary constants.
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}t}=-2e^{-2t}(A\cos t+B\sin t)\)
              \(\phantom{\frac{\mathrm{d}y}{\mathrm{d}t}=} +e^{-2t}(-A\sin t+B\cos t)-\sin t+\cos t\)
              \(t=0:\ 1=-2A+B+1 \Rightarrow B=\ldots\)
            marks:
              - code: M1
                note: Differentiates their general solution, using the product rule on the exponential term, substitutes \(t=0\), \(\frac{\mathrm{d}y}{\mathrm{d}t}=1\) and solves for both constants. Condone sign slips.
          - scheme: |
              \(y=e^{-2t}(2\cos t+4\sin t)+\cos t+\sin t\)
            marks:
              - code: A1
                note: Must be stated as \(y=\ldots\) in terms of \(t\); \(A=2\), \(B=4\) alone is not enough.
  - q: 3
    stamp: 22c74dc9
    parts:
      - part: a
        rows:
          - scheme: |
              \(\lambda^2+6\lambda+13=0 \Rightarrow \lambda=\ldots\)
            marks:
              - code: M1
                note: Forms the auxiliary equation and solves it by formula, completing the square or calculator, reaching complex roots.
          - scheme: |
              \(\lambda=-3\pm 2i\)
              \((y=)\,e^{-3t}(A\cos 2t+B\sin 2t)\)
            marks:
              - code: A1
                note: Correct complementary function oe; roots alone are not enough.
          - scheme: |
              \(y=a\sin 2t+b\cos 2t\)
            marks:
              - code: B1
          - scheme: |
              \(-4a\sin 2t-4b\cos 2t+6(2a\cos 2t-2b\sin 2t)\)
              \(\phantom{=}+13(a\sin 2t+b\cos 2t)=75\sin 2t\)
              Equates coefficients of \(\sin 2t\) and \(\cos 2t\)
            marks:
              - code: M1
                note: Differentiates their trial function twice, substitutes into the equation and equates coefficients of \(\sin 2t\) and \(\cos 2t\). Condone sign and coefficient slips in the derivatives.
          - scheme: |
              \(9a-12b=75,\quad 12a+9b=0\)
            marks:
              - code: A1
                note: oe
          - scheme: |
              \(a=3,\ b=-4\)
              \((y=)\,3\sin 2t-4\cos 2t\)
            marks:
              - code: A1
          - scheme: |
              \(y=e^{-3t}(A\cos 2t+B\sin 2t)+3\sin 2t-4\cos 2t\)
            marks:
              - code: A1ft
                note: ft their complementary function with two arbitrary constants plus their particular integral with none. Needs \(y=\).
      - part: b
        rows:
          - scheme: |
              \(t\to\infty \Rightarrow e^{-3t}(A\cos 2t+B\sin 2t)\to 0\)
              for all \(A,B\), so \(y\approx 3\sin 2t-4\cos 2t\)
            marks:
              - code: E1
                note: States that \(e^{-3t}\to 0\), so the complementary function vanishes whatever \(A\) and \(B\) (or the initial conditions), leaving the particular integral.
          - scheme: |
              \(R\sin(2t-\phi)=R\cos\phi\sin 2t-R\sin\phi\cos 2t\)
              \(R\cos\phi=3,\quad R\sin\phi=4\)
            marks:
              - code: M1
                note: Expands \(R\sin(2t-\phi)\) and equates coefficients with their particular integral of the form \(p\sin 2t+q\cos 2t\), or uses \(R=\sqrt{p^2+q^2}\) and \(\tan\phi\) with their \(p,q\). Condone sign slips.
          - scheme: |
              \(R=5\)
            marks:
              - code: A1
          - scheme: |
              \(\phi=\arctan\frac43\ [\approx 0.927]\)
            marks:
              - code: A1
                note: \(\arctan\frac43\) oe, such as \(\arcsin\frac45\), or awrt 0.927. Not in degrees.
  - q: 4
    stamp: 1a8bcc5a
    parts:
      - part: ''
        rows:
          - scheme: |
              \(\lambda^2+2\lambda+5=0 \Rightarrow \lambda=\ldots\)
            marks:
              - code: M1
                note: Forms the auxiliary equation and solves it by formula, completing the square or calculator, leading to \(\lambda=\ldots\).
          - scheme: |
              \(\lambda=-1\pm 2i\)
              \((y=)\ e^{-t}(A\cos 2t+B\sin 2t)\)
            marks:
              - code: A1
                note: Any equivalent real form, such as \(Re^{-t}\cos(2t+\alpha)\).
          - scheme: |
              \((y=)\ a\cos t+b\sin t\)
            marks:
              - code: B1
          - scheme: |
              \((-a\cos t-b\sin t)+2(-a\sin t+b\cos t)\)
              \(\phantom{(} +5(a\cos t+b\sin t)=10\cos t\)
            marks:
              - code: M1
                note: Differentiates their trial function twice, substitutes into the equation and equates coefficients of \(\cos t\) and \(\sin t\). Condone sign slips in the derivatives.
          - scheme: |
              \(4a+2b=10,\quad 4b-2a=0\)
            marks:
              - code: A1
                note: oe
          - scheme: |
              \(\Rightarrow a=\ldots,\ b=\ldots\)
            marks:
              - code: dM1
                note: Solves their two simultaneous equations for \(a\) and \(b\) by any means.
          - scheme: |
              \(a=2,\ b=1\)
              \((y=)\ 2\cos t+\sin t\)
            marks:
              - code: A1
          - scheme: |
              \(y=e^{-t}(A\cos 2t+B\sin 2t)+2\cos t+\sin t\)
            marks:
              - code: A1ft
                note: ft their complementary function, with two arbitrary constants, plus their particular integral. Needs \(y=\).
          - scheme: |
              \(5=A+2 \Rightarrow A=\ldots\ [=3]\)
            marks:
              - code: M1
                note: Substitutes \(t=0\), \(y=5\) into their general solution with two arbitrary constants to find one constant.
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}t}=-e^{-t}(A\cos 2t+B\sin 2t)\)
              \(\phantom{\frac{\mathrm{d}y}{\mathrm{d}t}=} +e^{-t}(-2A\sin 2t+2B\cos 2t)\)
              \(\phantom{\frac{\mathrm{d}y}{\mathrm{d}t}=} -2\sin t+\cos t\)
              \(2=-\their{3}+2B+1 \Rightarrow B=\ldots\ [=2]\)
            marks:
              - code: M1
                note: Differentiates their general solution, using the product rule on any product, substitutes \(t=0\), \(\frac{\mathrm{d}y}{\mathrm{d}t}=2\) and solves for the other constant. Condone sign slips.
          - scheme: |
              \(y=e^{-t}(3\cos 2t+2\sin 2t)+2\cos t+\sin t\)
            marks:
              - code: A1
                note: cso. Needs \(y=\).
  - q: 5
