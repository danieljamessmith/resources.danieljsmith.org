              \(\phantom{(} + (-9b - 12a + 13b)\sin 3t\)
              \(\phantom{(} = 28\cos 3t - 4\sin 3t\)
            marks:
              - code: M1
                note: Differentiates their trial function twice, substitutes all three terms and equates coefficients of \(\cos 3t\) and \(\sin 3t\). Condone sign and coefficient slips.
