      - part: b
        rows:
          - scheme: |
              \(y = e^{-2x}(a\cos x + b\sin x)\)
            marks:
              - code: B1
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}x} = e^{-2x}[(b-2a)\cos x - (a+2b)\sin x]\)
              \(\frac{\mathrm{d}^2y}{\mathrm{d}x^2} = e^{-2x}[(3a-4b)\cos x + (4a+3b)\sin x]\)
              \(\Rightarrow 8a\cos x + 8b\sin x = 6\cos x - 8\sin x\)
              \(\Rightarrow a = \ldots,\ b = \ldots\)
            marks:
              - code: M1
                note: Differentiates their trial form twice using the product rule, substitutes into the equation and equates coefficients of \(\cos x\) and \(\sin x\). Condone sign and coefficient slips.
          - scheme: |
              \(a = \frac34\) or \(b = -1\)
            marks:
              - code: A1
                note: Either constant correct.
          - scheme: |
              \((y =)\ e^{-2x}\left(\frac34\cos x - \sin x\right)\)
            marks:
              - code: A1
          - scheme: |
              \(y = e^{-2x}\left(A\cos 3x + B\sin 3x + \frac34\cos x - \sin x\right)\)
            marks:
              - code: A1ft
                note: ft their complementary function from (a), with two arbitrary constants, plus their particular integral; must start \(y =\).
