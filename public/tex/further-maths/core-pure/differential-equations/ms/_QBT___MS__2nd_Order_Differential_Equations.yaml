          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}x}=e^x\left(A+Bx+\frac32x^2\right)+e^x(B+3x)\)
              \(\Rightarrow 0=A+B \Rightarrow B=\ldots\)
            marks:
              - code: M1
                note: Differentiates their general solution, product rule on at least one term, substitutes \(x=0\), \(\frac{\mathrm{d}y}{\mathrm{d}x}=0\) and solves for the constants.
          - scheme: |
              \(y=e^x\left(\frac32x^2-x+1\right)\)
            marks:
              - code: A1
                note: oe, as \(y\) in terms of \(x\).
