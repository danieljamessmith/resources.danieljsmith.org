    parts:
      - part: a
        rows:
          - scheme: |
              \(\lambda^2 + 4\lambda + 13 = 0 \Rightarrow \lambda = \ldots\)
            marks:
              - code: M1
                note: Forms the auxiliary equation and solves it by formula, completing the square or calculator, reaching \(\lambda = \ldots\).
          - scheme: |
              \(\lambda = -2 \pm 3i\)
              \(y = e^{-2x}(A\cos 3x + B\sin 3x)\)
            marks:
              - code: A1
