questions:
  - q: 1
    stamp: '54253121'
    parts:
      - part: ''
        rows:
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}x} = (ax^2+2x)e^{ax}\)
              \(\frac{\mathrm{d}^2y}{\mathrm{d}x^2} = (a^2x^2+4ax+2)e^{ax}\)
              \(n=2\): \(a^0(a^2x^2+4ax+2)e^{ax}\), so true for \(n=2\)
            marks:
              - code: B1
                note: Second derivative found by differentiating and shown equal to the formula at \(n=2\). Not for substituting \(n=2\) into the formula alone.
          - scheme: |
              Assume true for \(n=k\):
              \(\frac{\mathrm{d}^{k+1}y}{\mathrm{d}x^{k+1}} = \frac{\mathrm{d}}{\mathrm{d}x}\left[a^{k-2}\left(a^2x^2+2kax+k(k-1)\right)e^{ax}\right]\)
            marks:
              - code: M1
                note: States the result assumed for \(n=k\) and takes its derivative as the \((k+1)\)th derivative.
          - scheme: |
              \(\phantom{=}a^{k-2}\left[(2a^2x+2ka)e^{ax}\right.\)
              \(\phantom{=a^{k-2}}\left.+\left(a^2x^2+2kax+k(k-1)\right)ae^{ax}\right]\)
            marks:
              - code: M1
                note: 'Applies the product rule to their \(k\)th derivative: two terms, the quadratic differentiated and \(e^{ax}\) differentiated to \(ae^{ax}\). Condone coefficient slips.'
              - code: A1
                note: Any correct unsimplified form, \(a^{k-2}\) factored out or multiplied in.
          - scheme: |
              \(= a^{k-1}\left(a^2x^2+2(k+1)ax+k(k+1)\right)e^{ax}\)
              \(= a^{(k+1)-2}\left(a^2x^2+2(k+1)ax\right.\)
              \(\phantom{=a^{(k+1)-2}}\left.+(k+1)\left((k+1)-1\right)\right)e^{ax}\)
            marks:
              - code: A1
                note: cso. Reaches \(a^{k-1}(\ldots)e^{ax}\) and shows it is the formula with \(n=k+1\), e.g. \(k(k+1)\) written as \((k+1)((k+1)-1)\) or the target stated.
          - scheme: |
              True for \(n=2\); true for \(n=k\) \(\Rightarrow\) true for \(n=k+1\)
              \(\Rightarrow\) true for all integers \(n \ge 2\)
            marks:
              - code: E1
                note: Concludes naming true for \(n=2\), true for \(n=k\) implies true for \(n=k+1\), and hence true for all integers \(n \ge 2\).
  - q: 2
    stamp: a67fb27f
    parts:
      - part: ''
        rows:
          - scheme: |
              \(\frac{\mathrm{d}}{\mathrm{d}x}(x^3e^{-x}) = 3x^2e^{-x} - x^3e^{-x}\)
              \(\phantom{\frac{\mathrm{d}}{\mathrm{d}x}(x^3e^{-x})} = -e^{-x}(x^3-3x^2)\)
              \(n=1\): \((-1)^1e^{-x}(x^3-3x^2+0-0)\), so true
            marks:
              - code: B1
                note: Needs both the derivative and the formula evaluated at \(n=1\), shown equal.
          - scheme: |
              Assume true for \(n=k\):
              \(\frac{\mathrm{d}^{k+1}}{\mathrm{d}x^{k+1}}(x^3e^{-x})\)
              \(\phantom{A} = \frac{\mathrm{d}}{\mathrm{d}x}\left[(-1)^ke^{-x}(x^3-3kx^2+\ldots)\right]\)
            marks:
              - code: M1
                note: States the assumption for \(n=k\) and differentiates its expression to obtain the \((k+1)\)th derivative. Not for assuming \(n=k+1\).
          - scheme: |
              \(= (-1)^k\bigl[-e^{-x}(x^3-3kx^2+3k(k-1)x\)
              \(\phantom{=} -k(k-1)(k-2)) + e^{-x}(3x^2-6kx+3k(k-1))\bigr]\)
            marks:
              - code: M1
                note: 'Uses the product rule on \(e^{-x}\) times their cubic: two terms, one with the cubic''s derivative. Condone sign slips.'
              - code: A1
                note: Correct, unsimplified.
          - scheme: |
              \(= (-1)^{k+1}e^{-x}\bigl(x^3-3(k+1)x^2\)
              \(\phantom{=} +3(k+1)kx-(k+1)k(k-1)\bigr)\)
            marks:
              - code: A1
                note: cso. Each coefficient collected to the \(n=k+1\) form with \((-1)^{k+1}\); constant \(-(k+1)k(k-1)\) oe accepted.
          - scheme: |
              True for \(n=1\); true for \(n=k\) \(\Rightarrow\) true for \(n=k+1\); so true for all positive integers \(n\)
            marks:
              - code: E1
                note: States the base case, the implication from \(n=k\) to \(n=k+1\), and truth for all positive integers \(n\).
  - q: 3
    stamp: 314fefb3
    parts:
      - part: ''
        rows:
          - scheme: |
              \(n=1\): \(\frac{\mathrm{d}y}{\mathrm{d}x} = e^{-2x}(-2\cosh 3x + 3\sinh 3x)\)
              \(\frac{1+(-5)}{2} = -2,\ \frac{1-(-5)}{2} = 3\), so true for \(n=1\)
            marks:
              - code: B1
                note: Correct derivative and both coefficients of the formula evaluated at \(n=1\), seen to agree.
          - scheme: |
              Assume \(\frac{\mathrm{d}^k y}{\mathrm{d}x^k} = e^{-2x}\Big(\tfrac{1+(-5)^k}{2}\cosh 3x\)
              \(\phantom{=}\ + \tfrac{1-(-5)^k}{2}\sinh 3x\Big)\)
              \(\frac{\mathrm{d}^{k+1}y}{\mathrm{d}x^{k+1}} = \frac{\mathrm{d}}{\mathrm{d}x}\left(\frac{\mathrm{d}^k y}{\mathrm{d}x^k}\right)\)
            marks:
              - code: M1
                note: States the result assumed for \(n=k\) and sets out to differentiate it to obtain the \((k+1)\)th derivative.
          - scheme: |
              \(\frac{\mathrm{d}^{k+1}y}{\mathrm{d}x^{k+1}} = -2e^{-2x}\Big(\tfrac{1+(-5)^k}{2}\cosh 3x\)
              \(\phantom{=}\ + \tfrac{1-(-5)^k}{2}\sinh 3x\Big)\)
              \(\phantom{=}\ + e^{-2x}\Big(\tfrac{3(1+(-5)^k)}{2}\sinh 3x\)
              \(\phantom{=}\ + \tfrac{3(1-(-5)^k)}{2}\cosh 3x\Big)\)
            marks:
              - code: M1
                note: 'Applies the product rule to the \(n=k\) expression: two terms, the second with \(\cosh 3x\) and \(\sinh 3x\) interchanged. Condone coefficient and sign slips.'
              - code: A1
                note: Correct, unsimplified.
          - scheme: |
              \(= e^{-2x}\Big(\tfrac{1-5(-5)^k}{2}\cosh 3x + \tfrac{1+5(-5)^k}{2}\sinh 3x\Big)\)
              \(= e^{-2x}\Big(\tfrac{1+(-5)^{k+1}}{2}\cosh 3x\)
              \(\phantom{=}\ + \tfrac{1-(-5)^{k+1}}{2}\sinh 3x\Big)\)
            marks:
              - code: A1
                note: cso. Both coefficients collected and reached in the \((-5)^{k+1}\) form without error; not for jumping to the printed form.
          - scheme: |
              True for \(n=1\); true for \(n=k \Rightarrow\) true for \(n=k+1\)
              \(\Rightarrow\) true for all \(n\in\mathbb{N}\)
            marks:
              - code: E1
                note: 'States all three: true for \(n=1\); true for \(n=k\) implies true for \(n=k+1\); hence true for all \(n\in\mathbb{N}\) oe.'
  - q: 4
    stamp: cda4312d
    parts:
      - part: ''
        rows:
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}x} = 2x\cosh x + x^2\sinh x\)
              \(\frac{\mathrm{d}^2y}{\mathrm{d}x^2} = x^2\cosh x + 4x\sinh x + 2\cosh x\)
              Compares with the formula at \(n = 1\)
            marks:
              - code: B1
                note: Both derivatives correct and matched to the formula at \(n = 1\). Not for substituting \(n = 1\) into the formula alone.
          - scheme: |
              Assumes \(\frac{\mathrm{d}^{2k}y}{\mathrm{d}x^{2k}} = x^2\cosh x + 4kx\sinh x\)
              \(\phantom{\frac{\mathrm{d}^{2k}y}{\mathrm{d}x^{2k}}} + 2k(2k-1)\cosh x\)
              \(\frac{\mathrm{d}^{2k+2}y}{\mathrm{d}x^{2k+2}} = \frac{\mathrm{d}^2}{\mathrm{d}x^2}\left(\frac{\mathrm{d}^{2k}y}{\mathrm{d}x^{2k}}\right)\)
            marks:
              - code: M1
                note: States the result for \(n = k\) and takes the \((2k+2)\)th derivative as its second derivative; implied by differentiating it.
          - scheme: |
              \(\frac{\mathrm{d}^{2k+1}y}{\mathrm{d}x^{2k+1}} = 2x\cosh x + x^2\sinh x\)
              \(\phantom{=} + 4k(\sinh x + x\cosh x) + 2k(2k-1)\sinh x\)
            marks:
              - code: M1
                note: Differentiates their \(n = k\) expression, with the product rule on at least one product and \(\cosh x \to \sinh x\). Condone coefficient slips.
          - scheme: |
              \(\frac{\mathrm{d}^{2k+2}y}{\mathrm{d}x^{2k+2}} = 2x\sinh x + x^2\cosh x\)
              \(\phantom{=} + (4k+2)(\cosh x + x\sinh x) + 2k(2k+1)\cosh x\)
            marks:
              - code: M1
                note: Differentiates their \((2k+1)\)th derivative in the same way. Condone coefficient slips.
              - code: A1
                note: Correct, in any unsimplified form.
          - scheme: |
              \(4k^2 + 6k + 2 = 2(k+1)\left(2(k+1)-1\right)\)
              \(\Rightarrow \frac{\mathrm{d}^{2k+2}y}{\mathrm{d}x^{2k+2}} = x^2\cosh x + 4(k+1)x\sinh x\)
              \(\phantom{\Rightarrow} + 2(k+1)\left(2(k+1)-1\right)\cosh x\)
            marks:
              - code: A1
                note: cso. Collects to the formula with \(n = k+1\), the \(\cosh x\) coefficient shown as \(2(k+1)(2k+1)\) or better.
          - scheme: |
              True for \(n = 1\); true for \(n = k\) \(\Rightarrow\) true for \(n = k+1\);
              so true for all integers \(n \ge 1\)
            marks:
              - code: E1
                note: 'States all three: true for \(n = 1\), true for \(n = k\) implies true for \(n = k+1\), hence true for all \(n \ge 1\).'
  - q: 5
    stamp: fde146a2
    parts:
      - part: ''
        rows:
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}x} = 2a(ax+1)\ln(ax+1) + a(ax+1)\)
              \(\frac{\mathrm{d}^2y}{\mathrm{d}x^2} = a^2\bigl(2\ln(ax+1)+3\bigr)\)
              \(\frac{\mathrm{d}^3y}{\mathrm{d}x^3} = \frac{2a^3}{ax+1}\)
              \(n=3\): \(2(-1)^0\frac{0!\,a^3}{(ax+1)^1} = \frac{2a^3}{ax+1}\)
            marks:
              - code: B1
                note: Three correct derivatives, any equivalent form, and the formula at \(n=3\) shown equal to the third derivative.
          - scheme: |
              Assume \(\frac{\mathrm{d}^ky}{\mathrm{d}x^k} = 2(-1)^{k-3}\frac{(k-3)!\,a^k}{(ax+1)^{k-2}}\)
              \(\frac{\mathrm{d}^{k+1}y}{\mathrm{d}x^{k+1}} = \frac{\mathrm{d}}{\mathrm{d}x}\left(2(-1)^{k-3}(k-3)!\,a^k(ax+1)^{-(k-2)}\right)\)
            marks:
              - code: M1
                note: States the \(n=k\) assumption and attempts to differentiate it to find the \((k+1)\)th derivative.
          - scheme: |
              \(\phantom{\frac{\mathrm{d}^{k+1}y}{\mathrm{d}x^{k+1}}} = 2(-1)^{k-3}(k-3)!\,a^k\)
              \(\phantom{\frac{\mathrm{d}^{k+1}y}{\mathrm{d}x^{k+1}} =} \times\bigl(-(k-2)\bigr)(ax+1)^{-(k-1)}\times a\)
            marks:
              - code: M1
                note: Differentiates to the form \(c(ax+1)^{-(k-1)}\). Condone sign slips and a missing factor \(a\).
              - code: A1
                note: Correct, unsimplified.
          - scheme: |
              \(\phantom{\frac{\mathrm{d}^{k+1}y}{\mathrm{d}x^{k+1}}} = 2(-1)^{k-2}\frac{(k-2)!\,a^{k+1}}{(ax+1)^{k-1}}\)
            marks:
              - code: A1
                note: cso. Needs \((-1)^{k-2}\) from the sign and \((k-2)(k-3)! = (k-2)!\), shown or clearly implied.
          - scheme: |
              True for \(n=3\); true for \(n=k\) \(\Rightarrow\) true for \(n=k+1\);
              so true for all integers \(n \ge 3\)
            marks:
              - code: E1
                note: 'States all three points: the base case, the implication from \(n=k\) to \(n=k+1\), and truth for all integers \(n \ge 3\).'
  - q: 6
    stamp: d1e1d735
    parts:
      - part: a
        rows:
          - scheme: |
              \(\frac{\mathrm{d}y}{\mathrm{d}t} = a\ln(1+at) + a\)
              \(\frac{\mathrm{d}^2y}{\mathrm{d}t^2} = a^2(1+at)^{-1}\), \(\frac{\mathrm{d}^3y}{\mathrm{d}t^3} = \ldots\)
            marks:
              - code: M1
                note: Differentiates repeatedly, reaching at least the second and third derivatives in the form \(ka^m(1+at)^{-p}\). Condone sign and coefficient slips.
          - scheme: |
              \(\frac{\mathrm{d}^2y}{\mathrm{d}t^2} = \frac{a^2}{1+at}\), \(\frac{\mathrm{d}^3y}{\mathrm{d}t^3} = -\frac{a^3}{(1+at)^2}\)
              \(\frac{\mathrm{d}^4y}{\mathrm{d}t^4} = \frac{2a^4}{(1+at)^3}\), \(\frac{\mathrm{d}^5y}{\mathrm{d}t^5} = -\frac{6a^5}{(1+at)^4}\)
            marks:
              - code: A1
                note: All four correct, any equivalent form.
          - scheme: |
              \(\frac{\mathrm{d}^ny}{\mathrm{d}t^n} = \frac{(-1)^n(n-2)!\,a^n}{(1+at)^{n-1}}\)
            marks:
              - code: A1
                note: oe, such as \((-1)^{n-2}\) or \((1+at)^{1-n}\) in the numerator. Must be in terms of \(n\), \(a\) and \(t\).
      - part: b
        rows:
          - scheme: |
              \(n=2\): \(\frac{(-1)^2\,0!\,a^2}{(1+at)^1} = \frac{a^2}{1+at} = f''(t)\)
            marks:
              - code: B1
                note: Shows the formula with \(n=2\) gives \(\frac{a^2}{1+at}\) and that this matches \(f''(t)\).
          - scheme: |
              Assume \(f^{(k)}(t) = \frac{(-1)^k(k-2)!\,a^k}{(1+at)^{k-1}}\)
              \(f^{(k+1)}(t)\)
              \(\phantom{A} = \frac{\mathrm{d}}{\mathrm{d}t}\left[(-1)^k(k-2)!\,a^k(1+at)^{-(k-1)}\right]\)
            marks:
              - code: M1
                note: States the formula assumed for \(n=k\) and sets out to differentiate it to obtain \(f^{(k+1)}(t)\).
          - scheme: |
              \(\phantom{A} = (-1)^k(k-2)!\,a^k\)
              \(\phantom{A = } \times\left(-(k-1)\right)a(1+at)^{-k}\)
            marks:
              - code: M1
                note: Differentiates the assumed result, reducing the power of \((1+at)\) by 1 with a multiplying factor. Condone sign and coefficient slips.
              - code: A1
                note: Correct derivative, unsimplified, including the factor \(a\).
          - scheme: |
              \(\phantom{A} = \frac{(-1)^{k+1}(k-1)!\,a^{k+1}}{(1+at)^{k}}\)
            marks:
              - code: A1
                note: cso. Combines \((k-1)(k-2)!\) as \((k-1)!\) and the signs as \((-1)^{k+1}\), giving the formula with \(n=k+1\).
          - scheme: |
              True for \(n=2\); true for \(n=k\)
              \(\Rightarrow\) true for \(n=k+1\);
              so true for all integers \(n\ge 2\)
            marks:
              - code: E1
                note: Concludes, naming true for \(n=2\), true for \(n=k\) implies true for \(n=k+1\), and hence true for all integers \(n\ge 2\).
      - part: c
        rows:
          - scheme: |
              \(f^{(7)}\left(\tfrac53\right) = \frac{(-1)^7\,5!\times 3^7}{\left(1+3\times\frac53\right)^6} = \ldots\)
            marks:
              - code: M1
                note: Substitutes \(n=7\), \(a=3\) and \(t=\frac53\) into their formula. Not for the sixth derivative.
          - scheme: |
              \(-\frac{45}{8}\)
            marks:
              - code: A1
                note: oe, or awrt \(-5.63\).
  - q: 7
    stamp: c19ab505
    parts:
      - part: a
        rows:
          - scheme: |
              \(f'(x)=-\frac12(1+x)^{-\frac32}\)
              \(\frac{(-1)^1\,2!}{2^2\,1!\,(1+x)^{\frac32}}=-\frac12(1+x)^{-\frac32}\)
            marks:
              - code: B1
                note: Both the derivative and the formula at \(n=1\), shown equal.
          - scheme: |
              Assume \(f^{(k)}(x)=\frac{(-1)^k(2k)!}{2^{2k}k!(1+x)^{k+\frac12}}\)
              \(f^{(k+1)}(x)=\frac{(-1)^k(2k)!}{2^{2k}k!}\times\frac{\mathrm{d}}{\mathrm{d}x}(1+x)^{-k-\frac12}\)
            marks:
              - code: M1
                note: States the formula assumed for \(n=k\) and sets out to differentiate it for \(f^{(k+1)}(x)\). Not for assuming the \(n=k+1\) result.
          - scheme: |
              \(\phantom{f^{(k+1)}(x)}=\frac{(-1)^k(2k)!}{2^{2k}k!}\left(-k-\frac12\right)\)
              \(\phantom{f^{(k+1)}(x)=}\times(1+x)^{-k-\frac32}\)
            marks:
              - code: M1
                note: Differentiates their \(f^{(k)}(x)\) to the form \(c(1+x)^{-k-\frac32}\). Condone sign and coefficient slips.
              - code: A1
                note: Any unsimplified form.
          - scheme: |
              \(\phantom{f^{(k+1)}(x)}=\frac{(-1)^{k+1}(2k+2)(2k+1)(2k)!}{2^{2k+2}(k+1)k!(1+x)^{k+\frac32}}\)
              \(\phantom{f^{(k+1)}(x)}=\frac{(-1)^{k+1}(2k+2)!}{2^{2k+2}(k+1)!(1+x)^{k+\frac32}}\)
            marks:
              - code: A1
                note: 'cso: the \(n=k+1\) formula reached with \((2k+2)!\) and \((k+1)!\) formed explicitly; any order of steps. Jumping to the result scores A0.'
          - scheme: |
              True for \(n=1\); true for \(n=k\Rightarrow\) true for \(n=k+1\)
              \(\Rightarrow\) true for all \(n\ge1\)
            marks:
              - code: E1
                note: States all three points; condone equivalent wording such as "for all positive integers \(n\)".
      - part: b
        rows:
          - scheme: |
              \(f(0)=1,\quad f^{(n)}(0)=\frac{(-1)^n(2n)!}{2^{2n}n!}\)
            marks:
              - code: B1
                note: Both, with \(f^{(n)}(0)\) from part (a).
          - scheme: |
              \(\frac{x^n}{n!}f^{(n)}(0)=\frac{x^n}{n!}\times\frac{(-1)^n(2n)!}{2^{2n}n!}\)
            marks:
              - code: M1
                note: Substitutes their \(f^{(n)}(0)\) into \(\frac{x^n}{n!}f^{(n)}(0)\), the Maclaurin general term quoted or implied.
          - scheme: |
              \(\phantom{\frac{x^n}{n!}f^{(n)}(0)}=(-1)^n\frac{(2n)!}{2^{2n}(n!)^2}x^n\)
              \((1+x)^{-\frac12}=1-\frac{x}{2}+\frac{3x^2}{8}-\cdots\)
            marks:
              - code: A1 AG
                note: Correct substituted general term, combining the two \(n!\) to \((n!)^2\), and the printed series stated without error.
  - q: 8
    stamp: caf899c2
    parts:
      - part: ''
        rows:
          - scheme: |
              \(\frac{\mathrm{d}^2}{\mathrm{d}x^2}(x^2f) = 2f+4xf'+x^2f''\)
              \(\phantom{\frac{\mathrm{d}^2}{\mathrm{d}x^2}(x^2f)} = 2f+4xf'-x^2f\)
              \(\phantom{\frac{\mathrm{d}^2}{\mathrm{d}x^2}(x^2f)} = -(x^2f-4xf'-2f)\)
            marks:
              - code: B1
                note: Differentiates twice, uses \(f''=-f\) and shows agreement with the RHS at \(n=1\). Not for substituting \(n=1\) into the RHS alone.
          - scheme: |
              Assume \(\frac{\mathrm{d}^{2k}}{\mathrm{d}x^{2k}}(x^2f)\)
              \(\phantom{A} = (-1)^k(x^2f-4kxf'-2k(2k-1)f)\)
              \(\frac{\mathrm{d}^{2k+2}}{\mathrm{d}x^{2k+2}}(x^2f)\)
              \(\phantom{A} = (-1)^k\left[\frac{\mathrm{d}^2}{\mathrm{d}x^2}(x^2f)-4k\frac{\mathrm{d}^2}{\mathrm{d}x^2}(xf')\right.\)
              \(\phantom{A = (-1)^k} \left.-2k(2k-1)f''\right]\)
            marks:
              - code: M1
                note: Assumes the result for \(n=k\) and writes the \((2k+2)\)th derivative as the second derivative of the assumed expression.
          - scheme: |
              \(\frac{\mathrm{d}^2}{\mathrm{d}x^2}(x^2f) = 2f+4xf'+x^2f''\)
              \(\frac{\mathrm{d}^2}{\mathrm{d}x^2}(xf') = 2f''+xf'''\)
            marks:
              - code: M1
                note: Finds the second derivatives of \(x^2f\) (or quotes the base case) and \(xf'\) by the product rule; whole-expression differentiation also scores. Condone slips.
          - scheme: |
              \(f''=-f,\ f'''=-f' \Rightarrow \frac{\mathrm{d}^{2k+2}}{\mathrm{d}x^{2k+2}}(x^2f) = \ldots\)
            marks:
              - code: M1
                note: Replaces \(f''\) by \(-f\) and \(f'''\) by \(-f'\) throughout and collects terms in \(x^2f\), \(xf'\) and \(f\). Condone sign and coefficient slips.
          - scheme: |
              \(\phantom{A} = (-1)^k(-x^2f+4(k+1)xf'\)
              \(\phantom{A = (-1)^k(} +(2+8k+2k(2k-1))f)\)
            marks:
              - code: A1
                note: Any correct unsimplified form in \(f\) and \(f'\) only.
          - scheme: |
              \(\phantom{A} = (-1)^{k+1}(x^2f-4(k+1)xf'\)
              \(\phantom{A = (-1)^{k+1}(} -2(k+1)(2k+1)f)\)
            marks:
              - code: A1
                note: cso, with the coefficient of \(f\) seen as \(2(k+1)(2k+1)\) or \(2(k+1)(2(k+1)-1)\).
          - scheme: |
              True for \(n=1\); true for \(n=k \Rightarrow\) true for \(n=k+1\);
              so true for all positive integers \(n\)
            marks:
              - code: E1
                note: States true for \(n=1\), true for \(n=k\) implies true for \(n=k+1\), hence true for all positive integers \(n\).
