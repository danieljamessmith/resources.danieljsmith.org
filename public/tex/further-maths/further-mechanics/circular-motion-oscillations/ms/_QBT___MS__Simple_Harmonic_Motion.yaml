              - code: A1
                note: \(\frac13\arccos\frac{7}{13}\) or awrt 0.334; or the time from \(O\), \(\frac13\arcsin\frac{7}{13}\) or awrt 0.190.
          - scheme: |
              \(T = 4 \times \their{\tfrac13\arccos\tfrac{7}{13}}\)
