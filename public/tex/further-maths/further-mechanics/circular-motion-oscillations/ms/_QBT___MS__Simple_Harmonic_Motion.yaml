questions:
  - q: 1
    stamp: 33d4184f
    parts:
      - part: a
        rows:
          - scheme: |
              \(\dot{x} = -\tfrac34\pi\sin\left(\tfrac14\pi t\right) + \tfrac{3\sqrt3}{4}\pi\cos\left(\tfrac14\pi t\right)\)
              \(\Rightarrow \ddot{x} = \ldots\)
            marks:
              - code: M1
                note: Differentiates their expression for \(x\) twice, each term changing between sine and cosine. Condone sign and coefficient slips.
          - scheme: |
              \(\ddot{x} = -\tfrac{3}{16}\pi^2\cos\left(\tfrac14\pi t\right) - \tfrac{3\sqrt3}{16}\pi^2\sin\left(\tfrac14\pi t\right)\)
            marks:
              - code: A1
          - scheme: |
              \(\ddot{x} = -\tfrac{\pi^2}{16}\left(3\cos\left(\tfrac14\pi t\right) + 3\sqrt3\sin\left(\tfrac14\pi t\right)\right)\)
              \(\phantom{\ddot{x}} = -\tfrac{\pi^2}{16}x\), so simple harmonic motion
            marks:
              - code: A1 AG
                note: Correct \(\ddot{x}\) shown equal to \(-\frac{\pi^2}{16}x\) without error, with a conclusion of simple harmonic motion. A0 if the conclusion is missing.
      - part: b
        rows:
          - scheme: |
              \(T = \frac{2\pi}{\their{\tfrac{\pi}{4}}} = \ldots\)
            marks:
              - code: M1
                note: Uses \(T = \frac{2\pi}{\omega}\) with their \(\omega\), from \(\ddot{x} = -\omega^2 x\) or the argument \(\frac14\pi t\).
          - scheme: |
              \(T = 8\,\mathrm{s}\)
            marks:
              - code: A1
      - part: c
        rows:
          - scheme: |
              \(a = \sqrt{3^2 + \left(3\sqrt3\right)^2} = \ldots\)
            marks:
              - code: M1
                note: Uses \(\sqrt{p^2+q^2}\) with the coefficients \(3\) and \(3\sqrt3\), or finds the greatest value of \(x\) by another valid method. Condone a squaring slip.
          - scheme: |
              \(a = 6\,\mathrm{m}\)
            marks:
              - code: A1
      - part: d
        rows:
          - scheme: |
              \(v_{\max} = \their{6} \times \their{\tfrac{\pi}{4}} = \ldots\)
            marks:
              - code: M1
                note: Uses \(a\omega\) with their amplitude and \(\omega\), or maximises their \(\dot{x}\) by another valid method.
          - scheme: |
              \(v_{\max} = \frac{3\pi}{2}\,\mathrm{m\,s^{-1}}\)
            marks:
              - code: A1
                note: oe in terms of \(\pi\).
      - part: e
        rows:
          - scheme: |
              \(\left(\tfrac{\pi}{4}\right)^2\left(\their{6}^2 - x^2\right) > \left(\tfrac{3\sqrt3}{4}\pi\right)^2\)
              \(\Rightarrow x^2 < \ldots\)
            marks:
              - code: M1
                note: Uses \(v^2 = \omega^2\left(a^2 - x^2\right)\) with their \(a\) and \(\omega\) and the given speed, as an equation or inequality, to find \(x\), or sets their \(\dot{x}\), or \(a\omega\cos\omega t\), equal to the given speed. Condone slips.
          - scheme: |
              \(-3 < x < 3\)
            marks:
              - code: A1
                note: Boundary \(x = \pm 3\), or \(|x| < 3\), soi; or, from the speed, a correct cosine or sine value, such as \(\cos\tfrac14\pi t = \frac{\sqrt3}{2}\), or a correct boundary time.
          - scheme: |
              \(6\sin\left(\tfrac14\pi t\right) = \their{3} \Rightarrow t = \ldots\)
            marks:
              - code: M1
                note: Sets a sine or cosine expression for \(x\), the original included, equal to their boundary displacement, or one for the speed equal to the given speed, and solves for a time.
          - scheme: |
              \(t = \frac23\)
            marks:
              - code: A1
                note: Time \(\frac23\) from \(O\) to \(x = 3\), or a correct equivalent time from another form of \(x\) or from the speed.
          - scheme: |
              \(4 \times \their{\tfrac23} = \ldots\)
            marks:
              - code: M1
                note: Uses symmetry to combine their times into the total per oscillation, as four times the time from \(O\) to \(x = 3\) or an equivalent sum or difference.
          - scheme: |
              \(\frac83\,\mathrm{s}\)
            marks:
              - code: A1
                note: \(\frac83\) or awrt 2.67.
  - q: 2
    stamp: 27da10f1
    parts:
      - part: a
        rows:
          - scheme: |
              \(\frac{2\pi}{\omega} = \frac{\pi}{2} \Rightarrow \omega = 4\)
            marks:
              - code: M1
                note: Uses \(T = \frac{2\pi}{\omega}\) with \(T = \frac{\pi}{2}\) to find \(\omega\).
              - code: A1
          - scheme: |
              \(1.6^2 = \their{4}^2\left(a^2 - 0.3^2\right)\)
            marks:
              - code: M1
                note: Uses \(v^2 = \omega^2\left(a^2 - x^2\right)\) with \(x = 0.3\), \(v = 1.6\) and their \(\omega\). Condone slips in substitution.
          - scheme: |
              \(2.56 = 16\left(a^2 - 0.09\right)\)
              \(a^2 = 0.25 \Rightarrow a = 0.5\)
            marks:
              - code: A1 AG
                note: Correct equation with \(\omega = 4\) solved without error to \(a = 0.5\); combined steps accepted. Verifying with \(a = 0.5\) scores A0.
      - part: b
        rows:
          - scheme: |
              \(1^2 = \their{4}^2\left(0.5^2 - x^2\right) \Rightarrow x = \ldots\)
            marks:
              - code: M1
                note: Uses \(v^2 = \omega^2\left(a^2 - x^2\right)\) with \(v = 1\), \(a = 0.5\) and their \(\omega\) to find \(x\), as an equation or inequality; or sets \(a\omega\cos\omega t\) or \(a\omega\sin\omega t\) equal to 1.
          - scheme: |
              \(x = \frac{\sqrt{3}}{4}\)
            marks:
              - code: A1
                note: oe, or awrt 0.433. Sign not needed. Or, from the speed, \(\cos 4t = \frac12\), \(\sin 4t = \frac12\) or a correct boundary time.
          - scheme: |
              \(0.5\sin 4t = \their{\tfrac{\sqrt{3}}{4}} \Rightarrow t = \ldots\)
            marks:
              - code: M1
                note: Uses \(x = a\sin\omega t\) or \(x = a\cos\omega t\), with their \(\omega\), equated to their boundary displacement, or its speed equated to 1, and solves for \(t\).
          - scheme: |
              \(t = \frac{\pi}{12}\)
            marks:
              - code: A1
                note: oe, including \(t = \frac{\pi}{24}\) from an end point with \(x = a\cos\omega t\).
          - scheme: |
              \(4 \times \their{\tfrac{\pi}{12}} = \frac{\pi}{3}\,\mathrm{s}\)
            marks:
              - code: M1
                note: Multiplies their time from \(O\) by 4, or uses an equivalent symmetry argument, such as \(4\left(\frac{\pi}{8} - \their{\frac{\pi}{24}}\right)\) from an end point.
              - code: A1
      - part: c
        rows:
          - scheme: |
              \(\tfrac12 \times 0.5 \times v^2 = 0.36 \Rightarrow v^2 = 1.44\)
              \(1.44 = \their{4}^2\left(0.25 - x^2\right) \Rightarrow x = \ldots\)
            marks:
              - code: M1
                note: Uses \(\frac12 mv^2 = 0.36\) for \(v^2\), then \(v^2 = \omega^2\left(a^2 - x^2\right)\) with \(a = 0.5\) and their \(\omega\) to find \(x\). Condone slips.
          - scheme: |
              \(x = 0.4\)
            marks:
              - code: A1
                note: Accept \(\pm 0.4\).
          - scheme: |
              \(F = 0.5 \times \their{4}^2 \times \their{0.4}\)
            marks:
              - code: M1
                note: Uses Newton's second law with acceleration of magnitude \(\omega^2 x\), with their \(\omega\) and displacement. Not for the acceleration alone.
          - scheme: |
              \(F = 3.2\,\mathrm{N}\)
            marks:
              - code: A1
