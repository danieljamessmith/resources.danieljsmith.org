  - q: 5
    stamp: 8c48ee32
    parts:
      - part: a
        rows:
          - scheme: |
              \(v\frac{\mathrm{d}v}{\mathrm{d}x} = 9(2-x)\)
            marks:
              - code: M1
                note: Uses \(v\frac{\mathrm{d}v}{\mathrm{d}x}\) or \(\frac{\mathrm{d}}{\mathrm{d}x}\left(\frac12 v^2\right)\) for the acceleration in the given equation; or identifies the centre \(x = 2\) and \(\omega = 3\) from it.
          - scheme: |
              \(\int v\,\mathrm{d}v = \int (18-9x)\,\mathrm{d}x\)
              \(\tfrac12 v^2 = 18x - \tfrac92 x^2 + c\)
            marks:
              - code: M1
                note: Separates the variables and integrates both sides, the power of at least one term increased by 1; or uses \(v^2 = \omega^2\left(a^2 - (x-2)^2\right)\) with their \(\omega\). Condone sign slips.
              - code: A1
                note: Correct, oe; the constant, or the amplitude, need not be seen yet.
          - scheme: |
              \(0 = 90 - \tfrac{225}{2} + c \Rightarrow c = \ldots\)
            marks:
              - code: dM1
                note: Substitutes \(x=5\), \(v=0\) into their integrated equation to find the constant, or uses them as limits; or takes the amplitude as the distance from their centre to \(x = 5\).
          - scheme: |
              \(c = \tfrac{45}{2}\)
              \(v^2 = 36x - 9x^2 + 45\)
              \(\phantom{v^2} = 9(5-x)(x+1)\)
            marks:
              - code: A1 AG
                note: Correct constant, or amplitude 3, and equation for \(v^2\), leading without error to the printed result; combined steps accepted.
      - part: b
        rows:
          - scheme: |
              \(v^2 = 9\left(9-(x-2)^2\right)\)
              \(\frac{\mathrm{d}x}{\mathrm{d}t} = 3\sqrt{9-(x-2)^2}\)
              \(\int \frac{1}{\sqrt{9-(x-2)^2}}\,\mathrm{d}x = \int 3\,\mathrm{d}t\)
            marks:
              - code: M1
                note: Completes the square as \(p-(x-q)^2\), takes the positive root and separates the variables; or finds the centre and amplitude from part (a). Condone slips in \(p\), \(q\).
          - scheme: |
              \(\arcsin\left(\frac{x-2}{3}\right) = 3t + K\)
            marks:
              - code: M1
                note: Integrates to the form \(\arcsin\left(\frac{x-q}{r}\right) = kt + K\), or writes \(x = q + r\sin(kt+K)\) with their centre and amplitude.
              - code: A1
                note: Correct, or \(x = 2 + 3\sin(3t+K)\), oe.
          - scheme: |
              \(K = \arcsin\left(\frac{\frac12-2}{3}\right) = \ldots\)
            marks:
              - code: dM1
                note: Substitutes \(t=0\), \(x=\frac12\) into their equation to find the constant.
          - scheme: |
              \(K = -\frac{\pi}{6}\)
            marks:
              - code: A1
                note: On the \(x = 2 + 3\sin(3t+K)\) route, needs \(\dot{x} > 0\) at \(t = 0\) used to reject \(-\frac{5\pi}{6}\).
          - scheme: |
              \(\arcsin\left(\frac{x-2}{3}\right) = 3t - \frac{\pi}{6}\)
              \(x = 2 + 3\sin\left(3t - \frac{\pi}{6}\right)\)
            marks:
              - code: A1 AG
                note: Correct equation with \(K=-\frac{\pi}{6}\), rearranged without error to the printed result.
  - q: 6
    stamp: 96b5c279
    parts:
      - part: a
        rows:
          - scheme: |
              \(R - mg = -m\omega^2 x\)
            marks:
              - code: M1
                note: Forms an equation of motion for the box with reaction, weight and acceleration of magnitude \(\omega^2 x\), or \(\omega^2 a\) at an extreme point. Condone sign slips.
          - scheme: |
              Greatest \(R = m\left(g + a\omega^2\right)\)
              Least \(R = m\left(g - a\omega^2\right)\)
            marks:
              - code: A1
                note: Both correct.
          - scheme: |
              \(3m\left(g + a\omega^2\right) = 7m\left(g - a\omega^2\right)\)
              \(\Rightarrow \omega^2 = \frac{2g}{5a}\)
            marks:
              - code: A1 AG
                note: Correct equation from the \(\frac73\) ratio, leading without error to the printed result.
      - part: b
        rows:
          - scheme: |
              \(R = m\left(g - \frac{2gx}{5a}\right) = 0\)
              \(\Rightarrow x = \ldots\)
            marks:
              - code: M1
                note: Sets their reaction from (a) to zero, or the downward acceleration \(\omega^2 x\) equal to \(g\), with \(\omega^2 = \frac{2g}{5a}\), and solves for \(x\).
          - scheme: |
              \(x = \frac{5a}{2}\)
            marks:
              - code: A1
          - scheme: |
              \(\frac{5a}{2} < 3a\), so the box leaves the platform
            marks:
              - code: E1
                note: Compares \(\frac{5a}{2}\) with the amplitude \(3a\), or \(3a\omega^2\) with \(g\), and concludes the box leaves the platform.
      - part: c
        rows:
          - scheme: |
              \(v^2 = \frac{2g}{5a}\left(9a^2 - \frac{25a^2}{4}\right)\)
            marks:
              - code: M1
                note: Uses \(v^2 = \omega^2\left(A^2 - x^2\right)\) with \(A = 3a\) and their height from (b). Not for amplitude \(a\).
              - code: A1
                note: Correct substituted expression.
          - scheme: |
              \(v = \sqrt{\frac{11ga}{10}}\)
            marks:
              - code: A1
                note: oe, such as \(\sqrt{1.1ga}\).
