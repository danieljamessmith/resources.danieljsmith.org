format: 1
pack: Dimensional Analysis
last_updated: 30 October 2026
questions:
  - q: 1
    stamp: 5291c70d
    parts:
      - part: a
        rows:
          - scheme: |
              \([F] = \mathrm{MLT^{-2}}\)
            marks:
              - code: B1
                note: Not for the units \(\mathrm{kg\,m\,s^{-2}}\) or \(\mathrm{N}\).
      - part: b
        rows:
          - scheme: |
              \(\mathrm{L} = \mathrm{M}^{\alpha}(\mathrm{LT^{-1}})^{\beta}(\mathrm{MLT^{-2}})^{\gamma}\)
            marks:
              - code: M1
                note: Equates the dimensions of both sides, using their \([F]\) from (a) for \([R]\). Condone one slip in a dimension. Powers need not be expanded.
          - scheme: |
              M: \(\alpha + \gamma = 0\)
              L: \(\beta + \gamma = 1\)
              T: \(-\beta - 2\gamma = 0\)
            marks:
              - code: A1
                note: All three correct, oe.
          - scheme: |
              \(\Rightarrow \alpha = \ldots,\ \beta = \ldots,\ \gamma = \ldots\)
            marks:
              - code: dM1
                note: Solves their three equations by any means to find all three powers.
          - scheme: |
              \(\alpha = 1,\ \beta = 2,\ \gamma = -1\)
            marks:
              - code: A1
  - q: 2
    stamp: 53dd27c8
    parts:
      - part: a
        rows:
          - scheme: |
              \([G] = \mathrm{M^{-1}L^3T^{-2}}\)
            marks:
              - code: B1
                note: Symbols in any order. Not for the units \(\mathrm{m^3\,kg^{-1}\,s^{-2}}\).
      - part: b
        rows:
          - scheme: |
              \(\mathrm{T} = (\mathrm{M^{-1}L^3T^{-2}})^{\alpha}\mathrm{M}^{\beta}\mathrm{L}^{\gamma}\)
            marks:
              - code: M1
                note: Forms a dimensional equation using their \([G]\) from (a) and the dimensions of \(T\), \(M\) and \(r\), each raised to its power. Condone one slip in a dimension.
          - scheme: |
              M: \(-\alpha + \beta = 0\)
              L: \(3\alpha + \gamma = 0\)
              T: \(-2\alpha = 1\)
            marks:
              - code: A1
                note: All three correct, oe.
          - scheme: |
              \(\alpha = \ldots,\ \beta = \ldots,\ \gamma = \ldots\)
            marks:
              - code: dM1
                note: Solves their three equations from equating powers for all three values. Condone sign slips.
          - scheme: |
              \(\alpha = -\tfrac12,\ \beta = -\tfrac12,\ \gamma = \tfrac32\)
            marks:
              - code: A1
                note: All three correct, oe.
  - q: 3
    stamp: 00acf64f
    parts:
      - part: a
        rows:
          - scheme: |
              \([\Gamma] = [g][r^2] = \mathrm{LT^{-2}} \times \mathrm{L^2}\)
            marks:
              - code: M1
                note: Uses \(\Gamma = gr^2\) with \([g] = \mathrm{LT^{-2}}\) and \([r] = \mathrm{L}\). Condone a slip in combining powers.
          - scheme: |
              \([\Gamma] = \mathrm{L^3T^{-2}}\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \([v^2] = [u^2] = \mathrm{L^2T^{-2}}\)
              \(\left[2\Gamma\left(\frac{1}{R}-\frac{1}{r}\right)\right] = \their{\mathrm{L^3T^{-2}}} \times \mathrm{L^{-1}}\)
            marks:
              - code: M1
                note: Finds the dimensions of the speed terms and of the \(\Gamma\) term, using their \([\Gamma]\) of the form \(\mathrm{L}^\alpha\mathrm{T}^\beta\) and \(\mathrm{L^{-1}}\) for the bracket.
          - scheme: |
              \(\phantom{\left[2\Gamma\right]} = \mathrm{L^2T^{-2}}\)
              All terms \(\mathrm{L^2T^{-2}}\), so consistent
            marks:
              - code: A1 AG
                note: cso, from a correct \([\Gamma]\). \([\Gamma]\) must not come from assuming this equation consistent. All three terms shown as \(\mathrm{L^2T^{-2}}\), with a conclusion in words. Comment on the factor 2 not required.
      - part: c
        rows:
          - scheme: |
              \([W] = \mathrm{M} \times \their{\mathrm{L^3T^{-2}}} \times \mathrm{L^{-1}}\)
            marks:
              - code: M1
                note: Multiplies \([m] = \mathrm{M}\), their \([\Gamma]\) of the form \(\mathrm{L}^\alpha\mathrm{T}^\beta\) and \(\mathrm{L^{-1}}\) for the bracket. Condone a slip in combining powers.
          - scheme: |
              \([W] = \mathrm{ML^2T^{-2}}\); \(\mathrm{kg\,m^2\,s^{-2}}\) or J
            marks:
              - code: A1
                note: Both the dimensions and the units; accept J, \(\mathrm{N\,m}\) or \(\mathrm{kg\,m^2\,s^{-2}}\).
  - q: 4
    stamp: 2aed1ca9
    parts:
      - part: a
        rows:
          - scheme: |
              \([p] = \mathrm{ML^{-1}T^{-2}}\)
            marks:
              - code: B1
                note: Not for the units \(\mathrm{Pa}\) or \(\mathrm{kg\,m^{-1}\,s^{-2}}\).
      - part: b
        rows:
          - scheme: |
              \(\mathrm{ML^{-1}T^{-2}} = (\mathrm{ML^{-3}})^{\alpha}(\mathrm{L})^{\beta}(\mathrm{LT^{-2}})\)
              \(\phantom{\mathrm{ML^{-1}T^{-2}}} = \mathrm{M}^{\alpha}\mathrm{L}^{-3\alpha+\beta+1}\mathrm{T^{-2}}\)
            marks:
              - code: M1
                note: Equates their \([p]\) to a product of powers of dimensions for \(\rho\), \(h\) and \(g\), with \(k\) dimensionless. Condone one slip in a dimension.
          - scheme: |
              M: \(\alpha = 1\)
            marks:
              - code: A1
          - scheme: |
              L: \(-3\alpha + \beta + 1 = -1 \Rightarrow \beta = 1\)
            marks:
              - code: A1
  - q: 5
    stamp: 5f95a69e
    parts:
      - part: a
        rows:
          - scheme: |
              \([\rho] = \mathrm{ML^{-3}}\)
            marks:
              - code: B1
                note: Accept \(\mathrm{M/L^3}\) oe. Not for the units \(\mathrm{kg\,m^{-3}}\).
      - part: b
        rows:
          - scheme: |
              Not possible: \(\tfrac12\) is dimensionless
            marks:
              - code: E1
                note: States it is not possible because the constant is dimensionless, or a pure number. Not for ``no'' alone.
      - part: c
        rows:
          - scheme: |
              \(\mathrm{MLT^{-2}} = (\mathrm{ML^{-3}})^{\alpha}(\mathrm{L^2})^{\beta}(\mathrm{LT^{-1}})^{\gamma}\)
            marks:
              - code: M1
                note: Forms a dimensional equation using their \([\rho]\) from (a) and the dimensions of \(F\), \(A\) and \(v\). Condone one slip in a dimension, and \(\frac12\) left in.
          - scheme: |
              M: \(\alpha = 1\)
              T: \(-\gamma = -2\)
              L: \(-3\alpha + 2\beta + \gamma = 1\)
            marks:
              - code: A1
                note: All three equations correct, oe.
          - scheme: |
              \(-3(1) + 2\beta + 2 = 1 \Rightarrow \beta = \ldots\)
            marks:
              - code: dM1
                note: Solves their three equations, substituting their \(\alpha\) and \(\gamma\) to find \(\beta\).
          - scheme: |
              \(\alpha = 1\), \(\beta = 1\), \(\gamma = 2\)
            marks:
              - code: A1
  - q: 6
    stamp: ce41cd28
    parts:
      - part: ''
        rows:
          - scheme: |
              \(\left[k_1 mv\frac{\mathrm{d}v}{\mathrm{d}x}\right] = \mathrm{M}\times\mathrm{LT^{-1}}\times\frac{\mathrm{LT^{-1}}}{\mathrm{L}}\)
            marks:
              - code: M1
                note: Replaces the quantities in at least one term by their dimensions and combines them. Condone one slip.
          - scheme: |
              \(\phantom{\left[k_1 mv\frac{\mathrm{d}v}{\mathrm{d}x}\right]} = \mathrm{MLT^{-2}}\)
            marks:
              - code: A1
                note: Accept \(v\frac{\mathrm{d}v}{\mathrm{d}x}\) treated as an acceleration, \(\mathrm{LT^{-2}}\).
          - scheme: |
              \([k_2\mu mg] = \mathrm{M}\times\mathrm{LT^{-2}} = \mathrm{MLT^{-2}}\)
            marks:
              - code: A1
                note: \(k_2\) and \(\mu\) dimensionless, stated or implied by their omission.
          - scheme: |
              \([Q] = \mathrm{ML^2T^{-2}}\)
            marks:
              - code: B1
          - scheme: |
              \(\left[k_3\frac{Q}{x}\right] = \frac{\mathrm{ML^2T^{-2}}}{\mathrm{L}} = \mathrm{MLT^{-2}}\)
            marks:
              - code: A1
          - scheme: |
              \([F] = \mathrm{MLT^{-2}}\), the same as every term
              \(\Rightarrow\) dimensionally consistent
            marks:
              - code: E1
                note: States \([F] = \mathrm{MLT^{-2}}\) and concludes consistent, with all three terms correctly shown as \(\mathrm{MLT^{-2}}\).
  - q: 7
    stamp: 8bf815c8
    parts:
      - part: ''
        rows:
          - scheme: |
              Exponent dimensionless: \(\left[\frac{kt}{m}\right] = 1\)
              \(\Rightarrow \frac{[k]\mathrm{T}}{\mathrm{M}} = 1 \Rightarrow [k] = \ldots\)
            marks:
              - code: M1
                note: Sets the dimensions of \(\frac{kt}{m}\) equal to 1 with \([t]\) and \([m]\) substituted, or equates \(\left[\frac{mg}{k}\right]\) with \([v]\) in M, L, T.
          - scheme: |
              \([k] = \mathrm{MT^{-1}}\)
            marks:
              - code: A1
                note: Any equivalent form. Not for the units \(\mathrm{kg\,s^{-1}}\).
  - q: 8
    stamp: 5855c862
    parts:
      - part: a
        rows:
          - scheme: |
              \([T]^2 = \frac{[a]^3}{[\mu]} \Rightarrow \mathrm{T^2} = \frac{\mathrm{L^3}}{[\mu]}\)
            marks:
              - code: M1
                note: Substitutes \([T]=\mathrm{T}\) and \([a]=\mathrm{L}\), with \(4\pi^2\) treated as dimensionless, into the equation. Condone slips in rearranging.
          - scheme: |
              \([\mu] = \mathrm{L^3T^{-2}}\)
            marks:
              - code: A1
                note: oe, such as \(\mathrm{L^3/T^2}\). Not for the units \(\mathrm{m^3\,s^{-2}}\).
      - part: b
        rows:
          - scheme: |
              \([H] = \mathrm{M}\sqrt{\their{\mathrm{L^3T^{-2}}}\,\mathrm{L}}\)
              \(\phantom{[H]} = \mathrm{M}\left(\mathrm{L^4T^{-2}}\right)^{\frac12}\)
            marks:
              - code: M1
                note: Uses \([m]=\mathrm{M}\), \([a]=\mathrm{L}\), \(1-e^2\) dimensionless and their \([\mu]\) in terms of \(\mathrm{L}\) and \(\mathrm{T}\), and halves the powers under the root.
          - scheme: |
              \([H] = \mathrm{ML^2T^{-1}}\)
            marks:
              - code: A1
                note: oe. Not for the units \(\mathrm{kg\,m^2\,s^{-1}}\).
  - q: 9
    stamp: 406ffc12
    parts:
      - part: a
        rows:
          - scheme: |
              \([k][v]^2 = [F]\)
              \(\Rightarrow [k](\mathrm{LT^{-1}})^2 = \mathrm{MLT^{-2}}\)
            marks:
              - code: M1
                note: Equates the dimensions of \(kv^2\) to those of force, with \([F]\) in terms of \(\mathrm{M}\), \(\mathrm{L}\) and \(\mathrm{T}\). Condone a slip in squaring \([v]\).
          - scheme: |
              \([k] = \mathrm{ML^{-1}}\)
            marks:
              - code: A1
                note: oe, such as \(\mathrm{ML^{-1}T^0}\). Not for the units \(\mathrm{kg\,m^{-1}}\).
      - part: b
        rows:
          - scheme: |
              \([k^2 m^\alpha u^\beta g^\gamma] = \mathrm{L}\)
              \((\their{\mathrm{ML^{-1}}})^2\,\mathrm{M}^\alpha(\mathrm{LT^{-1}})^\beta(\mathrm{LT^{-2}})^\gamma = \mathrm{L}\)
            marks:
              - code: M1
                note: Sets the dimensions of the third term equal to \(\mathrm{L}\), or to those of another term, using their \([k]\) in \(\mathrm{M}\), \(\mathrm{L}\), \(\mathrm{T}\). Condone one slip in \([u]\) or \([g]\).
          - scheme: |
              M: \(2 + \alpha = 0\)
              L: \(-2 + \beta + \gamma = 1\)
              T: \(-\beta - 2\gamma = 0\)
            marks:
              - code: A1
                note: All three equations correct, oe.
          - scheme: |
              \(\beta = -2\gamma \Rightarrow -2 - 2\gamma + \gamma = 1\)
              \(\phantom{\beta = -2\gamma} \Rightarrow \gamma = \ldots\)
            marks:
              - code: dM1
                note: Solves their three equations to find all of \(\alpha\), \(\beta\) and \(\gamma\), by any method.
          - scheme: |
              \(\alpha = -2,\ \beta = 6,\ \gamma = -3\)
            marks:
              - code: A1
  - q: 10
    stamp: 39e900ae
    parts:
      - part: ''
        rows:
          - scheme: |
              \((\mathrm{LT^{-1}})^\delta = \mathrm{L^2T^{-2}}\)
              \((\mathrm{LT^{-1}})^\gamma = \sqrt{\mathrm{L^2T^{-2}}} = \mathrm{LT^{-1}}\)
            marks:
              - code: M1
                note: Equates the dimensions of the terms added inside the square root, or of \(u^\gamma\sin\theta\) with the root, taking \(\sin\theta\) as dimensionless. Condone one dimension slip.
          - scheme: |
              \(\delta = 2\), \(\gamma = 1\)
            marks:
              - code: A1
          - scheme: |
              \(\mathrm{L} = \frac{(\mathrm{LT^{-1}})^\alpha}{(\mathrm{LT^{-2}})^\beta}\,\mathrm{LT^{-1}}\)
              \(\Rightarrow \alpha - \beta + 1 = 1,\ -\alpha + 2\beta - 1 = 0\)
              \(\Rightarrow \alpha = \ldots,\ \beta = \ldots\)
            marks:
              - code: M1
                note: Uses their bracket dimensions as a power product of \(\mathrm{L}\) and \(\mathrm{T}\), equates powers of \(\mathrm{L}\) and \(\mathrm{T}\) with \([R]\) and solves for \(\alpha\) and \(\beta\). Condone sign slips.
          - scheme: |
              \(\alpha = 1\), \(\beta = 1\)
            marks:
              - code: A1
