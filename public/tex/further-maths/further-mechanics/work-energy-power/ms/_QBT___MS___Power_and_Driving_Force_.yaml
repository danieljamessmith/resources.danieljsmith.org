  - q: 8
    stamp: 6b1dac4e
    parts:
      - part: ''
        rows:
          - scheme: |
              \(P = Fv \Rightarrow F = \frac{9000}{12} = 750\)
            marks:
              - code: B1
          - scheme: |
              Whole system, up the slope positive:
              \(750 + 240 + 90 - 900g\sin\alpha = 900a\)
            marks:
              - code: M1
                note: Forms an equation of motion for car and trailer with their braking force from \(\frac{P}{v}\), both resistances, the weight component and \(900a\). Condone sign slips.
              - code: A1
                note: Correct equation, unsimplified.
          - scheme: |
              \(a = 0.22\)
            marks:
              - code: A1
                note: Or \(-0.22\), consistent with their positive direction.
          - scheme: |
              Trailer, up the slope positive:
              \(T + 90 - 200g\sin\alpha = 200a\)
            marks:
              - code: M1
                note: Forms an equation of motion for the trailer, or the car with its \(750\,\mathrm{N}\) braking force, with the towbar force, its resistance, its weight component and mass times their \(a\). Condone sign slips.
              - code: A1
                note: Correct equation, in \(a\) or with \(a = 0.22\).
          - scheme: |
              \(T = 150\)
            marks:
              - code: A1
                note: Magnitude 150 N.
          - scheme: |
              Towbar in compression
            marks:
              - code: A1
                note: cso, with the direction of the towbar force on the trailer or car correctly interpreted.
  - q: 9
    stamp: 51818e4d
    parts:
      - part: a
        rows:
          - scheme: |
              \(P = Fv \Rightarrow F = \frac{12\,000}{12} = 1000\)
            marks:
              - code: B1
          - scheme: |
              \(\their{1000} = 1000g\sin\theta + 216 + 294\)
            marks:
              - code: M1
                note: Forms an equilibrium equation along the slope for the whole system, or one for each body, with driving force, both resistances and a weight component. Condone sign slips.
              - code: A1
                note: Correct equation, or a correct pair of equations for the two bodies.
          - scheme: |
              \(\sin\theta = 0.05\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \(KE_0 = \tfrac12 \times 200 \times 14^2 = 19\,600\)
            marks:
              - code: B1
          - scheme: |
              \(GPE_0 - GPE_1 = 200gs\sin\theta\ [= 98s]\)
            marks:
              - code: B1
                note: GPE lost by the sledge in terms of its distance, \(200gs\sin\theta\) or \(98s\) oe.
          - scheme: |
              \(19\,600 + 200gs\sin\theta - 294s = 0 \Rightarrow s = \ldots\)
            marks:
              - code: M1
                note: Forms a work--energy equation for the sledge with KE, GPE and work against resistance terms. Condone sign slips. Not for Newton's second law with constant-acceleration formulae.
              - code: A1
                note: Correct equation oe, with \(\sin\theta\) or 0.05.
          - scheme: |
              \(AB = 100\,\mathrm{m}\)
            marks:
              - code: A1
  - q: 10
    stamp: 52b5fc87
    parts:
      - part: a
        rows:
          - scheme: |
              \(F + 5000g\sin\theta - (800 + 500) = 5000(1.2)\)
              \(F + 5000(9.8)(0.06) - 1300 = 6000\)
            marks:
              - code: M1
                note: Forms an equation of motion along the slope for the combination, or for each vehicle with a tension, with driving force, weight component and both resistances. Condone sign slips and \(\sin\)/\(\cos\) confusion.
              - code: A1
          - scheme: |
              \(P = Fv = \their{4360} \times 14\)
            marks:
              - code: M1
                note: Uses \(P = Fv\) with their driving force and \(v = 14\), or substitutes \(F = \frac{P}{14}\) into their equation of motion.
          - scheme: |
              \(P = 61\,040\)
            marks:
              - code: A1
                note: awrt \(61\,000\) oe, such as \(61.0\,\mathrm{kW}\).
      - part: b
        rows:
          - scheme: |
              \(Pt = 61\,040 \times 7.93\)
            marks:
              - code: B1
                note: Engine work \(7.93P\), with \(P\) or their \(P\) from (a).
          - scheme: |
              \(GPE_0 - GPE_1 = 5000g\,s\sin\theta = 2940s\)
            marks:
              - code: B1
                note: GPE lost \(5000g\,s\sin\theta\) oe, in terms of the distance.
          - scheme: |
              \(KE_0+GPE_0+\sum W_{\text{other}}=KE_1+GPE_1\)
              \(\tfrac12(5000)(14^2) + 2940s + \their{61\,040}(7.93) - 1300s\)
              \(\phantom{\tfrac12(5000)(14^2)} = \tfrac12(5000)(22^2)\)
            marks:
              - code: M1
                note: Forms a work--energy equation with the KE change, engine work, GPE change and work against both resistances. Condone sign slips.
              - code: A1ft
                note: Correct equation with \(P\) or their \(P\) from (a).
          - scheme: |
              \(s = \frac{720\,000 - 61\,040(7.93)}{1640}\)
              \(AB = 144\,\mathrm{m}\)
            marks:
              - code: A1
                note: awrt 144 or 140.
  - q: 11
    stamp: 751046c6
    parts:
      - part: ''
        rows:
          - scheme: |
              \(\sin\alpha = \frac{7}{25} \Rightarrow 2500g\sin\alpha = 6860\)
            marks:
              - code: B1
                note: Correct weight component, soi by \(2500g \times \frac{7}{25}\) or 6860 in an equation.
          - scheme: |
              \(\frac{P}{12} - R - 6860 = 2500 \times 2.4\)
            marks:
              - code: M1
                note: Resolves along the slope at speed 12 with \(\frac{P}{12}\), \(R\), a weight component and \(2500 \times 2.4\). Condone sign slips and \(\sin\)/\(\cos\) confusion.
              - code: A1
          - scheme: |
              \(\frac{P}{18} - R - 6860 = 2500 \times 0.4\)
            marks:
              - code: M1
                note: Resolves along the slope at speed 18 as at speed 12, with \(\frac{P}{18}\) and \(2500 \times 0.4\).
              - code: A1
          - scheme: |
              \(\frac{P}{12} - \frac{P}{18} = \their{12\,860} - \their{7860} \Rightarrow P = \ldots\)
            marks:
              - code: dM1
                note: Eliminates \(P\) or \(R\) from their two equations, each with \(P\) divided by the speed, and solves for one unknown.
          - scheme: |
              \(P = 180\,000\)
            marks:
              - code: A1
                note: Condone an error in the weight component common to both equations, which cancels.
          - scheme: |
              \(R = 2140\)
            marks:
              - code: A1
  - q: 12
    stamp: ba4c785a
    parts:
      - part: a
        rows:
          - scheme: |
              \(1000P = 2000 \times 20\)
            marks:
              - code: M1
                note: Uses \(P = Fv\) with the driving force equal to the resistance and \(v = 20\). Condone a missing or wrong factor of 1000.
          - scheme: |
              \(P = 40\)
            marks:
              - code: A1
                note: \(P\) in kilowatts, so \(40\).
      - part: b
        rows:
          - scheme: |
              \(F = \frac{40\,000}{10} = 4000\)
            marks:
              - code: B1
          - scheme: |
              \(\their{4000} - (220 + 2 \times 10^2) - 2000g\sin\alpha\)
              \(\phantom{4000} = 2000a\)
            marks:
              - code: M1
                note: Forms an equation of motion along the slope with their driving force, the refined resistance at \(v = 10\), the weight component and \(2000a\). Condone sign slips and \(\sin\)/\(\cos\) confusion.
          - scheme: |
              \(4000 - 420 - 980 = 2000a\)
            marks:
              - code: A1
                note: Correct equation, oe.
          - scheme: |
              \(a = 1.3\)
            marks:
              - code: A1
      - part: c
        rows:
          - scheme: |
              \(F = \frac{40\,000}{U}\)
            marks:
              - code: B1
                note: Driving force as their power in watts over \(U\).
          - scheme: |
              \(\their{\frac{40\,000}{U}} = 220 + 2U^2 + 2000g\sin\alpha\)
            marks:
              - code: M1
                note: Equates their driving force, of the form \(\frac{k}{U}\), to \(220 + 2U^2\) plus the weight component. Condone sign slips and \(\sin\)/\(\cos\) confusion.
          - scheme: |
              \(\frac{40\,000}{U} = 1200 + 2U^2\)
            marks:
              - code: A1
                note: Correct equation, oe.
          - scheme: |
              \(U^3 + 600U - 20\,000 = 0 \Rightarrow U = \ldots\)
            marks:
              - code: dM1
                note: Multiplies through by \(U\) to form a cubic and solves it by any means, including a calculator.
          - scheme: |
              \(U = 20\)
            marks:
              - code: A1
                note: Other roots need not be considered.
