questions:
  - q: 1
    stamp: 4c03bd03
    parts:
      - part: a
        rows:
          - scheme: |
              \(P = Fv\) with \(F = R\):
              \(200\,000 = 20R \Rightarrow R = \ldots\)
            marks:
              - code: M1
                note: Uses \(P = Fv\) with driving force equal to resistance at \(v = 20\). Condone power left in kW.
          - scheme: |
              \(R = 10\,000\,\mathrm{N}\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \(\frac{60\,000}{8} - \their{10\,000} = 10\,000a \Rightarrow a = \ldots\)
            marks:
              - code: M1
                note: Forms an equation of motion with driving force \(\frac{P}{v}\), their resistance and mass \(10\,000\). Condone sign slips and power in kW.
          - scheme: |
              \(a = -0.25\,\mathrm{m\,s^{-2}}\)
            marks:
              - code: A1
                note: Or a deceleration of \(0.25\). A0 for \(a = 0.25\) with no direction.
      - part: c
        rows:
          - scheme: |
              \(F = \frac{200\,000}{10} = 20\,000\)
            marks:
              - code: B1
          - scheme: |
              \(\their{20\,000} = \their{10\,000} + 10\,000 \times 9.8\sin\theta\)
            marks:
              - code: M1
                note: Resolves along the slope with zero acceleration, using their driving force, their resistance and a weight component. Condone sign slips and \(\sin\)/\(\cos\) confusion.
              - code: A1
                note: Correct equation, oe.
          - scheme: |
              \(\sin\theta = \frac{5}{49} \Rightarrow \theta = 5.9^\circ\)
            marks:
              - code: A1
                note: awrt \(5.9^\circ\), or awrt \(0.102\) radians.
  - q: 2
    stamp: 24ece676
    parts:
      - part: ''
        rows:
          - scheme: |
              \(3000g\sin\theta = 3000 \times 9.8 \times \frac{1}{49} = 600\)
            marks:
              - code: B1
          - scheme: |
              \(P = Fv\)
              \(F = \their{600} + 300 + 60v \Rightarrow P = \ldots\)
            marks:
              - code: M1
                note: Uses \(P = Fv\) with driving force equal to resistance plus a weight component, at speed \(v\) or 15. Condone sign slips.
          - scheme: |
              \(P = 15(600 + 300 + 60 \times 15)\)
            marks:
              - code: A1
                note: Correct expression for the power at \(v = 15\), oe.
          - scheme: |
              Power needed, \(900v + 60v^2\), increases with \(v\), so
              the greatest constant speed is at maximum power
            marks:
              - code: E1
                note: States that the engine works at maximum power at the greatest constant speed, with a reason such as the power needed increasing with \(v\).
          - scheme: |
              \(P_{\max} = 27\,000\,\mathrm{W}\)
            marks:
              - code: A1
  - q: 3
    stamp: 3b7e8cdf
    parts:
      - part: i
        rows:
          - scheme: |
              \(P = Fv\) with \(F = R\): \(72\,000 = 18R \Rightarrow R = \ldots\)
            marks:
              - code: M1
                note: Uses \(P = Fv\) at \(v = 18\) with the driving force equal to the resistance.
          - scheme: |
              \(R = 4000\,\mathrm{N}\)
            marks:
              - code: A1
      - part: ii
        rows:
          - scheme: |
              \(\frac{72\,000}{12} - \their{4000} = \ldots\ [= 6000 - 4000]\)
            marks:
              - code: M1
                note: Finds the total resistance from \(P = Fv\) at \(v = 12\) and subtracts their tug resistance.
          - scheme: |
              \(2000\,\mathrm{N}\)
            marks:
              - code: A1
      - part: iii.a
        rows:
          - scheme: |
              \(F - \their{4000} - \their{2000} = 4000 \times 0.25\)
              \(\Rightarrow F = \ldots\ [= 7000]\)
            marks:
              - code: M1
                note: Forms Newton's second law for the whole system, with driving force, both their resistances and the total mass. Condone sign slips.
              - code: A1
                note: Correct equation, oe.
          - scheme: |
              \(P = Fv = \their{7000} \times 10\)
            marks:
              - code: M1
                note: Uses \(P = Fv\) with their driving force from Newton's second law and \(v = 10\).
          - scheme: |
              \(P = 70\,000\,\mathrm{W}\) \((70\,\mathrm{kW})\)
            marks:
              - code: A1
      - part: iii.b
        rows:
          - scheme: |
              \(T - \their{2000} = 2200 \times 0.25 \Rightarrow T = \ldots\)
            marks:
              - code: M1
                note: Forms Newton's second law for the aircraft alone, or the tug alone with their driving force, including the tow bar force. Condone sign slips.
          - scheme: |
              \(T = 2550\,\mathrm{N}\)
            marks:
              - code: A1
      - part: iv.a
        rows:
          - scheme: |
              Lower: no resistance below \(6\,\mathrm{m\,s^{-1}}\), so greater
              resultant force and acceleration there
            marks:
              - code: E1
                note: States lower, because zero resistance below 6 gives a greater acceleration or resultant force.
          - scheme: |
              Models agree from 6 to \(10\,\mathrm{m\,s^{-1}}\), so total time is less
            marks:
              - code: E1
                note: States the models agree from 6 to 10, so the time saved below 6 makes the total time less.
      - part: iv.b
        rows:
          - scheme: |
              The same
            marks:
              - code: E1
                note: States that the greatest steady speed is the same.
          - scheme: |
              \(12 > 6\), so same resistances and same maximum power at that speed
            marks:
              - code: E1
                note: Explains that the steady speed of 12 exceeds 6, so the original resistances and the same maximum power apply there.
  - q: 4
    stamp: '10793700'
    parts:
      - part: a
        rows:
          - scheme: |
              \(P = Fv \Rightarrow 12\,000 = 15F \Rightarrow F = 800\)
            marks:
              - code: B1
          - scheme: |
              \(\their{800} = R + 1000 \times 9.8 \times \tfrac{1}{20}\)
            marks:
              - code: M1
                note: Resolves along the slope with zero acceleration, with their driving force, \(R\) and the weight component. Condone sign slips and \(\sin\)/\(\cos\) confusion.
              - code: A1
          - scheme: |
              \(R = 310\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \(F = \frac{12\,000}{7.5} = 1600\)
            marks:
              - code: B1
          - scheme: |
              \(\their{1600} - \their{310} - 106 - 1600 \times 9.8 \times \tfrac{1}{20}\)
              \(\phantom{1600} = 1600a\)
            marks:
              - code: M1
                note: Forms an equation of motion for the system, or for the van alone with \(T\), with driving force, all resistances and weight components. Condone sign slips and \(\sin\)/\(\cos\) confusion.
              - code: A1
          - scheme: |
              \(a = 0.25\)
            marks:
              - code: A1
          - scheme: |
              \(T - 106 - 600 \times 9.8 \times \tfrac{1}{20}\)
              \(\phantom{T} = 600 \times \their{0.25}\)
            marks:
              - code: M1
                note: Forms a second equation of motion with \(T\), for the trailer or the van, with all its forces and mass times acceleration. Condone sign slips and \(\sin\)/\(\cos\) confusion.
              - code: A1
          - scheme: |
              \(T = 550\)
            marks:
              - code: A1
  - q: 5
    stamp: 0ec6645f
    parts:
      - part: ''
        rows:
          - scheme: |
              Maximum power at the greatest constant speed
              and for the greatest acceleration:
              \(P = Fv \Rightarrow F = \frac{64\,000}{v}\)
            marks:
              - code: E1
                note: States maximum power at \(v = 20\) and at \(v = 16\), each with a reason. Both needed.
          - scheme: |
              \(\frac{64\,000}{20} = (200 + 20k) + 2000g\sin\alpha\)
            marks:
              - code: M1
                note: Resolves along the slope with zero acceleration, using driving force \(\frac{64\,000}{20}\), resistance at \(v = 20\) and a weight component. Condone sign slips.
              - code: A1
          - scheme: |
              \(k = 101\)
            marks:
              - code: A1
          - scheme: |
              \(\frac{64\,000}{16} - (200 + 16\their{k})\)
              \(\phantom{\frac{64\,000}{16}} - 2000g\sin\alpha = 2000a\)
            marks:
              - code: M1
                note: Applies Newton's second law along the slope, using driving force \(\frac{64\,000}{16}\), resistance \(200 + 16k\) with their \(k\), and a weight component. Condone sign slips.
              - code: A1
          - scheme: |
              \(a = 0.602\,\mathrm{m\,s^{-2}}\)
            marks:
              - code: A1
  - q: 6
    stamp: 91505a2b
    parts:
      - part: a
        rows:
          - scheme: |
              Air resistance \(kv\): \(1200 = 600 + 15k \Rightarrow k = \ldots\)
            marks:
              - code: M1
                note: Equates the driving force to \(600\) plus a resistance proportional to speed at \(v = 15\). Condone sign slips.
          - scheme: |
              \(k = 40\)
            marks:
              - code: A1
          - scheme: |
              \(P = Fv\)
              \(P = (600 + \their{40} \times 30) \times 30\)
            marks:
              - code: M1
                note: Takes the driving force at \(30\,\mathrm{m\,s^{-1}}\) as their resistance \(600 + 30k\) and multiplies by 30.
          - scheme: |
              \(P = 1800 \times 30 = 54\,000\)
            marks:
              - code: A1 AG
                note: Correct \(k\) and substituted \(P = Fv\) leading without error to \(54\,000\).
      - part: b
        rows:
          - scheme: |
              \(\frac{54\,000}{20} - (600 + \their{40} \times 20) = 1300a\)
            marks:
              - code: M1
                note: Uses Newton's second law with driving force \(\frac{54\,000}{20}\), their resistance \(600 + 20k\) and mass 1300. Condone sign slips.
          - scheme: |
              \(a = 1\)
            marks:
              - code: A1
      - part: c
        rows:
          - scheme: |
              \(\frac{54\,000}{4} - (600 + \their{40} \times 4) = 1300a\)
            marks:
              - code: M1
                note: Uses Newton's second law with driving force \(\frac{54\,000}{4}\), their resistance \(600 + 4k\) and mass 1300. Condone sign slips.
          - scheme: |
              \(a = 9.8\)
            marks:
              - code: A1
      - part: d
        rows:
          - scheme: |
              Acceleration at \(20\,\mathrm{m\,s^{-1}}\) reasonable;
              at \(4\,\mathrm{m\,s^{-1}}\) unrealistically large for a van
            marks:
              - code: E1
                note: Interprets both answers, with (c)'s judged too large, for example as close to \(g\). Not for ``unrealistic'' without saying which.
          - scheme: |
              Model not valid at low speeds: \(F = \frac{P}{v}\) becomes very large as \(v \to 0\)
            marks:
              - code: E1
                note: Concludes the model fails at low speeds, giving the reason that \(\frac{P}{v}\) grows as \(v\) falls. Accept that full power or tyre grip cannot be sustained then.
