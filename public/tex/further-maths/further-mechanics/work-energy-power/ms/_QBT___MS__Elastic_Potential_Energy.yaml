questions:
  - q: 1
    stamp: 38fb4e8e
    parts:
      - part: a
        rows:
          - scheme: |
              \(\text{EPE}_0 = \frac{2mg(2a)^2}{2(2a)} = 2mga\)
              String slack at \(\frac32 a\), so \(\text{EPE}_1 = 0\)
            marks:
              - code: B1
                note: Needs both; EPE zero at \(\frac32 a\) is implied by an energy equation with no elastic term there.
          - scheme: |
              \(\frac12 mv^2 + mg\left(\frac32 a\right) = mg(4a) + \text{"}2mga\text{"}\)
            marks:
              - code: M1
                note: Equates energies at the two positions, with kinetic, gravitational and elastic terms, the elastic of the form \(\frac{\lambda x^2}{2l}\). Condone sign slips.
              - code: A1
                note: Any correct form, e.g. \(\frac12 mv^2 = \frac52 mga + 2mga\).
          - scheme: |
              \(v = 3\sqrt{ag}\)
            marks:
              - code: A1
                note: Or \(\sqrt{9ag}\) oe.
      - part: b
        rows:
          - scheme: |
              \(m\alpha = \frac{2mg(2a)}{2a} + mg\)
            marks:
              - code: M1
                note: Uses \(F = ma\) with a tension of the form \(\frac{\lambda x}{l}\) and the weight. Condone sign slips.
          - scheme: |
              \(\alpha = 3g\), downwards
            marks:
              - code: A1
                note: \(3g\) with its direction, downwards or towards \(O\); A0 without a direction.
  - q: 2
    stamp: fcfc38e3
    parts:
      - part: a
        rows:
          - scheme: |
              \(\text{EPE} = \frac{15 \times 0.4^2}{2 \times 2.5}\)
            marks:
              - code: M1
                note: Uses \(\frac{\lambda x^2}{2l}\) with \(x = 0.4\). Not for using the length \(2.9\) as the extension.
          - scheme: |
              \(\phantom{\text{EPE}} = 0.48\,\mathrm{J}\)
            marks:
              - code: A1
      - part: b
        rows:
          - scheme: |
              \(\text{GPE lost} = 0.75 \times 9.8 \times 1.1\)
            marks:
              - code: M1
                note: Uses \(mgh\) with \(h = 4.0 - 2.9\). Not for \(h = 4.0\).
          - scheme: |
              \(\phantom{\text{GPE lost}} = 8.085\,\mathrm{J}\)
            marks:
              - code: A1
                note: awrt \(8.09\), or \(8.1\).
      - part: c
        rows:
          - scheme: |
              \(\text{EPE at } B = \frac{15 \times 1.5^2}{2 \times 2.5} = 6.75\,\mathrm{J}\)
            marks:
              - code: B1
          - scheme: |
              \(\tfrac12 (0.75) v^2 + 6.75 = 0.48 + 8.085\)
            marks:
              - code: M1
                note: Forms an energy equation from \(A\) to \(B\) with KE at \(B\), GPE lost and both EPE terms. Condone sign slips and their values from (a), (b).
              - code: A1
                note: Correct equation, oe.
          - scheme: |
              \(v^2 = 4.84 \Rightarrow v = 2.2\,\mathrm{m\,s^{-1}}\)
            marks:
              - code: A1
                note: \(2.2\) or \(2.20\).
      - part: d
        rows:
          - scheme: |
              \(T = \frac{15 \times 0.8}{2.5}\), compared with \(0.75 \times 9.8\)
            marks:
              - code: M1
                note: Uses \(\frac{\lambda x}{l}\) with \(x = 0.8\) for the tension and compares it with the weight, or finds their difference.
          - scheme: |
              \(T = 4.8\,\mathrm{N}\), weight \(= 7.35\,\mathrm{N}\)
            marks:
              - code: A1
                note: Both correct; a resultant of \(2.55\,\mathrm{N}\) implies them.
          - scheme: |
              Resultant force (acceleration) downwards, and the particle is moving downwards, so its speed increases.
            marks:
              - code: E1
                note: States the resultant force or acceleration is downwards and the particle is moving downwards at \(C\). Needs the A1.
  - q: 3
    stamp: b07b4075
    parts:
      - part: ''
        rows:
          - scheme: |
              \(F = \frac{1}{\sqrt3} \times mg\cos 30^\circ = \tfrac12 mg\)
            marks:
              - code: B1
                note: Or friction work \(\tfrac12 mgx\) seen, including in the energy equation.
          - scheme: |
              \(\mathrm{EPE} = \frac{2mg\,x^2}{2a} = \frac{mgx^2}{a}\)
            marks:
              - code: B1
                note: soi in the energy equation.
          - scheme: |
              \(\tfrac12 m\left(\tfrac{3ga}{2}\right) - \tfrac12 mgx\)
              \(\phantom{A} = mg\left(\tfrac{x}{2}\right) + \frac{mgx^2}{a}\)
            marks:
              - code: M1
                note: Forms an energy equation with initial KE, GPE gain, EPE and friction work, the last three in \(x\). Condone sign slips and \(\sin\)/\(\cos\) confusion.
              - code: A1
                note: Correct equation, oe.
          - scheme: |
              \(x^2 + ax - \tfrac34 a^2 = 0 \Rightarrow x = \tfrac{a}{2}\)
            marks:
              - code: A1
                note: cso. A0 if \(x = -\tfrac{3a}{2}\) is not rejected.
  - q: 4
    stamp: 7ddd39a0
    parts:
      - part: a
        rows:
          - scheme: |
              \(2T\sin\theta = mg\), \(\sin\theta = \frac{5}{13}\)
              \(T = \frac{\lambda(\text{"}26a\text{"} - 18a)}{18a}\)
            marks:
              - code: M1
                note: Resolves vertically with the vertical components of both tensions and \(mg\), each tension \(\frac{\lambda x}{l}\) with their extension. Condone sin/cos confusion.
          - scheme: |
              \(2\left(\frac{4\lambda}{9}\right)\left(\frac{5}{13}\right) = mg\)
            marks:
              - code: A1
                note: Any correct form, e.g. \(\frac{40\lambda}{117} = mg\).
          - scheme: |
              \(\lambda = \frac{117mg}{40}\)
            marks:
              - code: A1
                note: oe, e.g. \(2.925mg\).
      - part: b
        rows:
          - scheme: |
              \(AP = \sqrt{(12a)^2 + (9a)^2} = 15a\)
              \(\Rightarrow\) extension \(= 30a - 18a = 12a\)
            marks:
              - code: B1
                note: Or \(6a\) for each half of natural length \(9a\).
          - scheme: |
              EPE at release \(= \frac{\lambda(12a)^2}{2(18a)} = 4\lambda a\)
            marks:
              - code: B1
                note: oe, in terms of \(\lambda\) or as \(11.7mga\); two halves \(2 \times \frac{\lambda(6a)^2}{2(9a)}\) accepted.
          - scheme: |
              EPE at equilibrium \(= \frac{\lambda(8a)^2}{2(18a)} = \frac{16\lambda a}{9}\)
            marks:
              - code: B1
                note: oe, in terms of \(\lambda\) or as \(5.2mga\).
          - scheme: |
              \(\text{"}4\lambda a\text{"} = \text{"}\frac{16\lambda a}{9}\text{"} + mg(4a) + \frac12 mv^2\)
            marks:
              - code: M1
                note: Forms an energy equation with both their EPE terms, a GPE change of \(mg\) times a distance, and \(\frac12 mv^2\). Condone sign slips.
          - scheme: |
              \(4\lambda a = \frac{16\lambda a}{9} + 4mga + \frac12 mv^2\)
            marks:
              - code: A1
                note: Any correct form, with \(\lambda\) or with \(\lambda = \frac{117mg}{40}\) substituted.
          - scheme: |
              \(v^2 = 5ag \Rightarrow v = \sqrt{5ag}\)
            marks:
              - code: A1
  - q: 5
    stamp: b27902d3
    parts:
      - part: a
        rows:
          - scheme: |
              \(\frac{9mg\,e}{3a} = mg\)
            marks:
              - code: M1
                note: Equates a tension of the form \(\frac{\lambda e}{l}\), with their \(\lambda\) and \(l\), to \(mg\). Condone \(e\) written as a length minus \(3a\).
              - code: A1
                note: Correct equation, oe.
          - scheme: |
              \(e = \frac{a}{3}\)
            marks:
              - code: A1
                note: Correct extension, or implied by a correct \(OE\) from an equation in the length.
          - scheme: |
              \(OE = 3a + \frac{a}{3} = \frac{10a}{3}\)
            marks:
              - code: A1
                note: \(\frac{10a}{3}\) oe.
      - part: b
        rows:
          - scheme: |
              EPE at \(A\): \(\frac{9mg}{2(3a)}\left(\frac{7a}{3}\right)^2\)
              \(\phantom{\text{EPE at }A:} = \frac{49}{6}mga\)
            marks:
              - code: B1
                note: Need not be simplified; soi in the energy equation.
          - scheme: |
              EPE at \(E\): \(\frac{9mg}{2(3a)}\left(\frac{a}{3}\right)^2 = \frac{1}{6}mga\)
            marks:
              - code: B1
                note: Need not be simplified; soi in the energy equation.
          - scheme: |
              Work against resistance \(= \frac14 mg \times 2a = \frac12 mga\)
            marks:
              - code: B1
                note: Need not be simplified; soi in the energy equation.
          - scheme: |
              \(\frac{49}{6}mga - \frac12 mga\)
              \(\phantom{A} = \frac12 mv^2 + mg(2a) + \frac16 mga\)
            marks:
              - code: M1
                note: Forms an energy equation from \(A\) to \(E\) with KE, a GPE change, two EPE terms of the form \(\frac{\lambda x^2}{2l}\) and the work against resistance. Condone sign slips.
              - code: A1
                note: Correct equation, oe, with any zero level for GPE.
          - scheme: |
              \(v = \sqrt{11ag}\)
            marks:
              - code: A1
                note: \(\sqrt{11ag}\) oe.
      - part: c
        rows:
          - scheme: |
              \(mg - \frac14 mg - \frac{9mg\,x}{3a} = 0\)
            marks:
              - code: M1
                note: Sets to zero a resultant of the weight, the resistance and a tension of the form \(\frac{\lambda x}{l}\). Condone sign slips. Or sets the derivative of their energy expression for \(v^2\) to zero.
              - code: A1
                note: Correct equation, oe, with the resistance opposing the weight.
          - scheme: |
              \(x = \frac{a}{4}\)
            marks:
              - code: A1
                note: Correct extension, or implied by a correct \(OB\) from an equation in the length.
          - scheme: |
              \(OB = 3a + \frac{a}{4} = \frac{13a}{4}\)
            marks:
              - code: A1
                note: \(\frac{13a}{4}\) oe.
  - q: 6
    stamp: '14519766'
    parts:
      - part: a
        rows:
          - scheme: |
              \(T = \frac{mg(2l)}{2l} = mg\)
            marks:
              - code: B1
          - scheme: |
              \(R = mg\cos\alpha = \frac{12mg}{13}\)
              \(F = \frac14 \times \frac{12mg}{13} = \frac{3mg}{13}\)
            marks:
              - code: B1
                note: Needs \(R = \frac{12mg}{13}\) or \(mg\cos\alpha\) used; \(F = \frac{3mg}{13}\) or exact equivalent.
          - scheme: |
              \(ma = \text{"}T\text{"} + mg\sin\alpha - \text{"}F\text{"}\)
            marks:
              - code: M1
                note: Forms an equation of motion along the plane with tension, a resolved weight component and friction. Condone sign slips and sin/cos confusion.
          - scheme: |
              \(ma = mg + \frac{5mg}{13} - \frac{3mg}{13}\)
            marks:
              - code: A1
                note: Correct equation with \(\sin\alpha = \frac{5}{13}\) substituted, or \(\sin\alpha\) left in.
          - scheme: |
              \(ma = \frac{15mg}{13} \Rightarrow a = \frac{15}{13}g\)
            marks:
              - code: A1 AG
                note: Correct substituted equation of motion leading without error to \(a=\frac{15}{13}g\); combined simplification accepted.
      - part: b
        rows:
          - scheme: |
              \(\text{EPE} = \frac{mg(2l)^2}{2(2l)} = mgl\)
            marks:
              - code: B1
          - scheme: |
              \(\text{GPE lost} = mg \times 2l\sin\alpha = \frac{10mgl}{13}\)
            marks:
              - code: B1
          - scheme: |
              \(\text{Work against friction} = \frac{3mg}{13} \times 2l = \frac{6mgl}{13}\)
            marks:
              - code: B1
          - scheme: |
              \(\frac12 mv^2 = \text{"}mgl\text{"} + \text{"}\frac{10mgl}{13}\text{"} - \text{"}\frac{6mgl}{13}\text{"}\)
            marks:
              - code: M1
                note: Forms an energy equation with kinetic energy, EPE, GPE and work against friction, all dimensionally correct. Condone sign slips.
          - scheme: |
              \(\frac12 mv^2 = mgl + \frac{10mgl}{13} - \frac{6mgl}{13}\)
            marks:
              - code: A1
          - scheme: |
              \(v = \sqrt{\frac{34gl}{13}}\)
            marks:
              - code: A1
                note: Any exact equivalent, or awrt \(1.62\sqrt{gl}\).
  - q: 7
    stamp: a35350b1
    parts:
      - part: a
        rows:
          - scheme: |
              \(R = 6(9.8) + 80\sin 20^\circ\)
              \(\Rightarrow F = 0.25R = 21.54\)
            marks:
              - code: B1
                note: Correct \(R=6g+80\sin20^\circ\), seen or used, and \(F=0.25R\), awrt \(21.5\,\mathrm{N}\) for \(g=9.8\).
          - scheme: |
              Resolves horizontally: \(80\cos 20^\circ = T + F\)
              with \(T = \frac{80}{2}e\)
            marks:
              - code: M1
                note: Equates the horizontal component of the force to Hooke's law tension, with extension in terms of the distance moved, plus their friction. Condone sign slips.
          - scheme: |
              \(80\cos 20^\circ = 40(0.4 + x) + 21.54\)
            marks:
              - code: A1
                note: Correct equation oe, in any variable for the distance moved or the string's length.
          - scheme: |
              \(40x = 37.64 \Rightarrow x = 0.9409\)
              \(\phantom{40x = 37.64 \Rightarrow x} = 0.94\) (2 s.f.)
            marks:
              - code: A1 AG
                note: Correct substituted horizontal force equation leading without error to \(x=0.94\,\mathrm{m}\) to 2 s.f.; no separate intermediate value required.
      - part: b
        rows:
          - scheme: |
              The coefficient of friction is assumed constant.
            marks:
              - code: E1
                note: States any valid limitation, e.g. block modelled as a particle, air resistance ignored, string light or obeying Hooke's law throughout.
      - part: c
        rows:
          - scheme: |
              Maximum speed where the resultant force is zero
              \(\Rightarrow x = 0.9409\)
            marks:
              - code: B1
                note: Stated or used, with \(x = 0.94\) or more accurate.
          - scheme: |
              \(\text{EPE} = \frac{80(0.4)^2}{2\times 2} = 3.2\)
              and \(\frac{80(1.3409)^2}{2\times 2} = 35.96\)
            marks:
              - code: B1
                note: Both, or their difference, as expressions or values.
          - scheme: |
              Work by force \(= 80\cos 20^\circ \times 0.9409\ [= 70.73]\)
            marks:
              - code: B1
          - scheme: |
              Work against friction \(= 21.54 \times 0.9409\ [= 20.27]\)
            marks:
              - code: B1
          - scheme: |
              \(\text{"}3.2\text{"} + \text{"}70.73\text{"} - \text{"}20.27\text{"}\)
              \(\phantom{3.2} = \tfrac12(6)v^2 + \text{"}35.96\text{"}\)
            marks:
              - code: M1
                note: Forms an equation with kinetic energy, both elastic potential energies and both work terms. Condone sign slips.
          - scheme: |
              \(53.66 = 3v^2 + 35.96\)
            marks:
              - code: A1
                note: Correct equation oe.
          - scheme: |
              \(v = 2.43\,\mathrm{m\,s^{-1}}\)
            marks:
              - code: A1
                note: Awrt 2.43.
  - q: 8
    stamp: ad4983c6
    parts:
      - part: a
        rows:
          - scheme: |
              EPE at \(C = \frac{\lambda a^2}{2a}\ \left[= \frac{\lambda a}{2}\right]\)
            marks:
              - code: B1
                note: Extension \(a\) used in \(\frac{\lambda x^2}{2a}\).
          - scheme: |
              \(\frac12 m\left(\sqrt{ag}\right)^2 + mga = \frac{\lambda a}{2}\)
            marks:
              - code: M1
                note: Forms an energy equation from \(B\) to \(C\) with KE, GPE and EPE terms, each dimensionally correct. Condone sign slips.
              - code: A1
                note: Correct equation, any zero level for GPE.
          - scheme: |
              \(\frac32 mga = \frac{\lambda a}{2} \Rightarrow \lambda = 3mg\)
            marks:
              - code: A1 AG
                note: Correct substituted energy equation leading without error to \(\lambda=3mg\); combined rearrangement accepted.
      - part: b.i
        rows:
          - scheme: |
              Acceleration zero at maximum speed:
              \(mg = \frac{\lambda x}{a} = \frac{3mgx}{a}\)
            marks:
              - code: M1
                note: Equates weight and tension \(\frac{\lambda x}{a}\) with \(\lambda = 3mg\), using zero acceleration. Condone sign slips.
          - scheme: |
              \(x = \frac{a}{3}\)
            marks:
              - code: A1 AG
                note: From \(mg = \frac{3mgx}{a}\) oe with no errors. Need not show that the speed increases then decreases.
      - part: b.ii
        rows:
          - scheme: |
              EPE \(= \frac{3mg}{2a}\left(\frac{a}{3}\right)^2\ \left[= \frac16 mga\right]\)
            marks:
              - code: B1
                note: Or \(\frac{\lambda a}{18}\).
          - scheme: |
              \(\frac12 m\left(\sqrt{ag}\right)^2 + mg\left(\frac{a}{3}\right)\)
              \(\phantom{\frac12} = \frac12 mv^2 + \text{"}\frac16 mga\text{"}\)
            marks:
              - code: M1
                note: Forms an energy equation from \(B\) or \(C\) with all relevant nonzero KE, GPE and EPE terms, including EPE at \(C\). Condone sign slips.
              - code: A1
                note: Correct equation, with \(\lambda\) or \(3mg\).
          - scheme: |
              \(v^2 = \frac{4ag}{3} \Rightarrow v = 2\sqrt{\frac{ag}{3}}\)
            marks:
              - code: A1
                note: Any exact form, e.g. \(\sqrt{\frac{4ag}{3}}\). Positive root only.
      - part: c
        rows:
          - scheme: |
              The kinetic energy of the spring must be included.
            marks:
              - code: E1
                note: States that a term for the spring's kinetic energy, or its gravitational potential energy, is needed. Not for a vague effect such as "less energy".
  - q: 9
    stamp: b6870fd2
    parts:
      - part: a
        rows:
          - scheme: |
              GPE lost \(= mg(2l)\sin\theta = \tfrac65 mgl\)
            marks:
              - code: B1
          - scheme: |
              \(R = \tfrac45 mg \Rightarrow\) work against friction
              \(\phantom{R} = \tfrac12 \cdot \tfrac45 mg \cdot 2l = \tfrac45 mgl\)
            marks:
              - code: B1
          - scheme: |
              EPE at \(C = \frac{kmg(2l)^2}{2l} = 2kmgl\)
              EPE at \(B = \frac{kmg(4l)^2}{2l} = 8kmgl\)
            marks:
              - code: B1
                note: Both needed.
          - scheme: |
              \(\tfrac12 m\left(2\sqrt{gl}\right)^2 + \tfrac65 mgl + 2kmgl\)
              \(\phantom{\tfrac12} = \tfrac45 mgl + 8kmgl\)
            marks:
              - code: M1
                note: Forms an energy equation with initial KE, GPE, both EPE terms and work against friction. Condone sign slips and errors in individual terms.
              - code: A1
                note: Correct equation in any form.
          - scheme: |
              \(6kmgl = \tfrac{12}{5}mgl \Rightarrow k = \tfrac25\)
            marks:
              - code: A1 AG
                note: Correct substituted energy equation leading without error to \(k=\tfrac25\); combined collection, rearrangement and solution accepted.
      - part: b
        rows:
          - scheme: |
              \(T = \frac{kmg(4l)}{l} = \tfrac85 mg\)
            marks:
              - code: B1
                note: Accept \(4kmg\), with \(k = \tfrac25\) used later.
          - scheme: |
              \(F = \tfrac12 \cdot \tfrac45 mg = \tfrac25 mg\), down the plane
            marks:
              - code: B1
                note: Needs the magnitude and the direction; the direction may be implied by the equation of motion.
          - scheme: |
              \(\tfrac85 mg - \tfrac35 mg - \tfrac25 mg = ma\)
            marks:
              - code: M1
                note: Resolves along the plane with tension, a weight component and friction, all three terms present. Condone sign slips.
              - code: A1
                note: Correct equation in any form.
          - scheme: |
              \(a = \tfrac35 g\), up the plane
            marks:
              - code: A1
                note: \(\tfrac35 g\) or awrt 5.88, with the direction up the plane.
  - q: 10
    stamp: c34b5e7d
    parts:
      - part: a
        rows:
          - scheme: |
              \(\sqrt{24^2 + 45^2} = 51 \Rightarrow x = 51 - 30 = 21\)
            marks:
              - code: B1
                note: Both the length 51 and the extension 21.
          - scheme: |
              \(24^2 + (52 - h)^2 = 30^2 \Rightarrow h = 34\)
            marks:
              - code: B1
                note: Height 34 m above the floor, 18 m below the rim, or a rise of 27 m.
          - scheme: |
              \(\mathrm{EPE} = 2 \times \frac{3150 \times 21^2}{2 \times 30} = 46\,305\)
            marks:
              - code: B1
                note: For both cords; awrt 46\,300.
          - scheme: |
              \(80g(7) + \text{"}46\,305\text{"} = \tfrac12(80)v^2 + 80g(34)\)
            marks:
              - code: M1
                note: Forms an energy equation from release to slack with KE, GPE at their two heights (or their change in height) and their EPE. Condone sign slips and EPE of one cord.
              - code: A1
                note: Correct equation, oe.
          - scheme: |
              \(40v^2 = 25\,137 \Rightarrow v = 25.07\ldots = 25\,\mathrm{m\,s^{-1}}\)
            marks:
              - code: A1 AG
                note: Correct substituted energy equation leading without error to \(v=25\,\mathrm{m\,s^{-1}}\) to 2 s.f.; no separate intermediate value required.
      - part: b
        rows:
          - scheme: |
              \(\tfrac12(80)(\text{"}628.4\text{"}) + 80g(34) = 80gH \Rightarrow H = \ldots\)
            marks:
              - code: M1
                note: Equates their KE at slack to the gain in GPE, with no EPE, or uses \(0 = \text{their } v^2 - 2gs\), with their \(v^2\) from (a). Condone sign slips.
          - scheme: |
              \(H = 66.1\) m, i.e. \(14.1\) m above the rim
            marks:
              - code: A1
                note: awrt 66.1 m above the floor, 14.1 m above the rim or 32.1 m above the slack point.
          - scheme: |
              \(24^2 + x^2 = 30^2 \Rightarrow x = \ldots\)
            marks:
              - code: M1
                note: Uses Pythagoras with 24 and 30, or symmetry with the slack position in (a), for the height above the rim at which the cords are taut.
          - scheme: |
              \(x = 18\) m above the rim (70 m above the floor)
            marks:
              - code: A1
          - scheme: |
              \(14.1 < 18\), so the cords are not taut on the way up: moving down
            marks:
              - code: E1
                note: Compares the correct greatest height with the correct taut height, at the same level, and concludes moving down. A bare "down" scores nothing.
