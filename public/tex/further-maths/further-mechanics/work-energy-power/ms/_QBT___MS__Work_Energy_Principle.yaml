              \(R = \tfrac{g}{5} = 1.96\)
            marks:
              - code: A1
  - q: 10
    stamp: 722d6522
    parts:
      - part: a
        rows:
          - scheme: |
              Rise of \(A\): \(3\sin\theta = \frac{15}{13}\)
            marks:
              - code: B1
          - scheme: |
              \(5g \times 3 - 3g \times \their{\tfrac{15}{13}}\)
            marks:
              - code: M1
                note: Finds the GPE lost by \(B\) minus the GPE gained by \(A\), with their rise of \(A\) of the form \(3\sin\theta\) or \(3\cos\theta\).
          - scheme: |
              \(\frac{150g}{13} = \frac{1470}{13} \approx 113\,\mathrm{J}\)
            marks:
              - code: A1
                note: awrt 113.
      - part: b
        rows:
          - scheme: |
              \(\tfrac12(3+5)(4.8)^2 = 92.16\)
            marks:
              - code: B1
          - scheme: |
              \(\mu \times \frac{36g}{13} \times 3 = \frac{108g\mu}{13}\)
            marks:
              - code: B1
                note: oe, such as awrt \(81.4\mu\).
          - scheme: |
              \(0 + 15g - \tfrac{108g\mu}{13} = 92.16 + \tfrac{45g}{13}\)
              or \(\their{\tfrac{150g}{13}} - \tfrac{108g\mu}{13} = 92.16\)
            marks:
              - code: M1
                note: Forms an energy equation for the system with the KE of both blocks, both GPE changes or their (a), and friction work. Condone sign slips.
              - code: A1ft
                note: Correct equation, ft their potential energy loss from (a).
          - scheme: |
              \(\mu = \frac{1133}{4410} \approx 0.257\)
            marks:
              - code: A1
                note: awrt 0.257.
      - part: c
        rows:
          - scheme: |
              \(\mu \times \frac{36g}{13} \times 0.5 = \frac{18g\mu}{13}\)
            marks:
              - code: B1
                note: oe, in terms of \(\mu\) or with a value of \(\mu\) substituted.
          - scheme: |
              \(3g(0.5+d)\sin\theta = \frac{15g}{13}(0.5+d)\)
            marks:
              - code: B1
                note: oe, such as \(\frac{147}{13}(0.5+d)\).
          - scheme: |
              \(\tfrac12(3)(4.8)^2 - \tfrac{18g}{13}\their{\mu}\)
              \(\phantom{\tfrac12(3)(4.8)^2} = \tfrac{15g}{13}(0.5+d)\)
            marks:
              - code: M1
                note: Forms an energy equation for \(A\) alone after \(B\) lands, with the KE of \(A\), GPE gained and friction work. Condone sign slips and slips in distances.
              - code: A1ft
                note: Correct equation, ft their \(\mu\).
          - scheme: |
              \(d = \frac{16\,523}{7350} \approx 2.25\)
            marks:
              - code: A1
                note: awrt 2.25.
