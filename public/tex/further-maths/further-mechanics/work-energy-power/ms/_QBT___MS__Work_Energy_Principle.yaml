questions:
  - q: 1
    stamp: a88750ee
    parts:
      - part: a
        rows:
          - scheme: |
              \(AB = 3 \Rightarrow \cos\theta = \tfrac45\)
              \(R = 2.5g\cos\theta = 2g\ [= 19.6]\)
            marks:
              - code: B1
                note: \(2g\) or 19.6, oe.
          - scheme: |
              \(W = \tfrac14 \times \their{2g} \times 3\)
            marks:
              - code: M1
                note: Multiplies \(\frac14\) their \(R\), a component of \(2.5g\), by their length \(AB\) from Pythagoras.
          - scheme: |
              \(W = \tfrac{3g}{2} = 14.7\,\mathrm{J}\)
            marks:
              - code: A1
                note: \(\frac{3g}{2}\) or 14.7.
      - part: b
        rows:
          - scheme: |
              Gain in \(GPE = 2.5g(1.8)\ [= 44.1\,\mathrm{J}]\)
            marks:
              - code: B1
          - scheme: |
              \(\tfrac12(2.5)U^2 - \their{14.7} = 2.5g(1.8)\)
            marks:
              - code: M1
                note: Forms a work--energy equation from \(A\) to \(B\) with \(\frac12(2.5)U^2\), the gain in \(GPE\) and their work against friction from (a). Condone sign slips.
              - code: A1ft
                note: Correct equation, oe; ft their work against friction from (a).
          - scheme: |
              \(U^2 = 47.04 \Rightarrow U = \tfrac{14\sqrt6}{5} \approx 6.86\)
            marks:
              - code: A1
                note: awrt 6.86, or \(\frac{14\sqrt6}{5}\) oe.
      - part: c
        rows:
          - scheme: |
              Loss in \(GPE = 2.5g(1.8)\ [= 44.1\,\mathrm{J}]\)
            marks:
              - code: B1
                note: Or twice their 14.7 for the round trip.
          - scheme: |
              \(2.5g(1.8) - \their{14.7} = \tfrac12(2.5)v^2\)
            marks:
              - code: M1
                note: Forms a work--energy equation from \(B\) to \(A\) with the loss in \(GPE\), \(\frac12(2.5)v^2\) and their friction work, or from \(A\) to \(A\) with their \(U^2\) and twice their friction work. Condone sign slips.
              - code: A1ft
                note: Correct equation, oe; ft their work against friction from (a).
          - scheme: |
              \(v^2 = 23.52 \Rightarrow v = \tfrac{14\sqrt3}{5} \approx 4.85\,\mathrm{m\,s}^{-1}\)
            marks:
              - code: A1
                note: awrt 4.85, or \(\frac{14\sqrt3}{5}\) oe.
  - q: 2
    stamp: bb9c4fe7
    parts:
      - part: a
        rows:
          - scheme: |
              \(R = mg\cos\alpha\)
            marks:
              - code: M1
                note: Resolves perpendicular to the roof with \(R\) and a component of \(mg\). Condone \(\sin\)/\(\cos\) confusion.
          - scheme: |
              \(R = \frac{4mg}{5}\)
            marks:
              - code: A1
                note: oe, such as \(0.8mg\). Not \(7.84m\).
      - part: b
        rows:
          - scheme: |
              \(s\sin\alpha = 0.6 \Rightarrow s = 1\)
            marks:
              - code: B1
                note: soi by correct work done by friction.
          - scheme: |
              \(F = 0.25 \times \their{\frac{4mg}{5}} = \frac{mg}{5}\)
              \(\sum W_{\text{other}} = -\frac{mg}{5} \times 1 = -\frac{mg}{5}\)
            marks:
              - code: B1ft
                note: \(0.25 \times\) their \(R\) \(\times 1\), as work done by or against friction. ft their \(R\) from (a).
          - scheme: |
              \(KE_0+GPE_0+\sum W_{\text{other}}=KE_1+GPE_1\)
              \(0 + mg(1.5) - \frac{mg}{5} = \frac12 mv^2 + 0\)
            marks:
              - code: M1
                note: Forms an energy equation from release to the ground, in one stage or two, with KE, GPE and their friction work. Condone sign slips.
              - code: A1ft
                note: Correct equation oe, or a correct pair of stage equations. ft their \(R\) from (a).
          - scheme: |
              \(v = \sqrt{\frac{13g}{5}} = 5.05\)
            marks:
              - code: A1
                note: awrt 5.05, or \(\frac{7\sqrt{13}}{5}\).
  - q: 3
    stamp: 33f5571c
    parts:
      - part: a
        rows:
          - scheme: |
              \(R = mg\cos\alpha\), \(F = \frac13 R\)
            marks:
              - code: M1
                note: Uses \(F = \frac13 R\) with \(R\) resolved perpendicular to the plane, \(mg\cos\alpha\). Condone a slip in finding \(\cos\alpha\).
          - scheme: |
              \(\cos\alpha = \frac{24}{25} \Rightarrow F = \frac13 \times \frac{24}{25}mg = \frac{8}{25}mg\)
            marks:
              - code: A1
                note: Needs \(\cos\alpha = \frac{24}{25}\) or \(R = \frac{24}{25}mg\) seen.
          - scheme: |
              \(W = Fd = \frac{8}{25}mg \times d = \frac{8}{25}mgd\)
            marks:
              - code: A1 AG
                note: Their correct friction multiplied by \(d\), reaching the printed result with no error in the part.
      - part: b
        rows:
          - scheme: |
              \(\frac12 m(\sqrt{gd})^2 - \frac{8}{25}mgd\)
              \(\phantom{A} = \frac12 mv^2 + mgd\sin\alpha\)
            marks:
              - code: M1
                note: Forms a work--energy equation from \(A\) to \(B\) with KE at \(A\), GPE gained and work against friction, or compares their \(s\) with \(d\). Condone sign slips.
          - scheme: |
              \(\frac12 mv^2 = -\frac1{10}mgd < 0 \Rightarrow\) does not reach \(B\)
            marks:
              - code: A1
                note: \(-\frac1{10}mgd\) oe, or \(\frac12 mgd < \frac35 mgd\), or \(\frac{5d}{6} < d\), with the conclusion that it does not reach \(B\).
          - scheme: |
              \(\frac12 mgd - \frac{8}{25}mgs = \frac{7}{25}mgs \Rightarrow s = \ldots\)
            marks:
              - code: M1
                note: Forms a work--energy equation from \(A\) to rest at distance \(s\), with KE at \(A\), GPE gained and work against friction in terms of \(s\). Condone sign slips.
          - scheme: |
              \(s = \frac{5d}{6}\)
            marks:
              - code: A1
  - q: 4
    stamp: a6cf0050
    parts:
      - part: a
        rows:
          - scheme: |
              \(h = 39\sin\alpha = 39 \times \tfrac{5}{13} = 15\)
            marks:
              - code: B1
          - scheme: |
              \(\tfrac12 m(21)^2 + 0 = \tfrac12 mv^2 + mg(\their{15})\)
            marks:
              - code: M1
                note: Forms an energy equation from \(A\) to \(B\) with both KE terms and a GPE change \(mgh\) using their height. Condone sign slips.
              - code: A1
                note: Correct equation, oe; \(m\) may be cancelled.
          - scheme: |
              \(v^2 = 147 \Rightarrow v = 7\sqrt{3} \approx 12.1\,\mathrm{m\,s^{-1}}\)
            marks:
              - code: A1
                note: \(7\sqrt{3}\) or awrt 12.1.
      - part: b
        rows:
          - scheme: |
              \(R = mg\cos\alpha = \tfrac{12mg}{13} \Rightarrow F = \tfrac13 R = \tfrac{4mg}{13}\)
            marks:
              - code: B1
                note: oe, such as \(3.02m\).
          - scheme: |
              \(\tfrac12 m(21)^2 - \their{\tfrac{4mg}{13}} \times 39\)
              \(\phantom{\tfrac12 m(21)^2} = \tfrac12 mv^2 + 15mg\)
            marks:
              - code: M1
                note: Forms an energy equation from \(A\) to \(B\) with both KE terms, the GPE gain and their friction times 39. Condone sign slips. Or earned by comparing their \(s\) with 39.
          - scheme: |
              \(\tfrac12 mv^2 = -44.1m < 0\), so \(P\) does not reach \(B\)
            marks:
              - code: A1
                note: Correct negative KE, or correct \(s\) with \(s < 39\), and the conclusion.
          - scheme: |
              \(\tfrac12 m(21)^2 - \tfrac{4mg}{13}s = mg\,s\sin\alpha\)
            marks:
              - code: M1
                note: Forms an energy equation from \(A\) to rest with initial KE, a GPE gain from \(s\sin\alpha\) and their friction times \(s\). Condone sign slips.
              - code: A1
                note: Correct equation, oe; \(m\) may be cancelled.
          - scheme: |
              \(s = \frac{220.5 \times 13}{9 \times 9.8} = 32.5\,\mathrm{m}\)
            marks:
              - code: A1
  - q: 5
    stamp: bb5b1dec
    parts:
      - part: a
        rows:
          - scheme: |
              \(R + 220\sin 15^\circ = 40g\cos 10^\circ\)
            marks:
              - code: M1
                note: Resolves perpendicular to the slope with the weight component and a component of the tension. Condone sign slips and sin/cos interchange.
          - scheme: |
              \(R = 40g\cos 10^\circ - 220\sin 15^\circ \approx 329.1\,\mathrm{N}\)
            marks:
              - code: A1
                note: Unevaluated or awrt 329.
          - scheme: |
              \(W_T = 220 \times 5\cos 15^\circ\ [\approx 1063\,\mathrm{J}]\)
            marks:
              - code: B1
                note: Unevaluated or awrt 1060.
          - scheme: |
              \(220(5)\cos 15^\circ - 0.25\their{R}(5)\)
              \(\phantom{220} = \tfrac12(40)v^2 + 40g(5)\sin 10^\circ\)
            marks:
              - code: M1
                note: Forms an energy equation over the 5 m with work by the tension, friction work from their \(R\) found by resolving, KE and GPE. Condone sign slips.
              - code: A1
                note: Correct equation, oe; need not be simplified.
          - scheme: |
              \(20v^2 = \ldots\ [310.8] \Rightarrow v \approx 3.94\,\mathrm{m\,s^{-1}}\)
            marks:
              - code: A1
          - scheme: |
              Resultant force up the slope while the rope pulls, so the speed is greatest when it breaks
            marks:
              - code: E1
                note: States that the sledge accelerates, or the resultant force is up the slope, while the rope pulls, so the speed is greatest when it breaks.
      - part: b
        rows:
          - scheme: |
              \(R = 40g\cos 10^\circ\)
            marks:
              - code: B1
          - scheme: |
              Work against friction \(= 0.25(40g\cos 10^\circ)s\)
            marks:
              - code: B1ft
                note: 0.25 times their \(R\) times the distance, oe.
          - scheme: |
              \(\their{310.8} - 0.25\their{40g\cos 10^\circ}s = 40g(\sin 10^\circ)s\)
            marks:
              - code: M1
                note: Forms an energy equation from the break to rest using their KE from (a), or from the start to rest, with friction work and GPE. Condone sign slips.
              - code: A1ft
                note: ft their KE from (a) and their \(R\).
          - scheme: |
              \(s = \ldots\ [\approx 1.89] \Rightarrow\) total \(= 6.89\,\mathrm{m}\)
            marks:
              - code: A1
                note: Total distance. Not for the further distance alone.
      - part: c
        rows:
          - scheme: |
              Model gives \(6.89 > 6.8\), so the model does not support the claim
            marks:
              - code: E1
                note: Compares their total from (b) with 6.8 m and states the matching conclusion about the claim.
          - scheme: |
              Air resistance, ignored by the model, would make the sledge stop sooner: the claim is reasonable
            marks:
              - code: E1
                note: Names an effect the model leaves out that would reduce the distance, such as air resistance, and concludes the claim is reasonable. Not for variation in friction or tension alone.
  - q: 6
    stamp: aa3af9a7
    parts:
      - part: a
        rows:
          - scheme: |
              \(R + 80\sin 20^\circ = 10g\cos 15^\circ \Rightarrow R = \ldots\)
            marks:
              - code: M1
                note: Resolves perpendicular to the plane with \(R\), a weight component and a tension component. Condone sign slips and sin/cos confusion.
          - scheme: |
              \(R = 67.3\)
            marks:
              - code: A1
                note: awrt 67.3, or \(98\cos 15^\circ - 80\sin 20^\circ\).
          - scheme: |
              \(KE_1 - KE_0 = \tfrac12 \times 10 \times (4.5^2 - 1.5^2)\ [= 90]\)
            marks:
              - code: B1
                note: Both kinetic energies, 11.25 and 101.25, or their difference.
          - scheme: |
              Work done by tension \(= 80x\cos 20^\circ\)
            marks:
              - code: B1
          - scheme: |
              \(KE_0+GPE_0+\sum W_{\text{other}}=KE_1+GPE_1\)
              \(11.25 + 80x\cos 20^\circ - 0.3\their{67.3}x\)
              \(\phantom{11.25} = 101.25 + 98x\sin 15^\circ\)
            marks:
              - code: M1
                note: Forms an energy equation with tension work, friction work \(0.3\their{R}x\), both KE terms and GPE of the form \(10gx\sin\theta\). Condone sign and sin/cos slips.
              - code: A1
                note: Correct equation, oe.
          - scheme: |
              \(x = 3.04\)
            marks:
              - code: A1
                note: awrt 3.04.
      - part: b
        rows:
          - scheme: |
              Include air resistance
            marks:
              - code: E1
                note: States a refinement such as air resistance, or another named resistance to motion besides friction.
          - scheme: |
              It does extra negative work per metre, so \(\sum W_{\text{other}}\) is smaller per metre: more distance is needed for the same KE gain, so \(x\) increases
            marks:
              - code: E1
                note: Argues that the extra resistance does work against the motion over the same KE gain, and concludes \(x\) increases. Not for the conclusion alone.
  - q: 7
    stamp: f9f25b43
    parts:
      - part: a
        rows:
          - scheme: |
              \(R = mg\cos\theta\)
            marks:
              - code: M1
                note: Resolves perpendicular to the plane, equating \(R\) to a component of the weight. Condone sin/cos confusion.
          - scheme: |
              \(\cos\theta = \tfrac{12}{13} \Rightarrow R = \tfrac{12mg}{13}\)
            marks:
              - code: A1
          - scheme: |
              \(F = \mu R = \tfrac14 \times \tfrac{12mg}{13} = \tfrac{3mg}{13}\)
            marks:
              - code: A1 AG
                note: Uses \(F = \mu R\) with correct \(R\), reaching the printed result without error.
      - part: b
        rows:
          - scheme: |
              \(\tfrac12 m\left(4\sqrt{ag}\right)^2 - \tfrac{3mg}{13}s = mgs\sin\theta\)
              \(\Rightarrow 8mag - \tfrac{3mgs}{13} = \tfrac{5mgs}{13}\)
            marks:
              - code: M1
                note: Forms a work--energy equation from \(O\) to rest with KE, GPE and the work done by friction. Condone sign slips and sin/cos confusion.
              - code: A1
                note: Correct equation, oe.
          - scheme: |
              \(s = 13a\)
            marks:
              - code: A1
          - scheme: |
              \(\tfrac{5mg}{13}\left(\their{13a}\right) - \tfrac{3mg}{13}\left(\their{13a}\right) = \tfrac12 mv^2\)
            marks:
              - code: M1
                note: Forms a work--energy equation ending at \(O\), from rest or over the whole motion, with all nonzero KE, GPE and friction terms. Condone sign slips.
              - code: A1ft
                note: Correct equation, ft their distance up the plane.
          - scheme: |
              \(v = 2\sqrt{ag}\)
            marks:
              - code: A1
                note: oe, such as \(\sqrt{4ag}\).
  - q: 8
    stamp: cb43c584
    parts:
      - part: a
        rows:
          - scheme: |
              \(F = \tfrac14 R = \tfrac14 \times 8g\cos 45^\circ\)
            marks:
              - code: M1
                note: Uses \(F = \frac14 R\) with \(R\) the weight's component perpendicular to the ramp.
          - scheme: |
              \(F = \sqrt2 g\)
            marks:
              - code: A1
                note: oe, or awrt \(13.9\,\mathrm{N}\).
          - scheme: |
              \(W = Fd = \sqrt2 gd\)
            marks:
              - code: A1
                note: \(\sqrt2 gd\) oe, or awrt \(1.41gd\). Must be in terms of \(g\) and \(d\), not \(13.9d\).
      - part: b
        rows:
          - scheme: |
              \(KE_1 = \tfrac12(8+2)(2.1)^2 = 22.05\)
            marks:
              - code: B1
          - scheme: |
              \(A\) loses \(8gd\sin 45^\circ = 4\sqrt2 gd\); \(B\) gains \(2gd\)
            marks:
              - code: B1
                note: Both GPE changes, oe, with any zero levels.
          - scheme: |
              \(KE_0+GPE_0+\sum W_{\text{other}}=KE_1+GPE_1\)
              \(0 + \their{4\sqrt2 gd} - \their{\sqrt2 gd} = \their{22.05} + \their{2gd}\)
            marks:
              - code: M1
                note: Forms a work--energy equation, for the system or each block, with both blocks' KE, both GPE changes and their friction work from (a). Condone sign slips.
              - code: A1ft
                note: Correct equation oe; ft their friction work from (a).
          - scheme: |
              \(d = \dfrac{22.05}{g(3\sqrt2-2)} \approx 1.00\)
            marks:
              - code: A1
                note: awrt 1.00, or 1.0; not 1 alone.
      - part: c
        rows:
          - scheme: |
              Model the pulley as rough, so friction at the pulley is included
            marks:
              - code: E1
                note: Gives one valid refinement, such as a rough or heavy pulley, a rope with mass or that stretches, or the blocks' dimensions. Not for ``more accurate'' alone.
  - q: 9
    stamp: 4b14bf73
    parts:
      - part: a
        rows:
          - scheme: |
              \(I = 0.5\bigl(12 - (-5)\bigr)\)
            marks:
              - code: M1
                note: Uses \(m(v-u)\) with the two velocities of opposite sign.
          - scheme: |
              \(I = 8.5\,\mathrm{N\,s}\)
            marks:
              - code: A1
      - part: b
